<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kant's Logic Lectures — Blomberg, Busolt, Wiener</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--parchment:#f6f0e2;--panel:#efe6d0;--ink:#2b2118;--accent:#5c3d1e;--muted:#8a7a63;--rule:#d4c6a8;--hit:#f3d27a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'EB Garamond',Georgia,serif;background:var(--parchment);color:var(--ink);display:flex;font-size:18px}
#left{flex:1 1 62%;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--rule)}
#right{flex:0 0 38%;max-width:480px;min-width:300px;display:flex;flex-direction:column;background:var(--panel)}
header{padding:.6rem 1rem 0;background:var(--parchment)}
h1{font-family:Cinzel,serif;font-weight:600;font-size:1rem;letter-spacing:.08em;color:var(--accent);margin:0 0 .5rem}
#tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--rule)}
.tab{font-family:Cinzel,serif;font-size:.8rem;letter-spacing:.06em;padding:.5rem .9rem;border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);cursor:pointer;border-radius:4px 4px 0 0;margin-bottom:-1px}
.tab.on{background:var(--parchment);color:var(--accent);border-color:var(--rule);border-bottom:1px solid var(--parchment);font-weight:600}
.tab small{font-family:'EB Garamond',serif;color:var(--muted);letter-spacing:0;display:block;font-size:.75rem}
#toolbar{padding:.4rem 1rem;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;gap:1rem;align-items:center}
#toolbar select{font:inherit;background:var(--parchment);border:1px solid var(--rule);color:var(--ink)}
#text{flex:1;overflow-y:auto;padding:1rem 2rem 4rem;line-height:1.65}
#text h2{font-family:Cinzel,serif;font-weight:600;font-size:1.05rem;color:var(--accent);margin:2.2rem 0 .2rem;letter-spacing:.04em;border-bottom:1px solid var(--rule);padding-bottom:.2rem}
#text .prov{font-size:.8rem;color:var(--muted);font-style:italic;margin:0 0 .8rem}
#text p{margin:.6rem 0;scroll-margin-top:1rem;padding:.15rem .4rem;border-left:3px solid transparent}
#text p.note{font-style:italic;color:var(--muted)}
#text hr{border:0;border-top:1px solid var(--rule)}
#text p.flash{border-left-color:var(--accent);background:rgba(92,61,30,.1)}
.pg{font-family:Cinzel,serif;font-size:.62rem;color:var(--accent);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:0 .3rem;margin:0 .15rem;vertical-align:.15em;white-space:nowrap;user-select:none}
.ms{font-size:.7rem;color:var(--muted);vertical-align:.2em}
.pgblock{font-family:Cinzel,serif;font-size:.62rem;color:var(--muted);margin-right:.4rem}
mark{background:var(--hit);color:inherit;padding:0 1px;border-radius:2px}
#searchbox{padding:1rem;border-bottom:1px solid var(--rule)}
#searchbox label.t{font-family:Cinzel,serif;font-size:.8rem;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:.4rem}
#q{width:100%;font:inherit;padding:.45rem .6rem;border:1px solid var(--rule);background:#fffdf7;border-radius:4px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.opts{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.5rem;font-size:.85rem}
.opts label{cursor:pointer}
#summary{padding:.5rem 1rem;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--rule)}
#summary b{color:var(--accent)}
#results{flex:1;overflow-y:auto;padding:.3rem 0 3rem}
.res{padding:.55rem 1rem;border-bottom:1px solid var(--rule);cursor:pointer;font-size:.95rem;line-height:1.4}
.res:hover{background:rgba(92,61,30,.08)}
.res .where{font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.05em;color:var(--accent);margin-bottom:.15rem}
.res .where span{color:var(--muted)}
.empty{padding:1rem;color:var(--muted);font-style:italic}
@media(max-width:800px){body{flex-direction:column;overflow:auto}#left,#right{flex:none;max-width:none;height:60vh}}
</style>
</head>
<body>
<!-- The three transcripts are shared data; load them from data/ and never copy them. -->
<script src="../../data/logik-blomberg-24.js"></script>
<script src="../../data/logik-busolt-24.js"></script>
<script src="../../data/logik-wiener-24.js"></script>

<div id="left">
  <header>
    <h1>Kant's Logic Lectures · AA XXIV</h1>
    <div id="tabs"></div>
  </header>
  <div id="toolbar"><span id="info"></span></div>
  <div id="text" tabindex="0"></div>
</div>
<div id="right">
  <div id="searchbox">
    <label class="t" for="q">Search the texts</label>
    <input id="q" type="search" placeholder="e.g. Verstand, Erkenntniß, Logic…" autocomplete="off">
    <div class="opts">
      <label><input type="radio" name="scope" value="all" checked> All three</label>
      <label><input type="radio" name="scope" value="cur"> This tab only</label>
      <label><input type="checkbox" id="exact"> Whole word</label>
      <label><input type="checkbox" id="strict"> Exact spelling</label>
    </div>
  </div>
  <div id="summary">Type a term to search. Spelling variants (ß/ss, c/k/z, case) are matched unless “Exact spelling” is ticked.</div>
  <div id="results"></div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
const WORKS = [
  {key:'blomberg', short:'Blomberg', data:LOGIK_BLOMBERG},
  {key:'busolt',   short:'Busolt',   data:LOGIK_BUSOLT},
  {key:'wiener',   short:'Wiener',   data:LOGIK_WIENER},
];

// ── State ─────────────────────────────────────────────────────────────────
let cur = 0;
let query = '';
let rendered = -1, renderedQuery = null;

// ── Helpers ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Fold one character for matching. Loose mode lower-cases, strips diacritics,
// and treats ß=ss, ſ=s, and the c/k/z spellings of the older German as one.
function foldChar(ch, strict){
  if(strict) return ch.toLowerCase();
  let c = ch.toLowerCase();
  if(c==='ß') return 'ss';
  if(c==='ſ') return 's';
  c = c.normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(c==='k'||c==='c') return 'k';
  if(c==='z') return 'k'; // Logic/Logik, Nuzzen/Nutzen: coarse on purpose
  if(c==='ä') return 'a';
  return c;
}
// Folded string plus a map from folded index to original index.
function fold(text, strict){
  let out='', map=[];
  for(let i=0;i<text.length;i++){
    const f = foldChar(text[i], strict);
    for(let j=0;j<f.length;j++){ out+=f[j]; map.push(i); }
  }
  map.push(text.length);
  return {out, map};
}
const isWordCh = ch => /[\p{L}\p{N}]/u.test(ch||'');

// All match ranges [start,end) in original text.
function findAll(text, q, opts){
  const fq = fold(q, opts.strict).out.trim();
  if(!fq) return [];
  const f = fold(text, opts.strict);
  const hits=[]; let i=0;
  while((i=f.out.indexOf(fq,i))!==-1){
    const s=f.map[i], e=f.map[i+fq.length];
    const ok = !opts.exact || (!isWordCh(text[s-1]) && !isWordCh(text[e]));
    if(ok) hits.push([s,e]);
    i+=fq.length;
  }
  return hits;
}
const opts = () => ({strict:$('strict').checked, exact:$('exact').checked});

// Wrap hits in <mark> within text[a,b), escaping everything.
function markup(text, a, b, hits){
  let out='', pos=a;
  for(const [s,e] of hits){
    if(e<=a||s>=b) continue;
    const s2=Math.max(s,a), e2=Math.min(e,b);
    out+=esc(text.slice(pos,s2))+'<mark>'+esc(text.slice(s2,e2))+'</mark>';
    pos=e2;
  }
  return out+esc(text.slice(pos,b));
}

function blockHTML(w, b){
  const text=b.text||'';
  const hits = query ? findAll(text, query, opts()) : [];
  // Page and manuscript markers sorted by offset.
  const marks=[];
  (b.pages||[]).forEach(p=>marks.push({i:p.i,html:`<span class="pg" title="Academy Edition page">AA 24:${p.p}</span>`}));
  (b.ms||[]).forEach(p=>marks.push({i:p.i,html:`<span class="ms" title="Manuscript page">[${esc(String(p.p))}]</span>`}));
  marks.sort((x,y)=>x.i-y.i);
  let out='',pos=0;
  for(const m of marks){ out+=markup(text,pos,m.i,hits)+m.html; pos=m.i; }
  out+=markup(text,pos,text.length,hits);
  return out;
}

// ── Render ────────────────────────────────────────────────────────────────
function renderTabs(){
  $('tabs').innerHTML='';
  WORKS.forEach((w,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    const m=w.data.meta;
    b.innerHTML=esc(w.short)+`<small>${esc(m.date||'')}</small>`;
    b.onclick=()=>{ cur=i; show(); if(query && scope()==='cur') runSearch(); };
    $('tabs').appendChild(b);
  });
}

function renderText(){
  if(rendered===cur && renderedQuery===query) return;
  const w=WORKS[cur], m=w.data.meta;
  $('info').textContent=`${m.label} · ${m.date||''} · AA 24:${m.aa[0]}–${m.aa[1]}`;
  const parts=[];
  w.data.sections.forEach(s=>{
    const t=s.title||(s.headings&&s.headings[0])||'';
    if(t) parts.push(`<h2 id="${s.id}">${esc(t)}</h2>`);
    if(s.provenance) parts.push(`<div class="prov">${esc(s.provenance)}</div>`);
    s.blocks.forEach(b=>{
      if(b.kind==='rule'){ parts.push('<hr>'); return; }
      const aa=b.aa?`<span class="pgblock">AA 24:${b.aa}</span>`:'';
      parts.push(`<p id="${b.id}" class="${b.kind==='note'?'note':''}">${aa}${blockHTML(w,b)}</p>`);
    });
  });
  $('text').innerHTML=parts.join('');
  rendered=cur; renderedQuery=query;
}

function show(){
  renderTabs();
  const scrollTop = rendered===cur ? $('text').scrollTop : 0;
  renderText();
  $('text').scrollTop=scrollTop;
}

// ── Search ────────────────────────────────────────────────────────────────
const scope = () => document.querySelector('input[name=scope]:checked').value;
const MAX_RESULTS = 400;

function runSearch(){
  query=$('q').value.trim();
  const res=$('results'), sum=$('summary');
  res.innerHTML='';
  if(!query){
    sum.textContent='Type a term to search. Spelling variants (ß/ss, c/k/z, case) are matched unless “Exact spelling” is ticked.';
    renderText(); return;
  }
  const o=opts(), list=[], counts=WORKS.map(()=>({p:0,n:0}));
  WORKS.forEach((w,wi)=>{
    if(scope()==='cur' && wi!==cur) return;
    w.data.sections.forEach(s=>s.blocks.forEach(b=>{
      if(!b.text) return;
      const hits=findAll(b.text,query,o);
      if(!hits.length) return;
      counts[wi].p++; counts[wi].n+=hits.length;
      list.push({wi,s,b,hits});
    }));
  });
  const total=counts.reduce((a,c)=>a+c.n,0);
  sum.innerHTML=total
    ? `<b>${total}</b> hit${total===1?'':'s'} in ${list.length} passage${list.length===1?'':'s'} — `+
      WORKS.map((w,i)=>counts[i].n?`${esc(w.short)} ${counts[i].n}`:'').filter(Boolean).join(' · ')+
      (list.length>MAX_RESULTS?` (showing first ${MAX_RESULTS})`:'')
    : `No hits for “${esc(query)}”.`;
  const frag=document.createDocumentFragment();
  list.slice(0,MAX_RESULTS).forEach(r=>{
    const [s0,e0]=r.hits[0], t=r.b.text;
    const a=Math.max(0,s0-60), b=Math.min(t.length,e0+90);
    const snip=(a>0?'…':'')+markup(t,a,b,r.hits)+(b<t.length?'…':'');
    const d=document.createElement('div'); d.className='res';
    const title=r.s.title||(r.s.headings&&r.s.headings[0])||'';
    d.innerHTML=`<div class="where">${esc(WORKS[r.wi].short)} · AA 24:${r.b.aa||'?'} <span>${esc(title.slice(0,50))}${r.hits.length>1?` · ${r.hits.length}×`:''}</span></div>${snip}`;
    d.onclick=()=>jump(r.wi,r.b.id);
    frag.appendChild(d);
  });
  res.appendChild(frag);
  renderText();
}

function jump(wi,id){
  cur=wi; renderTabs(); renderText();
  const el=document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:'center'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),2500);
}

// ── Wiring ────────────────────────────────────────────────────────────────
let timer;
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(runSearch,200)});
['exact','strict'].forEach(i=>$(i).addEventListener('change',runSearch));
document.querySelectorAll('input[name=scope]').forEach(r=>r.addEventListener('change',runSearch));

show();
</script>
</body>
</html>
