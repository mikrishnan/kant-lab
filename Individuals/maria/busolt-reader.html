<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logik Busolt — Reading Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:        #1a1208;
  --parchment:  #f4ede0;
  --parch-dark: #e8dcc8;
  --parch-deep: #d8ccb4;
  --accent:     #5c3d1e;
  --accent-lt:  #8b5e3c;
  --faded:      #7a6a52;
  --line:       #b8a88a;
  --aa-ink:     #3a5a3a;
  --aa-bg:      #eef5ee;
  --aa-bd:      #8aaa8a;
  --panel-bg:   #faf7f0;
  --hit:        #f3d98a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 19px; line-height: 1.55;
  background: var(--parchment); color: var(--ink);
  display: flex; flex-direction: column;
}
header {
  background: var(--accent); color: var(--parchment);
  padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px;
}
header h1 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.15rem; letter-spacing: .08em; margin: 0; }
header .sub { font-size: .9rem; opacity: .85; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; }
.tools input[type=search], .tools input[type=number] {
  font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--panel-bg); color: var(--ink);
}
.tools input[type=search] { width: 15em; }
.tools input[type=number] { width: 5.5em; }
.tools label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
main { flex: 1; display: flex; min-height: 0; }
nav {
  width: 290px; flex: none; overflow-y: auto; background: var(--panel-bg);
  border-right: 1px solid var(--line); padding: 10px 0;
}
nav h2, #results h2 {
  font-family: 'Cinzel', serif; font-weight: 400; font-size: .72rem; letter-spacing: .12em;
  color: var(--faded); margin: 6px 16px; text-transform: uppercase;
}
nav a {
  display: flex; justify-content: space-between; gap: 8px; padding: 4px 16px;
  color: var(--ink); text-decoration: none; font-size: .95rem; line-height: 1.3; cursor: pointer;
  border-left: 3px solid transparent;
}
nav a:hover { background: var(--parch-dark); }
nav a.on { background: var(--parch-dark); border-left-color: var(--accent); }
nav a .pp { font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink); white-space: nowrap; padding-top: 3px; }
nav a.untitled { font-style: italic; color: var(--faded); }
#reader { flex: 1; overflow-y: auto; padding: 24px 32px 80px; }
#page { max-width: 46em; margin: 0 auto; }
#page h2 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.3rem; color: #2e1a00; margin: 0 0 4px; letter-spacing: .04em; }
.prov { font-size: .85rem; font-style: italic; color: var(--faded); margin-bottom: 18px; }
.heads { font-size: .85rem; color: var(--faded); margin: -10px 0 14px; }
.blk { position: relative; margin: 0 0 .75em; padding-left: 4.6em; scroll-margin-top: 12px; }
.blk .mg {
  position: absolute; left: 0; top: .25em; width: 3.8em; text-align: right;
  font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink);
}
.blk.flash { background: var(--hit); transition: background 1.5s; }
.pg {
  font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink);
  background: var(--aa-bg); border: 1px solid var(--aa-bd); border-radius: 3px;
  padding: 0 4px; margin: 0 3px; white-space: nowrap; cursor: pointer;
}
body.nopg .pg { display: none; }
.blk.inf .tx { border-bottom: 1px dashed var(--accent-lt); }
.tag { font-size: .65rem; font-family: 'Cinzel', serif; color: var(--accent-lt); margin-left: 6px; letter-spacing: .05em; }
body.noinf .tag { display: none; }
body.noinf .blk.inf .tx { border-bottom: 0; }
.ed { color: var(--accent-lt); }              /* editorial brackets, kept verbatim */
.blk.rule { padding-left: 4.6em; }
.blk.rule hr { border: 0; border-top: 1px solid var(--line); margin: .6em 0; }
mark { background: var(--hit); color: inherit; padding: 0 1px; border-radius: 2px; }
.step { display: flex; justify-content: space-between; margin-top: 30px; font-size: .9rem; }
.step a { color: var(--accent); cursor: pointer; }
#results { display: none; width: 340px; flex: none; overflow-y: auto; background: var(--panel-bg); border-left: 1px solid var(--line); padding: 10px 0; }
#results.show { display: block; }
#results .r { padding: 6px 16px; border-bottom: 1px solid var(--parch-dark); cursor: pointer; font-size: .9rem; line-height: 1.35; }
#results .r:hover { background: var(--parch-dark); }
#results .r .w { font-family: 'Cinzel', serif; font-size: .66rem; color: var(--aa-ink); display: block; }
#results .none { padding: 8px 16px; color: var(--faded); font-style: italic; }
.note { font-size: .82rem; color: var(--faded); margin: 6px 16px; }
@media (max-width: 860px) { nav { display: none; } #reader { padding: 16px; } #results.show { width: 45%; } }
</style>
</head>
<body>
<header>
  <h1>Logik Busolt</h1>
  <span class="sub">Kant, lecture on logic, ca. 1789/90 · Academy Edition XXIV:603–686</span>
  <div class="tools">
    <input type="search" id="q" placeholder="Search the transcript…" aria-label="Search">
    <input type="number" id="goaa" placeholder="AA page" min="603" max="686" aria-label="Go to AA page">
    <label><input type="checkbox" id="tpg" checked> page breaks</label>
    <label><input type="checkbox" id="tinf" checked> inferred joins</label>
  </div>
</header>
<main>
  <nav id="nav"></nav>
  <div id="reader"><div id="page"></div></div>
  <aside id="results"></aside>
</main>

<script src="../../data/logik-busolt-24.js"></script>
<script>
/* ── data ── (LOGIK_BUSOLT comes from ../../data/logik-busolt-24.js) */
const SECTIONS = LOGIK_BUSOLT.sections;
const ED_RE = /(\[[^\]]*\]|<[^>]*>)/g;   // [ Textlücke: … ], [AA: …], < bricht ab >

/* ── state ── */
let cur = -1;
let query = '';

/* ── helpers ── */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function secLabel(s) { return s.title || (s.titleSrc === 'none' ? 'Titelei (no title)' : s.headings[0] || s.id); }
function secPages(s) {
  const a = s.blocks.map(b => b.aa).filter(Boolean), z = s.blocks.map(b => b.aaEnd || b.aa).filter(Boolean);
  return a.length ? (Math.min(...a) === Math.max(...z) ? '' + a[0] : Math.min(...a) + '–' + Math.max(...z)) : '';
}
function norm(s) { return s.toLowerCase().replace(/ß/g, 'ss'); }

/* Split text at its editorial brackets and search hits, appending to parent.
   Everything goes in as text nodes — the transcript is never parsed as HTML. */
function addText(parent, text) {
  text.split(ED_RE).forEach(part => {
    if (!part) return;
    const host = /^[\[<]/.test(part) ? el('span', 'ed') : parent;
    if (host !== parent) parent.appendChild(host);
    if (!query) { host.appendChild(document.createTextNode(part)); return; }
    const lo = norm(part), q = norm(query);
    let i = 0, j;
    while ((j = lo.indexOf(q, i)) >= 0) {
      host.appendChild(document.createTextNode(part.slice(i, j)));
      host.appendChild(el('mark', null, part.slice(j, j + q.length)));
      i = j + q.length;
    }
    host.appendChild(document.createTextNode(part.slice(i)));
  });
}

function pageChip(p) {
  const c = el('span', 'pg', 'AA ' + p);
  c.title = 'AA 24:' + p + ' — click to link to this page';
  c.onclick = () => { location.hash = 'aa-' + p; };
  return c;
}

/* ── render ── */
function buildNav() {
  const nav = document.getElementById('nav');
  nav.appendChild(el('h2', null, 'Sections'));
  SECTIONS.forEach((s, i) => {
    const a = el('a', s.title ? '' : 'untitled');
    a.dataset.i = i;
    a.appendChild(el('span', null, secLabel(s)));
    a.appendChild(el('span', 'pp', secPages(s)));
    a.onclick = () => show(i);
    nav.appendChild(a);
  });
  nav.appendChild(el('p', 'note',
    'No § numbers: the Busolt transcript carries none, so the sections are the volume’s own headings.'));
}

function renderBlock(b) {
  const d = el('div', 'blk');
  d.id = b.id;
  if (b.kind === 'rule') { d.className = 'blk rule'; d.appendChild(document.createElement('hr')); return d; }
  const inferred = (b.joined || []).includes('inferred');
  if (inferred) d.classList.add('inf');
  const startsPage = b.pages && b.pages.some(p => p.i === 0);
  if (startsPage) d.appendChild(el('span', 'mg', 'AA ' + b.aa));
  const tx = el('span', 'tx');
  const cuts = (b.pages || []).filter(p => p.i > 0);
  let at = 0;
  cuts.forEach(p => {
    addText(tx, b.text.slice(at, p.i));
    tx.appendChild(pageChip(p.p));
    at = p.i;
  });
  addText(tx, b.text.slice(at));
  d.appendChild(tx);
  if (inferred) {
    const t = el('span', 'tag', 'joined · inferred');
    t.title = 'The transcription broke this line mid-sentence; the extractor joined the next line on its own judgement.';
    d.appendChild(t);
  }
  if (b.kind === 'note') d.classList.add('xref');
  return d;
}

function show(i, blockId) {
  if (i < 0 || i >= SECTIONS.length) return;
  cur = i;
  const s = SECTIONS[i], page = document.getElementById('page');
  page.textContent = '';
  page.appendChild(el('h2', null, secLabel(s)));
  if (s.headings.length && s.titleSrc !== 'heading')
    page.appendChild(el('div', 'heads', 'Manuscript heading: ' + s.headings.join(' · ')));
  page.appendChild(el('div', 'prov', s.provenance + (secPages(s) ? ' · AA 24:' + secPages(s) : '')));
  let prevEnd = 0;
  s.blocks.forEach(b => {
    const d = renderBlock(b);
    // margin page label whenever a block opens on a page the previous one did not end on
    if (b.kind !== 'rule' && !d.querySelector('.mg') && b.aa !== prevEnd) d.insertBefore(el('span', 'mg', 'AA ' + b.aa), d.firstChild);
    prevEnd = b.aaEnd || b.aa;
    page.appendChild(d);
  });
  const step = el('div', 'step');
  const prev = el('a', null, i > 0 ? '← ' + secLabel(SECTIONS[i - 1]) : '');
  const next = el('a', null, i < SECTIONS.length - 1 ? secLabel(SECTIONS[i + 1]) + ' →' : '');
  prev.onclick = () => { show(i - 1); };
  next.onclick = () => { show(i + 1); };
  step.append(prev, next);
  page.appendChild(step);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
  const on = document.querySelector('#nav a.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
  const r = document.getElementById('reader');
  if (blockId) {
    const t = document.getElementById(blockId);
    if (t) { t.scrollIntoView({ block: 'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1600); return; }
  }
  r.scrollTop = 0;
}

/* AA page → the first block that is on it (blocks that cross onto it count) */
function findAA(p) {
  for (let i = 0; i < SECTIONS.length; i++)
    for (const b of SECTIONS[i].blocks)
      if (b.aa && p >= b.aa && p <= (b.aaEnd || b.aa)) return { i, id: b.id };
  return null;
}
function goAA(p) {
  const hit = findAA(p);
  if (hit) show(hit.i, hit.id);
  return !!hit;
}

/* ── search ── */
function runSearch() {
  const res = document.getElementById('results');
  res.textContent = '';
  const q = norm(query.trim());
  if (q.length < 2) { res.classList.remove('show'); query = ''; if (cur >= 0) show(cur); return; }
  query = query.trim();
  res.classList.add('show');
  const hits = [];
  SECTIONS.forEach((s, i) => s.blocks.forEach(b => {
    if (b.kind === 'rule') return;
    const k = norm(b.text).indexOf(q);
    if (k >= 0) hits.push({ i, b, k });
  }));
  res.appendChild(el('h2', null, hits.length + ' passage' + (hits.length === 1 ? '' : 's')));
  if (!hits.length) res.appendChild(el('div', 'none', 'Nothing found. Spelling is the transcript’s (Nuzzen, Urtheil, Kenntniße).'));
  hits.slice(0, 300).forEach(h => {
    const r = el('div', 'r');
    r.appendChild(el('span', 'w', secLabel(SECTIONS[h.i]) + ' · AA ' + h.b.aa));
    const from = Math.max(0, h.k - 50);
    r.appendChild(document.createTextNode((from ? '…' : '') + h.b.text.slice(from, h.k + q.length + 70) + '…'));
    r.onclick = () => show(h.i, h.b.id);
    res.appendChild(r);
  });
  if (hits.length > 300) res.appendChild(el('div', 'none', 'Showing the first 300.'));
  show(hits.length ? hits[0].i : cur, hits.length ? hits[0].b.id : null);
}

/* ── events ── */
let timer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  query = e.target.value;
  timer = setTimeout(runSearch, 250);
});
document.getElementById('goaa').addEventListener('change', e => {
  const p = +e.target.value;
  if (!goAA(p)) e.target.setCustomValidity('Not in AA 24:603–686'), e.target.reportValidity();
  else e.target.setCustomValidity('');
});
document.getElementById('tpg').onchange = e => document.body.classList.toggle('nopg', !e.target.checked);
document.getElementById('tinf').onchange = e => document.body.classList.toggle('noinf', !e.target.checked);
window.addEventListener('hashchange', route);

function route() {
  const h = location.hash.slice(1);
  let m;
  if ((m = /^aa-(\d+)$/.exec(h))) { if (goAA(+m[1])) return; }
  if ((m = /^s(\d+)$/.exec(h))) { const i = SECTIONS.findIndex(s => s.id === h); if (i >= 0) return show(i); }
  if (cur < 0) show(0);
}

/* ── init ── */
buildNav();
route();
</script>
</body>
</html>
