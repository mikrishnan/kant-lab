<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kant's logic lectures and Meier's Auszug — Reading Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:        #1a1208;
  --parchment:  #f4ede0;
  --parch-dark: #e8dcc8;
  --parch-deep: #d8ccb4;
  --accent:     #5c3d1e;
  --accent-lt:  #8b5e3c;
  --faded:      #7a6a52;
  --line:       #b8a88a;
  --aa-ink:     #3a5a3a;
  --aa-bg:      #eef5ee;
  --aa-bd:      #8aaa8a;
  --panel-bg:   #faf7f0;
  --hit:        #f3d98a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 19px; line-height: 1.55;
  background: var(--parchment); color: var(--ink);
  display: flex; flex-direction: column;
}
header {
  background: var(--accent); color: var(--parchment);
  padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px;
}
header h1 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.15rem; letter-spacing: .08em; margin: 0; }
header .sub { font-size: .9rem; opacity: .85; }
header .glink { margin-left: auto; font-family: 'Cinzel', serif; font-size: .74rem; letter-spacing: .08em; color: var(--parchment); text-decoration: none; border: 1px solid rgba(244,237,224,.5); border-radius: 12px; padding: 3px 11px; }
header .glink:hover { background: rgba(244,237,224,.15); }
/* reading mode: German only, or with the English floating over each sentence. Glossary features are not part of it */
#mode { margin-left: auto; display: flex; border: 1px solid rgba(244,237,224,.5); border-radius: 12px; overflow: hidden; align-self: center; }
#mode button { font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .07em; color: var(--parchment); background: none; border: 0; padding: 3px 11px; cursor: pointer; }
#mode button + button { border-left: 1px solid rgba(244,237,224,.5); }
#mode button:hover { background: rgba(244,237,224,.15); }
#mode button.on { background: var(--parchment); color: var(--accent); font-weight: 600; }
header #mode + .glink { margin-left: 0; }
body.noen .sent { cursor: text; }
body.noen .sent:hover, body.noen .sent.enhit { background: none; border-bottom: 0; }
body.noen .sent:hover .ph { border-bottom: 0; }
/* interlinear: every phrase stands over its own gloss; the sentence's English waits for a click */
.ph .il { display: none; }
body.ilm .ph { display: inline-flex; flex-direction: column; vertical-align: top; max-width: 100%; margin: 0 .12em .55em 0; }
body.ilm .ph .il { display: block; font-size: .86em; line-height: 1.25; font-style: italic; color: #2b3a52; padding-top: 1px; border-top: 1px solid var(--parch-deep); margin-top: 1px; }
body.ilm .sent:hover { background: none; }
body.ilm .sent:hover .ph { border-bottom: 0; }
body.ilm .sent:hover .ph .il { border-top-color: var(--line); }
body.ilm .sent.on .ph .il { color: #1d2a40; }
body.ilm .blk { margin-bottom: 1.1em; }
.term { text-decoration: underline dotted rgba(58, 90, 58, .55); text-underline-offset: 3px; cursor: pointer; }
.term:hover { background: var(--aa-bg); }
body.noterms .term { text-decoration: none; cursor: inherit; }
body.noterms .term:hover { background: none; }
#gcard { flex: none; max-height: 52%; overflow-y: auto; margin: 12px 12px 4px; padding: 10px 14px 12px; background: var(--parchment); border: 1px solid var(--aa-bd); border-left: 4px solid var(--aa-ink); border-radius: 5px; font-size: .92rem; line-height: 1.4; position: relative; }
#gcard[hidden] { display: none; }
#gcard .k { font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--aa-ink); }
#gcard .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 1.1rem; color: var(--faded); cursor: pointer; }
#gcard .de { font-weight: 600; font-size: 1.05rem; margin-top: 2px; }
#gcard .pr { color: var(--faded); font-size: .82rem; font-weight: 400; }
#gcard .en { color: #2b3a52; font-weight: 600; font-size: 1.15rem; margin: 2px 0 4px; }
#gcard .sn { font-size: .84rem; color: #2b3a52; margin: 2px 0; }
#gcard .sn i { color: var(--faded); }
#gcard .av { font-size: .82rem; color: #a0522d; }
#gcard .la { font-style: italic; color: var(--accent-lt); font-size: .88rem; }
#gcard .nt { font-size: .84rem; margin-top: 4px; }
#gcard .ct { font-size: .78rem; color: var(--faded); margin-top: 6px; }
#gcard .st { font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .08em; background: #fff4dc; color: #7a4a00; border-radius: 8px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
#gcard .exh { font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--aa-ink); margin: 9px 0 2px; border-top: 1px solid var(--parch-dark); padding-top: 6px; }
#gcard .ex { margin: 5px 0 7px; }
#gcard .ex a { font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .05em; color: var(--accent); cursor: pointer; text-decoration: none; }
#gcard .ex a:hover { text-decoration: underline; }
#gcard .ex .xd { font-size: .86rem; }
#gcard .ex .xe { font-size: .82rem; font-style: italic; color: #2b3a52; }
#gcard .ex .xo { font-size: .74rem; color: #a0522d; font-style: normal; }
#gcard .ex b { font-weight: 600; }
#gcard .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#gcard .acts a, #gcard .acts button { font: inherit; font-size: .8rem; padding: 2px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--parch-dark); color: var(--accent); cursor: pointer; text-decoration: none; }
#pop .gl { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(244,237,224,.3); font-size: .78rem; opacity: .9; }
#pop .gl b { font-weight: 600; }
#pop .g b { font-weight: 600; }
#pop .sn { font-size: .82rem; opacity: .85; margin-top: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; padding: 6px 20px; border-bottom: 1px solid var(--line); background: var(--panel-bg); }
input[type=search], input[type=number] {
  font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--parchment); color: var(--ink);
}
.tools input[type=number] { width: 9em; }
.tools label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
main { flex: 1; display: flex; min-height: 0; }
#left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#works { display: flex; flex: none; gap: 0; background: var(--accent); padding: 0 12px; overflow-x: auto; }
.work {
  font: inherit; font-family: 'Cinzel', serif; font-size: .78rem; letter-spacing: .06em; white-space: nowrap;
  color: var(--parch-deep); background: transparent; border: 0; border-bottom: 3px solid transparent;
  padding: 8px 16px 6px; cursor: pointer;
}
.work small { font-family: 'EB Garamond', serif; font-size: .8rem; letter-spacing: 0; opacity: .8; margin-left: 6px; }
.work:hover { color: #fff; }
.work.on { color: #fff; border-bottom-color: var(--parchment); }
.work .n { margin-left: 6px; color: var(--accent); background: var(--parchment); border-radius: 8px; padding: 0 6px; font-size: .64rem; }
#tabs {
  display: flex; flex: none; overflow-x: auto; background: var(--parch-dark);
  border-bottom: 1px solid var(--line); padding: 6px 12px 0; gap: 2px;
}
.tab {
  flex: none; font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .04em;
  padding: 6px 11px; color: var(--accent); background: var(--parch-deep);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 4px 4px 0 0;
  cursor: pointer; white-space: nowrap; max-width: 17em; overflow: hidden; text-overflow: ellipsis;
}
.tab:hover { background: var(--parchment); }
.tab.on { background: var(--parchment); color: #2e1a00; font-weight: 600; margin-bottom: -1px; padding-bottom: 7px; }
.tab.untitled { font-style: italic; }
.tab .n { margin-left: 5px; color: #fff; background: var(--accent-lt); border-radius: 8px; padding: 0 5px; font-size: .62rem; }
#reader { flex: 1; overflow-y: auto; padding: 24px 32px 80px; }
#page { max-width: 46em; margin: 0 auto; }
#page h2 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.3rem; color: #2e1a00; margin: 0 0 4px; letter-spacing: .04em; }
.prov { font-size: .85rem; font-style: italic; color: var(--faded); margin-bottom: 18px; }
.heads { font-size: .85rem; color: var(--faded); margin: -10px 0 14px; }
.blk { position: relative; margin: 0 0 .75em; padding-left: 4.6em; scroll-margin-top: 12px; }

.blk .mg {
  position: absolute; left: 0; top: .25em; width: 3.8em; text-align: right; line-height: 1.25;
  font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink);
}
.blk .mg i { display: block; font-style: normal; color: var(--accent-lt); }
.blk .mg .ct { display: block; font-family: 'EB Garamond', serif; font-size: .72rem; color: var(--faded); }
.blk.flash { background: var(--hit); transition: background 1.5s; }
.pg {
  font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink);
  background: var(--aa-bg); border: 1px solid var(--aa-bd); border-radius: 3px;
  padding: 0 4px; margin: 0 3px; white-space: nowrap; cursor: pointer;
}
body.nopg .pg { display: none; }
.blk.inf .tx { border-bottom: 1px dashed var(--accent-lt); }
.tag { font-size: .65rem; font-family: 'Cinzel', serif; color: var(--accent-lt); margin-left: 6px; letter-spacing: .05em; }
body.noinf .tag { display: none; }
body.noinf .blk.inf .tx { border-bottom: 0; }
.ed { color: var(--accent-lt); }              /* editorial brackets, kept verbatim */
.blk.rule { padding-left: 4.6em; }
.blk.rule hr { border: 0; border-top: 1px solid var(--line); margin: .6em 0; }
mark { background: var(--hit); color: inherit; padding: 0 1px; border-radius: 2px; }
/* Busolt's first page: the title page and the AA's table of contents, set as a contents table */
.titlepage { text-align: center; margin: 6px 0 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.titlepage .blk { margin-bottom: .15em; }
.titlepage .blk.big .tx { font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: .05em; color: #2e1a00; }
.titlepage .blk.small .tx { font-style: italic; font-size: .95rem; }
.toc { position: relative; padding-left: 4.6em; margin-bottom: 1.4em; }
.toc .mg { position: absolute; left: 0; top: .25em; width: 3.8em; text-align: right; font-family: 'Cinzel', serif; font-size: .68rem; color: var(--aa-ink); }
.toc-head { text-align: center; margin-bottom: 10px; }
.toc-head .tx { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: .08em; color: #2e1a00; }
.toc-head .en { display: block; font-size: .8rem; font-style: italic; color: var(--faded); }
.toc-cols { display: flex; justify-content: space-between; font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faded); border-bottom: 1px solid var(--line); padding: 0 6px 2px; margin-bottom: 4px; }
.toc-row { display: flex; align-items: baseline; gap: .45em; padding: 2px 6px; border-radius: 3px; cursor: pointer; scroll-margin-top: 12px; }
.toc-row:hover { background: var(--parch-dark); }
.toc-row .lead { flex: 1; min-width: 1.5em; border-bottom: 1px dotted var(--line); position: relative; top: -.3em; }
.toc-row .p { font-family: 'Cinzel', serif; font-size: .76rem; color: var(--aa-ink); white-space: nowrap; }
.toc-row.part { margin-top: .45em; font-variant: small-caps; letter-spacing: .03em; font-size: 1.04em; }
.toc-row.flash { background: var(--hit); transition: background 1.5s; }
.toc-sub { margin: 0 0 .3em 1.1em; padding-left: .7em; border-left: 1px dashed var(--accent-lt); }
.toc-sub .toc-row { font-size: .96em; }
body.noinf .toc-sub { border-left-color: transparent; }
.toc-grp { margin: .7em 0 .15em; padding: 0 6px; font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .05em; color: var(--accent-lt); cursor: pointer; border-bottom: 1px dashed var(--line); }
.toc-grp:first-child { margin-top: .2em; }
.toc-grp:hover { color: var(--accent); background: var(--parch-dark); }
.toc-grp .k { display: inline-block; margin-right: .6em; padding: 0 5px; border: 1px dashed var(--accent-lt); border-radius: 3px; font-size: .62rem; }
.toc-grp .pp { float: right; font-family: 'EB Garamond', serif; font-style: italic; font-size: .78rem; color: var(--faded); letter-spacing: 0; }
body.noinf .toc-grp { display: none; }
.toc-note { font-size: .78rem; font-style: italic; color: var(--faded); margin-top: 8px; }
body.noinf .toc-note { display: none; }
.step { display: flex; justify-content: space-between; margin-top: 30px; font-size: .9rem; }
.step a { color: var(--accent); cursor: pointer; }
#side {
  width: 360px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--panel-bg); border-left: 1px solid var(--line);
}
.sent { cursor: pointer; border-radius: 2px; }
.sent:hover { background: var(--parch-dark); }
.sent.on { background: var(--hit); box-shadow: 0 0 0 2px var(--hit); }
.sent.enhit { background: rgba(243, 217, 138, .45); border-bottom: 2px solid var(--hit); }
.sent:hover .ph { border-bottom: 1px dotted var(--accent-lt); }
.ph.hot { background: var(--parch-deep); border-bottom: 1px solid var(--accent) !important; border-radius: 2px; }
#pop .g { font-size: 1.05rem; }
#pop mark { color: var(--ink); }
#pop .g + .s { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(244,237,224,.3); font-size: .82rem; opacity: .78; }
#pop {
  position: fixed; z-index: 20; max-width: 34em; padding: 8px 12px;
  background: #2e1a00; color: var(--parchment); border-radius: 5px; box-shadow: 0 3px 12px rgba(0,0,0,.35);
  font-size: .95rem; line-height: 1.4; pointer-events: none;
}
#pop[hidden] { display: none; }
#side h2 {
  font-family: 'Cinzel', serif; font-weight: 400; font-size: .72rem; letter-spacing: .12em;
  color: var(--faded); margin: 12px 16px 6px; text-transform: uppercase;
}
#side form { padding: 0 16px 8px; display: flex; gap: 6px; }
#side input[type=search] { flex: 1; min-width: 0; font-size: 1rem; padding: 5px 9px; }
#side button { font: inherit; font-size: .85rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--parch-dark); color: var(--accent); cursor: pointer; }
#side .opts { padding: 0 16px 8px; font-size: .82rem; color: var(--faded); }
#side .opts label { cursor: pointer; }
#count { padding: 0 16px 6px; font-size: .85rem; color: var(--faded); }
#hits { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); }
#hits .g {
  font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .06em; color: var(--accent);
  background: var(--parch-dark); padding: 4px 16px; position: sticky; top: 0; cursor: pointer;
}
#hits .r { padding: 6px 16px; border-bottom: 1px solid var(--parch-dark); cursor: pointer; font-size: .9rem; line-height: 1.35; }
#hits .r:hover { background: var(--parch-dark); }
#hits .r .w { font-family: 'Cinzel', serif; font-size: .64rem; color: var(--aa-ink); display: block; }
#hits .none { padding: 8px 16px; color: var(--faded); font-style: italic; font-size: .9rem; }
@media (max-width: 860px) { main { flex-direction: column; } #side { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--line); } #reader { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Kant’s Logic</h1>
  <span class="sub">Two student transcripts of the lectures (AA XXIV) and the textbook they follow, Meier’s Auszug (1752)</span>
  <div id="mode" role="radiogroup" aria-label="Reading mode">
    <button type="button" role="radio" data-m="de" aria-checked="false" title="Read the German alone: no English appears over the sentences, and the search looks only at the German. Hovering an underlined glossary term still shows the glossary’s rendering of it.">German only</button>
    <button type="button" role="radio" data-m="il" aria-checked="false" title="Interlinear: each phrase of the German stands over its own short English gloss, in German word order. Click a sentence for its full English translation. Hovering an underlined glossary term shows the glossary’s rendering of it.">Interlinear</button>
    <button type="button" role="radio" data-m="en" aria-checked="true" class="on" title="Hover a sentence or phrase for its English; click to pin it. The search also finds German sentences through their English.">With English</button>
  </div>
  <a class="glink" href="glossary/index.html" target="_blank" rel="noopener" title="The shared glossary: one English rendering for every Kantian term">Glossary ↗</a>
</header>
<main>
  <section id="left">
    <div id="works" role="tablist" aria-label="Text"></div>
    <div id="tabs" role="tablist" aria-label="Sections"></div>
    <div class="tools">
      <input type="number" id="goaa" placeholder="Go to AA page" aria-label="Go to page">
      <label id="lpg"><input type="checkbox" id="tpg" checked> page breaks</label>
      <label id="linf"><input type="checkbox" id="tinf" checked> inferred joins</label>
      <label title="Underline the terms that have an entry in the shared glossary; click one to see it"><input type="checkbox" id="tterms" checked> glossary terms</label>
    </div>
    <div id="reader"><div id="page"></div></div>
  </section>
  <aside id="side">
    <div id="gcard" hidden></div>
    <h2>Search terms</h2>
    <form id="sf"><input type="search" id="q" placeholder="e.g. Urtheil, Begriff, cognitio" aria-label="Search" autocomplete="off"><button type="button" id="clr">Clear</button></form>
    <div class="opts"><label><input type="checkbox" id="whole"> whole words only</label> &nbsp; <label><input type="checkbox" id="allw" checked> all three texts</label></div>
    <div id="count">Type at least two letters. ß and ss are treated alike; case is ignored.</div>
    <div id="hits"></div>
  </aside>
</main>
<div id="pop" role="tooltip" lang="en" hidden></div>

<script src="../../data/logik-busolt-24.js"></script>
<script src="../../data/logik-blomberg-24.js"></script>
<script src="meier-auszug.js"></script>
<script src="translations/meier-aligned.js"></script>
<script src="translations/meier-phrases.js"></script>
<script src="translations/logik-units.js"></script>
<script src="glossary/kant-glossary.js"></script>
<script src="glossary/counts.js"></script>
<script src="glossary/terms-index.js"></script>
<script src="glossary/examples.js"></script>
<script>
/* ── data ──
   LOGIK_BUSOLT and LOGIK_BLOMBERG come from ../../data/; MEIER_AUSZUG from meier-auszug.js.
   All three are normalised into one shape, WORKS[].sections[].blocks[], below. */
const ED_RE = /(\[[^\]]*\]|<[^>]*>)/g;   // [ Textlücke: … ], [AA: …], < bricht ab >

function logikWork(key, L, label, sub) {
  return {
    key, label, sub, logik: true, aaRange: L.meta.aa,
    goto: 'Go to AA page',
    sections: L.sections.map(s => ({
      id: s.id, untitled: !s.title,
      label: s.title || (s.titleSrc === 'none' ? 'Titelei (no title)' : s.headings[0] || s.id),
      headings: s.titleSrc === 'heading' ? [] : s.headings,
      provenance: s.provenance, blocks: s.blocks
    }))
  };
}
function meierWork(M) {
  return {
    key: 'meier', label: 'Meier · Auszug', sub: '1752', logik: false, numRange: [1, 563],
    goto: 'Go to §',
    sections: M.nav.map((n, i) => ({
      id: 'm' + String(i + 1).padStart(2, '0'), tabNo: n.sec_num == null ? 'Einl.' : n.part_num + '.' + n.sec_num,
      label: n.sec_title_de, untitled: false,
      headings: [n.part_title_de],
      provenance: 'G. F. Meier, Auszug aus der Vernunftlehre (1752) · §§ ' + n.paras[0] + '–' + n.paras[n.paras.length - 1],
      blocks: n.paras.map(num => ({
        id: 'meier-para-' + num, kind: 'text', n: num, text: M.paras[String(num)], cite: M.citations[String(num)]
      }))
    }))
  };
}
const WORKS = [
  logikWork('busolt', LOGIK_BUSOLT, 'Logik Busolt', 'ca. 1789/90'),
  logikWork('blomberg', LOGIK_BLOMBERG, 'Logik Blomberg', 'ca. 1771'),
  meierWork(MEIER_AUSZUG)
];

/* Busolt's contents, grouped by the divisions of Meier's Auszug that the lectures follow. The grouping
   is the reader's, not the AA's: each group starts at the entry whose title begins with `from`, and
   names (and opens) the Meier sections it parallels, by their tab numbers. */
const TOC_GROUPS = {
  busolt: [
    { from: 'Von der Vollkommenheit', meier: ['1.1', '1.7'] },
    { from: 'Von den Begriffen',      meier: ['1.8'] },
    { from: 'Von den Urtheilen',      meier: ['1.9'] },
    { from: 'Regeln der Vernunft',    meier: ['1.10'] },
    { from: 'Die Praktische Logic',   meier: ['2.1'] },
    { from: 'Vom Gebrauch der Wörter', meier: ['3.1'] }
  ]
};

/* ── state ── */
let wi = 0;              // the text on show
let mode = 'en';         // reading mode: 'de' German only · 'il' interlinear glosses under the phrases · 'en' English floats over the sentences
let hovTerm = null;      // the glossary term under the pointer, for German-only mode
let cur = -1;            // the section on show
let queryRe = null;      // the compiled search, or null
let hitCount = null;     // per work, per section: occurrences, for the tab badges

/* ── helpers ── */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const W = () => WORKS[wi];
function secPages(s) {
  const a = s.blocks.map(b => b.aa).filter(Boolean), z = s.blocks.map(b => b.aaEnd || b.aa).filter(Boolean);
  return a.length ? (Math.min(...a) === Math.max(...z) ? '' + a[0] : Math.min(...a) + '–' + Math.max(...z)) : '';
}
function blockWhere(w, b) { return w.logik ? 'AA ' + b.aa : '§ ' + b.n; }
function paraLabel(b) {                 // Blomberg's own § heading, as parsed numbers; the raw form stays in the tooltip
  const n = b.para && b.para.nums;
  if (!n || !n.length) return '';
  if (n.length === 2 && /\d\s*[-–]\s*\d/.test(b.para.raw)) return '§ ' + n[0] + '–' + n[1];   // printed as a range
  return '§ ' + (n.length > 3 ? n[0] + '…' + n[n.length - 1] : n.join(', '));
}
/* A search term as a regex over the text itself, so offsets stay true to it.
   ß and ss match each other; case is ignored; optionally whole words only. */
function makeRe(q, whole) {
  q = q.trim();
  if (q.length < 2) return null;
  const body = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ß|ss/gi, '(?:ß|ss)');
  return new RegExp(whole ? '(?<![\\p{L}])' + body + '(?![\\p{L}])' : body, 'giu');
}

/* Split text at its editorial brackets and search hits, appending to parent.
   Everything goes in as text nodes — the text is never parsed as HTML. */
function addText(parent, text) {
  text.split(ED_RE).forEach(part => {
    if (!part) return;
    const host = /^[\[<]/.test(part) ? el('span', 'ed') : parent;
    if (host !== parent) parent.appendChild(host);
    if (!queryRe) { host.appendChild(document.createTextNode(part)); return; }
    let i = 0, m;
    queryRe.lastIndex = 0;
    while ((m = queryRe.exec(part))) {
      if (!m[0]) { queryRe.lastIndex++; continue; }
      host.appendChild(document.createTextNode(part.slice(i, m.index)));
      host.appendChild(el('mark', null, m[0]));
      i = m.index + m[0].length;
    }
    host.appendChild(document.createTextNode(part.slice(i)));
  });
}

/* A slice [from, to) of a block's text, with the glossary's terms (KANT_GLOSSARY_SPANS, generated by
   glossary/glossary.py index) as clickable spans. The spans are offsets into the block's own text. */
const GLOSS_BY_ID = Object.fromEntries(KANT_GLOSSARY.map(e => [e.id, e]));
function addTx(parent, b, from, to) {               // a slice of a block: page chips, then terms
  let at = from;
  (b.pages || []).forEach(p => {
    if (p.i > 0 && p.i >= from && p.i < to) { if (p.i > at) addTerms(parent, b, at, p.i); parent.appendChild(pageChip(p.p)); at = p.i; }
  });
  if (at < to) addTerms(parent, b, at, to);
}
function addTerms(parent, b, from, to) {
  const flat = (KANT_GLOSSARY_SPANS.spans[W().key] || {})[b.id];
  if (!flat) { addText(parent, b.text.slice(from, to)); return; }
  let at = from;
  for (let i = 0; i < flat.length; i += 3) {
    const s0 = Math.max(flat[i], from), s1 = Math.min(flat[i + 1], to);
    if (s1 <= s0 || s0 < at) continue;
    if (s0 > at) addText(parent, b.text.slice(at, s0));
    const t = el('span', 'term');
    t.dataset.g = KANT_GLOSSARY_SPANS.ids[flat[i + 2]];
    t.dataset.pr = b.text.slice(flat[i], flat[i + 1]);
    addText(t, b.text.slice(s0, s1));
    t.onclick = e => { if (document.body.classList.contains('noterms') || String(getSelection())) return; e.stopPropagation(); openTerm(t.dataset.g, t.dataset.pr); };
    t.onmouseenter = () => { hovTerm = t; refreshPop(); };       // German-only mode: the glossary's rendering floats over the term
    t.onmouseleave = () => { hovTerm = null; refreshPop(); };
    parent.appendChild(t);
    at = s1;
  }
  if (at < to) addText(parent, b.text.slice(at, to));
}

function pageChip(p) {
  const c = el('span', 'pg', 'AA ' + p);
  c.title = 'AA 24:' + p + ' — click to link to this page';
  c.onclick = () => { location.hash = W().key + ':aa-' + p; };
  return c;
}

/* ── render ── */
function buildWorks() {
  const box = document.getElementById('works');
  WORKS.forEach((w, i) => {
    const b = el('button', 'work', w.label);
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.dataset.w = i;
    b.appendChild(el('small', null, w.sub));
    b.onclick = () => showWork(i);
    box.appendChild(b);
  });
}

function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.textContent = '';
  const w = W();
  w.sections.forEach((s, i) => {
    const t = el('button', 'tab' + (s.untitled ? ' untitled' : ''), (s.tabNo || i + 1) + ' ' + s.label);
    t.type = 'button';
    t.setAttribute('role', 'tab');
    t.dataset.i = i;
    t.title = s.label + (w.logik && secPages(s) ? ' · AA 24:' + secPages(s) : '');
    t.onclick = () => show(i);
    tabs.appendChild(t);
  });
  const g = document.getElementById('goaa');
  g.placeholder = w.goto;
  g.min = w.logik ? w.aaRange[0] : w.numRange[0];
  g.max = w.logik ? w.aaRange[1] : w.numRange[1];
  g.value = '';
  g.setCustomValidity('');
  document.getElementById('linf').style.display = w.logik ? '' : 'none';
  document.getElementById('lpg').style.display = w.logik ? '' : 'none';
  document.querySelectorAll('#works .work').forEach(b => {
    b.classList.toggle('on', +b.dataset.w === wi);
    b.setAttribute('aria-selected', +b.dataset.w === wi);
  });
}

/* A block's sentence units, whichever text it is from: [{ o: [start, end), en, p: [[start, end, gloss], …] }],
   or null. Meier: MEIER_ALIGNED + MEIER_PHRASES. Busolt, Blomberg: LOGIK_UNITS (logik-units.py). */
const UNITS = new Map();                 // block id -> its units, for the hover window and the search
function unitsFor(w, b) {
  if (UNITS.has(b.id)) return UNITS.get(b.id);
  let u = null;
  if (!w.logik && b.n && MEIER_ALIGNED[b.n]) u = MEIER_ALIGNED[b.n].map((g, k) => ({ o: g.o, en: g.en, p: MEIER_PHRASES[b.n][k] }));
  else if (w.logik && typeof LOGIK_UNITS !== 'undefined') { const x = (LOGIK_UNITS[w.key] || {})[b.id]; if (x && x.length) u = x; }
  UNITS.set(b.id, u);
  return u;
}

/* A block as a row of sentences, each a unit with its English counterpart and cut into divisions
   that carry their own glosses. The spans are slices of the source's own text, so nothing in the
   German is altered. */
function renderSentences(tx, b, units) {
  let at = 0;
  units.forEach((g, k) => {
    if (g.o[0] > at) addTx(tx, b, at, g.o[0]);
    const sp = el('span', 'sent');
    sp.dataset.b = b.id; sp.dataset.k = k;
    if (mode !== 'de' && queryRe) { queryRe.lastIndex = 0; if (queryRe.test(g.en)) { sp.classList.add('enhit'); sp.title = 'The English translation of this sentence matches the search'; } }
    let pa = g.o[0];
    (g.p || []).forEach((ph, pi) => {
      if (ph[0] > pa) addTx(sp, b, pa, ph[0]);
      const span = el('span', 'ph');
      span.dataset.p = pi;
      const de = el('span', 'ild');                             // the phrase's German as one piece, so interlinear mode can stack
      addTx(de, b, ph[0], ph[1]);                               // it over its gloss
      span.append(de, el('span', 'il', ph[2]));                 // the gloss, shown beneath the phrase in interlinear mode
      span.onmouseenter = () => { hovPh = span; refreshPop(); };
      span.onmouseleave = () => { hovPh = null; refreshPop(); };
      sp.appendChild(span);
      pa = ph[1];
    });
    if (pa < g.o[1]) addTx(sp, b, pa, g.o[1]);
    sp.onclick = e => { if (mode === 'de') return; e.stopPropagation(); if (!String(getSelection())) selectSentence(b.id, k); };
    sp.onmouseenter = () => { hov = sp; refreshPop(); };
    sp.onmouseleave = () => { hov = null; hovPh = null; refreshPop(); };
    tx.appendChild(sp);
    at = g.o[1];
  });
  if (at < b.text.length) addTx(tx, b, at, b.text.length);
}

function renderBlock(b) {
  const d = el('div', 'blk');
  d.id = b.id;
  if (b.kind === 'rule') { d.className = 'blk rule'; d.appendChild(document.createElement('hr')); return d; }
  const inferred = (b.joined || []).includes('inferred');
  if (inferred) d.classList.add('inf');
  const tx = el('span', 'tx');
  const units = unitsFor(W(), b);
  if (units) renderSentences(tx, b, units);
  else addTx(tx, b, 0, b.text.length);
  d.appendChild(tx);
  if (inferred) {
    const t = el('span', 'tag', 'joined · inferred');
    t.title = 'The transcription broke this line mid-sentence; the extractor joined the next line on its own judgement.';
    d.appendChild(t);
  }
  if (b.kind === 'note') d.classList.add('xref');
  return d;
}

function margin(w, b, prev) {
  const m = el('span', 'mg');
  if (!w.logik) {                                        // Meier: every block is a §
    m.textContent = '§ ' + b.n;
    if (b.cite) m.appendChild(el('span', 'ct', b.cite));
    return m;
  }
  let any = false;
  if ((b.pages || []).some(p => p.i === 0) || b.aa !== prev.end) { m.textContent = 'AA ' + b.aa; any = true; }
  const pl = paraLabel(b);
  if (pl && (!prev.b || !prev.b.para || prev.b.para.raw !== b.para.raw)) {
    const i = el('i', null, pl);
    i.title = 'Blomberg’s own heading: ' + b.para.raw;
    m.appendChild(i); any = true;
  }
  return any ? m : null;
}

/* The AA prints Busolt's table of contents as a run of one-line blocks — a title, then its page —
   after a block ending in "Inhaltsverzeichnis". Found here and set as a contents table: the printed
   titles and pages verbatim, each row opening the section it names. Only the indentation is the
   reader's own: the AA prints the list flat, and entries are indented beneath an entry whose page is
   a range ("Abhandlung der Logic 616-686") when their pages fall inside it. */
const tocKey = t => t.toLowerCase().replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
  .replace(/c/g, 'k').replace(/[^a-z]/g, '').replace(/(.)\1+/g, '$1');
function tocRun(w, s) {
  if (!w.logik) return null;
  const B = s.blocks, h = B.findIndex(b => b.kind === 'text' && /Inhaltsverzeichnis$/.test(b.text));
  if (h < 0) return null;
  const entries = [];
  let i = h + 1;
  for (; i + 1 < B.length && /^\d+(-\d+)?$/.test(B[i + 1].text); i += 2) {
    const k = tocKey(B[i].text), [a, z] = B[i + 1].text.split('-').map(Number);
    const target = w.sections.findIndex((x, j) => j !== cur && !x.untitled && tocKey(x.label).includes(k));
    entries.push({ b: B[i], pb: B[i + 1], a, z: z || a, target });
  }
  return entries.length ? { head: h, end: i, entries } : null;
}
function tocRow(w, e) {
  const row = el('div', 'toc-row');
  row.id = e.b.id;
  const t = el('span', 'tx'), units = unitsFor(w, e.b);
  if (units) renderSentences(t, e.b, units); else addTx(t, e.b, 0, e.b.text.length);
  const p = el('span', 'p');
  p.id = e.pb.id;
  addTx(p, e.pb, 0, e.pb.text.length);
  row.append(t, el('span', 'lead'), p);
  if (e.target >= 0) {
    const sec = w.sections[e.target];
    row.title = 'Open “' + sec.label + '” (AA 24:' + secPages(sec) + ')';
    // capture, so a click opens the section rather than pinning the sentence; hovering still shows the English
    row.addEventListener('click', ev => { ev.stopPropagation(); hov = null; hovPh = null; refreshPop(); show(e.target); }, true);
  } else row.style.cursor = 'default';
  return row;
}
function tocGroup(g, M) {                  // a Meier division heading over the entries that parallel it
  const secs = WORKS[M].sections, ix = g.meier.map(n => secs.findIndex(x => x.tabNo === n));
  const first = secs[ix[0]], last = secs[ix[ix.length - 1]];
  const d = el('div', 'toc-grp');
  const roman = n => ['', 'I', 'II', 'III', 'IV'][+n.split('.')[0]] + '.' + n.split('.')[1];
  d.appendChild(el('span', 'k', 'Meier ' + roman(g.meier[0]) + (g.meier[1] ? '–' + g.meier[1].split('.')[1] : '')));
  d.appendChild(document.createTextNode(ix.length > 1 ? first.headings[0] : first.label));
  const pp = [first.blocks[0].n, last.blocks[last.blocks.length - 1].n];
  d.appendChild(el('span', 'pp', '§§ ' + pp[0] + '–' + pp[1]));
  d.title = 'Open Meier’s Auszug at ' + first.label + ' (§ ' + pp[0] + ')';
  d.onclick = ev => { ev.stopPropagation(); showWork(M, ix[0]); };
  return d;
}
function renderToc(page, w, s, run) {
  const B = s.blocks, prev = { end: 0, b: null };
  const tp = el('div', 'titlepage');
  B.slice(0, run.head).forEach((b, k) => {
    const d = renderBlock(b);
    d.classList.add(k < 3 ? 'big' : 'small');
    const m = margin(w, b, prev); if (m) d.insertBefore(m, d.firstChild);
    prev.end = b.aaEnd || b.aa; prev.b = b;
    tp.appendChild(d);
  });
  if (tp.childNodes.length) page.appendChild(tp);
  const toc = el('div', 'toc');
  const hb = B[run.head], first = run.entries[0].b;
  if (first.aa !== prev.end) toc.appendChild(el('span', 'mg', 'AA ' + first.aa));
  const head = el('div', 'toc-head');
  head.id = hb.id;
  const ht = el('span', 'tx'), hu = unitsFor(w, hb);
  if (hu) renderSentences(ht, hb, hu); else addTx(ht, hb, 0, hb.text.length);
  head.append(ht, el('span', 'en', 'Table of contents'));
  toc.append(head, el('div', 'toc-cols'));
  toc.lastChild.append(el('span', null, 'Section'), el('span', null, 'AA 24'));
  let box = null, range = null, nested = false;
  const groups = TOC_GROUPS[w.key] || [], M = WORKS.findIndex(x => x.key === 'meier');
  const used = new Set();
  run.entries.forEach(e => {
    if (range && e.a >= range[0] && e.a <= range[1]) {
      if (!box) { box = el('div', 'toc-sub'); toc.appendChild(box); nested = true; }
      const g = groups.find(g => !used.has(g) && e.b.text.startsWith(g.from));
      if (g) { used.add(g); box.appendChild(tocGroup(g, M)); }
      box.appendChild(tocRow(w, e));
      return;
    }
    box = null; range = e.z > e.a ? [e.a, e.z] : null;
    const r = tocRow(w, e);
    if (range) r.classList.add('part');
    toc.appendChild(r);
  });
  if (nested) toc.appendChild(el('div', 'toc-note', 'Titles and pages as the AA prints them; click a title to open its section. The structure is the reader’s, not the AA’s, which sets the list flat: the indented entries are those whose pages fall within the range printed beside the entry above them, and the headings over them are the divisions of Meier’s Auszug that the lectures follow (click one to open it in the Meier tab).'));
  page.appendChild(toc);
  prev.end = run.entries[run.entries.length - 1].pb.aa; prev.b = run.entries[run.entries.length - 1].pb;
  return { from: run.end, prev };
}

function show(i, blockId) {
  const w = W();
  if (i < 0 || i >= w.sections.length) return;
  cur = i;
  const s = w.sections[i], page = document.getElementById('page');
  page.textContent = '';
  page.appendChild(el('h2', null, s.label));
  if (s.headings.length) page.appendChild(el('div', 'heads', (w.logik ? 'Manuscript heading: ' : '') + s.headings.join(' · ')));
  page.appendChild(el('div', 'prov', s.provenance + (w.logik && secPages(s) ? ' · AA 24:' + secPages(s) : '')));
  const run = tocRun(w, s);
  let prev = { end: 0, b: null }, from = 0;
  if (run) ({ from, prev } = renderToc(page, w, s, run));
  s.blocks.slice(from).forEach(b => {
    const d = renderBlock(b);
    if (b.kind !== 'rule') {
      const m = margin(w, b, prev);
      if (m) d.insertBefore(m, d.firstChild);
      prev.end = b.aaEnd || b.aa; prev.b = b;
    }
    page.appendChild(d);
  });
  const step = el('div', 'step');
  const pv = el('a', null, i > 0 ? '← ' + w.sections[i - 1].label : '');
  const nx = el('a', null, i < w.sections.length - 1 ? w.sections[i + 1].label + ' →' : '');
  pv.onclick = () => show(i - 1);
  nx.onclick = () => show(i + 1);
  step.append(pv, nx);
  page.appendChild(step);
  document.querySelectorAll('#tabs .tab').forEach(t => {
    t.classList.toggle('on', +t.dataset.i === i);
    t.setAttribute('aria-selected', +t.dataset.i === i);
  });
  const on = document.querySelector('#tabs .tab.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  markTabs();
  markSelected();
  if (blockId) {
    const t = document.getElementById(blockId);
    if (t) { t.scrollIntoView({ block: 'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1600); return; }
  }
  document.getElementById('reader').scrollTop = 0;
}

function showWork(k, si, blockId) {
  wi = k;
  buildTabs();
  show(si || 0, blockId);
}

/* AA page / § number → where it is */
function findAA(p) {
  const w = W();
  for (let i = 0; i < w.sections.length; i++)
    for (const b of w.sections[i].blocks)
      if (b.aa && p >= b.aa && p <= (b.aaEnd || b.aa)) return { i, id: b.id };
  return null;
}
function findPara(n) {
  const w = W();
  for (let i = 0; i < w.sections.length; i++)
    for (const b of w.sections[i].blocks) if (b.n === n) return { i, id: b.id };
  return null;
}
function goTo(n) {
  const hit = W().logik ? findAA(n) : findPara(n);
  if (hit) show(hit.i, hit.id);
  return !!hit;
}

/* ── sentence units (Meier) ──
   Hovering a division (phrase) of a sentence floats that division's English over it, with the whole
   sentence's English beneath; hovering elsewhere in the sentence shows the sentence alone. Clicking pins
   the sentence (and the window) until Esc or a click elsewhere. */
let sel = null;          // { n, k } — the pinned sentence, or null
let hov = null;          // the sentence span under the pointer
let hovPh = null;        // the division under the pointer, if any

function englishOf(sp) { return UNITS.get(sp.dataset.b)[sp.dataset.k].en; }
function glossOf(sp, ph) { return UNITS.get(sp.dataset.b)[sp.dataset.k].p[ph.dataset.p][2]; }
function showPop(sp, ph) {
  const pop = document.getElementById('pop');
  pop.textContent = '';
  if (ph) pop.appendChild(el('div', 'g', glossOf(sp, ph)));
  const full = el('div', ph ? 's' : 'g');
  addText(full, englishOf(sp));                                           // the search term marked in the English too
  pop.appendChild(full);
  const ids = ph && !document.body.classList.contains('noterms') ? [...ph.querySelectorAll('.term')] : [];
  if (ids.length) {                                                       // the glossary's renderings of the terms in this division
    const gl = el('div', 'gl', 'Glossary: ');
    const seen = new Set();
    ids.forEach(t => {
      if (seen.has(t.dataset.g)) return;
      if (seen.size) gl.appendChild(document.createTextNode(' · '));
      seen.add(t.dataset.g);
      gl.appendChild(document.createTextNode(t.dataset.pr + ' → '));
      gl.appendChild(el('b', null, GLOSS_BY_ID[t.dataset.g].en));
    });
    pop.appendChild(gl);
  }
  placePop(ph || sp, 34);
}
function placePop(target, em) {           // over the target (below it if there is no room), never leaving the text side
  const pop = document.getElementById('pop'), box = document.getElementById('left').getBoundingClientRect();
  pop.style.maxWidth = Math.min(em * 16, box.width - 8) + 'px';
  pop.hidden = false;
  const rects = target.getClientRects(), r0 = rects[0], gap = 6;
  const pw = pop.offsetWidth, phh = pop.offsetHeight;
  let top = r0.top - phh - gap;
  if (top < box.top + 4) top = rects[rects.length - 1].bottom + gap;  // no room above: below the last line
  let left = Math.min(Math.max(box.left + 4, r0.left), box.right - pw - 4);
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
}
/* German-only mode keeps the glossary: hovering an underlined term floats the glossary's rendering of it
   (and its other senses, if it has any) — the glossary's English, never the sentence's. */
function showTermPop(t) {
  const e = GLOSS_BY_ID[t.dataset.g], pop = document.getElementById('pop');
  pop.textContent = '';
  const g = el('div', 'g');
  g.append(document.createTextNode(t.dataset.pr + ' → '), el('b', null, e.en));
  pop.appendChild(g);
  (e.senses || []).forEach(sn => pop.appendChild(el('div', 'sn', '“' + sn.en + '” when ' + sn.when)));
  pop.appendChild(el('div', 'gl', 'Glossary' + (e.status !== 'confirmed' ? ' (proposed)' : '') + ' · click for the full entry'));
  placePop(t, 24);
}
function pinnedSpan() {
  return sel && document.querySelector('.sent[data-b="' + sel.b + '"][data-k="' + sel.k + '"]');
}
function refreshPop() {                  // the hovered division's English, else the hovered/pinned sentence's, else nothing
  document.querySelectorAll('.ph.hot').forEach(x => x.classList.remove('hot'));
  if (mode !== 'en') {                    // German only and interlinear: the glossary's rendering over a hovered term;
    const pin = mode === 'il' && pinnedSpan();   // interlinear also shows a clicked sentence's full English
    if (hovTerm && hovTerm.isConnected && !document.body.classList.contains('noterms')) showTermPop(hovTerm);
    else if (pin) showPop(pin, null);
    else document.getElementById('pop').hidden = true;
    return;
  }
  const sp = hov || pinnedSpan();
  if (hov && hovPh) hovPh.classList.add('hot');
  if (sp) showPop(sp, hov ? hovPh : null); else document.getElementById('pop').hidden = true;
}
function markSelected() {
  document.querySelectorAll('.sent.on').forEach(x => x.classList.remove('on'));
  const sp = pinnedSpan();
  if (sp) sp.classList.add('on');
  hov = null; hovPh = null;
  refreshPop();
}
function selectSentence(bid, k) {
  sel = (sel && sel.b === bid && sel.k === k) ? null : { b: bid, k };  // a second click unpins
  markSelected();
}

/* ── glossary card ── */
const TEXT_NAMES = { meier: 'Meier', busolt: 'Busolt', blomberg: 'Blomberg', wiener: 'Wiener Logik', refl16: 'Refl. XVI', refl17: 'Refl. XVII–XVIII' };
function marked(cls, text, at) {         // text with [start, end) in bold
  const d = el('div', cls);
  if (!at) { d.textContent = text; return d; }
  d.append(document.createTextNode(text.slice(0, at[0])), el('b', null, text.slice(at[0], at[1])), document.createTextNode(text.slice(at[1])));
  return d;
}
function exampleEl(x) {
  const d = el('div', 'ex');
  const a = el('a', null, TEXT_NAMES[x.t] + ' · ' + x.cite + ' →');
  a.title = 'Open this sentence in the reader';
  a.onclick = () => { location.hash = x.link; };
  d.append(a, marked('xd', x.de, x.d), marked('xe', x.en, x.e));
  if (!x.e) d.lastChild.appendChild(el('span', 'xo', '  (this translation does not yet use the glossary’s rendering)'));
  return d;
}
function openTerm(id, printed) {
  const e = GLOSS_BY_ID[id], card = document.getElementById('gcard');
  if (!e) return;
  card.textContent = '';
  const x = el('button', 'x', '×'); x.type = 'button'; x.title = 'Close'; x.onclick = () => { card.hidden = true; };
  card.appendChild(x);
  const k = el('div', 'k', 'Glossary'); if (e.status !== 'confirmed') k.appendChild(el('span', 'st', 'proposed'));
  card.appendChild(k);
  const de = el('div', 'de', e.de);
  if (printed && printed !== e.de) de.appendChild(el('span', 'pr', '  as printed: ' + printed));
  card.appendChild(de);
  card.appendChild(el('div', 'en', e.en));
  (e.senses || []).forEach(sn => { const d = el('div', 'sn', '“' + sn.en + '”'); d.appendChild(el('i', null, ' when ' + sn.when)); card.appendChild(d); });
  if (e.avoid && e.avoid.length) card.appendChild(el('div', 'av', 'Not: ' + e.avoid.join(', ')));
  if (e.la && e.la.length) card.appendChild(el('div', 'la', 'Latin: ' + e.la.join(', ')));
  if (e.note) card.appendChild(el('div', 'nt', e.note));
  const c = (typeof KANT_GLOSSARY_COUNTS !== 'undefined' && KANT_GLOSSARY_COUNTS[id]) || null;
  if (c && c.total) card.appendChild(el('div', 'ct', 'Occurs ' + c.total.toLocaleString('en') + '× in the corpus: ' +
    Object.keys(TEXT_NAMES).filter(t => c[t]).map(t => TEXT_NAMES[t] + ' ' + c[t]).join(' · ')));
  const exs = (typeof KANT_GLOSSARY_EXAMPLES !== 'undefined' && KANT_GLOSSARY_EXAMPLES[id]) || [];
  if (exs.length) {                       // one sentence per text, chosen by glossary.py examples, with its English
    card.appendChild(el('div', 'exh', 'In the texts'));
    exs.forEach(x => card.appendChild(exampleEl(x)));
  }
  const acts = el('div', 'acts');
  const a = el('a', null, 'Open in the glossary ↗'); a.href = 'glossary/index.html#' + id; a.target = '_blank'; a.rel = 'noopener';
  const f = el('button', null, 'Find “' + (printed || e.de) + '” in the texts'); f.type = 'button';
  f.onclick = () => { document.getElementById('q').value = printed || e.de; runSearch(); };
  acts.append(a, f);
  card.appendChild(acts);
  card.hidden = false;
  card.scrollTop = 0;
}

/* ── search ── */
function markTabs() {
  document.querySelectorAll('#tabs .n').forEach(n => n.remove());
  if (!hitCount) return;
  document.querySelectorAll('#tabs .tab').forEach(t => {
    const n = hitCount[wi][+t.dataset.i];
    if (n) t.appendChild(el('span', 'n', n));
  });
}

function runSearch() {
  queryRe = makeRe(document.getElementById('q').value, document.getElementById('whole').checked);
  const all = document.getElementById('allw').checked;
  const box = document.getElementById('hits'), count = document.getElementById('count');
  box.textContent = '';
  document.querySelectorAll('#works .n').forEach(n => n.remove());
  if (!queryRe) {
    hitCount = null;
    count.textContent = 'Type at least two letters. ß and ss are treated alike; case is ignored.' + (mode !== 'de' ? ' The English translation is searched too and leads to its German sentence.' : ' German only: the English is not searched.');
    if (cur >= 0) show(cur);
    return;
  }
  hitCount = WORKS.map(w => w.sections.map(() => 0));
  const groups = [], perWork = WORKS.map(() => 0);
  let total = 0, passages = 0;
  WORKS.forEach((w, k) => {
    if (!all && k !== wi) return;
    w.sections.forEach((s, i) => {
      const rows = [];
      s.blocks.forEach(b => {
        if (b.kind === 'rule') return;
        queryRe.lastIndex = 0;
        const first = queryRe.exec(b.text);
        if (!first) return;
        let n = 1;
        while (queryRe.exec(b.text)) n++;
        rows.push({ b, k: first.index, len: first[0].length });
        total += n; passages++; perWork[k] += n; hitCount[k][i] += n;
      });
      if (mode !== 'de') s.blocks.forEach(b => {          // the English, sentence by sentence: a hit belongs to its German sentence
        const units = b.kind === 'rule' ? null : unitsFor(w, b);
        if (!units) return;
        units.forEach((g, si) => {
          queryRe.lastIndex = 0;
          const first = queryRe.exec(g.en);
          if (!first) return;
          let n = 1;
          while (queryRe.exec(g.en)) n++;
          rows.push({ b, k: first.index, len: first[0].length, en: g.en, si });
          total += n; passages++; perWork[k] += n; hitCount[k][i] += n;
        });
      });
      const order = new Map(s.blocks.map((b, ix) => [b, ix]));          // German row first, then the English rows of the same block
      rows.sort((a, b2) => order.get(a.b) - order.get(b2.b) || (a.en === undefined ? 0 : 1) - (b2.en === undefined ? 0 : 1) || (a.si || 0) - (b2.si || 0));
      if (rows.length) groups.push({ k, i, rows });
    });
  });
  count.textContent = total
    ? total + ' occurrence' + (total === 1 ? '' : 's') + ' in ' + passages + ' passage' + (passages === 1 ? '' : 's') +
      ' across ' + groups.length + ' section' + (groups.length === 1 ? '' : 's') + '.'
    : 'Nothing found. Spelling is each text’s own (Nuzzen, Urtheil, Kenntniße / Erkenntniss).';
  document.querySelectorAll('#works .work').forEach(b => {
    const n = perWork[+b.dataset.w];
    if (n) b.appendChild(el('span', 'n', n));
  });
  let shown = 0;
  groups.forEach(g => {
    if (shown >= 400) return;
    const w = WORKS[g.k], s = w.sections[g.i];
    const h = el('div', 'g', w.label + ' · ' + (s.tabNo || g.i + 1) + ' ' + s.label + ' · ' + g.rows.length);
    h.onclick = () => { if (g.rows[0].en !== undefined) sel = { b: g.rows[0].b.id, k: g.rows[0].si }; showWork(g.k, g.i, g.rows[0].b.id); };
    box.appendChild(h);
    g.rows.forEach(x => {
      if (shown++ >= 400) return;
      const r = el('div', 'r');
      r.appendChild(el('span', 'w', blockWhere(w, x.b) + (x.en !== undefined ? ' · English → its German sentence' : '')));
      const t = x.en !== undefined ? x.en : x.b.text, from = Math.max(0, x.k - 50);
      r.appendChild(document.createTextNode((from ? '…' : '') + t.slice(from, x.k)));
      r.appendChild(el('mark', null, t.slice(x.k, x.k + x.len)));
      r.appendChild(document.createTextNode(t.slice(x.k + x.len, x.k + x.len + 70) + '…'));
      r.onclick = () => { if (x.en !== undefined) sel = { b: x.b.id, k: x.si }; showWork(g.k, g.i, x.b.id); };
      box.appendChild(r);
    });
  });
  if (passages > 400) box.appendChild(el('div', 'none', 'Showing the first 400 passages; narrow the term, or search one text at a time.'));
  // re-render what is on show so the highlights and tab badges follow the search
  if (groups.some(g => g.k === wi && g.i === cur)) show(cur);
  else {
    const first = groups.find(g => g.k === wi) || groups[0];
    if (first) { if (first.rows[0].en !== undefined) sel = { b: first.rows[0].b.id, k: first.rows[0].si }; showWork(first.k, first.i, first.rows[0].b.id); }
    else if (cur >= 0) show(cur);
  }
}

/* ── events ── */
let timer;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 250);
});
document.getElementById('sf').addEventListener('submit', e => e.preventDefault());
document.getElementById('whole').onchange = runSearch;
document.getElementById('allw').onchange = runSearch;
document.getElementById('clr').onclick = () => { document.getElementById('q').value = ''; runSearch(); document.getElementById('q').focus(); };
function setMode(m) {                    // switch the reading mode; the glossary toggle is left alone
  const hadEnglish = mode !== 'de';
  mode = m;
  document.body.classList.toggle('noen', m !== 'en');
  document.body.classList.toggle('ilm', m === 'il');
  document.querySelectorAll('#mode button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === m); b.setAttribute('aria-checked', b.dataset.m === m);
  });
  sel = null; hov = null; hovPh = null; hovTerm = null;
  refreshPop();
  if (hadEnglish !== (m !== 'de')) runSearch();   // English hits come and go with German-only mode
  else markSelected();
}
document.querySelectorAll('#mode button').forEach(b => { b.onclick = () => { if (b.dataset.m !== mode) setMode(b.dataset.m); }; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) { sel = null; markSelected(); } });
document.addEventListener('click', () => { if (sel) { sel = null; markSelected(); } });
document.getElementById('reader').addEventListener('scroll', () => { hov = null; hovPh = null; hovTerm = null; refreshPop(); });
window.addEventListener('resize', refreshPop);
document.getElementById('goaa').addEventListener('change', e => {
  const n = +e.target.value, w = W();
  if (!goTo(n)) e.target.setCustomValidity(w.logik ? 'Not in AA 24:' + w.aaRange[0] + '–' + w.aaRange[1] : 'Not in §§ 1–563'), e.target.reportValidity();
  else e.target.setCustomValidity('');
});
document.getElementById('tpg').onchange = e => document.body.classList.toggle('nopg', !e.target.checked);
document.getElementById('tinf').onchange = e => document.body.classList.toggle('noinf', !e.target.checked);
document.getElementById('tterms').onchange = e => { document.body.classList.toggle('noterms', !e.target.checked); if (!e.target.checked) document.getElementById('gcard').hidden = true; };
window.addEventListener('hashchange', route);

/* #busolt  #blomberg:s06  #blomberg:aa-80  #meier:para-12  #busolt:busolt-s14-012.3 (a block's sentence)
   (a bare #aa-614 or #s04 means Busolt) */
function route() {
  let h = location.hash.slice(1), k = 0;
  const m0 = /^(busolt|blomberg|meier)(?::(.*))?$/.exec(h);
  if (m0) { k = WORKS.findIndex(w => w.key === m0[1]); h = m0[2] || ''; }
  if (k !== wi || cur < 0) { wi = k; buildTabs(); cur = -1; }
  let m;
  if ((m = /^aa-(\d+)$/.exec(h)) && WORKS[wi].logik && goTo(+m[1])) return;
  if ((m = /^para-(\d+)$/.exec(h)) && !WORKS[wi].logik && goTo(+m[1])) return;
  if ((m = /^(.+)\.(\d+)$/.exec(h))) {     // #busolt:busolt-s14-012.3 — one sentence, pinned (from the glossary's examples)
    const j = WORKS[wi].sections.findIndex(s => s.blocks.some(b => b.id === m[1]));
    if (j >= 0) { sel = mode !== 'de' ? { b: m[1], k: +m[2] } : null; return show(j, m[1]); }
  }
  const i = WORKS[wi].sections.findIndex(s => s.id === h);
  if (i >= 0) return show(i);
  if (cur < 0) show(0);
}

/* ── init ── */
buildWorks();
route();
</script>
