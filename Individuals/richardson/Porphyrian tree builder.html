<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porphyrian tree builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9E5EA; --surface:#F6F4F7; --ink:#24161D; --muted:#66555F; --line:#C4BAC3;
  --porphyry:#6B2741; --porphyry-text:#6B2741; --on-porphyry:#FBF1F5;
  --verdigris:#1D6B5C; --ochre:#7A560A;
  --serif:"Alegreya","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#21121A; --surface:#2C1922; --ink:#F0E7EB; --muted:#B9A7B0; --line:#5A404C;
    --porphyry:#A84A6C; --porphyry-text:#E7A6BD; --on-porphyry:#FFF4F8;
    --verdigris:#7CCBB9; --ochre:#E0BC6A;
  }
}
:root[data-theme="dark"]{
  --bg:#21121A; --surface:#2C1922; --ink:#F0E7EB; --muted:#B9A7B0; --line:#5A404C;
  --porphyry:#A84A6C; --porphyry-text:#E7A6BD; --on-porphyry:#FFF4F8;
  --verdigris:#7CCBB9; --ochre:#E0BC6A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--sans);display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--porphyry-text);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:.5rem 1.25rem;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:italic 500 1.35rem/1 var(--serif);color:var(--porphyry-text);margin:0;white-space:nowrap}
.title{flex:1 1 12rem;min-width:8rem;font:500 1.2rem/1.2 var(--serif);background:transparent;border:0;border-bottom:1px solid transparent;padding:.2rem 0;border-radius:0}
.title:hover,.title:focus{border-bottom-color:var(--line)}
.actions{display:flex;gap:.4rem;overflow-x:auto;max-width:100%;padding:2px}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--porphyry-text);color:var(--porphyry-text)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--porphyry);border-color:var(--porphyry);color:var(--on-porphyry)}
.btn.primary:hover:not(:disabled){color:var(--on-porphyry);filter:brightness(1.12)}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 22rem}
.stage{position:relative;min-width:0;min-height:0}
.scroll{position:absolute;inset:0;overflow:auto;display:flex}
#tree{margin:auto;flex:none;display:block}
.zoom{position:absolute;right:.75rem;bottom:.75rem;display:flex;gap:.3rem}
.zoom .btn{background:var(--surface);min-width:2.2rem}
.hint{position:absolute;left:.9rem;bottom:.9rem;margin:0;color:var(--muted);font-size:.9rem;max-width:calc(100% - 12rem);pointer-events:none}

/* tree */
.edge{fill:none;stroke:var(--line);stroke-width:1.5}
.edge.on{stroke:var(--porphyry);stroke-width:3.5}
.diff{font:italic 500 16px var(--serif);fill:var(--verdigris);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diff.blank{fill:var(--muted);font-weight:400}
.node{cursor:pointer}
.node:focus{outline:none}
.node .pill{fill:var(--surface);stroke:var(--porphyry);stroke-width:1.5}
.node.derived .pill{stroke-dasharray:4 3;stroke:var(--muted)}
.node text{font:700 17px var(--serif);fill:var(--ink);text-anchor:middle;pointer-events:none}
.node.derived text{font:italic 400 16px var(--serif)}
.node.on .pill{fill:var(--porphyry);stroke:var(--porphyry);stroke-dasharray:none}
.node.on text{fill:var(--on-porphyry)}
.node .ring{fill:none;stroke:none}
.node.sel .ring{stroke:var(--porphyry);stroke-width:1.5}
.node:focus-visible .ring{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
.node:hover:not(.on) .pill{stroke-width:2.5}
.stem{stroke:var(--line);stroke-width:1.5}
.ind{font:400 15px var(--serif);fill:var(--ochre);text-anchor:middle}

/* inspector */
.insp{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:1.1rem 1.2rem 2rem}
.insp h2{font:700 1.45rem/1.15 var(--serif);margin:0}
.latin{font:italic 400 1rem var(--serif);color:var(--muted);margin:.1rem 0 1rem}
.insp h3{font:700 1.05rem var(--serif);margin:1.5rem 0 .4rem;padding-top:1rem;border-top:1px solid var(--line)}
.field{display:block;margin:.6rem 0}
.field span{display:block;font-size:.92rem;color:var(--muted);margin-bottom:.15rem}
.field input,.add input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.4rem .55rem;font-family:var(--serif);font-size:1.05rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.help{color:var(--muted);font-size:.95rem;margin:.2rem 0 .5rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.inds{list-style:none;margin:.3rem 0;padding:0}
.inds li{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem 0;font-family:var(--serif);font-size:1.05rem;color:var(--ochre);border-bottom:1px dotted var(--line)}
.inds button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1;padding:.2rem .45rem;border-radius:4px}
.inds button:hover{color:var(--ink)}
.add{display:flex;gap:.4rem;margin-top:.5rem}
.def{font:400 1.15rem/1.5 var(--serif);margin:.3rem 0}
.def em,.insp p em{color:var(--verdigris);font-style:italic;font-weight:500}
.def small{display:block;font-size:1rem;color:var(--muted);margin-top:.5rem}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:min(40rem,calc(100vw - 2rem));padding:1.2rem}
dialog::backdrop{background:rgba(20,8,14,.55)}
dialog h2{font:700 1.3rem var(--serif);margin:0 0 .7rem}
dialog textarea{width:100%;height:16rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.6rem;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical;white-space:pre;overflow:auto}
.seg{display:flex;gap:.4rem;margin-bottom:.6rem}
.seg .btn[aria-pressed="true"]{background:var(--porphyry);border-color:var(--porphyry);color:var(--on-porphyry)}
#dlg-msg{min-height:1.4em;margin:.5rem 0 0;color:var(--muted);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:6px;max-width:calc(100vw - 2rem);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,46%)}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  .brand{font-size:1.15rem}
}
</style>
</head>
<body>
<header class="bar">
  <h1 class="brand">Porphyrian tree</h1>
  <input class="title" id="title" aria-label="Title of this tree" placeholder="Untitled tree" maxlength="120">
  <div class="actions">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="redo">Redo</button>
    <button class="btn" id="classic">Load the classic tree</button>
    <button class="btn" id="new">Start a new tree</button>
    <button class="btn" id="export">Export or import</button>
  </div>
</header>

<main>
  <div class="stage">
    <div class="scroll" id="scroll">
      <svg id="tree" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Tree of genera and species"></svg>
    </div>
    <p class="hint">Select a genus or species to edit it. Arrow keys move through the tree.</p>
    <div class="zoom">
      <button class="btn" id="zout" aria-label="Zoom out">−</button>
      <button class="btn" id="zin" aria-label="Zoom in">+</button>
      <button class="btn" id="zfit">Fit</button>
    </div>
  </div>
  <aside class="insp" id="insp" aria-label="Selected genus or species"></aside>
</main>

<dialog id="dlg" aria-labelledby="dlg-h">
  <h2 id="dlg-h">Export or import</h2>
  <div class="seg">
    <button class="btn" id="tab-outline" aria-pressed="true">Text outline</button>
    <button class="btn" id="tab-json" aria-pressed="false">JSON</button>
  </div>
  <textarea id="dlg-text" spellcheck="false" aria-label="Tree as text"></textarea>
  <p id="dlg-msg" aria-live="polite"></p>
  <div class="row">
    <button class="btn primary" id="dlg-copy">Copy</button>
    <button class="btn" id="dlg-import" hidden>Replace tree with this JSON</button>
    <button class="btn" id="dlg-close">Close</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const LS='porphyrian-tree-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const lowerFirst=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
const mk=(name,diff,children,individuals)=>({id:uid(),name:name||'',diff:diff||'',children:children||[],individuals:individuals||[]});

function classic(){
  const human=mk('Human','rational',[],['Socrates','Plato']);
  const animal=mk('Animal','sensitive',[human,mk('Beast','irrational')]);
  const living=mk('Living body','animate',[animal,mk('Plant','insensitive')]);
  const body=mk('Body','corporeal',[living,mk('','inanimate')]);
  return {title:'The tree of substance',root:mk('Substance','',[body,mk('','incorporeal')])};
}
function norm(o,isRoot){
  if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error('Each genus or species must be an object with a name.');
  const ch=Array.isArray(o.children)?o.children:[];
  if(ch.length!==0&&ch.length!==2) throw new Error('A division needs exactly two species; found '+ch.length+'.');
  return {id:uid(),name:String(o.name==null?'':o.name),diff:isRoot?'':String(o.diff==null?'':o.diff),
    children:ch.map(c=>norm(c,false)),
    individuals:ch.length?[]:(Array.isArray(o.individuals)?o.individuals:[]).map(String)};
}
function strip(n,isRoot){
  const o={name:n.name};
  if(!isRoot) o.diff=n.diff;
  if(n.children.length) o.children=n.children.map(c=>strip(c,false));
  else if(n.individuals.length) o.individuals=n.individuals.slice();
  return o;
}
function load(){
  try{
    const raw=localStorage.getItem(LS); if(!raw) return null;
    const o=JSON.parse(raw);
    return {title:String(o.title||''),root:norm(o.root,true)};
  }catch(e){return null}
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify({title:state.title,root:strip(state.root,true)}))}catch(e){}
}

let state=load()||classic();
let selected=state.root.id;
let undoStack=[],redoStack=[],lastKey=null,lastT=0;
let zoom=1,fit=true,natW=1,natH=1;
let info=new Map();

const snapshot=()=>JSON.stringify({title:state.title,root:state.root});
function change(key,fn){
  const now=Date.now();
  if(!(key&&key===lastKey&&now-lastT<1500)){undoStack.push(snapshot()); if(undoStack.length>200) undoStack.shift();}
  redoStack=[];lastKey=key;lastT=now;
  fn();save();updateButtons();
}
function restore(from,to){
  if(!from.length) return;
  to.push(snapshot());
  state=JSON.parse(from.pop());
  lastKey=null;save();
  $('title').value=state.title;
  renderTree();
  if(!info.has(selected)) selected=state.root.id;
  renderAll();
}
function updateButtons(){ $('undo').disabled=!undoStack.length; $('redo').disabled=!redoStack.length; }

/* ---------- measuring + layout ---------- */
const F_NAME='700 17px Alegreya, "Iowan Old Style", Georgia, serif';
const F_DER='italic 400 16px Alegreya, "Iowan Old Style", Georgia, serif';
const F_DIFF='italic 500 16px Alegreya, "Iowan Old Style", Georgia, serif';
const F_IND='400 15px Alegreya, "Iowan Old Style", Georgia, serif';
const ctx=document.createElement('canvas').getContext('2d');
let cache=new Map();
function tw(t,f){
  const k=f+'|'+t; let w=cache.get(k);
  if(w===undefined){ctx.font=f;w=ctx.measureText(t).width;cache.set(k,w);}
  return w;
}
const H=40,LEVEL=128,GAP=28,PAD=28,IND_LH=22;

function layout(){
  info=new Map(); let maxB=0;
  function size(n,p,depth,pLabel){
    const named=!!n.name.trim();
    const label=named?n.name.trim():(p?((n.diff.trim()||'…')+' '+lowerFirst(pLabel)):'Unnamed genus');
    const nodeW=Math.max(76,tw(label,named?F_NAME:F_DER)+36);
    const diffLabel=p?(n.diff.trim()||'differentia?'):'';
    const diffW=p?tw(diffLabel,F_DIFF)+18:0;
    let indW=0; n.individuals.forEach(s=>{indW=Math.max(indW,tw(s,F_IND)+8)});
    const selfW=Math.max(nodeW,diffW,indW);
    const i={n,p,depth,label,named,nodeW,diffLabel,selfW,w:selfW,cw:0};
    info.set(n.id,i);
    if(n.children.length){
      i.cw=n.children.reduce((a,c)=>a+size(c,n,depth+1,label),0)+GAP*(n.children.length-1);
      i.w=Math.max(selfW,i.cw);
    }
    return i.w;
  }
  function place(n,left){
    const i=info.get(n.id);
    i.y=PAD+i.depth*LEVEL;
    if(n.children.length){
      let x=left+(i.w-i.cw)/2;
      n.children.forEach(c=>{place(c,x);x+=info.get(c.id).w+GAP;});
      const mid=(info.get(n.children[0].id).x+info.get(n.children[1].id).x)/2;
      i.x=Math.min(Math.max(mid,left+i.selfW/2),left+i.w-i.selfW/2);
    }else i.x=left+i.w/2;
    const b=i.y+H+(n.individuals.length?14+IND_LH*n.individuals.length:0);
    if(b>maxB) maxB=b;
  }
  const w=size(state.root,null,0,'');
  place(state.root,PAD);
  natW=Math.ceil(w+PAD*2); natH=Math.ceil(maxB+PAD+34);
}
function rankOf(i){
  if(!i.p) return ['Highest genus','summum genus'];
  if(i.n.children.length) return ['Intermediate genus','genus subalternum'];
  return ['Lowest species','species infima'];
}
function lineage(id){
  const s=new Set(); let i=info.get(id);
  while(i){s.add(i.n.id); i=i.p?info.get(i.p.id):null;}
  return s;
}

/* ---------- tree rendering ---------- */
const svg=$('tree');
function renderTree(){
  const hadFocus=svg.contains(document.activeElement);
  layout();
  if(!info.has(selected)) selected=state.root.id;
  const on=lineage(selected);
  let edges='',labels='',nodes='';
  (function walk(n){
    const i=info.get(n.id);
    if(i.p){
      const pi=info.get(i.p.id),y1=pi.y+H;
      edges+=`<path class="edge${on.has(n.id)?' on':''}" d="M${pi.x},${y1} C${pi.x},${y1+44} ${i.x},${i.y-62} ${i.x},${i.y}"/>`;
      labels+=`<text class="diff${n.diff.trim()?'':' blank'}" x="${i.x}" y="${i.y-16}">${esc(i.diffLabel)}</text>`;
    }
    const x=i.x-i.nodeW/2;
    const cls='node'+(i.named?'':' derived')+(on.has(n.id)?' on':'')+(n.id===selected?' sel':'');
    nodes+=`<g class="${cls}" data-id="${n.id}" tabindex="0" role="button" aria-pressed="${n.id===selected}" aria-label="${esc(i.label)}, ${rankOf(i)[0].toLowerCase()}">`+
      `<rect class="ring" x="${x-4}" y="${i.y-4}" width="${i.nodeW+8}" height="${H+8}" rx="${H/2+4}"/>`+
      `<rect class="pill" x="${x}" y="${i.y}" width="${i.nodeW}" height="${H}" rx="${H/2}"/>`+
      `<text x="${i.x}" y="${i.y+H/2}" dy=".33em">${esc(i.label)}</text></g>`;
    if(n.individuals.length){
      nodes+=`<line class="stem" x1="${i.x}" y1="${i.y+H}" x2="${i.x}" y2="${i.y+H+10}"/>`;
      n.individuals.forEach((s,k)=>{nodes+=`<text class="ind" x="${i.x}" y="${i.y+H+28+IND_LH*k}">${esc(s)}</text>`;});
    }
    n.children.forEach(walk);
  })(state.root);
  svg.setAttribute('viewBox',`0 0 ${natW} ${natH}`);
  svg.innerHTML=edges+labels+nodes;
  applyZoom();
  if(hadFocus) focusNode();
}
function focusNode(){
  const el=svg.querySelector('[data-id="'+selected+'"]');
  if(el) el.focus({preventScroll:fit});
}
function applyZoom(){
  const sc=$('scroll');
  if(fit){
    const z=Math.min((sc.clientWidth-4)/natW,(sc.clientHeight-4)/natH,1);
    zoom=Math.max(z,0.55);
  }
  svg.style.width=Math.round(natW*zoom)+'px';
  svg.style.height=Math.round(natH*zoom)+'px';
}

/* ---------- inspector ---------- */
const insp=$('insp');
function renderInspector(){
  const i=info.get(selected),n=i.n,p=i.p;
  const rank=rankOf(i);
  const pLabel=p?info.get(p.id).label:'';
  let h=`<h2>${rank[0]}</h2><p class="latin" lang="la">${rank[1]}</p>`;
  h+=`<label class="field"><span>Name</span><input id="f-name" data-field="name" value="${esc(n.name)}" placeholder="${p?esc(i.label):'e.g. Substance'}" maxlength="80" autocomplete="off"></label>`;
  if(p) h+=`<label class="field"><span>Differentia that sets it apart within ${esc(lowerFirst(pLabel))}</span><input id="f-diff" data-field="diff" value="${esc(n.diff)}" placeholder="e.g. rational" maxlength="60" autocomplete="off"></label>`;

  h+=`<h3>Definition</h3><p class="def" id="def"></p>`;

  h+=`<h3>Division</h3>`;
  if(n.children.length){
    const a=info.get(n.children[0].id),b=info.get(n.children[1].id);
    h+=`<p class="help">Divided by <em>${esc(a.diffLabel)}</em> and <em>${esc(b.diffLabel)}</em> into ${esc(lowerFirst(a.label))} and ${esc(lowerFirst(b.label))}. Select either species to edit it.</p>
    <div class="row"><button class="btn" data-act="swap">Swap sides</button><button class="btn" data-act="undivide">Remove division</button></div>`;
  }else if(n.individuals.length){
    h+=`<p class="help">${esc(i.label)} has individuals under it. Remove them before dividing, because they would belong to neither new species.</p>`;
  }else{
    h+=`<p class="help">Split ${esc(lowerFirst(i.label))} into two species by a pair of opposed differentiae.</p>
    <div class="pair">
      <label class="field"><span>Differentia</span><input id="d1" placeholder="e.g. corporeal" maxlength="60" autocomplete="off"></label>
      <label class="field"><span>Its opposite</span><input id="d2" placeholder="non-…" maxlength="60" autocomplete="off"></label>
    </div>
    <button class="btn primary" data-act="divide">Divide</button>`;
  }

  if(!n.children.length){
    h+=`<h3>Individuals</h3>`;
    if(n.individuals.length){
      h+=`<ul class="inds">`+n.individuals.map((s,k)=>`<li><span>${esc(s)}</span><button data-act="rm-ind" data-i="${k}" aria-label="Remove ${esc(s)}">×</button></li>`).join('')+`</ul>`;
    }else h+=`<p class="help">Particular things that fall under ${esc(lowerFirst(i.label))}, such as Socrates under human.</p>`;
    h+=`<div class="add"><input id="ind" placeholder="Name of an individual" aria-label="Name of an individual" maxlength="60" autocomplete="off"><button class="btn" data-act="add-ind">Add</button></div>`;
  }
  insp.innerHTML=h;
  updateDefinition();
}
function updateDefinition(){
  const el=$('def'); if(!el) return;
  const i=info.get(selected),n=i.n,p=i.p;
  if(!p){ el.innerHTML=`${esc(i.label)} is the highest genus. Nothing stands above it, so it has no definition by genus and differentia.`; return; }
  const pi=info.get(p.id);
  if(!n.diff.trim()){ el.innerHTML=`Give this species a differentia to define it within ${esc(lowerFirst(pi.label))}.`; return; }
  let h=i.named
    ? `<strong>${esc(i.label)}</strong> is <em>${esc(n.diff.trim())}</em> ${esc(lowerFirst(pi.label))}.`
    : `This species has no name of its own. It is <em>${esc(n.diff.trim())}</em> ${esc(lowerFirst(pi.label))}.`;
  if(i.depth>1){
    const diffs=[]; let c=i;
    while(c.p){ if(c.n.diff.trim()) diffs.push(c.n.diff.trim()); c=info.get(c.p.id); }
    h+=`<small>Traced to the highest genus: <em>${esc(diffs.join(', '))}</em> ${esc(lowerFirst(c.label))}.</small>`;
  }
  el.innerHTML=h;
}
function renderAll(){renderTree();renderInspector();updateButtons();}
function select(id){
  if(!info.has(id)) return;
  selected=id; renderTree(); renderInspector();
  if(!fit){const el=svg.querySelector('[data-id="'+id+'"]'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',inline:'nearest'});}
}

insp.addEventListener('input',e=>{
  const f=e.target.dataset.field; if(!f) return;
  const n=info.get(selected).n;
  change(f+':'+n.id,()=>{n[f]=e.target.value;});
  renderTree(); updateDefinition();
  const nm=$('f-name'); if(nm&&info.get(selected).p) nm.placeholder=info.get(selected).label;
});
insp.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='d1'||e.target.id==='d2'){e.preventDefault();act('divide');}
  else if(e.target.id==='ind'){e.preventDefault();act('add-ind');}
});
insp.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act,b);
});
function act(a,btn){
  const i=info.get(selected),n=i.n;
  if(a==='divide'){
    const d1=$('d1'),d2=$('d2'); if(!d1) return;
    const x=d1.value.trim(),y=d2.value.trim()||(x?'non-'+x:'');
    if(!x){toast('Enter a differentia to divide by, such as “corporeal”.');d1.focus();return;}
    change(null,()=>{n.children=[mk('',x),mk('',y)];});
    selected=n.children[0].id; renderAll();
    const f=$('f-name'); if(f) f.focus();
  }else if(a==='undivide'){
    change(null,()=>{n.children=[];});
    renderAll(); toast('Removed the division of '+lowerFirst(i.label)+'. Undo restores it.');
  }else if(a==='swap'){
    change(null,()=>{n.children.reverse();}); renderAll();
  }else if(a==='add-ind'){
    const f=$('ind'),v=f.value.trim();
    if(!v){f.focus();return;}
    change(null,()=>{n.individuals.push(v);}); renderAll();
    const g=$('ind'); if(g) g.focus();
  }else if(a==='rm-ind'){
    change(null,()=>{n.individuals.splice(+btn.dataset.i,1);}); renderAll();
  }
}

/* ---------- tree interaction ---------- */
svg.addEventListener('click',e=>{
  const g=e.target.closest('.node'); if(g){select(g.dataset.id);focusNode();}
});
svg.addEventListener('keydown',e=>{
  const g=e.target.closest('.node'); if(!g) return;
  const i=info.get(g.dataset.id); let to=null;
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault(); select(i.n.id);
    const f=$('f-name'); if(f){f.focus();f.select();} return;
  }
  if(e.key==='ArrowUp') to=i.p;
  else if(e.key==='ArrowDown') to=i.n.children[0];
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&i.p){
    const k=i.p.children.indexOf(i.n)+(e.key==='ArrowLeft'?-1:1);
    to=i.p.children[k];
  }else return;
  e.preventDefault();
  if(to){select(to.id);focusNode();}
});

/* ---------- top bar ---------- */
$('title').value=state.title;
$('title').addEventListener('input',e=>change('title',()=>{state.title=e.target.value;}));
$('undo').onclick=()=>restore(undoStack,redoStack);
$('redo').onclick=()=>restore(redoStack,undoStack);
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.key.toLowerCase()!=='z') return;
  if(e.target.matches&&e.target.matches('textarea')) return;
  e.preventDefault();
  if(e.shiftKey) restore(redoStack,undoStack); else restore(undoStack,redoStack);
});
function replaceTree(t,msg){
  change(null,()=>{state=t;});
  selected=state.root.id; fit=true; $('title').value=state.title;
  renderAll(); if(msg) toast(msg);
}
$('classic').onclick=()=>replaceTree(classic(),'Loaded the classic tree. Undo brings your tree back.');
$('new').onclick=()=>{
  replaceTree({title:'',root:mk('')},'Started a new tree. Undo brings the old one back.');
  const f=$('f-name'); if(f) f.focus();
};
$('zin').onclick=()=>{fit=false;zoom=Math.min(zoom*1.2,2.5);applyZoom();};
$('zout').onclick=()=>{fit=false;zoom=Math.max(zoom/1.2,0.3);applyZoom();};
$('zfit').onclick=()=>{fit=true;applyZoom();};
if(window.ResizeObserver) new ResizeObserver(()=>{if(fit) applyZoom();}).observe($('scroll'));
else window.addEventListener('resize',()=>{if(fit) applyZoom();});

/* ---------- export / import ---------- */
function outline(){
  let out=(state.title.trim()?state.title.trim()+'\n\n':'')+info.get(state.root.id).label+'\n';
  (function walk(n,prefix){
    const items=n.children.length?n.children.map(c=>({c})):n.individuals.map(s=>({s}));
    items.forEach((it,k)=>{
      const last=k===items.length-1;
      const line=it.c?((it.c.diff.trim()||'?')+': '+info.get(it.c.id).label):('• '+it.s);
      out+=prefix+(last?'└─ ':'├─ ')+line+'\n';
      if(it.c) walk(it.c,prefix+(last?'   ':'│  '));
    });
  })(state.root,'');
  return out;
}
const dlg=$('dlg'),dtext=$('dlg-text');
function setTab(json){
  $('tab-outline').setAttribute('aria-pressed',String(!json));
  $('tab-json').setAttribute('aria-pressed',String(json));
  dtext.readOnly=!json; $('dlg-import').hidden=!json;
  dtext.value=json?JSON.stringify({title:state.title,root:strip(state.root,true)},null,2):outline();
  $('dlg-msg').textContent=json?'Paste JSON exported from this page to load a saved tree.':'';
}
$('export').onclick=()=>{setTab(false); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');};
$('tab-outline').onclick=()=>setTab(false);
$('tab-json').onclick=()=>setTab(true);
$('dlg-close').onclick=()=>dlg.close?dlg.close():dlg.removeAttribute('open');
$('dlg-copy').onclick=async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(dtext.value);ok=true;}catch(e){
    try{dtext.focus();dtext.select();ok=document.execCommand('copy');}catch(e2){}
  }
  if(!ok){dtext.focus();dtext.select();}
  $('dlg-msg').textContent=ok?'Copied.':'Copying is blocked here. The text is selected, so copy it with your keyboard.';
};
$('dlg-import').onclick=()=>{
  try{
    const o=JSON.parse(dtext.value);
    const t={title:String(o.title||''),root:norm(o.root||o,true)};
    $('dlg-close').onclick();
    replaceTree(t,'Replaced the tree. Undo brings the old one back.');
  }catch(e){
    $('dlg-msg').textContent='That JSON can’t be loaded: '+e.message;
  }
};

let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),4500);
}

renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{cache=new Map();renderTree();});
})();
</script>
</body>
