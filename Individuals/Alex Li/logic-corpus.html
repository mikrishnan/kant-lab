<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Corpus · Kant Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap');

  :root {
    --ink: #1a1208;
    --parchment: #f5efe0;
    --parchment-dark: #e8dfc8;
    --accent: #5c3d1e;
    --accent-light: #8b5e3c;
    --faded: #7a6a52;
    --rule: #cfc3a6;
    --hit: rgba(214, 170, 60, 0.45);
    --panel-w: 430px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-size: 1.05rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    border-bottom: 1px solid var(--accent-light);
    background: var(--parchment-dark);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    flex: none;
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 1.3rem;
    color: var(--accent);
  }

  header a { color: var(--faded); font-size: 0.9rem; }
  header .sub { color: var(--faded); font-size: 0.9rem; font-style: italic; }

  button, select, input { font: inherit; color: inherit; }

  /* ── the two columns ───────────────────────────────────────────────── */
  .app {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--panel-w);
  }

  .reader, .panel { min-height: 0; display: flex; flex-direction: column; }
  .panel { border-left: 1px solid var(--accent-light); background: #f9f4e8; }

  /* ── left: tabs, section picker, text ──────────────────────────────── */
  .tabs { display: flex; gap: 0; padding: 0.6rem 1.25rem 0; border-bottom: 1px solid var(--accent-light); background: var(--parchment); }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    padding: 0.45rem 1rem 0.5rem;
    cursor: pointer;
    text-align: left;
    border-radius: 3px 3px 0 0;
    margin-bottom: -1px;
  }
  .tab .t { font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.05em; color: var(--accent); display: block; }
  .tab .d { font-size: 0.78rem; color: var(--faded); display: block; }
  .tab:hover { background: var(--parchment-dark); }
  .tab[aria-selected="true"] { background: #fffaf0; border-color: var(--accent-light); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.25rem; padding: 0.55rem 1.25rem; border-bottom: 1px solid var(--rule); background: #fffaf0; font-size: 0.92rem; }
  .bar select { flex: 1 1 18rem; min-width: 0; padding: 0.25rem 0.4rem; background: var(--parchment); border: 1px solid var(--accent-light); border-radius: 2px; }
  .layers { display: flex; gap: 0.9rem; align-items: center; color: var(--faded); }
  .layers label { cursor: pointer; display: inline-flex; gap: 0.3rem; align-items: center; }

  .text { flex: 1; min-height: 0; overflow-y: auto; padding: 1.2rem 1.5rem 4rem; background: #fffaf0; scroll-behavior: smooth; }
  .text-inner { max-width: 46rem; margin: 0 auto; }

  .work-meta { color: var(--faded); font-size: 0.88rem; margin-bottom: 1rem; }
  .sec-head { margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--rule); }
  .sec-head h2 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.05rem; letter-spacing: 0.03em; color: var(--accent); }
  .sec-head .prov { color: var(--faded); font-size: 0.85rem; font-style: italic; margin-top: 0.15rem; }
  .sec-head .alt { color: var(--faded); font-size: 0.88rem; }

  .blk { position: relative; padding-left: 3.4rem; margin-bottom: 0.85rem; border-radius: 3px; }
  .blk .gut {
    position: absolute; left: 0; top: 0.35rem; width: 3rem; text-align: right;
    font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.03em;
    color: var(--faded); text-decoration: none;
  }
  .blk .gut:hover { color: var(--accent); text-decoration: underline; }
  .blk p { font-size: 1.12rem; line-height: 1.7; hyphens: auto; }
  .blk.note p { font-style: italic; color: var(--faded); }
  .blk.flash { animation: flash 2.6s ease-out; }
  @keyframes flash { 0% { background: rgba(214, 170, 60, 0.5); } 100% { background: transparent; } }

  .para-tag { font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.06em; color: var(--accent-light); margin: 1.4rem 0 0.35rem 3.4rem; }
  hr.rule { border: none; border-top: 1px solid var(--rule); margin: 1rem 0 1rem 3.4rem; }

  .pg, .ms { font-family: 'Cinzel', serif; font-size: 0.64rem; letter-spacing: 0.04em; color: var(--faded); vertical-align: 0.18em; white-space: nowrap; }
  .pg { padding: 0 0.15rem; border: 1px solid var(--rule); border-radius: 2px; margin: 0 0.15rem; background: var(--parchment); }
  .ms { margin: 0 0.1rem; }
  .inf { color: var(--faded); cursor: help; font-size: 0.8rem; }

  /* the three annotation layers, told apart by line style rather than by new hues */
  .a-ex  { background: rgba(139, 94, 60, 0.13); border-bottom: 2px solid var(--accent-light); cursor: pointer; }
  .a-syl { background: rgba(92, 61, 30, 0.10);  border-bottom: 3px double var(--accent); cursor: pointer; }
  .a-par { background: rgba(122, 106, 82, 0.15); border-bottom: 2px dotted var(--accent); cursor: pointer; }
  .a-ex:hover, .a-syl:hover, .a-par:hover { background: rgba(214, 170, 60, 0.28); }
  mark.hit, .hit { background: var(--hit); color: inherit; border-radius: 2px; }
  .hit.cur { outline: 2px solid var(--accent); }
  .flash-q { animation: flashq 2.6s ease-out; }
  @keyframes flashq { 0% { background: rgba(214, 170, 60, 0.7); } 100% { background: transparent; } }

  /* ── right: search and the three lenses ────────────────────────────── */
  .search { padding: 0.8rem 1rem 0.6rem; border-bottom: 1px solid var(--rule); }
  .search .row { display: flex; gap: 0.4rem; }
  .search input[type="search"] { flex: 1; min-width: 0; padding: 0.4rem 0.6rem; background: #fffaf0; border: 1px solid var(--accent-light); border-radius: 2px; font-size: 1.05rem; }
  .search input[type="search"]:focus { outline: 2px solid rgba(139, 94, 60, 0.4); }
  .search .opts { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; margin-top: 0.45rem; font-size: 0.85rem; color: var(--faded); }
  .search .opts label { cursor: pointer; display: inline-flex; gap: 0.25rem; align-items: center; }
  .search .sum { margin-top: 0.35rem; font-size: 0.85rem; color: var(--faded); min-height: 1.2em; }

  .ptabs { display: flex; border-bottom: 1px solid var(--accent-light); background: var(--parchment); }
  .ptab { flex: 1; padding: 0.5rem 0.2rem; background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.04em; color: var(--accent); }
  .ptab:hover { background: var(--parchment-dark); }
  .ptab[aria-selected="true"] { border-bottom-color: var(--accent); background: #f9f4e8; }
  .ptab .n { display: block; font-family: 'EB Garamond', serif; font-size: 0.8rem; color: var(--faded); letter-spacing: 0; }

  .pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 0.8rem 1rem 3rem; scroll-behavior: smooth; }
  .lede { font-size: 0.88rem; color: var(--faded); font-style: italic; margin-bottom: 0.8rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.9rem; }
  .chip { padding: 0.12rem 0.55rem; border: 1px solid var(--accent-light); border-radius: 999px; background: transparent; cursor: pointer; font-size: 0.84rem; color: var(--accent); }
  .chip:hover { background: var(--parchment-dark); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--parchment); }

  .grp { margin: 1.1rem 0 0.4rem; }
  .grp h3 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.05em; color: var(--accent); }
  .grp .desc { font-size: 0.84rem; color: var(--faded); font-style: italic; }

  .card { background: #fffaf0; border: 1px solid var(--rule); border-left: 3px solid var(--accent-light); border-radius: 3px; padding: 0.55rem 0.7rem; margin-bottom: 0.55rem; }
  .card.flash { animation: flash 2.6s ease-out; }
  .card .q { font-size: 1.02rem; line-height: 1.5; cursor: pointer; }
  .card .q:hover { color: var(--accent); }
  .card .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; font-size: 0.8rem; color: var(--faded); margin-bottom: 0.25rem; }
  .card .work { font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.05em; color: var(--accent); }
  .card .reading { margin-top: 0.3rem; font-size: 0.9rem; color: #4b3a22; }
  .tag { display: inline-block; padding: 0 0.4rem; border: 1px solid var(--rule); border-radius: 2px; font-size: 0.72rem; color: var(--faded); }
  .tag.attested { border-color: var(--accent-light); color: var(--accent); }
  .label { font-family: 'Cinzel', serif; font-size: 0.64rem; letter-spacing: 0.05em; color: var(--faded); text-transform: uppercase; margin-right: 0.3rem; }

  .pcard { border-left-style: double; border-left-width: 5px; }
  .pcard h4 { font-family: 'EB Garamond', serif; font-weight: 600; font-size: 1.02rem; color: var(--accent); margin-bottom: 0.15rem; }
  .pass { padding: 0.35rem 0 0.35rem 0.6rem; border-top: 1px dashed var(--rule); }
  .pass:first-of-type { border-top: none; }

  .hitgrp { margin: 0.9rem 0 0.3rem; font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--accent); }
  .hit-item { display: block; width: 100%; text-align: left; background: transparent; border: none; border-bottom: 1px solid var(--rule); padding: 0.4rem 0.2rem; cursor: pointer; font-size: 0.98rem; line-height: 1.45; }
  .hit-item:hover { background: var(--parchment-dark); }
  .hit-item .c { display: block; font-size: 0.74rem; color: var(--faded); font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
  .more { margin: 0.8rem 0; padding: 0.35rem 0.9rem; border: 1px solid var(--accent-light); border-radius: 2px; background: transparent; cursor: pointer; color: var(--accent); }
  .more:hover { background: var(--parchment-dark); }
  .empty { color: var(--faded); font-style: italic; padding: 0.6rem 0; }

  .foot { padding: 0.45rem 1rem; border-top: 1px solid var(--rule); font-size: 0.78rem; color: var(--faded); background: var(--parchment); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { display: block; }
    .reader { height: 70vh; }
    .panel { height: 80vh; border-left: none; border-top: 1px solid var(--accent-light); }
  }
</style>
</head>
<body>

<header>
  <h1>Logic Corpus</h1>
  <span class="sub">Kant’s logic lectures, AA XXIV: Blomberg · Busolt · Wiener</span>
  <a href="../../">Kant Lab</a>
</header>

<div class="app">
  <section class="reader" aria-label="Text">
    <div class="tabs" id="tabs" role="tablist" aria-label="Lecture transcript"></div>
    <div class="bar">
      <select id="sec" aria-label="Section"></select>
      <div class="layers" aria-label="Show on the text">
        <span>Mark:</span>
        <label><input type="checkbox" id="L-ex" checked> <span class="a-ex">examples</span></label>
        <label><input type="checkbox" id="L-syl" checked> <span class="a-syl">syllogisms</span></label>
        <label><input type="checkbox" id="L-par" checked> <span class="a-par">parallels</span></label>
      </div>
    </div>
    <div class="text" id="text"><div class="text-inner" id="text-inner"></div></div>
  </section>

  <aside class="panel" aria-label="Search and analysis">
    <div class="search">
      <div class="row"><input type="search" id="q" placeholder="Search a term in all three lectures…" autocomplete="off" spellcheck="false"></div>
      <div class="opts">
        <label><input type="checkbox" id="loose" checked> spelling-tolerant</label>
        <label><input type="checkbox" id="W-blomberg" checked> Blomberg</label>
        <label><input type="checkbox" id="W-busolt" checked> Busolt</label>
        <label><input type="checkbox" id="W-wiener" checked> Wiener</label>
      </div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="ptabs" id="ptabs" role="tablist" aria-label="Analysis"></div>
    <div class="pbody" id="pbody"></div>
    <div class="foot">Quotations are the Academy Edition’s text, verbatim. Categories, types, moods, glosses and parallels are the group’s reading.</div>
  </aside>
</div>

<!-- Shared data, as plain <script src> includes so the page still opens from a file:// URL. -->
<script src="../../data/logik-blomberg-24.js"></script>
<script src="../../data/logik-busolt-24.js"></script>
<script src="../../data/logik-wiener-24.js"></script>
<!-- The group's own annotation layers (examples, syllogism types, parallel passages). -->
<script src="annotations.js"></script>
<script>
/* ── data ───────────────────────────────────────────────────────────────── */
const LC_WORKS = [
  { key: 'blomberg', short: 'Blomberg', data: LOGIK_BLOMBERG },
  { key: 'busolt',   short: 'Busolt',   data: LOGIK_BUSOLT },
  { key: 'wiener',   short: 'Wiener',   data: LOGIK_WIENER }
];
const LC_PTABS = [
  { key: 'hits', label: 'Hits' },
  { key: 'ex',   label: 'Examples' },
  { key: 'syl',  label: 'Syllogisms' },
  { key: 'par',  label: 'Parallels' }
];
const LC_SUGGEST = ['Schluß', 'Dilemma', 'Triangel', 'Hypothese', 'Mond', 'Definition', 'Beyspiel'];
const LC_HIT_PAGE = 120;

/* ── indexes built once from the data ───────────────────────────────────── */
const lcWork = {};            // key → work
const lcBlock = {};           // block id → { work, sec, block }
const lcAnn = {};             // block id → [{ layer, id, entry, pass, s, e }]
const lcEntry = {};           // 'ex:ex01' / 'syl:sy01' / 'par:pa01' → entry
LC_WORKS.forEach(w => {
  lcWork[w.key] = w;
  w.data.sections.forEach((sec, si) => sec.blocks.forEach(b => { lcBlock[b.id] = { work: w, sec: si, block: b }; }));
});

function lcAddAnn(layer, entry, loc, pass) {
  const rec = lcBlock[loc.block];
  if (!rec) return;
  const at = rec.block.text ? rec.block.text.indexOf(loc.quote) : -1;
  const a = { layer, id: entry.id, entry, pass, s: at, e: at < 0 ? -1 : at + loc.quote.length };
  (lcAnn[loc.block] = lcAnn[loc.block] || []).push(a);
}
LC_EXAMPLES.forEach(e => { lcEntry['ex:' + e.id] = e; lcAddAnn('ex', e, e, -1); });
LC_SYLLOGISMS.forEach(e => { lcEntry['syl:' + e.id] = e; lcAddAnn('syl', e, e, -1); });
LC_PARALLELS.forEach(p => { lcEntry['par:' + p.id] = p; p.passages.forEach((x, i) => lcAddAnn('par', p, x, i)); });

/* ── state ──────────────────────────────────────────────────────────────── */
let curWork = 'blomberg';
let curSec = 0;
let ptab = 'hits';
let query = '';
let loose = true;
let searchIn = { blomberg: true, busolt: true, wiener: true };
let layers = { ex: true, syl: true, par: true };
let exCat = '';               // example category filter
let sylType = '';             // syllogism type filter
let hitLimit = LC_HIT_PAGE;
let curHit = null;            // { id, s, e } — the hit last clicked
let HITS = [];                // [{ id, s, e }] in reading order
let hitsByBlock = {};         // block id → [{ s, e }]
let hitsBySec = {};           // 'work:sec' → n

/* ── helpers ────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function pageAt(block, off) {
  let p = block.aa;
  (block.pages || []).forEach(x => { if (x.i <= off) p = x.p; });
  return p;
}
const cite = (rec, off) => 'AA ' + rec.work.data.meta.volume + ':' + pageAt(rec.block, off);

function secRange(sec) {
  const pp = sec.blocks.map(b => b.aaEnd || b.aa).concat(sec.blocks.map(b => b.aa)).filter(n => typeof n === 'number');
  return pp.length ? [Math.min.apply(null, pp), Math.max.apply(null, pp)] : null;
}
function secLabel(sec, si) {
  const r = secRange(sec);
  const t = sec.title && sec.title.trim() ? sec.title.trim() : (sec.titleSrc === 'none' ? 'Titelei (no title printed)' : 'Untitled');
  return (si + 1) + '. ' + t + (r ? ' · AA ' + (r[0] === r[1] ? r[0] : r[0] + '–' + r[1]) : '');
}

/* A query as a regular expression. The spelling-tolerant form lets one printed
   spelling find the others (Schluß/Schlüsse, Logik/Logic, Satz/Saz/Sazz, Begriff/
   Begrif); it widens what is found, never what is shown — hits print as printed. */
function lcRegex(q, flags) {
  const t = q.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!t) return null;
  if (!loose) return new RegExp(escRe(t).replace(/ /g, '\\s+'), flags);
  let out = '';
  for (let i = 0; i < t.length; i++) {
    const c = t[i], two = t.slice(i, i + 2);
    if (c === ' ') out += '\\s+';
    else if (two === 'ss' || c === 'ß') { out += '(?:ss|ß)'; if (two === 'ss') i++; }
    else if (two === 'tz' || two === 'zz' || c === 'z') { out += '(?:tz|zz|z)'; if (two === 'tz' || two === 'zz') i++; }
    else if (two === 'th') { out += 'th?'; i++; }
    else if (c === 'c' || c === 'k') out += '[ck]';
    else if (c === 'y' || c === 'i') out += '[iy]';
    else if (c === 'a' || c === 'ä') out += '[aä]';
    else if (c === 'o' || c === 'ö') out += '[oö]';
    else if (c === 'u' || c === 'ü') out += '[uü]';
    else if ('flmnprt'.indexOf(c) >= 0) { out += c + '{1,2}'; if (t[i + 1] === c) i++; }
    else out += escRe(c);
  }
  return new RegExp(out, flags);
}

function markText(text, re) {
  if (!re) return esc(text);
  re.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (!m[0].length) { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + '<mark class="hit">' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

/* ── search over the three works ────────────────────────────────────────── */
function runSearch() {
  HITS = []; hitsByBlock = {}; hitsBySec = {};
  const re = query.trim().length >= 2 ? lcRegex(query, 'gi') : null;
  if (!re) return;
  LC_WORKS.forEach(w => {
    if (!searchIn[w.key]) return;
    w.data.sections.forEach((sec, si) => sec.blocks.forEach(b => {
      if (!b.text) return;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(b.text))) {
        if (!m[0].length) { re.lastIndex++; continue; }
        const h = { id: b.id, s: m.index, e: m.index + m[0].length };
        HITS.push(h);
        (hitsByBlock[b.id] = hitsByBlock[b.id] || []).push(h);
        const k = w.key + ':' + si;
        hitsBySec[k] = (hitsBySec[k] || 0) + 1;
      }
    }));
  });
}

/* ── left: the text ─────────────────────────────────────────────────────── */
function blockHtml(b) {
  if (b.kind === 'rule') return '<hr class="rule" id="' + esc(b.id) + '">';
  const text = b.text || '';
  const cuts = new Set([0, text.length]);
  const ranges = [];
  (lcAnn[b.id] || []).forEach(a => {
    if (!layers[a.layer] || a.s < 0) return;
    ranges.push({ s: a.s, e: a.e, cls: 'a-' + a.layer, ann: a.layer + ':' + a.id + (a.pass >= 0 ? ':' + a.pass : '') });
  });
  (hitsByBlock[b.id] || []).forEach(h => {
    const cur = curHit && curHit.id === b.id && curHit.s === h.s;
    ranges.push({ s: h.s, e: h.e, cls: 'hit' + (cur ? ' cur' : ''), ann: '' });
  });
  ranges.forEach(r => { cuts.add(r.s); cuts.add(r.e); });
  const marks = {};
  (b.pages || []).forEach(x => { if (x.i > 0) { cuts.add(x.i); (marks[x.i] = marks[x.i] || []).push('<span class="pg" title="Academy Edition page begins here">' + '‹' + x.p + '›</span>'); } });
  (b.ms || []).forEach(x => { cuts.add(x.i); (marks[x.i] = marks[x.i] || []).push('<span class="ms" title="The manuscript’s own pagination">[' + x.p + ']</span>'); });
  const pts = Array.from(cuts).sort((a, c) => a - c);
  let html = '';
  for (let k = 0; k < pts.length; k++) {
    const s = pts[k];
    if (marks[s]) html += marks[s].join('');
    const e = pts[k + 1];
    if (e === undefined || e <= s) continue;
    const act = ranges.filter(r => r.s <= s && r.e >= e);
    const piece = esc(text.slice(s, e));
    if (!act.length) { html += piece; continue; }
    const cls = act.map(r => r.cls).join(' ');
    const ann = act.map(r => r.ann).filter(Boolean).join(' ');
    html += '<span class="' + cls + '"' + (ann ? ' data-ann="' + esc(ann) + '"' : '') + '>' + piece + '</span>';
  }
  const infer = (b.joined || []).indexOf('inferred') >= 0
    ? ' <span class="inf" title="The extractor joined this paragraph from separate lines on its own judgement; the transcription has no mark there.">‡</span>' : '';
  return '<div class="blk' + (b.kind === 'note' ? ' note' : '') + '" id="' + esc(b.id) + '">' +
    '<a class="gut" href="#' + esc(b.id) + '" title="' + esc(b.id) + '">' + b.aa + '</a><p>' + html + infer + '</p></div>';
}

function renderTabs() {
  $('tabs').innerHTML = LC_WORKS.map(w => {
    const m = w.data.meta;
    return '<button class="tab" role="tab" data-work="' + w.key + '" aria-selected="' + (w.key === curWork) + '">' +
      '<span class="t">' + esc(m.work) + '</span><span class="d">' + esc(m.date) + ' · AA ' + m.volume + ':' + m.aa[0] + '–' + m.aa[1] + '</span></button>';
  }).join('');
}

function renderSelect() {
  const w = lcWork[curWork];
  $('sec').innerHTML = w.data.sections.map((sec, si) => {
    const n = hitsBySec[w.key + ':' + si];
    return '<option value="' + si + '"' + (si === curSec ? ' selected' : '') + '>' + esc(secLabel(sec, si)) + (n ? '  ·  ' + n + ' hit' + (n > 1 ? 's' : '') : '') + '</option>';
  }).join('');
}

function renderText() {
  const w = lcWork[curWork];
  const sec = w.data.sections[curSec];
  const m = w.data.meta;
  const title = sec.title && sec.title.trim() ? sec.title.trim() : (sec.titleSrc === 'none' ? 'Titelei' : 'Untitled');
  const alts = (sec.headings || []).filter(h => h.trim() !== sec.title.trim());
  let html = '<div class="work-meta">' + esc(m.work) + ' · ' + esc(m.date) + ' · ' + esc(m.provenance) + '</div>';
  html += '<div class="sec-head"><h2>' + esc(title) + '</h2>' +
    (alts.length ? '<div class="alt">Manuscript heading: ' + alts.map(esc).join(' / ') + '</div>' : '') +
    (sec.provenance ? '<div class="prov">' + esc(sec.provenance) + '</div>' : '') + '</div>';
  let prevPara = '';
  sec.blocks.forEach(b => {
    const pr = b.para && b.para.raw;
    if (pr && pr !== prevPara) html += '<div class="para-tag" title="Blomberg’s heading keyed to Meier’s Auszug, as printed">' + esc(pr) + '</div>';
    if (pr) prevPara = pr;
    html += blockHtml(b);
  });
  $('text-inner').innerHTML = html;
}

function renderAll() { renderTabs(); renderSelect(); renderText(); renderPanel(); }

/* ── right: the panel ───────────────────────────────────────────────────── */
function matcher() {
  const re = query.trim().length >= 2 ? lcRegex(query, 'i') : null;
  return { re, test: s => !re || re.test(s) };
}

function filtered() {
  const f = matcher();
  const ok = (e, extra) => f.test([e.quote, e.point, e.note, e.sub, e.mood, e.topic, extra].filter(Boolean).join('   '));
  const ex = LC_EXAMPLES.filter(e => ok(e, (LC_EXAMPLE_CATS.find(c => c.key === e.cat) || {}).label));
  const sy = LC_SYLLOGISMS.filter(e => ok(e, (LC_SYLL_TYPES.find(c => c.key === e.type) || {}).label));
  const pa = LC_PARALLELS.filter(p => ok(p, p.passages.map(x => x.quote).join(' ')) );
  return { ex, sy, pa, re: f.re };
}

function renderPtabs(F) {
  const counts = { hits: HITS.length, ex: F.ex.length, syl: F.sy.length, par: F.pa.length };
  const totals = { hits: '', ex: '/' + LC_EXAMPLES.length, syl: '/' + LC_SYLLOGISMS.length, par: '/' + LC_PARALLELS.length };
  $('ptabs').innerHTML = LC_PTABS.map(t =>
    '<button class="ptab" role="tab" data-ptab="' + t.key + '" aria-selected="' + (t.key === ptab) + '">' + t.label +
    '<span class="n">' + (t.key === 'hits' ? counts.hits : (query.trim().length >= 2 ? counts[t.key] + totals[t.key] : totals[t.key].slice(1))) + '</span></button>').join('');
}

function citeEntry(e) {
  const rec = lcBlock[e.block];
  if (!rec) return '';
  const at = rec.block.text.indexOf(e.quote);
  return '<span class="work">' + esc(rec.work.short) + '</span><span>' + esc(cite(rec, Math.max(at, 0))) + '</span>';
}
const quoteHtml = (e, re) => '<div class="q" data-go="' + esc(e.block) + '" data-quote="' + esc(e.quote) + '">“' + markText(e.quote, re) + '”</div>' +
  (lcBlock[e.block] && lcBlock[e.block].block.text.indexOf(e.quote) < 0 ? '<div class="reading">(quotation not located in its block)</div>' : '');

function exampleCard(e, re) {
  return '<div class="card" id="item-ex-' + e.id + '"><div class="meta">' + citeEntry(e) + '</div>' + quoteHtml(e, re) +
    '<div class="reading"><span class="label">Illustrates</span>' + markText(e.point, re) + '</div></div>';
}
function syllCard(e, re) {
  return '<div class="card" id="item-syl-' + e.id + '"><div class="meta">' + citeEntry(e) +
    '<span class="tag' + (e.named ? ' attested' : '') + '" title="' + (e.named ? 'The passage itself names this' : 'Filed here by the group; the passage does not name it') + '">' + (e.named ? 'named in the text' : 'filed by the group') + '</span></div>' +
    '<div class="reading" style="margin:0 0 0.25rem"><span class="label">Type</span>' + markText(e.sub, re) + '</div>' + quoteHtml(e, re) +
    (e.mood ? '<div class="reading"><span class="label">Mood · group’s reading</span>' + markText(e.mood, re) + '</div>' : '') +
    (e.note ? '<div class="reading">' + markText(e.note, re) + '</div>' : '') + '</div>';
}
function parCard(p, re) {
  return '<div class="card pcard" id="item-par-' + p.id + '"><h4>' + markText(p.topic, re) + '</h4>' +
    '<div class="meta"><span class="tag">' + esc(p.kind === 'doctrine' ? 'same doctrine' : p.kind === 'wording' ? 'same wording' : 'recurring example') + '</span><span>group’s reading</span></div>' +
    p.passages.map(x => '<div class="pass"><div class="meta">' + citeEntry(x) + '</div>' + quoteHtml(x, re) + '</div>').join('') +
    (p.note ? '<div class="reading">' + markText(p.note, re) + '</div>' : '') + '</div>';
}

function renderHits() {
  if (query.trim().length < 2) {
    return '<p class="lede">Search all three lectures at once. Hits are marked in the text on the left, wherever the section is open; click one to go to it.</p>' +
      '<div class="chips">' + LC_SUGGEST.map(s => '<button class="chip" data-suggest="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
      '<p class="lede">Spelling-tolerant search finds the printed variants of a word (Schluß · Schlüsse, Logik · Logic, Begriff · Begrif); each hit shows the spelling the text prints. The other three tabs are filtered by the same term.</p>';
  }
  if (!HITS.length) return '<div class="empty">No hits for “' + esc(query.trim()) + '”.</div>';
  const re = lcRegex(query, 'gi');
  let html = '', last = '', shown = 0;
  for (let i = 0; i < HITS.length && shown < hitLimit; i++, shown++) {
    const h = HITS[i], rec = lcBlock[h.id];
    const g = rec.work.key + ':' + rec.sec;
    if (g !== last) {
      last = g;
      html += '<div class="hitgrp">' + esc(rec.work.short) + ' · ' + esc(secLabel(rec.work.data.sections[rec.sec], rec.sec)) + ' (' + hitsBySec[g] + ')</div>';
    }
    const t = rec.block.text, a = Math.max(0, h.s - 70), z = Math.min(t.length, h.e + 70);
    html += '<button class="hit-item" data-hit="' + i + '"><span class="c">' + esc(cite(rec, h.s)) + '</span>' +
      (a > 0 ? '…' : '') + esc(t.slice(a, h.s)) + '<mark class="hit">' + esc(t.slice(h.s, h.e)) + '</mark>' + esc(t.slice(h.e, z)) + (z < t.length ? '…' : '') + '</button>';
  }
  if (shown < HITS.length) html += '<button class="more" id="more">Show ' + Math.min(LC_HIT_PAGE, HITS.length - shown) + ' more (' + (HITS.length - shown) + ' left)</button>';
  return html;
}

function renderExamples(F) {
  const re = F.re ? new RegExp(F.re.source, 'gi') : null;
  const chips = '<div class="chips">' + '<button class="chip" data-excat="" aria-pressed="' + (exCat === '') + '">All ' + F.ex.length + '</button>' +
    LC_EXAMPLE_CATS.map(c => '<button class="chip" data-excat="' + c.key + '" aria-pressed="' + (exCat === c.key) + '">' + esc(c.label) + ' ' + F.ex.filter(e => e.cat === c.key).length + '</button>').join('') + '</div>';
  let html = '<p class="lede">Illustrations the lecturer brings in, sorted by the field they are drawn from. The sorting is the group’s; the wording is the text’s.</p>' + chips;
  LC_EXAMPLE_CATS.forEach(c => {
    if (exCat && exCat !== c.key) return;
    const list = F.ex.filter(e => e.cat === c.key);
    if (!list.length) return;
    html += '<div class="grp"><h3>' + esc(c.label) + '</h3><div class="desc">' + esc(c.desc) + '</div></div>' + list.map(e => exampleCard(e, re)).join('');
  });
  if (!F.ex.length) html += '<div class="empty">No example matches “' + esc(query.trim()) + '”.</div>';
  return html;
}

function renderSyllogisms(F) {
  const re = F.re ? new RegExp(F.re.source, 'gi') : null;
  const chips = '<div class="chips">' + '<button class="chip" data-syltype="" aria-pressed="' + (sylType === '') + '">All ' + F.sy.length + '</button>' +
    LC_SYLL_TYPES.map(c => '<button class="chip" data-syltype="' + c.key + '" aria-pressed="' + (sylType === c.key) + '">' + esc(c.label) + ' ' + F.sy.filter(e => e.type === c.key).length + '</button>').join('') + '</div>';
  let html = '<p class="lede">Passages on inference, by the kind of inference. “Named in the text” means the passage itself uses the term; “filed by the group” is the group’s classification. A mood is added only where the group has read it off the premises.</p>' + chips;
  LC_SYLL_TYPES.forEach(c => {
    if (sylType && sylType !== c.key) return;
    const list = F.sy.filter(e => e.type === c.key);
    if (!list.length) return;
    html += '<div class="grp"><h3>' + esc(c.label) + '</h3><div class="desc">' + esc(c.desc) + '</div></div>' + list.map(e => syllCard(e, re)).join('');
  });
  if (!F.sy.length) html += '<div class="empty">No passage matches “' + esc(query.trim()) + '”.</div>';
  return html;
}

function renderParallels(F) {
  const re = F.re ? new RegExp(F.re.source, 'gi') : null;
  let html = '<p class="lede">The same teaching, wording or example in more than one lecture. Click a quotation to open it in its transcript; the passages are the text’s, the comparison is the group’s.</p>';
  html += F.pa.map(p => parCard(p, re)).join('');
  if (!F.pa.length) html += '<div class="empty">No parallel matches “' + esc(query.trim()) + '”.</div>';
  return html;
}

function renderPanel() {
  const F = filtered();
  renderPtabs(F);
  const body = $('pbody');
  body.innerHTML = ptab === 'hits' ? renderHits() : ptab === 'ex' ? renderExamples(F) : ptab === 'syl' ? renderSyllogisms(F) : renderParallels(F);
  const n = HITS.length;
  $('sum').textContent = query.trim().length < 2 ? '' :
    n + ' hit' + (n === 1 ? '' : 's') + ' · ' + LC_WORKS.filter(w => searchIn[w.key]).map(w => w.short + ' ' + HITS.filter(h => lcBlock[h.id].work === w).length).join(' · ');
}

/* ── moving between the two columns ─────────────────────────────────────── */
function flash(el, cls) {
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 2800);
}

function goTo(id, quote, hit) {
  const rec = lcBlock[id];
  if (!rec) return;
  const sameSec = rec.work.key === curWork && rec.sec === curSec;
  curWork = rec.work.key; curSec = rec.sec;
  if (hit) curHit = hit;
  if (!sameSec || hit) { renderTabs(); renderSelect(); renderText(); }
  const el = document.getElementById(id);
  if (!el) return;
  (el.querySelector('.hit.cur') || el).scrollIntoView({ block: 'center' });
  flash(el, 'flash');
  if (quote) {
    const spans = Array.from(el.querySelectorAll('[data-ann]'));
    flash(spans.find(sp => sp.textContent && quote.indexOf(sp.textContent) === 0) || spans[0], 'flash-q');
  }
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}

function openAnn(spec) {
  const parts = spec.split(':');           // layer:id[:pass]
  ptab = parts[0];
  if (ptab === 'ex') exCat = ''; else if (ptab === 'syl') sylType = '';
  renderPanel();
  const el = document.getElementById('item-' + parts[0] + '-' + parts[1]);
  if (el) { el.scrollIntoView({ block: 'center' }); flash(el, 'flash'); }
}

/* ── events ─────────────────────────────────────────────────────────────── */
$('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-work]');
  if (!b || b.dataset.work === curWork) return;
  curWork = b.dataset.work; curSec = 0; curHit = null;
  renderAll();
  $('text').scrollTop = 0;
});
$('sec').addEventListener('change', ev => { curSec = +ev.target.value; curHit = null; renderText(); $('text').scrollTop = 0; });
['ex', 'syl', 'par'].forEach(k => $('L-' + k).addEventListener('change', ev => { layers[k] = ev.target.checked; renderText(); }));

$('text-inner').addEventListener('click', ev => {
  const sp = ev.target.closest('[data-ann]');
  if (sp) { const specs = sp.dataset.ann.split(' '); openAnn(specs[specs.length - 1]); return; }
  const g = ev.target.closest('.gut');
  if (g) { ev.preventDefault(); history.replaceState(null, '', g.getAttribute('href')); }
});

$('ptabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ptab]');
  if (!b) return;
  ptab = b.dataset.ptab; renderPanel(); $('pbody').scrollTop = 0;
});

let lcTimer = 0;
function applyQuery() {
  const was = query.trim().length >= 2;
  query = $('q').value;
  hitLimit = LC_HIT_PAGE; curHit = null;
  runSearch();
  if (!was && query.trim().length >= 2) ptab = 'hits';   // a new search opens its hits; later edits leave the tab alone
  renderSelect(); renderText(); renderPanel();
}
$('q').addEventListener('input', () => { clearTimeout(lcTimer); lcTimer = setTimeout(applyQuery, 160); });
$('loose').addEventListener('change', ev => { loose = ev.target.checked; applyQuery(); });
LC_WORKS.forEach(w => $('W-' + w.key).addEventListener('change', ev => { searchIn[w.key] = ev.target.checked; applyQuery(); }));

$('pbody').addEventListener('click', ev => {
  const t = ev.target;
  const h = t.closest('[data-hit]');
  if (h) { const hit = HITS[+h.dataset.hit]; goTo(hit.id, null, hit); return; }
  const q = t.closest('[data-go]');
  if (q) { goTo(q.dataset.go, q.dataset.quote); return; }
  const c = t.closest('[data-excat]');
  if (c) { exCat = c.dataset.excat; renderPanel(); return; }
  const y = t.closest('[data-syltype]');
  if (y) { sylType = y.dataset.syltype; renderPanel(); return; }
  const s = t.closest('[data-suggest]');
  if (s) { $('q').value = s.dataset.suggest; applyQuery(); return; }
  if (t.closest('#more')) { hitLimit += LC_HIT_PAGE; renderPanel(); }
});

window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (lcBlock[id]) goTo(id); });

/* ── init ───────────────────────────────────────────────────────────────── */
renderAll();
if (lcBlock[location.hash.slice(1)]) goTo(location.hash.slice(1));
</script>
</body>
</html>
