<html lang="en">
<head>

<title>Jäsche Logik · cross-reference · Kant Lab</title>
<style>

<!-- Shared data, as plain <script src> includes so the page still opens from a file:// URL.
     The Jäsche Logik is Alex Li's own extraction (logik-jasche-9.js, beside this page);
     the three lectures come from data/. -->
<script src="../../data/logik-blomberg-24.js"></script>
<script src="../../data/logik-busolt-24.js"></script>
<script src="../../data/logik-wiener-24.js"></script>
<script src="logik-jasche-9.js"></script>
<script>
/* ── data ───────────────────────────────────────────────────────────────── */
/* The lectures Jäsche is compared with. Another lecture is one more line here:
   a { key, label, data, rgb } whose data has the same sections/blocks shape. */
const XR_SOURCES = [
  { key: 'blomberg', label: 'Blomberg', data: LOGIK_BLOMBERG },
  { key: 'busolt',   label: 'Busolt',   data: LOGIK_BUSOLT },
  { key: 'wiener',   label: 'Wiener',   data: LOGIK_WIENER }
];
const XR_MIN_WORDS = 6;        // a sentence shorter than this is not compared
const XR_FLOOR = 0.6;          // the lowest tolerance the slider offers
const XR_RULE = 0.9;           // the tolerance this tool was asked to apply
const XR_GRAM = 3;             // shared word-run that nominates a candidate
const XR_STOP_GRAM = 60;       // a run found this often is too common to nominate by
const J = LOGIK_JASCHE;

/* ── state ──────────────────────────────────────────────────────────────── */
let xrOn = false;
let xrReady = false;           // the comparison has been computed
let tol = XR_RULE;
let showWork = {};  XR_SOURCES.forEach(s => { showWork[s.key] = true; });
let showStrength = { exact: true, pot: true };
let query = '';
let loose = true;
let HITS = [];  let hitCur = -1;  let hitsByBlock = {};  let sentsByBlock = {};
let XR = { sents: [], order: [], src: [], passages: [], bySent: new Map(), progress: 0 };
const jb = {};  J.sections.forEach((s, si) => s.blocks.forEach(b => { jb[b.id] = { b, si }; }));
const srcBlock = {};   // block id → { work, b }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* ── text helpers ───────────────────────────────────────────────────────── */
const ABBR = /(?:^|[\s(])(?:d\.\s?h|d\.\s?i|z\.\s?b|z\.\s?e|u\.\s?s\.\s?w|u\.\s?s\.\s?f|u\.\s?dgl|u\.\s?a|s\.\s?w|s\.\s?o|v\.\s?a|bzw|etc|vgl|nr|no|dgl|m|c|dr|prof|st)\.$/i;
function sentenceSpans(text) {
  const out = []; let start = 0, m;
  const re = /[.!?]+["»”’)\]]*\s+(?=["«„“(\[]?[A-ZÄÖÜ0-9])/g;
  while ((m = re.exec(text))) {
    const end = m.index + m[0].trimEnd().length;
    if (ABBR.test(text.slice(start, end))) continue;
    out.push([start, end]); start = m.index + m[0].length;
  }
  if (start < text.length) out.push([start, text.length]);
  return out;
}
/* Words are compared after folding the spelling the lectures differ in:
   case, ß/ss, umlauts, c/k, y/i, ph/f, th/t, tz/zz/z, doubled letters, gelahrt/gelehrt. */
function normWord(w) {
  return w.toLowerCase().replace(/ß/g, 'ss').replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u')
    .replace(/gelahr/g, 'gelehr').replace(/ch/g, '\u0001').replace(/ph/g, 'f').replace(/th/g, 't')
    .replace(/c/g, 'k').replace(/\u0001/g, 'ch').replace(/y/g, 'i').replace(/tz|zz/g, 'z').replace(/(.)\1+/g, '$1');
}
function tokens(text) {
  const out = [], re = /[A-Za-zÄÖÜäöüßæœ]+/g; let m;
  while ((m = re.exec(text))) out.push({ w: normWord(m[0]), s: m.index, e: m.index + m[0].length });
  return out;
}
function pageAt(b, off) { let p = b.aa; (b.pages || []).forEach(x => { if (x.i <= off) p = x.p; }); return p; }

/* A query as a regular expression; spelling-tolerant widens it, never what is shown. */
function qRegex(q, flags) {
  const t = q.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!t) return null;
  if (!loose) return new RegExp(escRe(t).replace(/ /g, '\\s+'), flags);
  let out = '';
  for (let i = 0; i < t.length; i++) {
    const c = t[i], two = t.slice(i, i + 2);
    if (c === ' ') out += '\\s+';
    else if (two === 'ss' || c === 'ß') { out += '(?:ss|ß)'; if (two === 'ss') i++; }
    else if (two === 'tz' || two === 'zz' || c === 'z') { out += '(?:tz|zz|z)'; if (two === 'tz' || two === 'zz') i++; }
    else if (two === 'th') { out += 'th?'; i++; }
    else if (c === 'c' || c === 'k') out += '[ck]';
    else if (c === 'y' || c === 'i') out += '[iy]';
    else if (c === 'a' || c === 'ä') out += '[aä]';
    else if (c === 'o' || c === 'ö') out += '[oö]';
    else if (c === 'u' || c === 'ü') out += '[uü]';
    else if ('flmnprt'.indexOf(c) >= 0) { out += c + '{1,2}'; if (t[i + 1] === c) i++; }
    else out += escRe(c);
  }
  return new RegExp(out, flags);
}

/* ── the comparison ─────────────────────────────────────────────────────── */
function buildSources() {
  const src = [], gram = new Map();
  XR_SOURCES.forEach(S => S.data.sections.forEach(sec => sec.blocks.forEach(b => {
    if (b.kind !== 'text' || !b.text) return;
    const t = tokens(b.text), id = src.length;
    src.push({ work: S.key, b, t, w: t.map(x => x.w) });
    srcBlock[b.id] = { work: S.key, b, id };
    for (let i = 0; i + XR_GRAM <= t.length; i++) {
      const key = t.slice(i, i + XR_GRAM).map(x => x.w).join(' ');
      let a = gram.get(key); if (!a) gram.set(key, a = []);

/* ── left: the Jäsche text ──────────────────────────────────────────────── */

function blockHtml(b) {
  if (b.kind === 'rule') return '<hr class="rule" id="' + esc(b.id) + '">';
  const text = b.text, cuts = new Set([0, text.length]), ranges = [], marks = {};

  [...text.matchAll(/￼/g)].forEach(m => ranges.push({ s: m.index, e: m.index + 1, cls: 'unset', title: 'A glyph the transcription could not set' }));
  (hitsByBlock[b.id] || []).forEach(hi => { const h = HITS[hi]; ranges.push({ s: h.s, e: h.e, cls: 'hit' + (hi === hitCur ? ' cur' : ''), hit: hi }); });
  if (xrOn && xrReady) {
    (sentsByBlock[b.id] || []).forEach(sn => {
      if (!sn.act) return;
      const p = XR.bySent.get(sn);
      ranges.push({ s: sn.s, e: sn.e, cls: 'x x-' + sn.act.work + ' ' + (sn.act.exact ? 'exact' : 'pot'), xr: p.idx });
      if (p.sents[0] === sn) (marks[sn.s] = marks[sn.s] || []).push('<span class="xchip x-' + p.work + '" data-xr="' + p.idx + '" title="Open this passage in the cross-reference panel">' +
        esc(XR_SOURCES.find(x => x.key === p.work).label) + (p.sents.length > 1 ? ' ×' + p.sents.length : '') + '</span>');
    });
  }
  ranges.forEach(r => { cuts.add(r.s); cuts.add(r.e); });
  (b.pages || []).forEach(x => { if (x.i > 0) { cuts.add(x.i); (marks[x.i] = marks[x.i] || []).push('<span class="pg" title="Academy Edition page begins here">‹' + x.p + '›</span>'); } });

    const s = pts[k], e = pts[k + 1];
    if (marks[s]) html += marks[s].join('');

    let piece = esc(text.slice(s, e)).replace(/￼/g, '⬚');
    if (!act.length) { html += piece; continue; }
    act.filter(r => r.tag).forEach(r => { piece = '<' + r.tag + '>' + piece + '</' + r.tag + '>'; });

$('prev').addEventListener('click', () => gotoHit(-1));
$('next').addEventListener('click', () => gotoHit(1));
$('loose').addEventListener('change', ev => { loose = ev.target.checked; runSearch(); renderText(); });

$('tol').addEventListener('input', ev => { tol = +ev.target.value / 100; refresh(); });
$('ctl').addEventListener('change', ev => {
  const w = ev.target.dataset.work, s = ev.target.dataset.str;
  if (w) showWork[w] = ev.target.checked; if (s) showStrength[s] = ev.target.checked;
  if (w || s) refresh();
});

function openPassage(idx) {
  const card = $('xc-' + idx); if (!card) return;
  card.classList.add('open'); card.scrollIntoView({ block: 'center' }); flash(card, 'flash');
}
$('inner').addEventListener('click', ev => {
  const x = ev.target.closest('[data-xr]'); if (x) { openPassage(+x.dataset.xr); return; }
  const g = ev.target.closest('.gut'); if (g) { ev.preventDefault(); history.replaceState(null, '', g.getAttribute('href')); }
});
$('pbody').addEventListener('click', ev => {
  const t = ev.target;
  const sb = t.closest('[data-src]'); if (sb) { $('sp-' + sb.dataset.src).classList.toggle('open'); return; }
  const go = t.closest('[data-go]'); if (go) { const card = go.closest('.card'); card.classList.add('open'); scrollToId(go.dataset.go, true); return; }
  const h = t.closest('[data-toggle]'); if (h) h.closest('.card').classList.toggle('open');
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (document.getElementById(id)) scrollToId(id, true); });

/* ── init ───────────────────────────────────────────────────────────────── */
renderToc(); renderText(); renderPanel(); updateToc();
if (location.hash && document.getElementById(location.hash.slice(1))) scrollToId(location.hash.slice(1), true);
</script>
</body>
</html>
