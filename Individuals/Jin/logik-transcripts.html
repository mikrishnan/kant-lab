<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kant's Logic Lectures — Blomberg, Wiener, Busolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #f6efe0;
  --parchment-dark: #ebe1cb;
  --ink: #2a2118;
  --muted: #7a6a58;
  --accent: #5c3d1e;
  --accent-soft: #c9ac84;
  --rule: #d8c9aa;
  --mark: #fff0a6;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 18px; line-height: 1.55;
  background: var(--parchment); color: var(--ink);
  display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  padding: 10px 18px; background: var(--accent); color: var(--parchment);
}
header h1 { font-family: 'Cinzel', serif; font-weight: 400; font-size: 17px; letter-spacing: .08em; margin: 0; }
.modes { display: flex; gap: 4px; }
.modes button, .toggles label, header input, .pane-head select, .pane-head button, .jump input, .jump button {
  font: inherit; font-size: 15px;
}
.modes button {
  background: transparent; color: var(--parchment); border: 1px solid var(--accent-soft);
  padding: 3px 14px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .08em;
}
.modes button.on { background: var(--parchment); color: var(--accent); }
.toggles { display: flex; gap: 14px; font-size: 14px; margin-left: auto; }
.toggles label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
header .search { display: flex; gap: 6px; }
header input[type=search] { padding: 3px 8px; border: 1px solid var(--accent-soft); background: var(--parchment); color: var(--ink); width: 230px; }
header .search button { background: var(--parchment); color: var(--accent); border: 0; padding: 3px 12px; cursor: pointer; }

main { flex: 1; min-height: 0; display: flex; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
.pane:last-child { border-right: 0; }
.pane-head {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 14px; background: var(--parchment-dark); border-bottom: 1px solid var(--rule);
}
.pane-head select { padding: 3px 6px; background: var(--parchment); color: var(--ink); border: 1px solid var(--accent-soft); max-width: 100%; }
.pane-head .work { font-family: 'Cinzel', serif; }
.pane-head button { background: var(--parchment); border: 1px solid var(--accent-soft); color: var(--accent); cursor: pointer; padding: 2px 10px; }
.pane-head button:disabled { opacity: .35; cursor: default; }
.jump { display: flex; gap: 4px; align-items: center; font-size: 14px; color: var(--muted); }
.jump input { width: 60px; padding: 2px 5px; border: 1px solid var(--accent-soft); background: var(--parchment); }
.pane-body { flex: 1; overflow-y: auto; padding: 18px 26px 60px; }
.pane-meta { color: var(--muted); font-size: 15px; font-style: italic; margin-bottom: 14px; }
.pane-meta .badge { font-style: normal; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: .06em; border: 1px solid var(--accent-soft); padding: 0 6px; margin-left: 6px; }
h2.sec-title { font-family: 'Cinzel', serif; font-weight: 600; font-size: 20px; color: var(--accent); margin: 0 0 4px; }

.blk { display: grid; grid-template-columns: 74px 1fr; gap: 0 12px; margin: 0 0 .7em; padding: 2px 0; border-left: 3px solid transparent; }
.blk .cite { font-family: 'Cinzel', serif; font-size: 10.5px; color: var(--muted); text-align: right; padding-top: 5px; letter-spacing: .03em; user-select: none; }
.blk .cite .par { display: block; color: var(--accent); font-size: 12px; }
.blk .txt { white-space: pre-wrap; }
.blk.inferred { border-left: 3px dashed var(--accent-soft); padding-left: 8px; }
.blk.note .txt { font-style: italic; color: var(--muted); }
.blk.rule .txt { border-top: 1px solid var(--rule); height: 0; margin-top: 12px; }
.blk.flash { background: var(--mark); transition: background 2s; }
.aa, .ms { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: .03em; vertical-align: super; line-height: 0; padding: 1px 4px; margin: 0 2px; white-space: nowrap; }
.aa { background: var(--accent); color: var(--parchment); }
.ms { border: 1px solid var(--accent-soft); color: var(--muted); }
body.hide-aa .aa, body.hide-ms .ms { display: none; }
mark { background: var(--mark); padding: 0 1px; }
.sec-par { font-family: 'Cinzel', serif; color: var(--accent); font-size: 14px; letter-spacing: .06em; margin: 1.3em 0 .3em 86px; border-bottom: 1px solid var(--rule); }

#results { display: none; flex: 1; overflow-y: auto; padding: 18px 26px 60px; }
#results.on { display: block; }
#results h3 { font-family: 'Cinzel', serif; color: var(--accent); font-weight: 400; margin: 22px 0 6px; letter-spacing: .06em; }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 6px 4px; font: inherit; font-size: 16px; color: var(--ink); cursor: pointer; }
.hit:hover { background: var(--parchment-dark); }
.hit .where { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); display: block; }
.empty { color: var(--muted); font-style: italic; }
footer { font-size: 12.5px; color: var(--muted); padding: 5px 18px; border-top: 1px solid var(--rule); background: var(--parchment-dark); }
@media (max-width: 800px) { main.compare { flex-direction: column; } .blk { grid-template-columns: 1fr; } .blk .cite { text-align: left; } .sec-par { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Kant's Logic Lectures</h1>
  <div class="modes">
    <button id="m-read" class="on">Read</button>
    <button id="m-compare">Compare</button>
  </div>
  <form class="search" id="searchForm">
    <input type="search" id="q" placeholder="Search all three transcripts…" aria-label="Search all three transcripts">
    <button>Search</button>
  </form>
  <div class="toggles">
    <label><input type="checkbox" id="t-aa" checked> AA pages</label>
    <label><input type="checkbox" id="t-ms" checked> Manuscript pages</label>
  </div>
</header>
<main id="main"></main>
<div id="results"></div>
<footer>Academy Edition XXIV transcriptions, from <code>data/</code>. A dashed rule marks a paragraph the extractor joined on its own judgement (inferred), not on the transcription's own marker. Editorial brackets are the Academy Edition's.</footer>

<!-- Shared data, generated from Textfiles/ — see data/README.md. Plain <script src> so the page also works from file:// -->
<script src="../../data/logik-blomberg-24.js"></script>
<script src="../../data/logik-wiener-24.js"></script>
<script src="../../data/logik-busolt-24.js"></script>
<script>
/* ---------- data ---------- */
const WORKS = [
  { key: 'blomberg', short: 'Blomberg', data: LOGIK_BLOMBERG },
  { key: 'wiener',   short: 'Wiener',   data: LOGIK_WIENER },
  { key: 'busolt',   short: 'Busolt',   data: LOGIK_BUSOLT },
];
const WORK = Object.fromEntries(WORKS.map(w => [w.key, w]));

/* ---------- state ---------- */
let mode = 'read';
let panes = [];
let activeQuery = '';

/* ---------- helpers ---------- */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fold(s) { return s.toLowerCase().replace(/ſ/g, 's'); }
function highlight(raw, q) {
  const safe = esc(raw);
  if (!q) return safe;
  const re = new RegExp('(' + escRe(esc(q)) + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}
function sectionLabel(s) { return s.title || (s.titleSrc === 'none' ? 'Titelei' : s.id); }
function blockPara(b) { return b.para ? b.para.raw : null; }

/* A block's text with its page marks put back where the transcription had them. */
function blockHtml(b, q) {
  const events = [];
  (b.pages || []).forEach(p => events.push({ i: p.i, html: '<span class="aa">AA ' + p.p + '</span>' }));
  (b.ms || []).forEach(p => events.push({ i: p.i, html: '<span class="ms">[' + p.p + ']</span>' }));
  events.sort((a, b2) => a.i - b2.i);
  let out = '', at = 0;
  events.forEach(ev => {
    out += highlight(b.text.slice(at, ev.i), q) + ev.html;
    at = ev.i;
  });
  return out + highlight(b.text.slice(at), q);
}

/* ---------- a pane: one work, one section ---------- */
function makePane(workKey) {
  const pane = { work: WORK[workKey], sec: 0, root: el('section', 'pane') };
  const head = el('div', 'pane-head');
  const wsel = el('select', 'work');
  WORKS.forEach(w => { const o = el('option', null, w.data.meta.work + ' (' + w.data.meta.date + ')'); o.value = w.key; wsel.appendChild(o); });
  wsel.value = workKey;
  const ssel = el('select');
  const prev = el('button', null, '‹'), next = el('button', null, '›');
  prev.title = 'Previous section'; next.title = 'Next section';
  const jump = el('form', 'jump');
  jump.innerHTML = 'Meier § <input type="number" min="1" aria-label="Meier section number"> <button>Go</button>';
  head.append(wsel, prev, ssel, next, jump);
  const body = el('div', 'pane-body');
  pane.root.append(head, body);
  Object.assign(pane, { wsel, ssel, prev, next, jump, body });

  function fillSections() {
    ssel.innerHTML = '';
    pane.work.data.sections.forEach((s, i) => {
      const o = el('option', null, sectionLabel(s) + '  ·  AA ' + firstAA(s));
      o.value = i; ssel.appendChild(o);
    });
    // Only Blomberg is keyed to Meier's §§.
    jump.style.display = pane.work.data.sections.some(s => s.blocks.some(b => b.para)) ? '' : 'none';
  }
  wsel.onchange = () => { pane.work = WORK[wsel.value]; pane.sec = 0; fillSections(); render(pane); };
  ssel.onchange = () => { pane.sec = +ssel.value; render(pane); };
  prev.onclick = () => { if (pane.sec > 0) { pane.sec--; render(pane); } };
  next.onclick = () => { if (pane.sec < pane.work.data.sections.length - 1) { pane.sec++; render(pane); } };
  jump.onsubmit = e => {
    e.preventDefault();
    const n = +jump.querySelector('input').value;
    if (n) jumpToPara(pane, n);
  };
  fillSections();
  pane.fillSections = fillSections;
  return pane;
}

function firstAA(s) {
  const b = s.blocks.find(x => x.aa != null);
  return b ? b.aa : '—';
}

function render(pane, focusId) {
  const d = pane.work.data, s = d.sections[pane.sec];
  pane.wsel.value = pane.work.key;
  pane.ssel.value = pane.sec;
  pane.prev.disabled = pane.sec === 0;
  pane.next.disabled = pane.sec === d.sections.length - 1;
  const body = pane.body;
  body.innerHTML = '';
  const title = el('h2', 'sec-title', sectionLabel(s));
  body.appendChild(title);
  const meta = el('div', 'pane-meta');
  let m = s.provenance || '';
  if (s.headings && s.headings.length) m += (m ? ' — ' : '') + 'Manuscript heading: ' + s.headings.join(' / ');
  meta.textContent = m;
  if (s.titleSrc) meta.appendChild(el('span', 'badge', 'title: ' + s.titleSrc));
  body.appendChild(meta);
  let lastPara = null, target = null;
  s.blocks.forEach(b => {
    const p = blockPara(b);
    if (p && p !== lastPara) body.appendChild(el('div', 'sec-par', 'Meier ' + p));
    lastPara = p;
    const row = el('div', 'blk ' + b.kind + (b.joined && b.joined.includes('inferred') ? ' inferred' : ''));
    row.id = pane.work.key + '-' + b.id;
    const cite = el('div', 'cite');
    cite.textContent = b.aa != null ? 'AA 24:' + b.aa + (b.aaEnd && b.aaEnd !== b.aa ? '–' + b.aaEnd : '') : '';
    if (b.joined && b.joined.includes('inferred')) cite.title = 'Paragraph break removed by the extractor\'s inference';
    const txt = el('div', 'txt');
    txt.innerHTML = b.kind === 'rule' ? '' : blockHtml(b, activeQuery);
    row.append(cite, txt);
    body.appendChild(row);
    if (b.id === focusId) target = row;
  });
  if (target) {
    target.scrollIntoView({ block: 'center' });
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 100);
  } else {
    body.scrollTop = 0;
  }
}

function jumpToPara(pane, n) {
  const d = pane.work.data;
  for (let si = 0; si < d.sections.length; si++) {
    const b = d.sections[si].blocks.find(x => x.para && x.para.nums && x.para.nums.includes(n));
    if (b) { pane.sec = si; render(pane, b.id); return; }
  }
  pane.jump.querySelector('input').setCustomValidity('No such §');
  pane.jump.reportValidity();
  setTimeout(() => pane.jump.querySelector('input').setCustomValidity(''), 1500);
}

/* ---------- modes ---------- */
function setMode(m) {
  mode = m;
  document.getElementById('m-read').classList.toggle('on', m === 'read');
  document.getElementById('m-compare').classList.toggle('on', m === 'compare');
  const main = document.getElementById('main');
  hideResults();
  const keep = panes[0];
  main.innerHTML = '';
  main.className = m;
  panes = [keep || makePane('blomberg')];
  if (m === 'compare') {
    const other = WORKS.find(w => w.key !== panes[0].work.key).key;
    panes.push(makePane(other));
  }
  panes.forEach(p => { main.appendChild(p.root); render(p); });
}

/* ---------- search ---------- */
function hideResults() {
  document.getElementById('results').classList.remove('on');
  document.getElementById('main').style.display = '';
}
document.getElementById('searchForm').onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) { activeQuery = ''; hideResults(); panes.forEach(p => render(p)); return; }
  activeQuery = q;
  const nq = fold(q);
  const res = document.getElementById('results');
  res.innerHTML = '';
  const LIMIT = 150;
  let total = 0;
  const top = el('p', 'empty');
  res.appendChild(top);
  WORKS.forEach(w => {
    const hits = [];
    w.data.sections.forEach((s, si) => s.blocks.forEach(b => {
      if (b.kind === 'rule') return;
      const at = fold(b.text).indexOf(nq);
      if (at >= 0) hits.push({ s, si, b, at });
    }));
    total += hits.length;
    res.appendChild(el('h3', null, w.data.meta.work + ' — ' + hits.length + (hits.length === 1 ? ' passage' : ' passages')));
    hits.slice(0, LIMIT).forEach(h => {
      const btn = el('button', 'hit');
      const where = el('span', 'where', sectionLabel(h.s) + ' · AA 24:' + h.b.aa + (h.b.para ? ' · Meier ' + h.b.para.raw : ''));
      const start = Math.max(0, h.at - 70);
      const snip = el('span');
      snip.innerHTML = (start ? '… ' : '') + highlight(h.b.text.slice(start, h.at + q.length + 110), q) + ' …';
      btn.append(where, snip);
      btn.onclick = () => {
        hideResults();
        if (mode === 'compare') setMode('read');
        const p = panes[0];
        p.work = w; p.fillSections(); p.sec = h.si; render(p, h.b.id);
      };
      res.appendChild(btn);
    });
    if (hits.length > LIMIT) res.appendChild(el('p', 'empty', 'Showing the first ' + LIMIT + '.'));
  });
  top.textContent = total ? total + ' passages for “' + q + '” (case and long s ignored; spelling otherwise as the AA prints it).' : 'Nothing found for “' + q + '”. The transcriptions keep the manuscripts\' spelling — try a stem.';
  document.getElementById('main').style.display = 'none';
  res.classList.add('on');
};

/* ---------- wiring ---------- */
document.getElementById('m-read').onclick = () => setMode('read');
document.getElementById('m-compare').onclick = () => setMode('compare');
document.getElementById('t-aa').onchange = e => document.body.classList.toggle('hide-aa', !e.target.checked);
document.getElementById('t-ms').onchange = e => document.body.classList.toggle('hide-ms', !e.target.checked);

setMode('read');
</script>
</body>
</html>
