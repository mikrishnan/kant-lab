<script>
const PV = {"examples":[{"type":"lec","id":"busolt-s26-046","date":{"label":"ca. 1789/90","era":"1780"},"cite":"Busolt Logic","pages":"AA 24:672","crumb":"Busolt › Von den Hypothetischen und Disiunktiven Urtheilen","prev":["c.) Contraire, wenn einem allgemeinen bejahenden Urtheil ein allgemein verneinendes Urtheil entgegengesezt wird, oder umgekehrt, z.E. Alle Menschen sind Lasterhafte. Ueber einen solchen Saz kann der andere so entsezt werden, daß er sagt: Kein Mensch ist Lasterhaft. Hier thut er mehr als nothig ist, dem andern zu wiedersprechen Judicia contraria opposita können beide falsch seyn, weil darin mehr verneint wird als es nöthig ist. Die Falschheit steckt also in der Allgemeinheit. Bei den folgenden Arten ändert man das Subiect und Praedicat, aber bei der conversion kann man die Quantitaet ändern, nicht aber die Qualitaet. Man nennt die Versezzung der Terminen metathesis terminorum. Durch diese entsteht ein unmittelbarer Schluß durch die conversion der Urtheile wo versezt wird die Quantitaet und nicht die Qualitaet und durch die contraposition der Urtheile, wo versezt wird die Qualitaet und nicht die Quantitaet. Z.E. Alle Menschen sind Sterblich einige Sterbliche sind also Menschen, d.i. durch die Conversion Was nicht sterblich ist, ist kein Mensch d.i. durch die contraposition. Bei der conversion der Urtheile heißt das Urtheil was umgekehrt werden soll: Judicium conversum das wodurch die Umkehrung entspringt iudicium convertens. Die Umkehrung geschieht entweder per accidens oder simpliciter.","Die Bedingungen der Form nach sind diese;"],"text":"a.) Allgemeine bejahende Säzze lassen sich nur per accidens, allgemein verneinende Sazze nur simpliciter und drittens particulaer bejahende oder verneinende Säzze auch simpliciter umkehren. Das erste heißt soviel iudicium conuersum est vniversale und von diesen kann ich nun umgekehrt sagen einige sterbliche sind Menschen Ich denke mir nemlich sterbliche unter denen auch die Menschen sind, d.i. das Subiect Mensch ist unter der Sphäre der Sterblichen, als des Praedicats. Das Praedicat muß also großer seyn als das Subiect, ich kann also einige Sterbliche für Menschen annehmen. Es giebt allgemein bejahende Säzze, die sich simpliciter umkehren lassen, bei welchen die Sphäre des Subiects und Praedicats gleich ist z.E. Alle Figuren in drei geraden Linien eingeschloßen, sind Triangel, alle Triangel sind Figuren in drei geraden Linien eingeschloßen sind Drei Ekke, d.i. eine Subtilitaet und ich überlaße es hier einem jedem, wieviel er aus einer unendlichen Menge Drei Ekke ausnehmen will. Dieser Unterschied aber ist euanescens. Alle verneinende Urtheile, die einen Wiederstreit enthalten laßen sich simpliciter umkehren, z.E. kein Triangel ist ohne Winkel keine Figur ohne Winkel ist ein Triangel alle Particular bejahende oder verneinende Säzze laßen sich simpliciter umkehren, d.i. daß die Quantitaet nicht verändert wird. Die Contraposition will soviel sagen: ein jeder allgemeine Saz laßt sich contraponiren. Z.B. Alle Menschen sind Sterblich, Nichtsterbliche sind nicht Menschen. Wie wird nach den Judiciis mediatis geschloßen? Wenn ein Begrif aus dem andern soll geschloßen werden, der im vorigen nicht enthalten ist; so muß man einen Begriff, der die Bedingung der Regeln enthält hinzufügen; der Begriff des Obiects enthalt nun die Bedingung der Regel, und also muß von dieser conclusion auch das Praedicat der Conclusion gelten. Z.E. Alle Menschen sind Sterblich, Caius ist ein Mensch, also ist Caius sterblich. Es gründet sich dieser Vernunftschluß auf den Grundsaz: einem jeden Dinge in so fern es unter die Bedingung subsumirt werden kann kommt das Praedikat zu ein Vernunftschluß aber ist cognitio a priori per subsumtionem conceptus sub conditione regulae cuiusdam generali.","next":["Der Vernunftschluß hat zwei requisitionen","a.) Allgemeine Regel d.i. Maior."],"ranges":[[1847,1923]],"kindLabel":"Categorical syllogism"},{"type":"lec","id":"blomberg-s06-082","date":{"label":"ca. 1771","era":"1770"},"cite":"Blomberg Logic","pages":"AA 24:88","crumb":"Blomberg › Der Vierte Abschnitt. Von der Wahrheit der Gelahrten Erkenntniß","prev":["In einer einfachen, und gantz Simplen Idea ist natürlicher weise weder wahrheit, noch Falschheit anzutreffen. sonderen dieselbe findet nur bey der Vergleichung statt.","Wenn ich der Sache ein solches Merckmahl beylege, was ihr entweder wiederspricht, oder wohl gar gantz zu wieder ist, oder ein solches Merckmahl in ihr verneine, was in ihr doch Identisch ist."],"text":"Dasjenige aber, wodurch ich erkenne, daß die Vergleichung mit einem Dinge recht sey, oder nicht, heißt die Nota intermedia (Principium materiale) z.E. wenn ich beweisen will, daß ein Körper theilbar sey, so nehme ich eine Notam intermediam an, daß derselbe zusammen gesezt ist, und schlüße auf folgende Art: alles, was zusammen gesezet ist, ist theilba hr, atqui ein jeder Körper ist zusammen gesezt, ergo ist ein jeder Körper theilba hr.","next":["Einige Sätze sind so beschaffen, daß sie gantz und gar kein Materiales Merckmahl der Wahrheit an sich haben, sonderen blos das Formale bey sich führen. Dieses sind eigentlich die unmittelbahre Urtheile, die wir von einer Sache haben, und aus nichts mehr beweisen, und herleiten können. Z.E. daß ein Korper zusammengesezt sey.","Die einfachen Begriffen haben das Merckmahl an sich, daß sie jederzeit wahr sind. z.E. wenn ich mir den Mond rund vorstelle, so ist dieses ein wahrer Begrif weil ich ihn mir so wircklich dencke."],"ranges":[[308,438]],"kindLabel":"Categorical syllogism"},{"type":"lec","id":"busolt-s29-001","date":{"label":"ca. 1789/90","era":"1780"},"cite":"Busolt Logic","pages":"AA 24:674","crumb":"Busolt › Regeln der Vernunftschlüße. Fortsezzung","prev":[],"text":"1.) In einem ordentlichen Vernunftschluß können nicht mehr, als 3. Hauptbegriffe seyn; denn die Conclusion hat nur 2 Anmerkung Ist einer von den beiden Hauptbegriffen in den Praemißen doppelt Sinnig; so findet sich das doppelt Sinnige im ganzen Schluß Z.E. In dem Ort wo ich bin, ist kein anderer, die Stube das ist der Ort wo ich bin, also ist in der Stube kein anderer.","next":["2.) Medius Terminus ne ingrediatur conclusionem, id vero pessimi concurrit vitium.","3.) Ex puris negatiuis nihil sequitur. Dieses sieht man durch die gesunde Vernunft ein; es folgt aus der Natur der Sache selbst: Denn die Subsumtion muß unter der Bedingung der Regel seyn. Ich muß sagen daß einem Dinge das zu komme, was die Bedingung der Regel ist, und dies muß doch bejahend seyn. Z.E. Kein Mensch ist ein unvernünftiges Thier, Kein Ochs ist ein Mensch also ist kein Ochs ein unvernünftiges Thier."],"ranges":[[257,370]],"kindLabel":"Fallacy / sophism"},{"type":"ref","w":"meier","r":3223,"cite":"Reflexion 3223","pages":"AA 16:719–720","src":"locus","loc":"Gegenüber von L §. 367 Satz 2","paras":[367],"work":"Meier, Auszug","phRaw":"β1","dating":{"raw":"β1","uncertain":false,"span":false,"phases":[{"sym":"β¹","years":"ca. 1752 – W.S. 1755/56","from":1752,"to":1756,"inherited":false,"note":"diese Phase zieht sich (sieht man von den wenigen Bemerkungen aus α² ab) als älteste Schicht durch das ganze Meier’sche Compendium hindurch. Es erschien 1752: dies Jahr bildet also den Terminus a quo für Kants Aufzeichnungen. Der Terminus ad quem dürfte das W.S. 1755-6 sein, in dem Kant zum ersten Mal über Logik las. Vermuthlich schrieb er in diesem Semester als Vorbereitung für das Colleg die Bemerkungen der Phase β¹ nieder; doch ist nicht ausgeschlossen, dass er sein »Heft« schon einige Semester oder gar Jahre früher fertiggestellt hatte. Hierher gehört auch ein Doppelblatt mit Vorarbeiten für die »Meditationes de igne«, ferner das lose Blatt J 2, und wahrscheinlich auch D 31. Tinte: röthlich-braun."}],"lo":1752,"hi":1756,"label":"c. 1752–1756","era":"1750","undatedPhase":false,"prose":false},"text":"/\nAlle Menschen konnen irren;\nLeibnitz war ein Mensch;\nAlso konte Leibnitz irren.","ranges":[[2,81]],"secs":[{"n":366,"text":"Wenn ein Urtheil wahr ist, so muss auch dasjenige wahr sein, welches durch eine logische Veränderung des ersten entstanden ist, die der Wahrheit unbeschadet vorgenommen werden kann. Widrigenfalls müsste die logische Veränderung der Wahrheit nachtheilig sein, und nicht nachtheilig sein, welches unmöglich ist §.362. Dieser Schluss heisst: der Schluss von der logischen Veränderung eines wahren Urtheils."},{"n":367,"text":"Ein ordentlicher Vernunftschluss (ratiocinium ordinarium) ist ein Vernunftschluss, in welchem  von dem Allgemeinen auf das Besondere geschlossen wird §.363. Zum Exempel: alle Tugenden tragen etwas zu meiner Glückseligkeit bei; nun sind alle philosophische Tugenden Tugenden, also tragen alle philosophische Tugenden etwas zu meiner Glückseligkeit bei. Alle übrige Vernunftschlüsse sind ausserordentliche Vernunftschlüsse (ratiocinium extraordinarium)."},{"n":368,"text":"Alle ordentliche Vernunftschlüsse haben zwei Vorderurtheile, die den mittlern Hauptbegriff mit einander gemein haben §.367. Dasjenige Vorderurtheil in denselben, welches den grössern Hauptbegriff enthält, heisst der Obersatz der ordentlichen Vernunftschlüsse (propositio maior ratiociniorum ordinariorum); welches aber den kleinern Hauptbegriff enthält, der Untersatz derselben (propositio minor)."}],"focus":367,"kindLabel":"Categorical syllogism"},{"type":"ref","w":"meier","r":3305,"cite":"Reflexion 3305","pages":"AA 16:766–767","src":"group","paras":[402,403,404,405],"work":"Meier, Auszug","phRaw":"θ? (ψ−χ?)","dating":{"raw":"θ? (ψ−χ?)","uncertain":true,"span":true,"phases":[{"sym":"θ","years":"die 1780er Jahre","from":1780,"to":1789,"inherited":false,"note":"θ für sich allein (ohne Exponenten) zeigt an, dass eine genauere Datirung nicht möglich ist, und repräsentirt dann den ganzen Zeitraum, für den es gilt — die 80er Jahre."},{"sym":"ψ","years":"um 1776–78","from":1776,"to":1778,"inherited":false,"note":"ψ u. φ: um 1776-8, sicher später als κ-τ, früher als θ (Stellungsindicien). Eine Bemerkung auf S. VII der »Metaphysica« stammt aus der Zeit des Briefes an Herz vom 24. Nov. 1776 (X 186), eine andere (ebenda auf S. XXXIV) muss vor dem Tode Lamberts (25. Sept. 1777) geschrieben sein. Eine Reihe weiterer Reflexionen weisen durch ihren Inhalt auf dieselbe Zeit. Die Schrift ist in ψ wie in φ klein, eng, gedrängt, oft recht flüchtig. Der Buchstabe φ ist, vor allem in den Praefationes und der Synopsis der »Metaphysica«, verwandt, um die Bemerkungen zu kennzeichnen, die zwischen den Textzeilen stehn; ψ füllt hier, allein oder in Verbindung mit andern Phasen, die Ränder […]. Die Tinte ist röthlich-braun (theils dunkel, theils hell), mitunter auch blass-braun."},{"sym":"χ","years":"1778–79","from":1778,"to":1779,"inherited":false,"note":"1778-9. Meistens flotte grosszügige Schrift, wie in den gleichzeitigen Briefen an Herz und Mendelssohn. Bei manchen Bemerkungen ist die Abgrenzung nach σ, bei anderen die nach θ hin (wo auch flotte, freie, grosszügige Schrift vorherrscht) schwer oder gar unmöglich. Tinte schwarz, röthlich-braun (theils dunkel, theils hell), blass-braun."}],"lo":1776,"hi":1789,"label":"c. 1776–1789 (uncertain)","era":"1770","undatedPhase":false,"prose":false},"text":"Die Logik der megarischen Secte (Euclidis non geometrae).\nSophistici ratiocinandi modi:\n1. Mentiens. Si dicis te mentiri, verumqve (s obiective) dicis, mentiris (s subiective). ergo mentiris te mentiri, i.e. non mentiris.\nEpimenides ait omnes Cretenses esse mendaces; ipse vero Cretensis est, igitur mentitur, et Cretenses sunt veraces; ipse vero Cretensis est, ergo (s et cum verax sit) ipsi credendum, et Cretenses sunt mendaces.\nSeneca. Tota mihi vita mentitur: hanc coargue, hanc ad verum, si acutus es, dirige.\nPhiletas hisce argutiis exilis factus et tenuis, ut, ne vento abriperetur, cogeretur plumbeos globulos subiicere.\n2. Electra. (Agamemnonis filia Orestem fratrem adstantem non agnovit).\n3. Obvelatus. Nosti tuum Patrem? Ita. At si obvelatum prope te statuam? Nostin hunc? Minime. At ille ipse est pater tuus; ergo nosti et simul non nosti.\n4. Acervus (Sorites). Somnium hoc est probabile, cur non etiam (g valde) verosimile? cur non adeo, ut difficulter a vero internoscatur? postremo: ut nihil hoc et illud intercedat?\nNum vnum granum facit acervum. Num duo, num tria? ergo qvod tandem acervus fiat, unicum granum efficit.\n5. Cornutus. Atqvi cornua non perdidisti, ergo habes.\n6. Calvus. a qvoto pilo amisso incipit qvispiam calvus censeri?\nSi qvid movetur, aut movetur in loco, in qvo est, aut in qvo non est.\nDas sophisma aceruus findet immer statt, wo wir durch die bloße Größe einen specifischen Unterschied machen wollen. Es muß ein Punctum flexus contrarii in dem Fortschritte seyn, da die eine Richtung aufhört und die Andere Anfängt. So kan der Geitz nicht durch gar zu Große Sparsamkeit etc etc. erklärt werden. Reich und Arm unterscheiden sich dadurch, daß jenes die Wohlhabenheit übersteigt oder mehr hat, als er bedarf, dieses aber unter ihr ist.\nSummum ius summa iniuria — gegen die schaale Principien der Billigkeit — oder das princip: was den meisten Nützlich ist, dem, was Recht ist, vorzuziehen.\nFiat iustitia, pereat mundus — sie wird dabey nicht untergehen.\ngar zu gütig seyn (nicht gar zu klug).","ranges":[[101,221],[715,853]],"secs":[{"n":401,"text":"Zu den verstümmelten Vernunftschlüssen gehören 1) die zusammengezogene Vernunftschlüsse (ratiocinium contractum), wenn man zum Schlusssatze bloss den mittlern Hauptbegriff hinzu thut, doch so, dass er kein bedingtes Urtheil wird. Zum Exempel: diese Welt ist die beste, weil sie von GOtt er wähltworden. 2) Die Zergliederungsschlüsse (inductio), welche folgenden Obersatz zum Grunde legen, ihn aber auslassen: was von einem jedweden niedrigern Begriffe bejahet oder verneinet werden kann, das kann von ihrem höhern Begriffe allgemein bejahet oder verneinet werden §.263. Wenn in dem Untersatze alle niedrigere Begriffe angeführt werden, so ist es ein ausführlicher Zergliederungsschluss (inductio completa). Zum Exempel: die erste Person der Gottheit ist GOtt, die andere auch, die dritte auch; also sind alle Personen der Gottheit GOtt. 3)Die Exempelschlüsse (exemplum in ratiociniis), wenn man dasjenige, was man von einem niedrigern Begriffe bejahet oder verneinet um seines höhern Begriffs willen, von einem andern niedrigern Begriffe, der zu eben demselben höhern Begriffe gehört, bejahet oder verneinet. Zum Exempel: die Menschen können sündigen, also können auch alle heilige Engel sündigen."},{"n":402,"text":"Ein Vernunftschluss, welcher in der Form unrichtig ist (paralogismus), wenn sein Fehler versteckt ist, wird ein Betrugschluss genennet (sophisma, fallacia, captio)."},{"n":403,"text":"Ein Betrugschluss kann entstehen: 1) wenn wir getrennte Dinge auf eine unrichtige Art verknüpfen, und verknüpfte Dinge auf eine unrichtige Art trennen (sophisma sensus compositi et divisi). Zum Exempel: wo drei Thaler sind, da sind zwei Thaler; nun machen drei und zwei Thaler fünf Thaler aus, also wo drei Thaler sind, da sind fünf Thaler. 2) Wenn ein Hauptbegriff auf eine zweifache Weise genommen wird (sophisma figurae  dictionis). Zum Exempel: ein Weltweiser ist eine Gattung der Gelehrten, Leibniz ist ein Weltweiser, also ist Leibniz eine Gattung der Gelehrten."}],"focus":402,"kindLabel":"Fallacy / sophism"},{"type":"ref","w":"baum","r":4185,"cite":"Reflexion 4185","pages":"AA 17:448–449","src":"locus","loc":"ZuM § 224","paras":[224],"work":"Baumgarten, Metaphysica","phRaw":"λ? (κ1?)","dating":{"raw":"λ? (κ1?)","uncertain":true,"span":false,"phases":[{"sym":"λ","years":"Ende 1769 – Herbst 1770","from":1769,"to":1770,"inherited":false,"note":"Ende 1769 - Herbst 1770. Eine Anzahl von Bemerkungen aus λ spiegelt den Standpunkt der Inauguraldissertation (am 21. August 1770 von Kant vertheidigt) wieder. Fest datirt sind ausserdem der Entwurf zum Brief an Suckow vom 15. December 1769 (X 78-9) auf dem losen Blatt Nr. 4 aus dem v. Duisburg’schen Nachlass und auf S. 432b der »Metaphysica« die Abschrift einer Preisfrage, die am 15. Februar 1770 vom Stolpischen Legat in Leyden gestellt und im Februar 1770 im »Journal des Sçavans«, am 17. März 1770 in den »Göttingischen Anzeigen von gelehrten Sachen« veröffentlicht wurde. […] Tinte: schwarz-braun oder schwarz mit bräunlichem Schimmer."},{"sym":"κ¹","years":"1769","from":1769,"to":1769,"inherited":true,"note":"1769. Eine grössere Zahl von Reflexionen aus dieser Phase kann ihres Inhalts wegen nur zwischen dem Aufsatz »Von dem ersten Grunde des Unterschiedes der Gegenden im Raume« (Anfang 1768) und der Inauguraldissertation vom Jahre 1770 entstanden sein: Raum und Zeit sind nicht mehr etwas Objectives, aber auch noch nicht Formen der Sinnlichkeit, sondern »reine Begriffe der Anschauungen«, »conceptus intellectus puri«. Auf Grund des Briefes an Lambert vom 2. Sept. 1770 kann man den Terminus ad quem mit grosser Wahrscheinlichkeit noch genauer auf October 1769 bestimmen. […] Es bleibt also für die Phase κ nur das Jahr 1769 übrig (vgl. meine Kant-Studien 1895 S. 109ff.). Tinte: theils schwarz, theils röthlich-braun."}],"lo":1769,"hi":1770,"label":"c. 1769–1770 (uncertain)","era":"1760","undatedPhase":false,"prose":false},"text":"Plura coniuncta faciunt compositum. Omnia coniuncta totum. Ergo non omne compositum (e.g. aeternitas) est totum, qvanquam omne totum est compositum. Vox omnia sumitur vel generice vel singulariter. De omnibus numeris enunciamus generice in Arithmetica, et omnes lineas rectas cogitamus in Geometria generice, sed [sin] omnes et singulas cogitare non licet.\nIn notione rationali compositi terminus analyseos est simplex et terminus syntheticus totum. Prior est terminus a priori, hic a posteriori.\nVt cogitentur omnia distributive, necesse est, ut simul vnitates ponantur. ideoque aeternitas non est totum.\nIn qvolibet toto itaque cogitanda sunt: Materia, forma et totalitas.","ranges":[[0,148]],"secs":[{"n":223,"text":"Substantia in substantiam propius influens illi praesens@@1@@ est, et proxime praesentes sibi invicem substantiae, se contingunt, sunt contigua@@2@@, ut adeo sit praesentia@@3@@ influxus propior, et immediata praesentia mutua, s. immediatus conflictus, contactus@@4@@. Quatenus aliquid in aliud non influit, nec ab eo patitur, propius, absens@@5@@ ab illo dicitur."},{"n":224,"text":"Ens compositum (stricte et simpliciter dictum)@@1@@ est totum partium extra partes, ens non compositum simplex (simpliciter et rigorose dictum)@@2@@ est. Ens compositum latius dictum@@3@@ est quicquid partes habet, et simplex comparative@@4@@ minus compositum."},{"n":225,"text":"Partes compositorum vel singulae et simul sumptae sunt accidentia, vel aliquae compositorum partes sunt substantiae, §. 10, 191. Si prius est, ens compositum est accidens, §. 224, 155. Posterius est ens compositum strictius dictum (reale)@@1@@."}],"focus":224,"kindLabel":"Categorical syllogism"},{"type":"ref","w":"baum","r":6311,"cite":"Reflexion 6311","pages":"AA 18:607–612","src":"none","paras":[],"work":"Baumgarten, Metaphysica","phRaw":"1790","dating":{"raw":"1790","uncertain":false,"span":false,"phases":[],"lo":1790,"hi":1790,"label":"1790 (dated in words by the edition)","era":"1790","undatedPhase":false,"prose":true},"text":"-Sch. XI 1 S. 265-7. Hb. IV S. 502f. Ki. L S. 197f.\nWiderlegung des problematischen Idealismus.\nMan theilt den Idealismus in den problematischen (den des Cartesius) und in den dogmatischen (den des Berkeley). Der letzte leugnet das Daseyn aller Dinge außer dem des Behauptenden, der erste hingegen sagt blos, daß man dasselbe nicht beweisen könne. Wir wollen uns hier blos auf den problematischen Idealismus einschränken.\nDer problematische Idealist giebt zu, daß wir Veränderungen durch unsern innern Sinn wahrnehmen, er leugnet aber, daß man darum auf das Daseyn äußerer Gegenstände im Raum schließen könne, weil der Schluß von einer Wirkung auf eine bestimmte Ursache nicht gültig sey. — Veränderung des innern Sinnes oder innere Erfahrung wird also von dem Idealisten zugegeben, und wenn man ihn daher widerlegen will, so kann dies nicht anders geschehen, als daß man ihm zeigt, diese innere Erfahrung, oder welches einerlei ist, das empirische Bewußtseyn meines Daseyns setze äußere Wahrnehmung voraus.\nMan muß hier das transscendentale und empirische Bewußtseyn wohl unterscheiden; jenes ist das Bewußtseyn Ich denke und geht aller Erfahrung vorher, indem es sie erst möglich macht. Dies transscendentale Bewußtseyn liefert uns aber keine Erkenntniß unserer Selbst; denn Erkenntniß unserer Selbst ist die Bestimmung unseres Daseyns in der |\nZeit und soll dies geschehen, so muß ich meinen innern Sinn afficiren. Ich denke z.B. über die Gottheit nach und verbinde mit diesen Gedanken das transscendentale Bewußtseyn (denn sonst würde ich nicht denken können), ohne mich mir dabei doch in der Zeit vorzustellen, welches geschehen müßte, wenn ich mir dieser Vorstellung durch meinen innern Sinn bewußt wäre. Geschehen Eindrücke auf meinen innern Sinn, so setzt dies voraus, daß ich mich selbst afficire (ob es gleich uns unerklärbar ist, wie dies zugeht) und so setzt also das empirische Bewußtseyn das transscendentale voraus.\nIn unserm innern Sinn wird unser Daseyn in der Zeit bestimmt und setzt also die Vorstellung der Zeit selbst voraus; in der Zeit aber ist die Vorstellung des Wechsels enthalten; Wechsel setzt etwas Beharrliches voraus, woran es wechselt und welches macht, daß der Wechsel wahrgenommen wird. Die Zeit selbst ist zwar beharrlich, aber sie kann allein nicht wahrgenommen werden, folglich muß es ein Beharrliches geben, woran man den Wechsel in der Zeit wahrnehmen kann. Dies Beharrliche können wir selbst nicht seyn, denn wir sind eben als Gegenstand des innern Sinnes durch die Zeit bestimmt; es kann also das Beharrliche blos in dem, was durch den äußern Sinn gegeben wird, gesetzt werden. So setzt also Möglichkeit der innern Erfahrung Realität des äußern Sinnes voraus. Denn gesetzt man wollte sagen, auch die Vorstellung des durch den äußern Sinn gegebenen Beharrlichen sey blos durch den innern Sinn gegebene Wahrnehmung, die nur durch die Einbildungskraft als durch den äußern Sinn gegeben vorgestellt wird, so würde es doch überhaupt (wenn auch gleich nicht für uns) möglich seyn müssen, sich derselben als zum innern Sinn gehörig, bewußt zu werden; aber dann würde die Vorstellung des Raumes in eine Vorstellung der Zeit verwandelt werden, d.h. es würde möglich seyn, den Raum sich als eine Zeit (nach einer Dimension) vorzustellen, |\nwelches sich selbst widerspricht. Es hat also der äußere Sinn Realität, weil ohne ihn der innere Sinn nicht möglich ist. — Hieraus scheint zu folgen, daß wir unser Daseyn in der Zeit nur immer im Commercio erkennen.","ranges":[[1931,2700]],"secs":[],"kindLabel":"Informal inference"}],"defs":[{"type":"lec","id":"blomberg-s11-019","date":{"label":"ca. 1771","era":"1770"},"cite":"Blomberg Logic","pages":"AA 24:281","crumb":"Blomberg › Der 9 te Abschnitt. Von den gelährten Urtheilen","prev":["Wo der Autor von den Anschauenden Urtheilen redet. Ein anschauendes Urtheil ist eigentlich ein einzeles Urtheil, in so fern es unmittelbahr erkanndt wird, ein Judicium discursivum aber ist ein geschloßen Urtheil. alle unmittelbahre Urtheile aber sind nur bloß deswegen anschauend, weil sie unmittelbahr erkannt werden, in so fern die Form derselben Sensitiv ist, denn sonsten, wenn die Form rational ist, so sind die unmittelb are Urtheile dennoch gar nicht anschauende Urtheile, denen anschauenden Urtheilen könnten nur die Discursive Contradistinguiret werden, und die alten nannten die allgemeine","Urtheile Discursiva, die einzelne aber intuitiva und so wollen wir es auch hier nehmen. Dieses war nun von den Anschauenden oder Erfahrungs Urtheilen. ob nun ein Urtheil ein Erfahrungs Urtheil sey, oder nicht, das gehört der Metaphysic zu untersuchen zu. Die logic betrachtet die Urtheile gar nicht, in so fern sie gegeben sind, wie die Metaphysic sonderen in so fern sie dieselbe vergleichen soll. Die Logic zeigt nur, ob die Urtheile allgemeine, oder besondere sind, und so beschäftiget sie sich nur mit der opposition, und der Identitaet. Alle Sätze sind entweder theoretisch, oder practisch. Die erste sind solche die nur bloß das Verhältniß der Begrife zu anderen Begrifen zeigen, die andere aber zeigen das Verhältniß der Handlung zu Begrifen an. Beide Sätze sind aber erweislich, oder unerweislich. Die Theoretisch erweisliche Sätze, wenn sie durch ein ratiocinium polysyllogisticum entstehen heißen Theoremata. Ein jeder erweißlicher Satz aber, der nur monosyllogistisch ist, heißt ein Corollarium. ein practisch erweislicher Satz ist ein Problema ein practisch unerweislicher Satz aber ein Postulatum. Bey allen Theoretisch erweislichen Sätzen ist der Satz selbst das Theorema, der beweiß des Satzes aber die Demonstration, die Handlung, die dabey gethan werden soll, heißt die Quaestio Die Sätze, nach welchen sie erkannt wird, die Resolution derselben. ein Lemma ist ein Satz, der wohl erweislich ist, aber nicht in dieser, sonderen in einer anderen disciplin, aus welcher er genommen. mit diesem muß man sich sehr in acht nehmen, damit man nicht etwas annimmt, und es schon für bewiesen in einer anderen Wißenschaft ausgiebt, da es doch in derselben noch gar nicht bewiesen ist ja man findet oft etwas in den Autoren das sie im Anfang annehmen, welches sie am Ende zu beweisen versprechen, allein der Beweiß ist vergeßen. Scholia sind Sätze, die einem Lehrgebäude gar nicht als essentialia, sonderen nur als accidentalia hinzugesezet werden."],"text":"Ein jeder Schluß ist überhaupt ein Urtheil, nur mit dem Unterschiede: ist das Urtheil Mittelb ar so ist es ein Vernunft-, oder ein mittelbarer Schluß. ist aber das Urtheil unmittelbahr, so ist der Schluß nur ein Verstandes Schluß es wird nemlich eins aus dem anderen geurtheilt absque medio Termino alsdenn ist das Urtheil, oder auch die Conclusio immediata, oder eins wird aus dem anderen geschloßen per medium Terminum, und alsdenn ist der Schluß mediate, oder auch ein Vernunft Schluß. wir wollen nun nur allein mittelbahre Schlüße erwegen. was ihre Entstehungs Art anbelangt, so ist diese 5erley, denn entweder können sie entstehen","next":["1) per Judicia aequipollentia oder","2) per Judicia Subalternata, oder"],"ranges":[[70,229]],"dtype":"contrast"},{"type":"lec","id":"busolt-s26-035","date":{"label":"ca. 1789/90","era":"1780"},"cite":"Busolt Logic","pages":"AA 24:670","crumb":"Busolt › Von den Hypothetischen und Disiunktiven Urtheilen","prev":["Qualitaet nulla in logicis dicitur, vbi ignorantiae scrutantis proceßio, pro ipsius rei definitione causaeque inventione sumitur e.g. quae nam est causa propagationis animalium, plantarumque? resp.: vis plastica. Hier definire ich idem per idem, und ist eben so viel gesagt, als: Die Ursache dieser Wirkung ist verborgen. Was gewinnt nun eine Erkentniß nach solcher An twort?","Anmerkung Qualitas occulta est Tautologica phaenomenorum explicatio et enim subiectum respicit, non Obiectum. Eiusmodi est ideosyncrasia Lamberti, cuius ait hominis sibi propinquam habitum cane et angue aversantem. Et vero ideosyncrasia quali, quae in hoc illudere indiuiduum influit. Von eben dieser Art ist das in neueren Zeiten sogenannte Wort bon sens (gesunder Verstand). Denn wer hat eine Definition von Sensu communi gegeben, es sey denn Tautologisch? selbst die Krusianische Philosophie beruhet auf einem Grundsaz der nichts anders als Qualitas occulta ist, nehmlich was ich nicht anders als Wahr befinde, das ist wahr. Die newtonianische Philosophie die sich auf den Grundsaz der Wechßelseitigen Sphäre im Zusammenhange des Weltlaufs gründet nimmt das Wort vis attractiva für qualitatem occultam im Physischen Sinn an, das heißt blos als ein Geständniß der Unwißenheit der wahren Ursachen, nicht aber für die wahre Ursache selbst."],"text":"Wird ein Urtheil aus einem andern gefolgert, ohne ein zwischen Urtheil, so ist dies ein Verstandesschluß, per iudicium intermedium ein Vernunftschluß, z.B. Alle Menschen sind Sterblich, also ist auch Caius sterblich. Hier ist nun Caius ein Begrif, den ich vorher nicht hatte, es ist also falsch geschloßen, und ich muß nur mittelbar schließen, dadurch, daß ich mir einen Begriff von Caius mache. Zur consequentia immediata muß iudicium praeuium und exclusio einen Begriff erhalten. Sie sind nicht anders unterschieden als nur in der Qualitaet, Quantitaet und Relation. Die Consequentiae immediatae geschehen","next":["a.) Per iudicia aequipollentia","b.) Per iudicia subalternata."],"ranges":[[0,149]],"dtype":"contrast"},{"type":"lec","id":"blomberg-s12-001","date":{"label":"ca. 1771","era":"1770"},"cite":"Blomberg Logic","pages":"AA 24:282","crumb":"Blomberg › Der 10 te Abschnitt. Von den gelahrten Vernunft Schlüßen","prev":[],"text":"Vernunft-Schlüße sind Urtheile, welche mittelbahr geschehen vermittelst eines medii Termini. Es giebt auch nemlich, wie vorhero gesagt, gewise Urtheilen, und Consequenzen, die wir immediatas genannt haben, diese waren indemonstrabel. wir nannten auch diese Folgen eines Urtheils aus anderen Urtheilen die unerweislich sind, nicht einen Vernunft-, sonderen einen Verstandes Schluß. allein von der anderen Seite giebt es doch noch gewiße Consequenzen aus anderen mittelbahren Urtheilen, und diese sind immer erweislich. Es giebt ungewiße Scheinschlüße, die nicht Vernunft Schlüße, sonderen nur bloße Themata zu denselben sind, und dergleichen sind die sogenannte Ratiocinia Disjunctiva, und Hypothetica, oder auch Speciosa. von diesen Schlüßen, die nur Themata zu Vernunft Schlüßen sind, wollen wir hier gar nicht handelen, sonderen von denen Vernunft Schlüßen selbsten allein.","next":["Wenn zwei Begrife zusammen gesezet werden, der eine das Merckmahl des anderen ist, so wird in diesen Begrifen ein gewißes Verhältniß gesezet. Dieses Verhältniß kann nun unmittelbar vorgestellet werden, und denn ist es ein Judicium. wenn es aber per notam intermediam geschieht, so ist es ein Ratiocinium. oder der Vernunft Schluß ist nichts anders, als die Vergleichung einer nota remota mit der Sache selbst, vermittelst einer Nota intermedia. Das mittelbare Verhältniß einer Nota remota ist immer remota in Absicht der Sache, aber auch nota proxima von der Nota intermedia, und also eine Nota rei ipsius, mit dem gegebenen Begrif, das ist ein Judicium medium, oder ein ratiocinium.","Ein adaequater Schluß bestehet in einem Vernunft Schluß, dessen Regel diese ist: nota notae rei est nota rei ipsius und dieses ist auch die Grundregel aller Syllogistik, und zugleich der gantze Unterschied eines Urtheils von einem Vernunft-Schluß. zu einem Judicio nemlich gehört ein unmittelbares klares Merckmal, zu einem Ratiocinio aber noch ein mittelbares klares Merckmal. Folglich ist das Ratiocinium das Verhältniß der nota remota durch eine nota mediata, vel intermedia zu einem gewißen gegebenen Begrif von einer Sache. in einem Ratiocinio kommen also diese 3 Handlungen vor: 1 mo wird die Nota proxima oder intermedia mit der nota remota verglichen, 2 wird die Nota proxima mit der Sache verglichen, et 3 tio wird die Nota remota mit der Sache selbst verglichen. Die nota intermedia wird auch der medius Terminus genannt. Dieweil nun in jedem Urtheil das Praedicat den majorem Terminum Constituiert, so können wir sagen: in jedem Vernunft Schluß giebet es 3 Termini. 1. den Satz, den ich vermittelst der nota intermedia erkennen soll, 2: die Nota remota und 3 tens den Terminus medius, oder die nota intermedia, welche den grund des Verhältnißes der Sache zur nota remota in sich enthält. und diese machen die 3 Terminos aus, nemlich Majorem, minorem et conclusionem. in jedem Vernunft Schluße wird 1. der Terminus major in dem Termino medio, oder die nota proxima mit der nota remota, 2 der Terminus medius mit dem minori, oder dem Subject, und endlich 3: der minor mit dem Majori, oder dem Praedicat verglichen."],"ranges":[[0,92]],"dtype":"define"},{"type":"lec","id":"wiener-s12-001","date":{"label":"1780ff.","era":"1780"},"cite":"Wiener Logic","pages":"AA 24:938","crumb":"Wiener › Von den Verstandes-Schlüssen","prev":[],"text":"Schluß aus Urtheil anders. mittelbar wo noch Begriffe die nicht im Urtheile liegen z.B. alle Körper theilbar, weil zusammengesetzt; aber alle Körper theilbar folglich auch einige consequentia immediata weil der Materie nach eins, nur Form verschieden, z.B. alle Menschen sterblich folglich einige sterbliche Dinge Menschen oder kein Mensch unsterblich Hier conclusum und judicium concludens eines. Auch Verstandesschluß vom ratiocinio zu unterscheiden wo judicium Vernunft brauche weil materialiter unterschieden z.B. alle Menschen sterblich folglich auch Cajus.","next":["Judicia immediata sind 1) per judicia aequipollentia einige Menschen sind nicht7 ° tugendhaft folglich sind nicht alle Menschen tugendhaft; nichts ist ohne Grund und alles hat seinen Grund sind Substitutionen. 2) Subalternata auch nur Form nach verschieden z.B. alle Menschen sind sterblich folglich einige Quantität unterschieden. 3) per judicia opposita einige Menschen sind gelehrt einige nicht Qualität verschieden; einige Menschen nicht sterblich, alle Menschen sterblich Quantität und Qualität sind a) contradictoria wenn eins allgemein bejahet oder verneinet und das andere partikulär verneinet oder bejahet d.i. die eigentliche Opposition wo die Bejahung des einen das andere aufhebt affirmando unum negat alterum und umgekehrt. (So Beweise apagogisch indirecte nur sehe man ob wirklich contradictoria opposita, in Metaphysik stößt man immer bei Gegentheil","auf Ungereimtheiten). Manche beweisen weil gegentheil auf Ungereimtheit führt und triumphiren aber opponent kan oft das nämliche. b) Subcontrarie opposita einige Menschen sind gelehrt, einige nicht Beide vielleicht wahr. Qualität verschieden, Quantität eins. Hier kan nicht indirecte geschlossen werden. Hier können beide wahr nicht beide falsch seyn also richtig der Schluß wenn das eine falsch ist das andere wahr nicht umgekehrt. c) contrarie opposita beide allgemein nur Qualität verschieden: alle Menschen gelehrt kein Mensch gelehrt, beide können falsch nicht wahr seyn sind das Gegentheil vom vorigen."],"ranges":[[0,82]],"dtype":"contrast"},{"type":"ref","w":"meier","r":3197,"cite":"Reflexion 3197","pages":"AA 16:707–708","src":"locus","loc":"ZuL §. 354","paras":[354],"work":"Meier, Auszug","phRaw":"ψ−θ","dating":{"raw":"ψ−θ","uncertain":false,"span":true,"phases":[{"sym":"ψ","years":"um 1776–78","from":1776,"to":1778,"inherited":false,"note":"ψ u. φ: um 1776-8, sicher später als κ-τ, früher als θ (Stellungsindicien). Eine Bemerkung auf S. VII der »Metaphysica« stammt aus der Zeit des Briefes an Herz vom 24. Nov. 1776 (X 186), eine andere (ebenda auf S. XXXIV) muss vor dem Tode Lamberts (25. Sept. 1777) geschrieben sein. Eine Reihe weiterer Reflexionen weisen durch ihren Inhalt auf dieselbe Zeit. Die Schrift ist in ψ wie in φ klein, eng, gedrängt, oft recht flüchtig. Der Buchstabe φ ist, vor allem in den Praefationes und der Synopsis der »Metaphysica«, verwandt, um die Bemerkungen zu kennzeichnen, die zwischen den Textzeilen stehn; ψ füllt hier, allein oder in Verbindung mit andern Phasen, die Ränder […]. Die Tinte ist röthlich-braun (theils dunkel, theils hell), mitunter auch blass-braun."},{"sym":"θ","years":"die 1780er Jahre","from":1780,"to":1789,"inherited":false,"note":"θ für sich allein (ohne Exponenten) zeigt an, dass eine genauere Datirung nicht möglich ist, und repräsentirt dann den ganzen Zeitraum, für den es gilt — die 80er Jahre."}],"lo":1776,"hi":1789,"label":"c. 1776–1789","era":"1770","undatedPhase":false,"prose":false},"text":"Vernunftschluß ist der mittelbare Schlus eines Satzes aus einer allgemeinen Regel.\nDer vermittelnde Satz ist (g subsumtion) der, so etwas unter der Bedingung der Regel subsumirt. Materie und Form —\nSie sind categorisch, hypothetisch oder disjunctiv. Jene allein haben maiorem, minorem und medium terminum und sind die materie der andern.","ranges":[[0,82]],"secs":[{"n":353,"text":"Wenn einige wahre Urtheile den hinreichenden Grund der Wahrheit eines andern enthalten, so sind sie mit einander verbunden §.15, und in diesem Verhältnisse wah rer  Urtheile bestehet der Zusammenhang der Wahrheiten (nexus veritatum)."},{"n":354,"text":"Ein Vernunftschluss (ratiocinium) ist eine deutliche Vorstellung des Zusammenhangs der Wahrheiten; welcher, wenn er in einem höhern Grade vollkommen ist, ein gelehrter, oder ein logischer Vernunftschluss genennet wird (ratiocinium logicum, eruditum)."},{"n":355,"text":"In einem Vernunftschlusse leiten wir eine Wahrheit aus andern Wahrheiten her §.353, 354. Und da also diese andern Wahrheiten die Beweisthümer der erstern sind §.191, so machen wir einen Vernunftschluss, wenn wir eine Wahrheit aus ihren Beweisthümern deutlich herleiten. Folglich ist, die deutliche Vorstellung der Folge eines Beweises, ein Vernunftschluss §.191."}],"focus":354,"dtype":"define"},{"type":"ref","w":"meier","r":3200,"cite":"Reflexion 3200","pages":"AA 16:709","src":"locus","loc":"Gegenüber von L §. 352","paras":[352],"work":"Meier, Auszug","phRaw":"θ","dating":{"raw":"θ","uncertain":false,"span":false,"phases":[{"sym":"θ","years":"die 1780er Jahre","from":1780,"to":1789,"inherited":false,"note":"θ für sich allein (ohne Exponenten) zeigt an, dass eine genauere Datirung nicht möglich ist, und repräsentirt dann den ganzen Zeitraum, für den es gilt — die 80er Jahre."}],"lo":1780,"hi":1789,"label":"c. 1780–1789","era":"1780","undatedPhase":false,"prose":false},"text":"1) Verstandesschlüße (s sind unmittelbare Schlüsse) schließen vom allgemeinen aufs besondere oder vom besonderen aufs besondere (s aber unmittelbar), niemals aber vom besonderen aufs allgemeine, weil sie bestimmende Urtheile geben sollen.\n2) Schlüsse der Urtheilskraft gehen vom besonderen zum (s empirisch-) allgemeinen (s sind Arten, von den individuis zu generibus fortzuschreiten.), von einigen Dingen, die zu einer Gewissen Art gehören, auf alle, oder von einigen Eigenschaften, darin Dinge von einerley Art zusammen stimmen, auf die übrige, so fern sie zu demselben Princip gehören. Es sind nichts als Arten, aus besonderen Begriffen zu allgemeinen zu kommen, also der Reflectirenden (s nicht bestimmenden) Urtheilskraft, mithin nicht das obiect zu bestimmen, sondern nur die Art [über] der Reflexion über dasselbe, um zu seiner Kenntnis zu gelangen. (s sind Schlüsse, zu Vorläufigen, nicht zu bestimmenden Urtheilen zu gelangen. — Analogie und Induction.)\nSind die Schlüsse der Urtheilskraft unmittelbare Schlüsse? Nein, es liegt ihnen ein Princip der Urtheilskraft zum Grunde: daß nämlich vieles nicht ohne Gemeinschaftlichen Grund in einem Zusammenstimmen werde, daß also das, was ihm so zukommt, aus einem gemeinschaftlichen Grunde werde nothwendig seyn. (s — Analogie, Induction.)\n(s 3. Vernunftschlüsse sind (g mittelbare) Schlüsse vom Allgemeinen zum Besondern per iudicium intermedium.)","ranges":[[0,1400]],"secs":[{"n":351,"text":"Wenn man in den besonders verneinenden Urtheilen, die Verneinung zum Prädicate setzt, so werden sie besonders bejahende Urtheile §.294, und können also alsdenn schlechtweg umgekehrt werden §.348."},{"n":352,"text":"Ein allgemein bejahendes Urtheil wird contraponirt (contrapositio), wenn man sein Prädicat in einen verneinenden Begriff verwandelt, und das vorige Subject von demselben allgemein verneinet. Alle wahren allgemein bejahenden Urtheile können contraponirt werden, das ist, wem ihr Prädicat nicht zukommt, denen kommt auch ihr Subject nicht zu. Widrigenfalls müsste einigen Dingen das Prädicat zuwider sein, und das Subject zukommen §.343. Man könnte also von einigen unter dem Subjecte enthaltenen das Prädicat mit Wahrheit verneinen §.295. Also wäre das allgemein bejahende Urtheil falsch §.302, und das ist ungereimt.von den gelehrten Vernunftschlüssen."},{"n":353,"text":"Wenn einige wahre Urtheile den hinreichenden Grund der Wahrheit eines andern enthalten, so sind sie mit einander verbunden §.15, und in diesem Verhältnisse wah rer  Urtheile bestehet der Zusammenhang der Wahrheiten (nexus veritatum)."}],"focus":352,"dtype":"contrast"},{"type":"lec","id":"blomberg-s12-003","date":{"label":"ca. 1771","era":"1770"},"cite":"Blomberg Logic","pages":"AA 24:283","crumb":"Blomberg › Der 10 te Abschnitt. Von den gelahrten Vernunft Schlüßen","prev":["Vernunft-Schlüße sind Urtheile, welche mittelbahr geschehen vermittelst eines medii Termini. Es giebt auch nemlich, wie vorhero gesagt, gewise Urtheilen, und Consequenzen, die wir immediatas genannt haben, diese waren indemonstrabel. wir nannten auch diese Folgen eines Urtheils aus anderen Urtheilen die unerweislich sind, nicht einen Vernunft-, sonderen einen Verstandes Schluß. allein von der anderen Seite giebt es doch noch gewiße Consequenzen aus anderen mittelbahren Urtheilen, und diese sind immer erweislich. Es giebt ungewiße Scheinschlüße, die nicht Vernunft Schlüße, sonderen nur bloße Themata zu denselben sind, und dergleichen sind die sogenannte Ratiocinia Disjunctiva, und Hypothetica, oder auch Speciosa. von diesen Schlüßen, die nur Themata zu Vernunft Schlüßen sind, wollen wir hier gar nicht handelen, sonderen von denen Vernunft Schlüßen selbsten allein.","Wenn zwei Begrife zusammen gesezet werden, der eine das Merckmahl des anderen ist, so wird in diesen Begrifen ein gewißes Verhältniß gesezet. Dieses Verhältniß kann nun unmittelbar vorgestellet werden, und denn ist es ein Judicium. wenn es aber per notam intermediam geschieht, so ist es ein Ratiocinium. oder der Vernunft Schluß ist nichts anders, als die Vergleichung einer nota remota mit der Sache selbst, vermittelst einer Nota intermedia. Das mittelbare Verhältniß einer Nota remota ist immer remota in Absicht der Sache, aber auch nota proxima von der Nota intermedia, und also eine Nota rei ipsius, mit dem gegebenen Begrif, das ist ein Judicium medium, oder ein ratiocinium."],"text":"Ein adaequater Schluß bestehet in einem Vernunft Schluß, dessen Regel diese ist: nota notae rei est nota rei ipsius und dieses ist auch die Grundregel aller Syllogistik, und zugleich der gantze Unterschied eines Urtheils von einem Vernunft-Schluß. zu einem Judicio nemlich gehört ein unmittelbares klares Merckmal, zu einem Ratiocinio aber noch ein mittelbares klares Merckmal. Folglich ist das Ratiocinium das Verhältniß der nota remota durch eine nota mediata, vel intermedia zu einem gewißen gegebenen Begrif von einer Sache. in einem Ratiocinio kommen also diese 3 Handlungen vor: 1 mo wird die Nota proxima oder intermedia mit der nota remota verglichen, 2 wird die Nota proxima mit der Sache verglichen, et 3 tio wird die Nota remota mit der Sache selbst verglichen. Die nota intermedia wird auch der medius Terminus genannt. Dieweil nun in jedem Urtheil das Praedicat den majorem Terminum Constituiert, so können wir sagen: in jedem Vernunft Schluß giebet es 3 Termini. 1. den Satz, den ich vermittelst der nota intermedia erkennen soll, 2: die Nota remota und 3 tens den Terminus medius, oder die nota intermedia, welche den grund des Verhältnißes der Sache zur nota remota in sich enthält. und diese machen die 3 Terminos aus, nemlich Majorem, minorem et conclusionem. in jedem Vernunft Schluße wird 1. der Terminus major in dem Termino medio, oder die nota proxima mit der nota remota, 2 der Terminus medius mit dem minori, oder dem Subject, und endlich 3: der minor mit dem Majori, oder dem Praedicat verglichen.","next":["Also zu schließen erforderet nur die Synthetische Art der Vernunft, diese erforderet nun immer, daß man vom allgemeinen zum besonderen herabgehen soll, verkehret man dieses um, so ists wieder die Vernunft, und es wird alsdenn gleich ein Sprung begangen. und dahero muß auch major propositio immer, oder das Praedicat der conclusion zu erst kommen, oder zu erst muß ich per notam remotam, zur nota proxima gehen, denn muß ich wieder von der Nota proxima zur Sache, und endlich von der Sache zur nota remota gehen. Das ist die Synthesis der Vernunft, und läßt man diese aus den Augen, so beobachtet man auch nicht die Ordnung. in Jedem Vernunft Schluße giebt es also gewiße Terminos, deren müßen nun nicht mehr als 3 vorhanden seyn, und es finden auch in jedem rechten Vernunft Schluße nicht mehr als 3 iudicia Statt. Die 2 ersten heißen die Praemißen, das 3 te Urtheil aber heißt die Conclusion. Die Praemißen nun machen die Materie, die Conclusion aber die Form der Vernunft Schlüße aus, mithin wird die richtige Form eines Vernunft-Schlußes einzig, und allein beruhen auf der richtigen Folge der Conclusion. in beiden Schlüßen nun komt immer der medius Terminus oder die Nota intermedia (aber gar nicht in der Consequens selbst) vor. Jeder Vernunft-Schluß ist nichts anders, als eine Vorstellung eines Merckmals vermittelst eines Termini medii. Zu einem Vernunft Schluß gehöret, daß ein Merckmal einem anderen Merckmale der Sache als einer Notae nota untergeordnet werde. ich vergleiche also in einem Vernunft Schluße die Nota remota mit der Nota proxima, denn die Sache mit der nota proxima, und endlich auch die nota remota mit der Sache selbst. Alle Form der Vernunft-Schlüße ist nur zweyfach, und mehrere finden auch nicht statt, denn entweder ist das Urtheil Unmittelbar, oder Mittelbar","Die Grund Regel aller bejahenden Schlüße sind diese:"],"ranges":[[0,115]],"dtype":"principle"},{"type":"ref","w":"meier","r":3217,"cite":"Reflexion 3217","pages":"AA 16:717","src":"locus","loc":"ZuL §. 363 »dictum de omni et nullo«","lemma":"dictum de omni et nullo","paras":[363],"work":"Meier, Auszug","phRaw":"ψ−θ","dating":{"raw":"ψ−θ","uncertain":false,"span":true,"phases":[{"sym":"ψ","years":"um 1776–78","from":1776,"to":1778,"inherited":false,"note":"ψ u. φ: um 1776-8, sicher später als κ-τ, früher als θ (Stellungsindicien). Eine Bemerkung auf S. VII der »Metaphysica« stammt aus der Zeit des Briefes an Herz vom 24. Nov. 1776 (X 186), eine andere (ebenda auf S. XXXIV) muss vor dem Tode Lamberts (25. Sept. 1777) geschrieben sein. Eine Reihe weiterer Reflexionen weisen durch ihren Inhalt auf dieselbe Zeit. Die Schrift ist in ψ wie in φ klein, eng, gedrängt, oft recht flüchtig. Der Buchstabe φ ist, vor allem in den Praefationes und der Synopsis der »Metaphysica«, verwandt, um die Bemerkungen zu kennzeichnen, die zwischen den Textzeilen stehn; ψ füllt hier, allein oder in Verbindung mit andern Phasen, die Ränder […]. Die Tinte ist röthlich-braun (theils dunkel, theils hell), mitunter auch blass-braun."},{"sym":"θ","years":"die 1780er Jahre","from":1780,"to":1789,"inherited":false,"note":"θ für sich allein (ohne Exponenten) zeigt an, dass eine genauere Datirung nicht möglich ist, und repräsentirt dann den ganzen Zeitraum, für den es gilt — die 80er Jahre."}],"lo":1776,"hi":1789,"label":"c. 1776–1789","era":"1770","undatedPhase":false,"prose":false},"text":"Nota notae est nota rei ipsius (g ist das principium der categorischen schlüsse): ist dieses dictum und zugleich der Grund der prima figura.","ranges":[[0,140]],"secs":[{"n":362,"text":"Es ist unmöglich, dass etwas zu gleicher Zeit sei, und nicht sei. Oder, wenn von einem Dinge ein und eben dasselbe zu gleicher Zeit bejahet oder verneinet wird, so ist es Nichts. Dieser Satz heisst der Satz des Widerspruchs (principium contradictionis), und er ist das erste innerliche Kennzeichen der Wahrheit §.95, auf welchem alle Folgen der Vernunftschlüsse beruhen müssen, wenn sie wahr sein sollen §.361."},{"n":363,"text":"Was von einem Begriffe mit Wahrheit allgemein bejahet oder verneinet werden kann, das kann auch mit Wahrheit von einem jedweden andern Begriffe bejahet oder verneinet werden, welcher unter jenen gehört §.342. Widrigenfalls müssten zwei widersprechende Urtheile zugleich wahr sein §.343, und das ist wider den Satz des Widerspruchs §.362. Dieser Satz wird, der Schluss von dem Allgemeinen auf das Besondere, genannt (dictum de omni et nullo)."},{"n":364,"text":"Wenn der hinreichende Grund wahr ist, so ist auch seine Folge wahr, widrigenfalls wäre, der hinreichende Grund, kein hinreichender Grund §.15, welches wider §.362. Folglich, wenn die Folge falsch ist, so ist auch der hinreichende Grund falsch, weil sonst der hinreichende Grund ohne Folge sein könnte. Dieser Schluss heisst, der Schluss von dem hinreichenden Grunde auf seine Folge (a ratione sufficiente ad rationatum valet consequentia)."}],"focus":363,"dtype":"principle"}]};

// ── helpers ──
const eraOf=y=>y==null?'none':y<1760?'1750':y<1770?'1760':y<1780?'1770':y<1790?'1780':'1790';
function el(t,c,x){const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
const ABBR=/(?:z\.[EB]|d\.i|e\.g|u\.s\.w|etc|vgl|bzw|sc|id est|AA|Z\.E|Z\.B|[A-Z])$/;
// split into sentences, keeping offsets
function sentences(text){
  const out=[]; let start=0;
  const re=/([.?!])(\s+)(?=[A-ZÄÖÜ"»(\[])/g; let m;
  while((m=re.exec(text))){ const end=m.index+1; const before=text.slice(start,end);
    if(ABBR.test(before.slice(0,-1))) continue;
    out.push([start,end]); start=m.index+m[0].length; }
  if(start<text.length) out.push([start,text.length]);
  return out;
}
function markup(parent,text,a,b,ranges,lemma){
  // render text[a,b) with <mark> for ranges (and underline for lemma)
  const cuts=new Set([a,b]); ranges.forEach(r=>{ if(r[1]>a&&r[0]<b){cuts.add(Math.max(a,r[0]));cuts.add(Math.min(b,r[1]));} });
  const L=[]; if(lemma){ const i=text.indexOf(lemma); if(i>=0){ L.push([i,i+lemma.length]); cuts.add(i);cuts.add(i+lemma.length);} }
  const pts=[...cuts].filter(x=>x>=a&&x<=b).sort((x,y)=>x-y);
  for(let n=0;n<pts.length-1;n++){ const s=pts[n],e=pts[n+1]; const t=text.slice(s,e);
    const inM=ranges.some(r=>s>=r[0]&&e<=r[1]); const inL=L.some(r=>s>=r[0]&&e<=r[1]);
    let node=document.createTextNode(t);
    if(inL){const u=el('u','lemma'); u.appendChild(node); node=u;}
    if(inM){const mk=el('mark'); mk.appendChild(node); node=mk;}
    parent.appendChild(node);
  }
}

// ── context window for a lecture paragraph: levels ──
// 0: 1 sentence before/after   1: 3 sentences   2: whole paragraph   3: + neighbouring paragraphs
const LEVELS=['one sentence either side','three sentences either side','the whole paragraph','with the paragraphs around it'];
function renderLecture(it,level,box){
  box.textContent='';
  const text=it.text, S=sentences(text);
  const hi=S.map((s,i)=>it.ranges.some(r=>r[0]<s[1]&&r[1]>s[0])?i:-1).filter(i=>i>=0);
  const first=hi[0], last=hi[hi.length-1];
  if(level<=1){
    const k=level===0?1:3; const a=Math.max(0,first-k), b=Math.min(S.length-1,last+k);
    // if the paragraph is itself short at the front, borrow the previous paragraph's last sentence
    if(a===0 && level===0 && it.prev.length){ const ps=sentences(it.prev[it.prev.length-1]); const lastS=ps[ps.length-1]; const pt=it.prev[it.prev.length-1];
      const gap=el('span','gap','… '); box.appendChild(gap); box.appendChild(document.createTextNode(pt.slice(lastS[0],lastS[1])+' ')); }
    else if(a>0) box.appendChild(el('span','gap','… '));
    markup(box,text,S[a][0],S[b][1],it.ranges);
    if(b<S.length-1) box.appendChild(el('span','gap',' …'));
  } else if(level===2){
    markup(box,text,0,text.length,it.ranges);
  } else {
    it.prev.forEach(p=>{box.appendChild(document.createTextNode(p)); box.appendChild(el('span','para-break'));});
    markup(box,text,0,text.length,it.ranges);
    it.next.forEach(p=>{box.appendChild(el('span','para-break')); box.appendChild(document.createTextNode(p));});
  }
}
function ctrl(level,max,onchange,labelEl){
  const c=el('div','ctrl'); const less=el('button',null,'◂ less'); const more=el('button',null,'more context ▸'); const full=el('button',null,'full paragraph');
  const lab=el('span','lvl',''); c.append(less,more,full,lab);
  function upd(){ less.disabled=level<=0; more.disabled=level>=max; lab.textContent='showing: '+LEVELS[level]; }
  less.onclick=()=>{level--;upd();onchange(level)}; more.onclick=()=>{level++;upd();onchange(level)}; full.onclick=()=>{level=2;upd();onchange(level)};
  upd(); return c;
}

function dateExplain(d){
  const bits=[];
  if(d.span) bits.push('a span: any phase between the two named is possible');
  if(d.uncertain) bits.push('query marks are Adickes’ own expression of doubt');
  if(d.undatedPhase) bits.push('at least one possible phase has no absolute date');
  return bits.join(' · ');
}
function metaBlock(kindLabel,tag,dateLabel,era,title){
  const m=el('div','meta'); const p=el('span','date era-'+era,dateLabel); if(title)p.title=title; m.appendChild(p);
  const k=el('div','kind',kindLabel||''); if(tag)k.appendChild(el('span','tag '+tag.cls,tag.label)); m.appendChild(k); return m;
}
function lectureCard(it,tag){
  const card=el('article','item era-'+it.date.era); const head=el('div','item-head');
  const cite=el('div','cite',it.cite); cite.appendChild(el('span','pages',it.pages));
  head.appendChild(cite);
  head.appendChild(metaBlock(it.kindLabel,tag,it.date.label,it.date.era,'Date of the lecture course as the edition gives it'));
  card.appendChild(head);
  card.appendChild(el('div','crumb',it.crumb));
  const box=el('div','ctx'); card.appendChild(box);
  let level=0; renderLecture(it,level,box);
  card.appendChild(ctrl(level,3,l=>renderLecture(it,l,box)));
  return card;
}

// ── Reflexion: line-based context on the left, § on the right ──
const RLEVELS=['the lines either side','more lines','the whole Reflexion'];
function renderReflLeft(it,level,box){
  box.textContent=''; const text=it.text; const lines=[]; let p=0;
  text.split('\n').forEach(l=>{lines.push([p,p+l.length]); p+=l.length+1;});
  const hi=lines.map((l,i)=>it.ranges.some(r=>r[0]<l[1]&&r[1]>l[0])?i:-1).filter(i=>i>=0);
  const first=hi[0], last=hi[hi.length-1];
  let a=0,b=lines.length-1;
  if(level===0){a=Math.max(0,first-1); b=Math.min(lines.length-1,last+1);} else if(level===1){a=Math.max(0,first-3); b=Math.min(lines.length-1,last+3);}
  if(a>0) box.appendChild(el('span','gap','… \n'));
  markup(box,text,lines[a][0],lines[b][1],it.ranges);
  if(b<lines.length-1) box.appendChild(el('span','gap','\n …'));
}
function reflCard(it,tag){
  const d=it.dating;
  const card=el('article','item era-'+d.era); const head=el('div','item-head');
  const cite=el('div','cite',it.cite); cite.appendChild(el('span','pages',it.pages)); head.appendChild(cite);
  head.appendChild(metaBlock(it.kindLabel,tag,d.label,d.era,'Our reading of Adickes’ dating of the manuscript page'));
  const how={locus:'§ from the edition’s own locus note: '+(it.loc||''),group:'§ from the heading of its block',block:'§ from the heading of its block',page:'§ from the handbook page'}[it.src]||'';
  head.appendChild(el('div','sub',it.paras.length?('on '+it.work+' § '+it.paras.join(', ')+'   ·   '+how):('on '+it.work+': the edition names no §')));
  // dating strip: Adickes' own expression, then each phase with its years
  const ds=el('div','dating'); ds.appendChild(el('span',null,'Adickes’ dating: '+(d.prose?'“'+d.raw+'” (given in words)':d.raw)+(d.phases.length?'  →':'')));
  const pnote=el('div','phnote'); pnote.style.display='none';
  d.phases.forEach(p=>{
    const b=el('button','ph era-'+(p.from==null?'none':eraOf(p.from))); b.type='button'; b.setAttribute('aria-pressed','false');
    b.appendChild(el('b',null,p.sym)); b.appendChild(document.createTextNode(p.years||'undated'));
    b.title='Click for Adickes’ note on this phase';
    b.onclick=()=>{ const on=b.getAttribute('aria-pressed')==='true'; ds.querySelectorAll('.ph').forEach(x=>x.setAttribute('aria-pressed','false'));
      if(on){pnote.style.display='none';return;} b.setAttribute('aria-pressed','true'); pnote.style.display='block'; pnote.textContent=''; pnote.appendChild(el('b',null,'Phase '+p.sym+(p.years?' — '+p.years:' — no absolute date')+'. ')); pnote.appendChild(el('i',null,p.note||'Adickes gives no date for this phase.')); };
    ds.appendChild(b);
  });
  const ex=dateExplain(d); if(ex) ds.appendChild(el('span','flag','('+ex+')'));
  ds.appendChild(pnote); head.appendChild(ds);
  card.appendChild(head);
  const sp=el('div','split'); const L=el('div'); const R=el('div');
  L.appendChild(el('h4',null,'KANT’S NOTE')); const lb=el('div','ctx'); L.appendChild(lb);
  let level=0; renderReflLeft(it,level,lb);
  L.appendChild(ctrl(level,2,l=>renderReflLeft(it,l,lb)));
  // fix labels for reflexion levels
  const lvl=L.querySelector('.lvl'); const orig=lvl; 
  R.appendChild(el('h4',null,it.work.toUpperCase())); const rb=el('div','ctx'); R.appendChild(rb);
  const st=el('div','stepper'); R.appendChild(st);
  function showSec(n){ const s=it.secs.find(x=>x.n===n); rb.textContent=''; rb.appendChild(el('b',null,'§ '+n+'. ')); 
    const text=s.text.replace(/@@\d+@@/g,''); const lem=(n===it.focus&&it.lemma)?it.lemma:null; const i=lem?text.indexOf(lem):-1;
    const t=document.createElement('span'); markup(t,text,0,text.length,[],i>=0?lem:null); rb.appendChild(t);
    st.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n==n?'true':'false'));
    note.textContent=(n===it.focus)?(lem?'The words Kant annotates are underlined.':'This is the § Kant’s note is filed under.'):'Neighbouring § — shown for context.'; }
  st.appendChild(el('span',null,'step through:'));
  it.secs.forEach(s=>{const b=el('button',null,'§ '+s.n); b.dataset.n=s.n; b.onclick=()=>showSec(s.n); st.appendChild(b);});
  const note=el('span','flag',''); R.appendChild(note);
  sp.append(L,R); card.appendChild(sp);
  if(it.secs.length) showSec(it.focus); else { st.remove(); rb.appendChild(el('span','flag','The edition names no § for this Reflexion, so there is no Meier or Baumgarten text to set beside it.')); }
  return card;
}
// give Reflexion level labels (the shared ctrl used lecture labels)
const _ctrl=ctrl; 
ctrl=function(level,max,onchange){ const c=_ctrl(level,max,onchange); if(max===2){ const lab=c.querySelector('.lvl'); const upd=()=>{}; 
  const btns=c.querySelectorAll('button'); const fix=()=>{ const lv=[...RLEVELS].findIndex((x,i)=>false); };
  btns.forEach(b=>b.addEventListener('click',()=>{ setTimeout(()=>{ const t=lab.textContent; const i=LEVELS.findIndex(x=>t.endsWith(x)); if(i>=0) lab.textContent='showing: '+RLEVELS[Math.min(i,2)]; },0); }));
  lab.textContent='showing: '+RLEVELS[0]; btns[2].textContent='whole Reflexion'; } return c; };

// ── tabs ──
const main=document.getElementById('main'), tabEx=document.getElementById('tab-ex'), tabDf=document.getElementById('tab-df');
let exFilter={src:'All',kind:'',eras:{'1750':true,'1760':true,'1770':true,'1780':true,'1790':true,'none':true}};
function srcOf(it){ return it.type==='lec'?it.cite.replace(' Logic',''):(it.w==='meier'?'Meier Refl.':'Baumgarten Refl.'); }
function eraKey(it){ return it.type==='lec'?it.date.era:it.dating.era; }
function drawExamples(){
  main.textContent='';
  main.appendChild(el('p','note-strip','PREVIEW NOTE — New: every card carries a date (a colour-coded pill in the top right and a coloured edge). Lectures give the course date; Reflexionen show our plain-language reading of Adickes’ dating, with his own expression and each phase’s years just below (click a phase for his note). The type-of-inference filter is kept, and a date filter like the Meier reader’s is added.'));
  const bar=el('div','chips'); bar.appendChild(el('span','label','Source:'));
  ['All','Blomberg','Wiener','Busolt','Meier Refl.','Baumgarten Refl.'].forEach(t=>{const c=el('button','chip',t); c.setAttribute('aria-pressed',exFilter.src===t?'true':'false'); c.onclick=()=>{exFilter.src=t;drawExamples();}; bar.appendChild(c);});
  main.appendChild(bar);
  const bar2=el('div','chips'); bar2.appendChild(el('span','label','Type of inference:'));
  const kinds=[...new Set(PV.examples.map(x=>x.kindLabel))].sort();
  const sel=el('select'); const o0=el('option',null,'All kinds ('+PV.examples.length+')'); o0.value=''; sel.appendChild(o0);
  kinds.forEach(k=>{const o=el('option',null,k+' ('+PV.examples.filter(x=>x.kindLabel===k).length+')'); o.value=k; if(exFilter.kind===k)o.selected=true; sel.appendChild(o);});
  sel.onchange=()=>{exFilter.kind=sel.value;drawExamples();}; bar2.appendChild(sel);
  bar2.appendChild(el('span','label','   Date:'));
  [['1750','1750s'],['1760','1760s'],['1770','1770s'],['1780','1780s'],['1790','1790+'],['none','undated']].forEach(([k,t])=>{const c=el('button','chip era-chip era-'+k,t); c.setAttribute('aria-pressed',exFilter.eras[k]?'true':'false'); c.onclick=()=>{exFilter.eras[k]=!exFilter.eras[k];drawExamples();}; bar2.appendChild(c);});
  main.appendChild(bar2);
  const shown=PV.examples.filter(it=>(exFilter.src==='All'||srcOf(it)===exFilter.src)&&(!exFilter.kind||it.kindLabel===exFilter.kind)&&exFilter.eras[eraKey(it)]);
  main.appendChild(el('p','flag',shown.length+' of '+PV.examples.length+' sample examples'));
  shown.forEach(it=>main.appendChild(it.type==='lec'?lectureCard(it):reflCard(it)));
}
const TAGS={define:{cls:'define',label:'DEFINES'},contrast:{cls:'contrast',label:'CONTRASTS WITH IMMEDIATE'},principle:{cls:'principle',label:'PRINCIPLE / RULE'}};
let option='A', showPrinciples=false, typeOn={define:true,contrast:true,principle:false};
function defCard(d){ d.kindLabel=''; return d.type==='lec'?lectureCard(d,TAGS[d.dtype]):reflCard(d,TAGS[d.dtype]); }
function drawDefs(){
  main.textContent='';
  const opt=el('div','opt'); opt.appendChild(el('b',null,'PREVIEW ONLY — three ways to lay out the Definitions tab. Pick one:'));
  const row=el('div','chips'); 
  [['A','A · Two sections on one page'],['B','B · One list, type filters'],['C','C · Two sub-tabs']].forEach(([k,t])=>{const c=el('button','chip',t); c.setAttribute('aria-pressed',option===k?'true':'false'); c.onclick=()=>{option=k; drawDefs();}; row.appendChild(c);});
  opt.appendChild(row);
  opt.appendChild(el('p',null,{A:'Definitions and contrasts come first under their own heading; principles and rules follow in a collapsed section that opens with one click. Nothing is hidden by default except the principles.',B:'One list, tagged DEFINES / CONTRASTS / PRINCIPLE. The first two filters are on at the start and the principles filter is off; switch it on to merge them in. Best if you want to mix and re-order freely.',C:'“What it is” and “Principles & rules” as two sub-tabs inside Definitions. Cleanest separation, but the principles are one click away and easy to miss.'}[option]));
  main.appendChild(opt);
  const grp=PV.defs.filter(d=>d.dtype!=='principle'), pr=PV.defs.filter(d=>d.dtype==='principle');
  main.appendChild(el('p','note-strip','In the finished tab these would be sorted by source (lectures by date, then Reflexionen) or by Adickes’ phase dating, and each card’s context controls work as in Examples.'));
  if(option==='A'){
    main.appendChild(el('div','sect-head','Where Kant says what a mediate inference is, or contrasts it with an immediate one'));
    grp.forEach(d=>main.appendChild(defCard(d)));
    const h=el('div','sect-head','Principles and rules of mediate inference'); const btn=el('button',null,showPrinciples?'hide':'show'); h.appendChild(btn); main.appendChild(h);
    btn.onclick=()=>{showPrinciples=!showPrinciples; drawDefs();};
    if(showPrinciples) pr.forEach(d=>main.appendChild(defCard(d)));
    else main.appendChild(el('p','flag','2 passages in this sample (in the full tab, roughly a third of the list). Click “show”.'));
  } else if(option==='B'){
    const chips=el('div','chips'); chips.appendChild(el('span','label','Show:'));
    [['define','Defines'],['contrast','Contrasts with immediate'],['principle','Principles & rules']].forEach(([k,t])=>{const c=el('button','chip',t); c.setAttribute('aria-pressed',typeOn[k]?'true':'false'); c.onclick=()=>{typeOn[k]=!typeOn[k]; drawDefs();}; chips.appendChild(c);});
    main.appendChild(chips);
    PV.defs.filter(d=>typeOn[d.dtype]).forEach(d=>main.appendChild(defCard(d)));
  } else {
    let sub=drawDefs.sub||'what'; const chips=el('div','chips');
    [['what','What it is'],['rules','Principles & rules']].forEach(([k,t])=>{const c=el('button','chip',t); c.setAttribute('aria-pressed',sub===k?'true':'false'); c.onclick=()=>{drawDefs.sub=k; drawDefs();}; chips.appendChild(c);});
    main.appendChild(chips);
    (sub==='what'?grp:pr).forEach(d=>main.appendChild(defCard(d)));
  }
}
tabEx.onclick=()=>{tabEx.setAttribute('aria-selected','true');tabDf.setAttribute('aria-selected','false');drawExamples();};
tabDf.onclick=()=>{tabDf.setAttribute('aria-selected','true');tabEx.setAttribute('aria-selected','false');drawDefs();};
drawExamples();
