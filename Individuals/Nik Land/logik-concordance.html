<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Concordance — Jäsche, Meier, Kant’s lectures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f5efe0;
    --parchment-deep: #ece3cc;
    --card: #fbf8ef;
    --ink: #2b2118;
    --ink-soft: #5a4a3a;
    --ink-faint: #8b7b66;
    --rule: #d6c9a8;
    --accent: #5c3d1e;
    --accent-soft: #e9dcc0;
    --warn: #8a2b1c;
    /* one hue per text, drawn from the era / strata hues the readers already use */
    --c-ja: #5c3d1e;
    --c-me: #7a6a4a;
    --c-bl: #3b5068;
    --c-wi: #5c6e3a;
    --c-bu: #6b4f7a;
    --c-re: #8b5e3c;
    --c-tr: #4a7a76;
    --era-1750: #7a6a4a;
    --era-1760: #5c6e3a;
    --era-1770: #8b5e3c;
    --era-1780: #3b5068;
    --era-1790: #6b4f7a;
    --era-none: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--parchment); color: var(--ink);
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-size: 17px; line-height: 1.45;
  }
  button, select, input { font: inherit; color: inherit; }

  /* ── header ───────────────────────────────────────────────────────────── */
  header { padding: 10px 22px 8px; border-bottom: 1px solid var(--rule); background: var(--parchment-deep); }
  .hrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
  header h1 { margin: 0; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 19px; letter-spacing: .06em; color: var(--accent); }
  header .sub { color: var(--ink-soft); font-size: 15px; }
  #texts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; align-items: center; }
  #texts .lbl, #reading .lbl { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .08em; color: var(--ink-faint); margin-right: 2px; min-width: 5.2em; }
  #textsToggle { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 0 9px; cursor: pointer; color: var(--ink-soft); font-size: 14px; }
  #textsToggle:hover { background: var(--accent-soft); }
  #nav #suggestBtn { background: var(--accent-soft); color: var(--ink); border: 1.5px solid var(--accent); border-radius: 4px; padding: 0 10px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #nav #suggestBtn:hover { background: var(--rule); }
  #suggestCount { font-size: 12px; margin-left: 6px; background: var(--accent); color: #fffdf6; border-radius: 999px; padding: 0 6px; }
  #suggestCount:empty { display: none; }
  #textsum { display: none; margin-right: auto; color: var(--ink-soft); font-size: 14.5px; }
  header.compact #textsum { display: inline; }
  header.compact .hrow, header.compact #reading, header.compact #texts { display: none; }
  header.compact { padding-top: 5px; padding-bottom: 5px; }
  header.compact #nav { margin-top: 0; }
  #reading { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; align-items: center; }
  .rd { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
    padding: 2px 11px 2px 8px; border: 1.5px solid var(--cc); border-radius: 4px; color: var(--cc); font-size: 15.5px; line-height: 1.3; }
  .rd input { accent-color: var(--cc); margin: 0; width: 14px; height: 14px; cursor: pointer; }
  .rd.on { background: var(--cc); color: #fffdf6; font-weight: 600; }
  .chip.primary { opacity: .5; cursor: default; }
  .chip.primary input { cursor: default; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    padding: 3px 10px 3px 8px; border: 1.5px solid var(--cc); border-radius: 999px;
    background: transparent; color: var(--cc); font-size: 15.5px; line-height: 1.3;
  }
  .chip input { accent-color: var(--cc); margin: 0; width: 15px; height: 15px; cursor: pointer; }
  .chip.on { background: var(--cc); color: #fffdf6; }
  .chip .date { font-size: 12.5px; opacity: .8; }
  .chip .cnt { font-size: 12px; font-weight: 600; min-width: 1.4em; text-align: center;
    padding: 0 5px; border-radius: 999px; background: rgba(0,0,0,.12); }
  .chip.on .cnt { background: rgba(255,255,255,.25); }
  .chip.zero .cnt { opacity: .55; }
  #nav { margin: 6px 0 0; width: 100%; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14.5px; }
  #nav select, #nav input {
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 6px; max-width: 24ch;
  }
  #nav input { width: 5.5em; }
  #nav button { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 9px; cursor: pointer; }
  #nav button:hover { background: var(--accent-soft); }

  /* ── the selected stretch ─────────────────────────────────────────────── */
  #sel { padding: 7px 22px; border-bottom: 1px solid var(--rule); background: var(--card); font-size: 15.5px; }
  #sel .what { font-family: 'Cinzel', serif; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  #sel .ttl { margin-left: 8px; }
  #sel .aa { color: var(--ink-faint); margin-left: 8px; font-size: 14px; }
  #sel .m { display: block; color: var(--ink-soft); font-size: 14.5px; margin-top: 1px; }
  #sel .m b { color: var(--c-me); font-weight: 600; }
  .legend { float: right; font-size: 13px; color: var(--ink-faint); margin-left: 16px; }
  .legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin: 0 4px 0 8px; }
  .legend i.att { border-top: 2px solid var(--ink-soft); }
  .legend i.inf { border-top: 2px dashed var(--ink-soft); }

  /* ── body ─────────────────────────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  #leftcol { flex: 0 0 min(36vw, 560px); min-width: 300px; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--rule); background: var(--parchment); }
  #jaesche { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 80px; }
  body.no-ja #leftcol { flex-basis: 230px; min-width: 230px; }
  body.no-ja #psearch, body.no-ja #qresults { display: none; }
  body.no-ja #jaesche .ubody, body.no-ja #jaesche .uh .utitle { display: none; }
  #panels { flex: 1; display: flex; overflow-x: auto; min-width: 0; }
  .panel { flex: 1 0 330px; min-width: 300px; max-width: 640px; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule);
    border-top: 3px solid var(--cc); }
  .ph { position: relative; padding: 7px 14px 6px; background: var(--parchment-deep); border-bottom: 1px solid var(--rule); }
  .ph h2 { margin: 0; font-family: 'Cinzel', serif; font-weight: 600; font-size: 14.5px; letter-spacing: .05em; color: var(--cc); }
  .ph .meta { font-size: 13.5px; color: var(--ink-soft); line-height: 1.3; }
  .ph .note { font-size: 13.5px; color: var(--ink-faint); font-style: italic; line-height: 1.3; margin-top: 2px; }
  .pbody { flex: 1; overflow-y: auto; padding: 10px 14px 60px; }
  .empty { color: var(--ink-faint); font-style: italic; padding: 14px 4px; font-size: 15.5px; }
  .welcome { color: var(--ink-soft); padding: 24px 18px; max-width: 520px; font-size: 17px; }

  /* resizing the readers */
  .panel { position: relative; }
  .ph h2 { padding-right: 80px; }
  .rsz, #split { cursor: col-resize; z-index: 6; touch-action: none; }
  .rsz { position: absolute; top: 0; right: -4px; bottom: 0; width: 8px; }
  #split { flex: 0 0 8px; margin: 0 -4px; position: relative; }
  .rsz:hover, .rsz.on, #split:hover, #split.on { background: rgba(92,61,30,.28); }
  body.dragging { user-select: none; cursor: col-resize; }
  .zoomctl { display: inline-flex; gap: 2px; }
  .zoomctl button { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; padding: 0 6px; line-height: 1.3; color: var(--ink-soft); font-family: 'EB Garamond', serif; }
  .zoomctl button:hover { background: var(--accent-soft); }
  .ph .zoomctl { position: absolute; top: 6px; right: 12px; }
  .zoomctl .sm { font-size: 12px; } .zoomctl .lg { font-size: 16px; }
  #psearch .zoomctl { margin-left: auto; }

  /* the lecture transcripts, as running text */
  .flowtext { padding: 2px 18px 10px; font-size: 17px; line-height: 1.55; }
  #jaesche.flow .unit.flow { display: inline; padding: 0; border: 0; margin: 0; cursor: text; }
  #jaesche.flow .unit.flow:hover { background: rgba(92,61,30,.06); }
  #jaesche.flow .fl-blk { display: inline; }
  #jaesche.flow .fl-blk::after { content: ' ¶'; color: var(--ink-faint); font-size: .72em; opacity: .7; }
  #jaesche.flow .para-tag { margin: 0 4px 0 2px; }
  #jaesche:not(.flow) .unit.flow { display: block; padding: 2px 6px 2px 12px; border-left: 3px solid transparent; margin: 1px 0; cursor: pointer; }
  #jaesche:not(.flow) .unit.flow:hover { background: rgba(92,61,30,.05); }
  #jaesche:not(.flow) .unit.flow .fl-blk { display: block; margin: 3px 0; }
  #jaesche:not(.flow) .unit.flow .para-tag { display: table; margin: 5px 0 2px; }
  #jaesche:not(.flow) .unit.flow .fl-rule { display: block; text-align: center; line-height: 1; }
  .unit.flow.sel { background: var(--accent-soft); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #jaesche:not(.flow) .unit.flow.sel { border-left-color: var(--accent); }
  .fl-blk.note { font-style: italic; color: var(--ink-soft); }
  .fl-rule { color: var(--ink-faint); margin: 0 3px; }

  /* search in the text read */
  #psearch { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 6px 12px; background: var(--parchment-deep); border-bottom: 1px solid var(--rule); font-size: 14px; }
  #psearch input[type=search] { flex: 1 1 160px; min-width: 120px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 8px; font-size: 15.5px; }
  #psearch button { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 0 8px; cursor: pointer; }
  #psearch button:hover { background: var(--accent-soft); }
  #psearch label { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-soft); cursor: pointer; font-size: 13.5px; }
  #qcount { color: var(--ink-faint); font-size: 13.5px; min-width: 6em; }
  #psearch label[hidden] { display: none; }
  #qresults { max-height: 38%; overflow-y: auto; background: var(--card); border-bottom: 1px solid var(--rule); }
  #qresults[hidden] { display: none; }
  .qr { padding: 3px 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid rgba(214,201,168,.5); }
  .qr:hover { background: var(--accent-soft); }
  .qr b { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .04em; color: var(--accent); margin-right: 6px; }
  .qr .n { color: var(--ink-faint); font-size: 12px; margin-left: 6px; }
  .qr mark, #jaesche mark.hit, .panel mark.hit { background: #f4d97a; color: inherit; border-radius: 2px; padding: 0 1px; }
  .qmore { padding: 4px 12px; color: var(--ink-faint); font-size: 13px; font-style: italic; }

  /* Jäsche pane */
  .sechead { padding: 14px 18px 4px; }
  .sechead .part { font-family: 'Cinzel', serif; font-size: 12.5px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
  .sechead .st { font-family: 'Cinzel', serif; font-size: 15.5px; font-weight: 600; color: var(--accent); letter-spacing: .03em; line-height: 1.3; }
  .unit { margin: 0; padding: 6px 18px 8px 15px; border-left: 3px solid transparent; cursor: pointer; }
  .unit:hover { background: rgba(92,61,30,.05); }
  .unit.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .unit.cut { border-left-style: dotted; border-left-color: var(--rule); }
  .unit.cut.sel { border-left-style: solid; border-left-color: var(--accent); }
  .uh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ulabel { font-family: 'Cinzel', serif; font-weight: 600; color: var(--accent); font-size: 14px; letter-spacing: .05em; white-space: nowrap; }
  .utitle { font-weight: 600; font-size: 16px; }
  .uaa { margin-left: auto; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
  .ubody { font-size: 17px; }
  .jb { margin: 3px 0; text-align: left; }
  .jb.fn { font-size: 15px; color: var(--ink-soft); border-left: 2px solid var(--rule); padding-left: 8px; }
  .ubody hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 40% 6px 0; }
  .fig { border: 1px dashed var(--rule); color: var(--ink-faint); font-size: 14px; padding: 4px 8px; margin: 4px 0; font-style: italic; }
  sup.pg, .pg { font-family: 'EB Garamond', serif; font-size: 11.5px; color: var(--ink-faint); background: rgba(139,123,102,.14);
    padding: 0 4px; border-radius: 3px; margin: 0 2px; vertical-align: baseline; font-style: normal; white-space: nowrap; }
  .pg.ms { background: rgba(58,80,104,.14); color: var(--c-bl); }

  /* lecture runs */
  .run { margin: 0 0 14px; background: var(--card); border: 1.5px solid var(--rule); border-left: 4px solid var(--cc); border-radius: 4px; padding: 6px 10px 8px; }
  .run.inferred { border-style: dashed; border-left-style: dashed; }
  .run.mixed { border-style: dashed solid solid dashed; }
  .rh { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: baseline; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .rh .sec { font-weight: 600; color: var(--ink); }
  .rh .aa { color: var(--ink-faint); }
  .badge { font-size: 12px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--ink-faint); color: var(--ink-soft); white-space: nowrap; }
  .badge.att { border-color: var(--c-wi); color: var(--c-wi); }
  .badge.inf { border-style: dashed; border-color: var(--warn); color: var(--warn); }
  .badge.aa { border-color: var(--c-wi); color: var(--c-wi); }
  .badge.mei { border-style: dashed; border-color: var(--c-me); color: var(--c-me); }
  .rb { font-size: 16px; }
  .rb p { margin: 3px 0; position: relative; }
  .rb p.note { font-style: italic; color: var(--ink-soft); }
  .rb hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }
  .para-tag { display: inline-block; font-family: 'Cinzel', serif; font-size: 11.5px; letter-spacing: .04em; color: var(--c-bl);
    border: 1px solid var(--c-bl); border-radius: 3px; padding: 0 5px; margin: 5px 0 2px; }
  .more { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 1px 10px; cursor: pointer; color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .more:hover { background: var(--accent-soft); }

  /* Meier */
  .mcard { margin: 0 0 12px; background: var(--card); border: 1.5px dashed var(--rule); border-left: 4px solid var(--c-me); border-radius: 4px; padding: 6px 10px 8px; }
  .mcard .mh { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .05em; color: var(--c-me); font-weight: 600; }
  .mcard .mh span { font-family: 'EB Garamond', serif; letter-spacing: 0; font-weight: 400; color: var(--ink-faint); margin-left: 6px; font-size: 13px; }
  .mcard p { margin: 3px 0 0; font-size: 16px; }
  .jcard { margin: 0 0 12px; background: var(--card); border: 1.5px solid var(--rule); border-left: 4px solid var(--c-ja); border-radius: 4px; padding: 6px 10px 8px; }
  .jcard.inferred { border-style: dashed; border-left-style: dashed; }
  .jcard.pages { border-style: dotted; border-left-style: dotted; }
  .jcard.suggested, .run.suggested { border-style: dashed; border-color: #b8860b; border-left-color: #b8860b; }
  .badge.sug { border-style: dashed; border-color: #b8860b; color: #8a6508; }
  .jcard .mh { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .05em; color: var(--c-ja); font-weight: 600; }
  .jcard .mh span { font-family: 'EB Garamond', serif; letter-spacing: 0; font-weight: 400; color: var(--ink-faint); margin-left: 6px; font-size: 13px; }
  .unit .camline { margin: 0 0 2px; }
  .unit .tcard { margin: 5px 0; }
  .camline { font-size: 12.5px; color: var(--c-wi); margin: 1px 0 2px; }

  /* Reflexionen */
  .rctl { display: flex; flex-wrap: wrap; gap: 5px 6px; align-items: center; margin-bottom: 8px; font-size: 14px; }
  .era-btn { border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 0 9px; cursor: pointer; font-size: 13.5px; line-height: 1.5; }
  .era-btn.off { opacity: .3; }
  .rctl select { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; font-size: 14px; }
  .rctl label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; color: var(--ink-soft); }
  .rctl .cnt { color: var(--ink-faint); margin-left: auto; font-size: 13.5px; }
  .rctl .lnk { background: none; border: 0; text-decoration: underline; cursor: pointer; color: var(--c-re); padding: 0; font-size: 14px; }
  .refl { margin: 0 0 11px; background: var(--card); border: 1.5px solid var(--rule); border-left: 4px solid var(--c-re); border-radius: 4px; padding: 6px 10px 8px; }
  .rnamed { margin: 0 0 14px; padding: 6px 8px 2px; background: #f3e6c4; border: 1.5px solid var(--accent); border-radius: 5px; }
  .rnh { font-family: 'Cinzel', serif; font-weight: 600; font-size: 13.5px; letter-spacing: .04em; color: var(--ink); margin: 2px 0 3px; }
  .rnh.plain { margin: 10px 0 6px; color: var(--ink-soft); font-size: 12.5px; }
  .rnn { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 7px; }
  .refl.named { border-left-color: var(--accent); border-left-width: 6px; }
  .badge.named { border-color: var(--accent); background: var(--accent); color: #fffdf6; font-weight: 600; }
  .refl.interp { border-style: dashed; border-left-style: dashed; }
  .refl .rh1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 7px; }
  .refl .rnum { font-family: 'Cinzel', serif; font-weight: 600; font-size: 13.5px; color: var(--c-re); letter-spacing: .04em; }
  .refl .raa { font-size: 13px; color: var(--ink-faint); margin-left: auto; }
  .glyph { font-size: 14px; color: var(--ink-faint); cursor: help; }
  .phase { border: 1.5px solid currentColor; background: transparent; border-radius: 4px; padding: 0 6px; cursor: pointer; line-height: 1.35; }
  .phase .sym { font-weight: 600; font-size: 14px; }
  .phase .yr { font-size: 11.5px; margin-left: 4px; opacity: .85; }
  .phase.undated { border-style: dashed; }
  .phase.open { background: rgba(0,0,0,.07); }
  .era-1750 { color: var(--era-1750); } .era-1760 { color: var(--era-1760); } .era-1770 { color: var(--era-1770); }
  .era-1780 { color: var(--era-1780); } .era-1790 { color: var(--era-1790); } .era-none { color: var(--era-none); }
  .dating { font-size: 13.5px; color: var(--ink-soft); margin: 3px 0 1px; line-height: 1.35; }
  .dating .raw { font-family: 'EB Garamond', serif; font-style: italic; }
  .dating .span { font-weight: 600; }
  .dating .lnk, .rfoot .lnk { background: none; border: 0; padding: 0; color: var(--c-re); text-decoration: underline; cursor: pointer; font-size: inherit; }
  .adnote { margin: 5px 0 4px; padding: 5px 9px; border-left: 3px solid currentColor; background: rgba(0,0,0,.035); font-size: 14px; line-height: 1.4; color: var(--ink); }
  .adnote h4 { margin: 0 0 2px; font-family: 'Cinzel', serif; font-size: 12.5px; letter-spacing: .05em; font-weight: 600; }
  .adnote .flag { color: var(--warn); font-size: 13px; margin: 2px 0; }
  .adnote .verb { font-style: normal; }
  .adnote .cite { color: var(--ink-faint); font-size: 12.5px; }
  .locus { font-size: 13.5px; color: var(--ink-soft); margin: 2px 0; }
  .locus .chipx { display: inline-block; font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; margin-left: 4px; }
  .rtext { white-space: pre-wrap; font-size: 16px; margin: 4px 0 2px; }
  .rfoot { font-size: 12.5px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .rfoot .res { margin-left: auto; }
  .grp { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .grp summary { cursor: pointer; }
  .grp pre { white-space: pre-wrap; font-family: inherit; font-size: 12.5px; margin: 3px 0; color: var(--ink-faint); }

  /* Tradition */
  .tcard { margin: 0 0 10px; background: var(--card); border: 1.5px solid var(--rule); border-left: 4px solid var(--cc2, var(--c-tr)); border-radius: 4px; padding: 5px 10px 7px; }
  .tcard.wolff { --cc2: #3b5068; } .tcard.scholastic { --cc2: #6b4f7a; } .tcard.aristotle { --cc2: #5c6e3a; }

<script type="text/plain" id="suggest-head">/* ─────────────────────────────────────────────────────────────────────────────
   Assignations suggested by readers of logik-concordance.html: a stretch of one of
   the logic lectures, and the paragraph of Meier or of Jäsche it should go with.
   Written by that page ("Suggest an assignation" → "Save"), which also reads this
   file back on load, so the suggestions show beside the concordance's own links,
   marked as suggested. It can be edited by hand.

   A suggestion does not change the concordance: logik-concordance.js is generated
   by build_logik_concordance.py and is untouched. This file is the record of what
   readers proposed, for whoever decides what goes into the extractor or the table.

   Fields of an entry
     id      a short unique id
     on      the date it was suggested, YYYY-MM-DD
     by      who, as typed; may be empty
     note    why; may be empty
     src     the lecture passage:
               k      bl | wi | bu, for Blomberg, Wiener, Busolt
               g0, g1 first and last block of the passage, as positions in that work's
                      flat list of blocks in reading order, rules included
               aa     the AA XXIV pages, as a string, for the human reader
               title  the section's title, for the same
               text   the passage's opening words, for the same
     to      what it is assigned to:
               kind   meier | jaesche
               ns     (meier) the Meier §§
               id     (jaesche) the id of the stretch in logik-concordance.js
                      (p021 for § 21; s05-03 for the third stretch of section s05)
               label  the stretch as the page labels it, for the human reader
   ───────────────────────────────────────────────────────────────────────────── */

</script>
<div id="veil"><div id="box" role="dialog" aria-modal="true"></div></div>

<!-- Shared data. Each is a classic script, so the page opens from disk.
     The Jäsche transcript is this folder's own; the correspondence is generated from
     everything below it by build_logik_concordance.py. -->
<script src="../../data/phases-adickes.js"></script>
<script src="../../data/reflexionen-16-meier.js"></script>
<script src="../../data/logik-blomberg-24.js"></script>
<script src="../../data/logik-wiener-24.js"></script>
<script src="../../data/logik-busolt-24.js"></script>
<script src="../../data/tradition-meier.js"></script>
<script src="cambridge-concordance.js"></script>
<script src="logic-jaesche-9.js"></script>
<script src="logik-concordance.js"></script>
<script src="concordance-suggestions.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Logic concordance, centred on Meier's Auszug.

   Data (loaded above):   CAMBRIDGE       the Cambridge concordance, transcribed from the scan
                          LOGIK_JAESCHE   the Jäsche Logik, in its own 120 §§
                          CONCORD         for each of Meier's 563 §§, what corresponds to it in the
                                          other texts (generated; its header says how)
                          LOGIK_BLOMBERG / _WIENER / _BUSOLT, REFL_ENTRIES / _GROUPS,
                          TRADITION, PHASES / phaseInfo()   the texts and the dating
   Attested vs. inferred: a link a source states (the Cambridge Edition's concordance,
   Appendices C and D, or the Academy Edition's own headers) is drawn with a solid border;
   one this tool worked out is dashed and says what it rests on.
   ═══════════════════════════════════════════════════════════════════════════ */

// ── the texts ───────────────────────────────────────────────────────────────
const TEXTS = [
  { k: 'me', name: 'Meier',       date: '1752',          cc: '--c-me', on: true,  note: 'Auszug aus der Vernunftlehre — the handbook Kant lectured from, and the centre of the concordance' },
  { k: 'ja', name: 'Jäsche',      date: '1800',          cc: '--c-ja', on: true,  note: 'Logik, ed. G. B. Jäsche · AA IX' },
  { k: 'bl', name: 'Blomberg',    date: 'ca. 1771',      cc: '--c-bl', on: true,  note: 'Logik Blomberg · AA XXIV · in the Cambridge concordance' },
  { k: 'wi', name: 'Wiener',      date: '1780ff.',       cc: '--c-wi', on: true,  note: 'Wiener Logik · AA XXIV · in the Cambridge concordance' },
  { k: 'bu', name: 'Busolt',      date: 'ca. 1789/90',   cc: '--c-bu', on: false, note: 'Logik Busolt · AA XXIV · not in the Cambridge concordance: inferred throughout' },
  { k: 're', name: 'Reflexionen', date: '1752–1800',     cc: '--c-re', on: true,  note: 'Kant’s Reflexionen on Meier · AA XVI' },
  { k: 'tr', name: 'Tradition',   date: '',              cc: '--c-tr', on: false, note: 'Parallel passages from Wolff, the Scholastics and Aristotle' },
];
const TEXT = Object.fromEntries(TEXTS.map(t => [t.k, t]));

// the lecture transcripts, flattened exactly as the generator flattened them
const flatten = w => w.sections.flatMap(s => s.blocks.map(b => ({ s, b })));
const LEC = {
  bl: { fl: flatten(LOGIK_BLOMBERG), meta: LOGIK_BLOMBERG.meta, label: 'Logik Blomberg' },
  wi: { fl: flatten(LOGIK_WIENER),   meta: LOGIK_WIENER.meta,   label: 'Wiener Logik' },
  bu: { fl: flatten(LOGIK_BUSOLT),   meta: LOGIK_BUSOLT.meta,   label: 'Logik Busolt' },
};
const JFL = flatten(LOGIK_JAESCHE);
const SECS = Object.fromEntries(LOGIK_JAESCHE.sections.map(s => [s.id, s]));
const UNITS = CONCORD.units;
const UIDX = Object.fromEntries(UNITS.map((u, i) => [u.id, i]));

// ── state ───────────────────────────────────────────────────────────────────
const shown = Object.fromEntries(TEXTS.map(t => [t.k, t.on]));
const ERAS = [
  { key: '1750', label: '1750s', cls: 'era-1750', lo: 0,    hi: 1759 },
  { key: '1760', label: '1760s', cls: 'era-1760', lo: 1760, hi: 1769 },
  { key: '1770', label: '1770s', cls: 'era-1770', lo: 1770, hi: 1779 },
  { key: '1780', label: '1780s', cls: 'era-1780', lo: 1780, hi: 1789 },
  { key: '1790', label: '1790 +', cls: 'era-1790', lo: 1790, hi: 9999 },
  { key: 'none', label: 'undated', cls: 'era-none', lo: null, hi: null },
];
const reflState = { eras: Object.fromEntries(ERAS.map(e => [e.key, true])), sort: 'num', inline: false, limit: 30 };

// ── helpers ─────────────────────────────────────────────────────────────────
function el(tag, cls, text, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const txt = s => document.createTextNode(s);
const range = (a, b) => (b && b !== a) ? a + '–' + b : String(a);
function paraRanges(ns) {                       // [19,20,21,25] → "19–21, 25"
  const s = [...new Set(ns)].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length; ) {
    let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(j > i ? s[i] + '–' + s[j] : String(s[i])); i = j + 1;
  }
  return out.join(', ');
}
function unitLabel(u) {
  if (u.kind === 'para') return '§ ' + u.n;
  if (u.kind === 'vorrede') return 'Vorrede · ' + u.k;
  return 'Einl. ' + u.tag + ' · ' + u.k;
}
function secOf(u) { return SECS[u.sec]; }
// Appendix C is a tree of rows; only the most specific ones speak (see import_cambridge_concordance.py)
const CAM_LEAF = CAMBRIDGE.sections.filter(s => !CAMBRIDGE.sections.some(t => t !== s &&
  t.meier[0] >= s.meier[0] && t.meier[1] <= s.meier[1] && (t.meier[0] !== s.meier[0] || t.meier[1] !== s.meier[1])));
/** The Meier §§ whose Cambridge row cites a page this stretch stands on. */
function cambridgeFor(u) {
  const out = [];
  CAM_LEAF.forEach(r => {
    if (r.v9.some(([lo, hi]) => lo <= u.aaEnd && hi >= u.aa))
      for (let n = r.meier[0]; n <= r.meier[1]; n++) out.push(n);
  });
  return out;
}
const pageList = rs => rs.length ? rs.map(([a, b]) => range(a, b)).join(', ') : '—';

/** Fill `e` with a block's text, the AA's page numbers (and the manuscript's) standing where they stood. */
function fillText(e, b, vol) {
  const marks = [];
  (b.pages || []).forEach(m => marks.push({ i: m.i, t: 'aa', p: m.p }));
  (b.ms || []).forEach(m => marks.push({ i: m.i, t: 'ms', p: m.p }));
  marks.sort((x, y) => x.i - y.i || (x.t === 'aa' ? -1 : 1));
  let pos = 0;
  for (const m of marks) {
    if (m.i > pos) { e.appendChild(txt(b.text.slice(pos, m.i))); pos = m.i; }
    const s = el('span', 'pg' + (m.t === 'ms' ? ' ms' : ''), m.t === 'aa' ? m.p : '[' + m.p + ']');
    s.title = m.t === 'aa' ? 'Academy Edition, vol. ' + vol + ', page ' + m.p + ' begins here'
                           : 'Manuscript page ' + m.p + ' begins here';
    e.appendChild(s);
  }
  e.appendChild(txt(b.text.slice(pos)));
}

// ═══ the text being read ═══════════════════════════════════════════════════
/* Any of the texts can be the one read in the left-hand pane. Every correspondence in
   CONCORD runs through the stretches of Jäsche, so a selection in another text is carried
   to Jäsche (and from there to the rest) by looking up which stretches link to it: the
   *view* of a selection is { uis: Jäsche stretches, meier, trad, links }, the same shape
   as a stretch, and the panels draw from it. Where the Cambridge concordance gives a Meier §
   directly (Appendix D) the Meier readings use that instead of the detour. */
let primary = 'me';
let cur = -1;                                   // index into the primary text's units
let view = null;                                // what corresponds to the current selection
const PRIM = {};

/* Everything in CONCORD.paras hangs on a Meier §. A *view* of a selection is the pooled content of
   the Meier §§ it is tied to: { ns, meier, uis (Jäsche stretches), jaBasis, links, trad }. */
const PARAS = CONCORD.paras;
const BASIS_RANK = { cambridge: 3, pages: 2, mixed: 2, inferred: 1, suggested: 1 };
function viewOfMeier(ns, firstUi, extra) {
  const ja = new Map(), L = { bl: new Map(), wi: new Map(), bu: new Map() }, re = new Map();
  ns.forEach(n => {
    const d = PARAS[n]; if (!d) return;
    (d.ja || []).forEach(([ui, b]) => { if (!ja.has(ui) || BASIS_RANK[b] > BASIS_RANK[ja.get(ui)]) ja.set(ui, b); });
    for (const k of ['bl', 'wi', 'bu']) (d[k] || []).forEach(l => { const key = l.r[0] + '-' + l.r[1]; if (!L[k].has(key)) L[k].set(key, l); });
    (d.re || []).forEach(([i, res, how]) => { const o = re.get(i); if (!o) re.set(i, [i, res, how]); else { o[1] = Math.max(o[1], res); o[2] |= how; } });
  });
  // readers' suggestions: those touching these §§, or naming this stretch of Jäsche
  const sugg = suggInfos().filter(i => i.ns.some(n => ns.includes(n)) || (i.ui != null && (i.ui === firstUi || (extra && extra.has(i.ui)))));
  sugg.forEach(i => {
    const key = i.run.r[0] + '-' + i.run.r[1];
    if (!L[i.s.src.k].has(key) || L[i.s.src.k].get(key).basis !== 'suggested') L[i.s.src.k].set(key, Object.assign({}, i.run, { title: suggTitle(i.s) }));
    if (i.ui != null) ja.set(i.ui, 'suggested');
  });
  if (firstUi != null && !ja.has(firstUi)) ja.set(firstUi, 'cambridge');
  const uis = [...ja.keys()].sort((a, b) => a - b);
  if (firstUi != null) uis.splice(uis.indexOf(firstUi), 1), uis.unshift(firstUi);
  const v = { ns, meier: ns, uis, jaBasis: ja, mbasis: null, mscore: null, links: {}, stated: true,
              trad: ns.filter(n => TRADITION[n]) };
  for (const k of ['bl', 'wi', 'bu']) v.links[k] = [...L[k].values()].sort((a, b) => a.r[0] - b.r[0]);
  v.links.re = [...re.values()];
  v.sugUis = new Set(sugg.filter(i => i.ui != null).map(i => i.ui));
  return v;
}
// inverse indexes: which Meier §§ a block of a lecture, or a Reflexion, is placed on
const _lecInv = {};
function lecInv(k) {
  if (_lecInv[k]) return _lecInv[k];
  const m = new Map();
  Object.keys(PARAS).forEach(n => (PARAS[n][k] || []).forEach(l => {
    for (let g = l.r[0]; g <= l.r[1]; g++) { let a = m.get(g); if (!a) m.set(g, a = []); a.push([+n, l.basis]); }
  }));
  return (_lecInv[k] = m);
}
let _reInv = null;
function reInv() {
  if (_reInv) return _reInv;
  _reInv = new Map();
  Object.keys(PARAS).forEach(n => (PARAS[n].re || []).forEach(([i, res, how]) => {
    let a = _reInv.get(i); if (!a) _reInv.set(i, a = []); a.push({ n: +n, res, how });
  }));
  return _reInv;
}
// the AA's own headers name Jäsche pages for 43 groups of Reflexionen
const RE_BY_GRP = {};
REFL_ENTRIES.forEach((e, i) => { if (!e.vacat) (RE_BY_GRP[e.grp] = RE_BY_GRP[e.grp] || []).push(i); });
const GRP_PAGES = REFL_GROUPS.map((g, gi) => { const m = /AA 9:(\d+)(?:-(\d+))?/.exec(g.jaesche || ''); return m ? [gi, +m[1], +(m[2] || m[1])] : null; }).filter(Boolean);

// ── views of a selection in each text ──
function viewForJaesche(ui) {
  const u = UNITS[ui], v = viewOfMeier(u.meier || [], ui);
  v.mbasis = u.mbasis || null; v.mscore = u.mscore;
  const re = new Map(v.links.re.map(r => [r[0], r]));
  GRP_PAGES.forEach(([gi, a, b]) => { if (u.aa <= b && u.aaEnd >= a) (RE_BY_GRP[gi] || []).forEach(i => { const o = re.get(i); if (o) o[2] |= 1; else re.set(i, [i, null, 1]); }); });
  v.links.re = [...re.values()];
  return v;
}
function viewForMeier(n) { return viewOfMeier([n]); }
/** Appendix C: the stretches of Jäsche on the AA 9 pages that the rows for these Meier §§ cite. */
const unitsOnPages = ranges => UNITS.map((u, i) => i).filter(i => ranges.some(([lo, hi]) => lo <= UNITS[i].aaEnd && hi >= UNITS[i].aa));
function explicitJaesche(ns) {
  const out = new Set();
  ns.forEach(n => { const row = CAM_LEAF.find(r => n >= r.meier[0] && n <= r.meier[1]); if (row && row.v9.length) unitsOnPages(row.v9).forEach(i => out.add(i)); });
  return out;
}
/** Where the Cambridge concordance speaks, it — not the words — decides which stretches of Jäsche are shown. */
function applyExplicit(v, uis) {
  if (!uis.size) return v;
  const words = new Set(v.uis), mine = [...(v.sugUis || [])];
  v.uis = [...new Set([...uis, ...mine])].sort((a, b) => a - b);
  v.jaBasis = new Map(v.uis.map(ui => [ui, mine.includes(ui) ? 'suggested' : words.has(ui) ? 'cambridge' : 'pages']));
  v.jaExplicit = true;
  return v;
}
function viewForLecture(k, st) {
  const inv = lecInv(k), cnt = new Map(), bases = new Map();
  for (let g = st.g0; g <= st.g1; g++) (inv.get(g) || []).forEach(([n, basis]) => { cnt.set(n, (cnt.get(n) || 0) + 1); bases.set(n, basis); });
  const ranked = [...cnt].sort((a, b) => b[1] - a[1]);
  const top = ranked.length ? ranked[0][1] : 0;
  let ns = ranked.filter(([, c]) => c >= Math.max(1, 0.3 * top)).slice(0, 6).map(([n]) => n).sort((a, b) => a - b);
  const mine = suggInfos().filter(i => i.s.src.k === k && i.s.src.g0 <= st.g1 && i.s.src.g1 >= st.g0);
  const extra = new Set();
  mine.forEach(i => { ns = [...new Set(ns.concat(i.ns))].sort((a, b) => a - b); if (i.ui != null) extra.add(i.ui); });
  const v = viewOfMeier(ns, null, extra);
  v.stated = ns.some(n => bases.get(n) !== 'inferred');
  if (k === 'bl' || k === 'wi') {                    // the pages of the stretch, and the §§ Appendix D gives for them
    const fl = LEC[k].fl; let p0 = 1e9, p1 = 0;
    for (let g = st.g0; g <= st.g1; g++) { const b = fl[g].b; if (b.kind === 'rule') continue; p0 = Math.min(p0, b.aa); p1 = Math.max(p1, b.aaEnd || b.aa); }

/* The reading pane's width is set by the bar between it and the panels; each panel's by the bar on

    bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);

    () => { left.style.flex = ''; left.style.minWidth = ''; });
}

/** Where Blomberg's own headings fall nearest to a stretch's Meier §§, for when nothing was placed on it. */
function blombergNear(meier) {

  LEC.bl.fl.forEach(({ b }) => { if (b.para && !heads.has(b.para.nums[0])) heads.set(b.para.nums[0], b.aa); });
  const ns = [...heads.keys()].sort((a, b) => a - b);
  const below = ns.filter(n => n < lo).pop(), above = ns.find(n => n > hi);
  const bits = [];
  if (below != null) bits.push('§ ' + below + ' (AA 24:' + heads.get(below) + ')');
  if (above != null) bits.push('§ ' + above + ' (AA 24:' + heads.get(above) + ')');
  return 'Blomberg has no heading at Meier ' + (lo === hi ? '§ ' + lo : '§§ ' + lo + '–' + hi) + (bits.length ? '; the nearest are ' + bits.join(' and ') + '.' : '.');
}
function buildRun(W, l, k) {

  rh.appendChild(el('span', 'aa', 'AA ' + W.meta.volume + ':' + range(first.aa, last.aaEnd || last.aa)));
  const bd = el('span', 'badge ' + (l.basis === 'inferred' ? 'inf' : 'att'));
  bd.textContent = l.basis === 'cambridge' ? 'Cambridge concordance' :

  if (l.basis === 'suggested') bd.className = 'badge sug';
  bd.title = l.basis === 'suggested' ? (l.title || 'Suggested by a reader') : l.basis === 'inferred'
    ? 'Placed here by the similarity of its words to this stretch and by the order of the lecture. The Cambridge concordance does not list these pages (or Busolt at all).'
    : l.direct ? 'The Cambridge concordance (Appendix D) gives these pages for this Meier §.'

  rh.appendChild(bd);

      )).title = 'Cosine similarity of the passage to the stretch, and how many standard deviations above the other stretches it stands';

  let g = r0, lastTag = null;
  const put = until => {
    for (; g <= r1 && until(g); g++) {
      const b = fl[g].b;

      if (b.para && b.para.raw !== lastTag) {

}

// ═══ Reflexionen, and Adickes' dating ══════════════════════════════════════
const REFL_KIND = {
  'zu':        { glyph: '→', de: 'Zu …',        en: 'attached to the passage' },
  'gegenüber': { glyph: '‖', de: 'Gegenüber …', en: 'on the facing page' },
  'neben':     { glyph: '▎', de: 'Neben …',     en: 'beside the passage, in the margin' },
  'zwischen':  { glyph: '↕', de: 'Zwischen …',  en: 'between the printed lines, or between two §§' },
  'über':      { glyph: '↑', de: 'Über …',      en: 'above the line' },
  'unter':     { glyph: '↓', de: 'Unter …',     en: 'below the line' },
  'nach':      { glyph: '»', de: 'Nach …',      en: 'after the passage' },
  'in':        { glyph: '⊂', de: 'In …',        en: 'written into the printed text' },

function eraOf(sym) {
  const p = phaseInfo(sym);
  if (!p || p.from == null) return 'none';
  for (const e of ERAS) if (e.lo !== null && p.from >= e.lo && p.from <= e.hi) return e.key;
  return 'none';
}
const eraCls = sym => ERAS.find(x => x.key === eraOf(sym)).cls;
function entryEras(e) { const s = new Set((e.ph || []).map(eraOf)); if (!s.size) s.add('none'); return s; }
function entryVisible(e) { for (const k of entryEras(e)) if (reflState.eras[k]) return true; return false; }
/** The span of years Adickes' tables give for every phase an entry is dated to. */
function entrySpan(e) {
  let lo = null, hi = null, undated = 0;
  (e.ph || []).forEach(s => {
    const p = phaseInfo(s);
    if (p && p.from != null) { lo = lo == null ? p.from : Math.min(lo, p.from); hi = hi == null ? p.to : Math.max(hi, p.to); }
    else undated++;
  });
  return { lo, hi, undated };
}
const entryStart = e => { const s = entrySpan(e); return s.lo == null ? 9999 : s.lo; };
const hasHyphen = e => /[−–-]/.test(e.phRaw || '') && (e.ph || []).length > 1;

function phaseNote(sym) {
  const p = phaseInfo(sym);
  const box = el('div', 'adnote ' + eraCls(sym));
  box.appendChild(el('h4', null, 'Phase ' + (p ? p.sym : sym) + ' · ' + (p && p.years ? p.years : 'von Adickes nicht datiert')));
  const flag = s => box.appendChild(el('div', 'flag', s));
  if (p && p.inherited) flag('Dated from phase ' + p.inheritedFrom + '. ' + p.inheritedReason);
  if (p && p.relative) flag('Relative position only: ' + p.relative);
  if (p && p.significance) flag('Significance: ' + p.significance);
  if (p && p.covers) flag('Covers: ' + p.covers);
  if (p && p.editorial) flag(p.editorial);
  if (p && p.notInAdickesTable) flag('Not one of Adickes’ 33 tabled phases.');
  if (p && p.unlisted) flag('Adickes does not table this exponent of the letter.');
  if (!p || p.unknown) flag('This label could not be matched against Adickes’ table; it may be a transcription artefact.');
  if (p && p.note) box.appendChild(el('div', 'verb', p.note));
  if (p && p.aa) box.appendChild(el('div', 'cite', 'Adickes, ' + p.aa));
  return box;
}

function buildRefl(idx, how, res) {

  const ft = el('div', 'rfoot');

  ft.appendChild(el('span', null, 'Meier § ' + paraRanges(e.paras) + ' · ' + src));
  if (how & 8) { const b = el('span', 'badge aa', 'Cambridge: AA 16:' + range(e.aa, e.aaEnd)); b.title = 'Appendix D of the Cambridge concordance gives this AA 16 page for the Meier §'; ft.appendChild(b); }

  if (res != null) ft.appendChild(el('span', 'res', 'resemblance ' + res)).title = 'Cosine similarity ×100 of this Reflexion to the stretch; it orders, nothing more';

  if (g && (g.topic || g.phaseRange || g.raw)) {

    const s = el('summary', null, 'AA group' + (g.topic ? ': ' + g.topic : '') + (g.phaseRange ? ' · group dating ' + g.phaseRange.phases + (g.phaseRange.years ? ' (' + g.phaseRange.years + ')' : '') : ''));
    d.appendChild(s); d.appendChild(el('pre', null, g.raw));
    c.appendChild(d);
  }
  return c;
}

function panelRefl(u, head, body) {
  metaLine(head, 'Kant’s handschriftliche Bemerkungen · AA XVI · Refl. 1619–3488');
  noteLine(head, 'Stated pairings: filed under the Meier § by the AA, on an AA 16 page the Cambridge concordance gives for it, or (for a Jäsche stretch) in a group the AA heads with Jäsche pages. Dating is Adickes’ (AA XIV:XXXV–XLIII).');
  const all = (u.links || {}).re || [];
  const ctl = el('div', 'rctl');
  ERAS.forEach(er => {
    const b = el('button', 'era-btn ' + er.cls + (reflState.eras[er.key] ? '' : ' off'), er.label);
    b.title = er.key === 'none' ? 'Reflexionen whose phase Adickes leaves undated (ε, ο, π), or which the AA dates only in prose' : 'Phases beginning in the ' + er.label;
    b.onclick = () => { reflState.eras[er.key] = !reflState.eras[er.key]; reflState.limit = 30; renderPanels(); };
    ctl.appendChild(b);
  });
  const sel = el('select');
  [['num', 'by Refl. number'], ['date', 'by date (Adickes)'], ['res', 'by resemblance to the selection'], ['aa', 'attested pairing first']].forEach(([v, t]) => { const o = el('option', null, t); o.value = v; sel.appendChild(o); });
  sel.value = reflState.sort;
  sel.onchange = () => { reflState.sort = sel.value; reflState.limit = 30; renderPanels(); };
  ctl.appendChild(sel);
  const lab = el('label'); const cb = el('input', null, null, { type: 'checkbox' }); cb.checked = reflState.inline;
  cb.onchange = () => { reflState.inline = cb.checked; renderPanels(); };
  lab.appendChild(cb); lab.appendChild(txt('all Adickes notes open'));
  ctl.appendChild(lab);
  const nb = el('button', 'lnk', 'Adickes’ notation & table');
  nb.onclick = () => openAdickes(null);
  ctl.appendChild(nb);
  const cnt = el('span', 'cnt'); ctl.appendChild(cnt);
  body.appendChild(ctl);

  const rows = all.filter(([i]) => entryVisible(REFL_ENTRIES[i]));
  cnt.textContent = rows.length === all.length ? all.length + ' Reflexionen' : rows.length + ' of ' + all.length;
  if (!all.length) { body.appendChild(el('div', 'empty', 'No Reflexion is paired with this selection by the Cambridge concordance or the AA, or filed under a Meier § aligned to it.')); return; }
  const cmp = {
    num:  (a, b) => REFL_ENTRIES[a[0]].r - REFL_ENTRIES[b[0]].r,
    date: (a, b) => entryStart(REFL_ENTRIES[a[0]]) - entryStart(REFL_ENTRIES[b[0]]) || REFL_ENTRIES[a[0]].r - REFL_ENTRIES[b[0]].r,
    res:  (a, b) => (b[1] || 0) - (a[1] || 0) || REFL_ENTRIES[a[0]].r - REFL_ENTRIES[b[0]].r,
    aa:   (a, b) => (((b[2] & 9) ? 1 : 0) - ((a[2] & 9) ? 1 : 0)) || (b[1] || 0) - (a[1] || 0),
  }[reflState.sort];
  rows.sort(cmp);
  // reading Jäsche: the Reflexionen whose AA group header cites the Jäsche pages come first, apart from the rest
  const named = primary === 'ja' ? rows.filter(r => r[2] & 1) : [];
  if (named.length) {
    const top = el('div', 'rnamed');
    top.appendChild(el('div', 'rnh', 'Named by the editor for these Jäsche pages · ' + named.length + (named.length === 1 ? ' Reflexion' : ' Reflexionen')));
    top.appendChild(el('div', 'rnn', 'Adickes’ own header for the group these stand in cites the Jäsche pages (“IX …”): the editor ties them to this part of the Logik. The header is the group’s, not each note’s.'));
    named.forEach(([i, res, how]) => { const c = buildRefl(i, how, res); c.classList.add('named'); c.dataset.go = 're:' + i; c.title = 'Double-click to read this Reflexion as the main text'; top.appendChild(c); });
    body.appendChild(top);
    markPanels(top);
  }
  const rest = named.length ? rows.filter(r => !(r[2] & 1)) : rows;
  if (named.length && rest.length) body.appendChild(el('div', 'rnh plain', 'Other Reflexionen paired with this selection · ' + rest.length));
  const list = el('div'); body.appendChild(list);
  const draw = () => {
    list.textContent = '';
    rest.slice(0, reflState.limit).forEach(([i, res, how]) => { const c = buildRefl(i, how, res); c.dataset.go = 're:' + i; c.title = 'Double-click to read this Reflexion as the main text'; list.appendChild(c); });
    const left = rest.length - reflState.limit;
    if (left > 0) {
      const m = el('button', 'more', 'show ' + Math.min(30, left) + ' more (' + left + ' left)');
      m.onclick = () => { reflState.limit += 30; draw(); };
      list.appendChild(m);
    }
    markPanels(list);
  };
  draw();
}

// ── the Adickes overlay ──
function openAdickes(which) {
  const box = document.getElementById('box');
  box.textContent = '';
  const x = el('button', 'x', 'close'); x.onclick = closeBox; box.appendChild(x);
  box.appendChild(el('h3', null, 'Adickes’ chronology of the phases of Kant’s hand'));
  box.appendChild(el('div', 'cite', 'Erich Adickes, introduction to AA XIV, pp. XXXV–XLIII'));
  const add = (title, o) => { box.appendChild(el('h4', null, title + ' · ' + o.aa)); box.appendChild(el('p', null, o.text)); };
  if (which === 'hyphen') add('THE HYPHEN', ADICKES_HYPHEN_NOTE);
  add('NOTATION', ADICKES_PREAMBLE);
  if (which !== 'hyphen') add('THE HYPHEN', ADICKES_HYPHEN_NOTE);
  add('INK', ADICKES_INK_NOTE);
  box.appendChild(el('h4', null, 'THE PHASES, in Adickes’ order (chronological)'));
  PHASES.forEach(p => {
    const d = el('details'); d.className = eraCls(p.sym);
    const s = el('summary'); s.appendChild(el('b', null, p.sym));
    s.appendChild(txt(p.years || (p.relative ? 'relative position only' : 'no date')));
    d.appendChild(s);
    const inner = el('div', 'adnote ' + eraCls(p.sym));
    if (p.relative) inner.appendChild(el('div', 'flag', 'Relative position only: ' + p.relative));
    if (p.significance) inner.appendChild(el('div', 'flag', 'Significance: ' + p.significance));
    if (p.covers) inner.appendChild(el('div', 'flag', 'Covers: ' + p.covers));
    if (p.editorial) inner.appendChild(el('div', 'flag', p.editorial));
    if (p.note) inner.appendChild(el('div', 'verb', p.note));
    inner.appendChild(el('div', 'cite', 'Adickes, ' + p.aa));
    d.appendChild(inner);
    box.appendChild(d);
  });
  document.getElementById('veil').classList.add('open');
}
function closeBox() { document.getElementById('veil').classList.remove('open'); }
document.getElementById('veil').addEventListener('click', e => { if (e.target.id === 'veil') closeBox(); });

// ═══ init ══════════════════════════════════════════════════════════════════
// A link may carry the text read, the selection and the texts shown: #p021&r=ja&t=bl,wi,re
const hashParts = location.hash.slice(1).split('&');
const hashArg = k => (hashParts.find(x => x.startsWith(k + '=')) || '').slice(k.length + 1);
if (TEXT[hashArg('r')]) primary = hashArg('r');
const hashTexts = hashArg('t').split(',').filter(k => TEXT[k]);
if (hashTexts.length) TEXTS.forEach(t => { t.on = hashTexts.includes(t.k); shown[t.k] = t.on; });
shown[primary] = true;
buildReading(); paintReading();
buildChips();
buildNav(); wireNav();
buildPrimaryPane();
wireSearch();
wireSplit();
wireSuggest();
wireAsk();
wireTextsToggle();
zoomButtons('prim', document.getElementById('pzoom'));
if (hashArg('q')) document.getElementById('q').value = decodeURIComponent(hashArg('q'));
let start = PRIM[primary].byId(hashParts[0]);
if (start == null || start < 0) start = primary === 'ja' ? UIDX['p021'] : primary === 'me' ? MEIER_NS.indexOf(292) : 0;
select(start, true, true);
if (document.getElementById('q').value) runSearch();
</script>
