name: Proposal
description: A feature for one of the tools, or a new tool
title: "Proposal: "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Say what you want and why. The more concrete the better.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - The Logic Portal
        - A participant's tool, in Individuals/
        - A new tool
        - Shared data
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why — what would it help you read or see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Optional. For something bigger, the steps to ask for one at a time, each one checkable by clicking — e.g. "1. Clicking a § number scrolls the text to that §."
