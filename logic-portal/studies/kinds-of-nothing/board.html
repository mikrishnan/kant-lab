<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The board · the kinds of nothing · Kant Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap');

  /* The Logic Portal's palette and fonts, as on the study's own page. */
  :root {
    --ink: #1a1208;
    --parchment: #f5efe0;
    --parchment-dark: #e8dfc8;
    --panel: #faf7f0;
    --card: #fbf8f1;
    --accent: #5c3d1e;
    --accent-light: #8b5e3c;
    --faded: #7a6a52;
    --line: #b8a88a;
    --line-soft: #d9ccb0;
    --prob: #8a3b12;      /* problems, and what may answer them */
    --note: #fff6c9;      /* what is written on the board */
    --machine: #9a8f7a;   /* what the computer drew */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--parchment);
         display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-light); }

  header { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); background: var(--parchment-dark);
           font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.05em; flex: none; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .slash { color: var(--line); }
  header b { color: var(--accent); font-weight: 600; }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.5rem; padding: 0.4rem 0.8rem; border-bottom: 1px solid var(--line-soft); background: var(--panel); flex: none; }
  .tools .grp { display: flex; align-items: center; gap: 0.3rem; padding-right: 0.6rem; margin-right: 0.1rem; border-right: 1px solid var(--line-soft); }
  .tools .grp:last-child { border-right: 0; }
  .tools .lbl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin-right: 0.15rem; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--accent); border-radius: 999px; padding: 0.05rem 0.7rem; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-light); background: var(--card); }
  .btn.solid { background: var(--accent); color: var(--parchment); border-color: var(--accent); }
  .btn.solid:hover { background: var(--accent-light); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.k-problem { color: var(--prob); border-color: #d6b19c; }
  .btn.k-note { background: var(--note); }
  select.vsel { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0.05rem 0.3rem; max-width: 16rem; color: var(--accent); }
  #search { border: 1px solid var(--line); border-radius: 999px; padding: 0.05rem 0.7rem; width: 11rem; background: #fff; }
  #found { font-size: 0.82rem; color: var(--faded); min-width: 3.5rem; }
  .linkish { background: none; border: 0; padding: 0; color: var(--faded); cursor: pointer; text-decoration: underline; font-size: 0.86rem; }
  .linkish:hover { color: var(--accent); }

  .wrap { flex: 1; display: flex; min-height: 0; }

  /* ── The stage: an endless board, panned and zoomed ── */
  #stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
           background-color: #f7f2e4; background-image: radial-gradient(#ddd1b6 1px, transparent 1px); background-size: 24px 24px; }
  #stage.panning { cursor: grabbing; }
  #stage.linking, #stage.linking .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #ink { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #ink .ar { pointer-events: auto; cursor: pointer; }
  #ink .ar path.hit { fill: none; stroke: transparent; stroke-width: 16; }
  #ink .ar path.v { fill: none; stroke-width: 2.2; }
  #ink .ar.division path.v { stroke-width: 1.5; }
  #ink .ar.sel path.v { stroke-width: 4; }
  #ink .ar .pill rect { fill: #fff; stroke-width: 1.3; }
  #ink .ar .pill text { font-family: 'EB Garamond', serif; font-size: 13px; fill: var(--accent); }
  #ink .ar.problem .pill text { fill: var(--prob); }
  #ink .ar.computer .pill text { fill: var(--faded); font-style: italic; }
  #ink .frame rect.f { stroke-width: 2; }
  #ink .frame.sel rect.f { stroke-width: 3.5; }
  #ink .marq { fill: rgba(139, 94, 60, 0.08); stroke: var(--accent-light); stroke-dasharray: 5 4; }
  #ink #ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .dim { opacity: 0.14; }
  #ink .ar.dim { opacity: 0.08; }

  /* frame tabs: a model's name, and the handle that moves it */
  .ftab { position: absolute; color: #fff; border-radius: 7px 7px 7px 0; padding: 0.1rem 0.6rem 0.12rem; white-space: nowrap; cursor: move; font-size: 0.9rem; }
  .ftab b { font-family: 'Cinzel', serif; letter-spacing: 0.04em; font-weight: 600; margin-right: 0.35rem; }
  .ftab i { opacity: 0.92; }
  .ftab small { display: block; font-size: 0.72rem; opacity: 0.85; margin-top: -0.1rem; }

  /* cards */
  .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-left-width: 5px; border-radius: 8px; padding: 0.3rem 0.55rem 0.35rem;
          box-shadow: 0 1px 2px rgba(60, 40, 10, 0.12); cursor: pointer; }
  .card:hover { box-shadow: 0 2px 8px rgba(60, 40, 10, 0.2); }
  .card.sel { outline: 3px solid var(--accent-light); outline-offset: 1px; }
  .card.hit { outline: 3px solid #d9a441; outline-offset: 1px; }
  .card.k-part { width: 168px; text-align: center; }
  .card.k-part .lab { display: block; font-weight: 600; color: var(--accent); font-size: 1.02rem; line-height: 1.15; }
  .card.k-part .lab.lat { font-style: italic; }
  .card .sub { display: block; font-size: 0.8rem; color: var(--faded); font-style: italic; margin-top: 0.1rem; line-height: 1.15; }
  .card .count { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.15rem; font-family: 'Cinzel', serif; letter-spacing: 0.06em; }
  .card .nearq { display: none; text-align: left; font-size: 0.8rem; font-style: italic; margin-top: 0.3rem; border-top: 1px dotted var(--line-soft); padding-top: 0.25rem; line-height: 1.25; }
  .card .nearq span { font-style: normal; color: var(--faded); font-size: 0.72rem; }
  .card.k-passage { width: 250px; background: var(--card); border-color: var(--line); font-size: 0.86rem; }
  .card.k-passage .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.1rem; }
  .card.k-passage .pq { font-style: italic; line-height: 1.25; }
  .card.k-passage .pc { display: block; font-size: 0.75rem; color: var(--faded); margin-top: 0.2rem; }
  .card.k-problem { width: 260px; background: #fff7f1; border-color: #d6b19c; border-left-color: var(--prob); font-size: 0.88rem; line-height: 1.25; }
  .card .tag { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.09em; color: var(--prob); margin-bottom: 0.15rem; }
  .card.k-note { width: 190px; background: var(--note); border-color: #e6d58a; font-size: 0.9rem; line-height: 1.25; transform: rotate(-0.6deg); }
  .card.k-note .tag { color: #8a7420; }
  .card .who { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.2rem; text-align: right; }
  .card .chk { color: #a0661a; font-size: 0.7rem; display: block; margin-top: 0.15rem; }
  .card .knob { position: absolute; right: -13px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
                font-size: 13px; line-height: 21px; text-align: center; cursor: crosshair; display: none; box-shadow: 0 0 0 2px #fff; }
  .card:hover .knob, .card.sel .knob { display: block; }
  #stage.readonly .knob { display: none !important; }
  /* depth: zoomed out, a card is its name; zoomed in, its first passage shows */
  #world.far .card .sub, #world.far .card .count, #world.far .card .who, #world.far .card .chk { display: none; }
  #world.far .card.k-part .lab { font-size: 1.5rem; }
  #world.far .card.k-passage .pq, #world.far .card.k-problem, #world.far .card.k-note { font-size: 1.15rem; }
  #world.near .card .nearq { display: block; }

  /* floating boxes on the stage */
  .float { position: absolute; background: rgba(250, 247, 240, 0.96); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(60, 40, 10, 0.12); font-size: 0.86rem; cursor: default; }
  #layers { left: 12px; bottom: 12px; padding: 0.45rem 0.7rem 0.5rem; max-width: 260px; }
  #layers .ttl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); display: block; margin-bottom: 0.2rem; }
  #layers label { display: flex; align-items: center; gap: 0.4rem; margin: 0.05rem 0; cursor: pointer; }
  #layers label i { display: inline-block; width: 1.4rem; height: 0; border-top: 2px solid var(--accent); }
  #layers label i.sq { height: 0.7rem; border: 1.5px solid var(--line); border-radius: 3px; }
  #layers label span.n { color: var(--faded); margin-left: auto; padding-left: 0.6rem; }
  #layers.closed label { display: none; }
  #zoom { right: 12px; bottom: 12px; padding: 0.2rem 0.3rem; display: flex; align-items: center; gap: 0.2rem; }
  #zoom button { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 1rem; padding: 0.1rem 0.45rem; border-radius: 6px; }
  #zoom button:hover { background: var(--parchment-dark); }
  #zoom #zk { min-width: 3.2rem; text-align: center; color: var(--faded); font-size: 0.82rem; }
  #banner { left: 50%; top: 12px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; align-items: center; gap: 0.6rem; max-width: 80%; }
  #banner.show { display: flex; }
  #banner.photo { background: #eef2f6; border-color: #3b5068; }
  #banner .btn { font-size: 0.82rem; }
  #chooser { display: none; padding: 0.35rem; gap: 0.3rem; flex-wrap: wrap; width: 230px; }
  #chooser.show { display: flex; }
  #chooser .ttl { flex-basis: 100%; font-size: 0.78rem; color: var(--faded); padding: 0 0.2rem; }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; }
  #toast.show { display: block; }

  /* ── The side: what is selected, and the portal ── */
  #side { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side .tabs { display: flex; border-bottom: 1px solid var(--line-soft); flex: none; }
  #side .tabs button { flex: 1; border: 0; background: none; padding: 0.4rem; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--faded); border-bottom: 2px solid transparent; }
  #side .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #details { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; }
  #reading { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #reading.on { display: flex; }
  #reading .bar { display: flex; justify-content: space-between; padding: 0.3rem 0.8rem; font-size: 0.82rem; color: var(--faded); border-bottom: 1px solid var(--parchment-dark); }
  #reading .bar a { color: var(--accent); }
  #reading iframe { flex: 1; width: 100%; border: 0; background: var(--parchment); }
  #details h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #details h2.lat { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1.2rem; }
  #details .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #details .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #details .mchip { display: inline-block; color: #fff; border-radius: 4px; padding: 0 0.4rem; font-size: 0.8rem; font-style: normal; margin-right: 0.3rem; }
  #details .q { margin: 0 0 0.5rem; padding: 0.35rem 0.55rem; border-left: 3px solid var(--line); background: #fff; font-size: 0.94rem; }
  #details .q .t { font-style: italic; }
  #details .q .c { display: flex; gap: 0.5rem; align-items: baseline; margin-top: 0.2rem; font-size: 0.8rem; }
  #details .q .c button { background: none; border: 0; padding: 0; color: var(--accent-light); text-decoration: underline; cursor: pointer; font-size: 0.8rem; }
  #details .q .c .chk { color: #a0661a; }
  #details .q .c .x { margin-left: auto; color: var(--faded); }
  #details .stmt { background: #fff; border: 1.5px dashed var(--accent-light); border-radius: 6px; padding: 0.4rem 0.6rem; white-space: pre-wrap; }
  #details .stmt.machine { border-style: dotted; color: var(--faded); }
  #details .stmt.problem { border-color: var(--prob); }
  #details .by { font-size: 0.82rem; color: var(--faded); margin: 0.25rem 0 0; }
  #details .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.25rem 0.5rem; margin: 0.22rem 0; cursor: pointer; font-size: 0.9rem; }
  #details .rel:hover { border-color: var(--accent-light); }
  #details .rel b { color: var(--accent); font-weight: 600; }
  #details .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; margin: 0.2rem 0; }
  #details .warn { color: var(--prob); font-size: 0.86rem; }
  #details .row { display: flex; gap: 0.4rem 0.6rem; margin-top: 0.9rem; flex-wrap: wrap; align-items: center; }
  #details label.f { display: block; font-size: 0.86rem; color: var(--faded); margin: 0.65rem 0 0.2rem; }
  #details textarea, #details input[type=text], #details select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.45rem; background: #fff; }
  #details textarea { min-height: 4.5rem; resize: vertical; }
  #details .ev { display: flex; gap: 0.4rem; align-items: flex-start; font-size: 0.86rem; margin: 0.25rem 0; cursor: pointer; }
  #details .ev input { margin-top: 0.25rem; flex: none; }
  #details .addq { border: 1px dashed var(--line); border-radius: 8px; padding: 0.2rem 0.6rem 0.6rem; margin-top: 0.5rem; background: #fff; }
  #details .intro p, #details .intro li { font-size: 0.95rem; }
  #details .intro p { margin: 0 0 0.55rem; }
  #details .intro ul { margin: 0 0 0.6rem; padding-left: 1.1rem; }
  #details .intro li { margin-bottom: 0.25rem; }
  #details kbd { font-family: inherit; font-size: 0.82rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; background: #fff; }
  #details .swatches { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  #details .swatches label { width: 1.7rem; height: 1.7rem; border-radius: 50%; cursor: pointer; display: block; border: 3px solid transparent; }
  #details .swatches input { display: none; }
  #details .swatches input:checked + label { border-color: var(--ink); }
  #details .photo { background: #fff; border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.35rem 0.6rem; margin: 0.35rem 0; }
  #details .photo b { color: var(--accent); }
  #details .photo .meta { font-size: 0.8rem; color: var(--faded); }
</style>
</head>
<body>
<header>
  <a href="../../index.html">The Logic Portal</a><span class="slash">/</span>
  <a href="../../index.html#studies">Studies</a><span class="slash">/</span>
  <a href="index.html">The kinds of nothing</a><span class="slash">/</span>
  <b>The board</b>
</header>
<div class="tools">
  <span class="grp"><span class="lbl">Add</span>
    <button type="button" class="btn" data-add="part" title="A part of a model, in Kant’s terms">Part</button>
    <button type="button" class="btn" data-add="passage" title="A passage, with its citation">Passage</button>
    <button type="button" class="btn k-problem" data-add="problem" title="A model’s problem, in your words">Problem</button>
    <button type="button" class="btn k-note" data-add="note" title="Anything else, as on a whiteboard">Note</button>
    <button type="button" class="btn" data-add="model" title="A new model: a frame for parts">Model</button>
  </span>
  <span class="grp"><span class="lbl">View</span>
    <select class="vsel" id="vsel" aria-label="View"></select>
    <button type="button" class="btn" id="vnew" title="The same cards, in an arrangement of its own">New view</button>
    <button type="button" class="linkish" id="vmore">this view…</button>
  </span>
  <span class="grp">
    <input type="search" id="search" placeholder="Find on the board" aria-label="Find on the board"><span id="found"></span>
  </span>
  <span class="grp">
    <button type="button" class="btn" id="undo" title="Undo (⌘Z)">↶</button>
    <button type="button" class="btn" id="redo" title="Redo (⇧⌘Z)">↷</button>
  </span>
  <span class="grp">
    <button type="button" class="btn solid" id="snap" title="Keep the board as it is now, to come back to">Photograph the board</button>
    <button type="button" class="linkish" id="photos">Photographs</button>
  </span>
  <span class="grp">
    <button type="button" class="linkish" id="export">Export</button>
    <button type="button" class="linkish" id="import">Import</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </span>
</div>
<div class="wrap">
  <div id="stage">
    <div id="world">
      <svg id="ink" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="gframes"></g><g id="garrows"></g><path id="ghost" d=""></path><rect id="marq" class="marq" width="0" height="0" style="display:none"></rect></svg>
      <div id="cards"></div>
    </div>
    <div id="layers" class="float"></div>
    <div id="zoom" class="float"><button type="button" id="zout" title="Zoom out">−</button><span id="zk">100%</span><button type="button" id="zin" title="Zoom in">+</button><button type="button" id="zfit" title="Show the whole view">Fit</button><button type="button" id="ztidy" title="Lay this view out again, a column per model">Tidy</button></div>
    <div id="banner" class="float"></div>
    <div id="chooser" class="float"></div>
    <div id="toast" class="float"></div>
  </div>
  <aside id="side">
    <div class="tabs"><button type="button" id="tdet" class="on">On the board</button><button type="button" id="tread">Reading</button></div>
    <div id="details"></div>
    <div id="reading"><div class="bar"><span>The Logic Portal</span><a id="full" href="../../index.html" target="_blank" rel="noopener">open it full size ↗</a></div><iframe id="portal" title="The Logic Portal"></iframe></div>
  </aside>
</div>

<script src="board.js"></script>
<script>
/* ── Data ─────────────────────────────────────────────────────────────────── */
const BASE = typeof STUDY_BOARD !== 'undefined' ? STUDY_BOARD : { models: [], items: [], arrows: [], views: [] };
const PORTAL = '../../index.html';
const KEY = 'kantlab-board-kinds-of-nothing-v1';   // this browser's board: { v, board, photos, viewId }
const ME = 'kantlab-board-me';                     // the GitHub username last signed with
const TYPES = ['kept', 'renamed', 'split into', 'merged from', 'dropped', 'new'];
const PALETTE = ['#5c6e3a', '#8b5e3c', '#3b5068', '#6b4e7a', '#3f6b63', '#9a6a1e', '#7a3b3b', '#5a5a5a'];
const LAYERS = [
  { key: 'frames', label: 'Models, as frames', mark: 'sq' },
  { key: 'division', label: 'Kant’s divisions', color: '#b8a88a' },
  { key: 'hypothesis', label: 'Hypotheses, signed', color: '#5c3d1e' },
  { key: 'problem', label: 'Problems, and what may answer them', color: '#8a3b12', dash: '7 4' },
  { key: 'passage', label: 'Passages', mark: 'sq' },
  { key: 'note', label: 'Notes', mark: 'sq' },
  { key: 'computer', label: 'Same label (the computer’s)', color: '#9a8f7a', dash: '2 4' },
];
const INK = { division: '#b8a88a', hypothesis: '#5c3d1e', problem: '#8a3b12', computer: '#9a8f7a', passage: '#5c3d1e', note: '#5c3d1e' };
const DASH = { problem: '7 4', computer: '2 4' };
const FAR = 0.55, NEAR = 1.3;

/* ── State ────────────────────────────────────────────────────────────────── */
let B;                 // the board: { models, items, arrows, views, removed }
let photos = [];       // photographs: { id, name, date, by, board }
let viewId;            // the view shown
let live = null;       // while a photograph is shown, the board it stands in for
let undoStack = [], redoStack = [];
let sel = { kind: null, ids: [] };   // kind: 'card' | 'arrow' | 'model'
let form = null;       // the form open on the side, if any
let mode = null;       // { linkFrom } while choosing where an arrow goes
let focus = null;      // { id, hops }
let query = '';
let cam = { x: 40, y: 30, k: 1 };
let size = {};         // card id → { w, h }, as last drawn
let side = 'details';

/* ── Builders: the board ──────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);

/* ── Builders: where things stand ─────────────────────────────────────────── */

    const before = { m: B.models.length, i: B.items.length, a: B.arrows.length, v: B.views.length };
    // Someone else's board: what is new comes in beside yours; nothing of yours is overwritten.
    change(() => { merge(B, { models: d.board.models || [], items: d.board.items, arrows: d.board.arrows || [], views: d.board.views || [] }); });
    const have = new Set(photos.map(p => p.id)); (d.photos || []).forEach(p => { if (!have.has(p.id)) photos.push(p); }); save();
    render();
    toast('Added ' + (B.items.length - before.i) + ' cards, ' + (B.arrows.length - before.a) + ' arrows, ' + (B.models.length - before.m) + ' models and ' + (B.views.length - before.v) + ' views. Nothing of yours was changed.');
  }).catch(() => alert('That file is not an export of this board.'));
});

/* ── Init ─────────────────────────────────────────────────────────────────── */
load();
render();
// Cards are measured once the page is laid out, and again when its fonts arrive, since they change every card's size.
const settle = () => { renderBoard(); if (view().cam) { cam = Object.assign({}, view().cam); applyCam(); } else fit(); };
requestAnimationFrame(settle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!drag) settle(); });
</script>
</body>
</html>
