<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A topic’s board · My topics · the Logic Portal · Kant Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap');

  /* The Logic Portal's palette and fonts. This page began as the board of the study the kinds of
     nothing (studies/kinds-of-nothing/board.html), and is now the portal's own: the two go their own ways. */
  :root {
    --ink: #1a1208;
    --parchment: #f5efe0;
    --parchment-dark: #e8dfc8;
    --panel: #faf7f0;
    --card: #fbf8f1;
    --accent: #5c3d1e;
    --accent-light: #8b5e3c;
    --faded: #7a6a52;
    --line: #b8a88a;
    --line-soft: #d9ccb0;
    --prob: #8a3b12;      /* problems, and what may answer them */
    --note: #fff6c9;      /* what is written on the board */
    --machine: #9a8f7a;   /* what the computer drew */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--parchment);
         display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-light); }

  header { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); background: var(--parchment-dark);
           font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.05em; flex: none; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .slash { color: var(--line); }
  header b { color: var(--accent); font-weight: 600; }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.5rem; padding: 0.4rem 0.8rem; border-bottom: 1px solid var(--line-soft); background: var(--panel); flex: none; }
  .tools .grp { display: flex; align-items: center; gap: 0.3rem; padding-right: 0.6rem; margin-right: 0.1rem; border-right: 1px solid var(--line-soft); }
  .tools .grp:last-child { border-right: 0; }
  .tools .lbl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin-right: 0.15rem; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--accent); border-radius: 999px; padding: 0.05rem 0.7rem; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-light); background: var(--card); }
  .btn.solid { background: var(--accent); color: var(--parchment); border-color: var(--accent); }
  .btn.solid:hover { background: var(--accent-light); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.k-problem { color: var(--prob); border-color: #d6b19c; }
  header a.back { font-family: 'EB Garamond', serif; font-size: 1rem; letter-spacing: 0; border: 1px solid var(--accent); border-radius: 999px; padding: 0 0.7rem; margin-right: 0.4rem; background: var(--accent); color: var(--parchment); }
  header a.back:hover { background: var(--accent-light); text-decoration: none; }
  header #tname { font-family: 'EB Garamond', serif; font-size: 1.05rem; letter-spacing: 0; }
  .btn.k-note { background: var(--note); }
  select.vsel { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0.05rem 0.3rem; max-width: 16rem; color: var(--accent); }
  #search { border: 1px solid var(--line); border-radius: 999px; padding: 0.05rem 0.7rem; width: 11rem; background: #fff; }
  #found { font-size: 0.82rem; color: var(--faded); min-width: 3.5rem; }
  .linkish { background: none; border: 0; padding: 0; color: var(--faded); cursor: pointer; text-decoration: underline; font-size: 0.86rem; }
  .linkish:hover { color: var(--accent); }

  .wrap { flex: 1; display: flex; min-height: 0; }

  /* ── The stage: an endless board, panned and zoomed ── */
  #stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
           background-color: #f7f2e4; background-image: radial-gradient(#ddd1b6 1px, transparent 1px); background-size: 24px 24px; }
  #stage.panning { cursor: grabbing; }
  #stage.linking, #stage.linking .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #ink { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #ink .ar { pointer-events: auto; cursor: pointer; }
  #ink .ar path.hit { fill: none; stroke: transparent; stroke-width: 16; }
  #ink .ar path.v { fill: none; stroke-width: 2.2; }
  #ink .ar.division path.v { stroke-width: 1.5; }
  #ink .ar.sel path.v { stroke-width: 4; }
  #ink .ar .pill rect { fill: #fff; stroke-width: 1.3; }
  #ink .ar .pill text { font-family: 'EB Garamond', serif; font-size: 13px; fill: var(--accent); }
  #ink .ar.problem .pill text { fill: var(--prob); }
  #ink .ar.computer .pill text { fill: var(--faded); font-style: italic; }
  #ink .frame rect.f { stroke-width: 2; }
  #ink .frame.sel rect.f { stroke-width: 3.5; }
  #ink .frame.drop rect.f { stroke-width: 3.5; fill-opacity: 0.14; }   /* a passage dragged from Passages is over it */
  #ink .marq { fill: rgba(139, 94, 60, 0.08); stroke: var(--accent-light); stroke-dasharray: 5 4; }
  #ink #ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .dim { opacity: 0.14; }
  #ink .ar.dim { opacity: 0.08; }

  /* frame tabs: a model's name, and the handle that moves it */
  .ftab { position: absolute; color: #fff; border-radius: 7px 7px 7px 0; padding: 0.1rem 0.6rem 0.12rem; white-space: nowrap; cursor: move; font-size: 0.9rem; }
  .ftab b { font-family: 'Cinzel', serif; letter-spacing: 0.04em; font-weight: 600; margin-right: 0.35rem; }
  .ftab i { opacity: 0.92; }
  .ftab small { display: block; font-size: 0.72rem; opacity: 0.85; margin-top: -0.1rem; }

  /* cards */
  .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-left-width: 5px; border-radius: 8px; padding: 0.3rem 0.55rem 0.35rem;
          box-shadow: 0 1px 2px rgba(60, 40, 10, 0.12); cursor: pointer; }
  .card:hover { box-shadow: 0 2px 8px rgba(60, 40, 10, 0.2); }
  .card.sel { outline: 3px solid var(--accent-light); outline-offset: 1px; }
  .card.hit { outline: 3px solid #d9a441; outline-offset: 1px; }
  .card.k-part { width: 168px; text-align: center; }
  .card.k-part .lab { display: block; font-weight: 600; color: var(--accent); font-size: 1.02rem; line-height: 1.15; }
  .card.k-part .lab.lat { font-style: italic; }
  .card .sub { display: block; font-size: 0.8rem; color: var(--faded); font-style: italic; margin-top: 0.1rem; line-height: 1.15; }
  .card .count { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.15rem; font-family: 'Cinzel', serif; letter-spacing: 0.06em; }
  .card .nearq { display: none; text-align: left; font-size: 0.8rem; font-style: italic; margin-top: 0.3rem; border-top: 1px dotted var(--line-soft); padding-top: 0.25rem; line-height: 1.25; }
  .card .nearq span { font-style: normal; color: var(--faded); font-size: 0.72rem; }
  .card.k-passage { width: 250px; background: var(--card); border-color: var(--line); font-size: 0.86rem; }
  .card.k-passage .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.1rem; }
  .card.k-passage .pq { font-style: italic; line-height: 1.25; }
  .card.k-passage .pc { display: block; font-size: 0.75rem; color: var(--faded); margin-top: 0.2rem; }
  .card.k-passage .pc .pof { margin-left: 0.35rem; }
  .card.k-passage .para, #details .para { font-style: normal; color: var(--accent-light); font-size: 0.85em; }
  .card.slost { border-style: dashed; }
  #details .q .t .out { color: var(--faded); opacity: 0.75; }
  #details .q .t .in { background: var(--note); }
  #details .sxbox { background: #fff; border: 1px solid var(--line); padding: 0.4rem 0.6rem; max-height: 46vh; overflow: auto; font-size: 0.9rem; line-height: 1.45; margin: 0 0 0.5rem; }
  #details .sx { margin: 0 0 0.55rem; }
  #details .sx.far { color: var(--faded); }
  #details .sx .sc { display: block; font-size: 0.72rem; color: var(--faded); font-style: normal; user-select: none; }
  #details .sx mark.in { background: var(--note); color: var(--ink); border-radius: 2px; }
  #details .sx .sm { cursor: pointer; font-style: normal; user-select: none; }   /* drawn by CSS alone, so that the text selected is the passage's */
  #details .sx .sm::before { content: '‖'; margin: 0 0.12rem 0 0; font-size: 0.72rem; color: var(--accent-light); opacity: 0.55; }
  #details .sx .sm:hover::before { color: var(--accent); opacity: 1; }
  #details .sx.cutting .sm::before { content: ''; margin: 0; }
  #details .sx.cutting .sm.can::before { content: '✂'; margin: 0 0.15rem; color: var(--accent-light); font-size: 0.8rem; opacity: 1; }
  #details .sx .sm.cut::before { content: '✂'; margin: 0 0.15rem; color: var(--prob); font-size: 0.95rem; opacity: 1; }
  #details .sxrow { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: baseline; font-size: 0.82rem; margin: 0.15rem 0 0.35rem; }
  #details .sxrow b { font-weight: 600; color: var(--accent); min-width: 2.6rem; }
  #details .sxnow { font-size: 0.86rem; margin: 0 0 0.4rem; }
  /* a passage card opened to its passage in full: wider, and above the cards it covers until it is closed */
  .card.k-passage.open { width: 340px; z-index: 3; box-shadow: 0 3px 14px rgba(60, 40, 10, 0.25); }
  .card.k-passage .pl { display: block; font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.08em; color: var(--accent); margin: 0.3rem 0 0.05rem; }
  .card .more { display: block; margin-top: 0.15rem; padding: 0; border: 0; background: none; color: var(--faded); font: inherit; font-size: 0.75rem; text-decoration: underline; cursor: pointer; }
  .card .more:hover { color: var(--accent); }
  .card.k-problem { width: 260px; background: #fff7f1; border-color: #d6b19c; border-left-color: var(--prob); font-size: 0.88rem; line-height: 1.25; }
  .card .tag { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.09em; color: var(--prob); margin-bottom: 0.15rem; }
  .card.k-note { width: 190px; background: var(--note); border-color: #e6d58a; font-size: 0.9rem; line-height: 1.25; transform: rotate(-0.6deg); }
  .card.k-note .tag { color: #8a7420; }
  .card .who { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.2rem; text-align: right; }
  .card .chk { color: #a0661a; font-size: 0.7rem; display: block; margin-top: 0.15rem; }
  .card .knob { position: absolute; right: -13px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
                font-size: 13px; line-height: 21px; text-align: center; cursor: crosshair; display: none; box-shadow: 0 0 0 2px #fff; }
  .card:hover .knob, .card.sel .knob { display: block; }
  #stage.readonly .knob { display: none !important; }
  /* depth: zoomed out, a card is its name; zoomed in, its first passage shows */
  #world.far .card .sub, #world.far .card .count, #world.far .card .who, #world.far .card .chk { display: none; }
  #world.far .card.k-part .lab { font-size: 1.5rem; }
  #world.far .card.k-passage .pq, #world.far .card.k-problem, #world.far .card.k-note { font-size: 1.15rem; }
  #world.near .card .nearq { display: block; }

  /* floating boxes on the stage */
  .float { position: absolute; background: rgba(250, 247, 240, 0.96); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(60, 40, 10, 0.12); font-size: 0.86rem; cursor: default; }
  #layers { left: 12px; bottom: 12px; padding: 0.45rem 0.7rem 0.5rem; max-width: 260px; }
  #layers .ttl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); display: block; margin-bottom: 0.2rem; }
  #layers label { display: flex; align-items: center; gap: 0.4rem; margin: 0.05rem 0; cursor: pointer; }
  #layers label i { display: inline-block; width: 1.4rem; height: 0; border-top: 2px solid var(--accent); }
  #layers label i.sq { height: 0.7rem; border: 1.5px solid var(--line); border-radius: 3px; }
  #layers label span.n { color: var(--faded); margin-left: auto; padding-left: 0.6rem; }
  #layers.closed label { display: none; }
  #zoom { right: 12px; bottom: 12px; padding: 0.2rem 0.3rem; display: flex; align-items: center; gap: 0.2rem; }
  #zoom button { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 1rem; padding: 0.1rem 0.45rem; border-radius: 6px; }
  #zoom button:hover { background: var(--parchment-dark); }
  #zoom #zk { min-width: 3.2rem; text-align: center; color: var(--faded); font-size: 0.82rem; }
  #banner { left: 50%; top: 12px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; align-items: center; gap: 0.6rem; max-width: 80%; }
  #banner.show { display: flex; }
  #banner.photo { background: #eef2f6; border-color: #3b5068; }
  #banner .btn { font-size: 0.82rem; }
  #chooser { display: none; padding: 0.35rem; gap: 0.3rem; flex-wrap: wrap; width: 230px; }
  #chooser.show { display: flex; }
  #chooser .ttl { flex-basis: 100%; font-size: 0.78rem; color: var(--faded); padding: 0 0.2rem; }
  #chooser textarea { flex-basis: 100%; border: 1px solid #e6d58a; background: var(--note); border-radius: 6px; padding: 0.3rem 0.45rem; font-size: 0.92rem; resize: vertical; }
  #chooser { width: 260px; }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; }
  #toast.show { display: block; }

  /* ── The side: what is selected, and the portal ── */
  #side { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side .tabs { display: flex; border-bottom: 1px solid var(--line-soft); flex: none; }
  #side .tabs button { flex: 1; border: 0; background: none; padding: 0.45rem 0.15rem; white-space: nowrap; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.04em; color: var(--faded); border-bottom: 2px solid transparent; }
  #side .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #details { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; }
  #reading { flex: 1; display: none; flex-direction: column; min-height: 0; }
  /* the topic's passages, waiting to be put on the board one at a time */
  #passages { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; display: none; }
  #passages h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #passages .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #passages .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #passages .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; }
  #passages .pp { background: #fff; border: 1px solid var(--line-soft); border-left: 4px solid var(--line); border-radius: 6px; padding: 0.35rem 0.55rem 0.4rem; margin: 0 0 0.45rem; cursor: grab; }
  #passages .pp:hover { border-color: var(--accent-light); }
  #passages .pp.dragging { opacity: 0.5; }
  #passages .pp .pc { font-size: 0.84rem; color: var(--accent); font-weight: 600; }
  #passages .pp .pc span { color: var(--faded); font-weight: 400; }
  #passages .pp .pw { font-style: italic; font-size: 0.9rem; line-height: 1.25; margin: 0.15rem 0 0.3rem; }
  #passages .pp .row { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: center; }
  #passages .pp .pl { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--accent); margin: 0.35rem 0 0.1rem; }
  #passages .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.2rem 0.5rem; margin: 0.2rem 0; cursor: pointer; font-size: 0.88rem; color: var(--accent); }
  #passages .rel:hover { border-color: var(--accent-light); }
  /* finding among them: the box stays at the top as the list scrolls (top: less the padding above it) */
  #passages .ppbar { position: sticky; top: -0.8rem; z-index: 1; display: flex; align-items: baseline; gap: 0.5rem; margin: 0 -1rem 0.5rem; padding: 0.45rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line-soft); }
  #passages .ppbar[hidden] { display: none; }
  #ppfind { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.7rem; background: #fff; font: inherit; font-size: 0.92rem; }
  #ppfound { font-size: 0.82rem; color: var(--faded); white-space: nowrap; }
  #passages mark.pf { color: inherit; background: color-mix(in srgb, #d9a441 38%, transparent); border-radius: 2px; padding: 0 1px; }
  #passages .pin { display: block; font-size: 0.84rem; line-height: 1.25; color: var(--faded); margin: -0.1rem 0 0.3rem; }
  #passages .pin i { font-style: normal; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--accent); margin-right: 0.3rem; }
  #passages .rel .pin { margin: 0.1rem 0 0; }
  #passages .rel .ppg { color: var(--faded); font-size: 0.8rem; }
  #passages .rel[draggable="true"] { cursor: grab; }
  #boards { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; display: none; }
  #boards h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #boards .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #boards .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #boards .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; }
  #boards .pp { background: #fff; border: 1px solid var(--line-soft); border-left: 4px solid var(--line); border-radius: 6px; padding: 0.35rem 0.55rem 0.4rem; margin: 0 0 0.45rem; cursor: grab; }
  #boards .pp:hover { border-color: var(--accent-light); }
  #boards .pp.dragging { opacity: 0.5; }
  #boards .pp .pc { font-size: 0.84rem; color: var(--accent); font-weight: 600; }
  #boards .pp .pc span { color: var(--faded); font-weight: 400; }
  #boards .pp .pw { font-style: italic; font-size: 0.9rem; line-height: 1.25; margin: 0.15rem 0 0.3rem; }
  #boards .pp .row { display: flex; gap: 0.6rem; align-items: center; }
  #boards .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.2rem 0.5rem; margin: 0.2rem 0; cursor: pointer; font-size: 0.88rem; color: var(--accent); }
  #boards .rel:hover { border-color: var(--accent-light); }
  #side .tabs button b.n { display: inline-block; min-width: 1.1rem; margin-left: 0.25rem; padding: 0 0.3rem; border-radius: 999px; background: var(--accent); color: var(--parchment); font-family: 'EB Garamond', serif; font-size: 0.75rem; letter-spacing: 0; font-weight: 400; }
  #stage.dropping { outline: 3px dashed var(--accent-light); outline-offset: -6px; }
  /* a link to another topic's board, or to a card or group on it */
  .card.k-link { width: 230px; background: #eef3f8; border-color: #a9bed2; border-left-color: #2f5d8a; font-size: 0.86rem; line-height: 1.25; }
  .card.k-link .lt { display: block; font-family: 'Cinzel', serif; font-size: 0.64rem; letter-spacing: 0.06em; color: #2f5d8a; margin-bottom: 0.1rem; }
  .card.k-link .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; }
  .card.k-link .lti { display: block; color: var(--accent); }
  .card.k-link .lw { font-style: italic; color: #3b3328; margin-top: 0.1rem; }
  .card.k-link.gone { border-style: dashed; border-left-style: dashed; background: #f3f2ef; opacity: 0.85; }
  .card .inl, .ftab .inl { position: absolute; top: -0.65rem; left: 0.5rem; background: #2f5d8a; color: #fff; border-radius: 999px; padding: 0 0.45rem; font-size: 0.7rem; font-style: normal; font-family: 'EB Garamond', serif; letter-spacing: 0; }
  .card .also { display: inline-block; margin-top: 0.25rem; border: 1px dashed #9a8f7a; color: var(--faded); border-radius: 999px; padding: 0 0.45rem; font-size: 0.68rem; font-style: normal; }
  /* a passage with other cards on the board: where they are, and, while one is selected, the others outlined */
  .card .twin { display: inline-flex; align-items: center; gap: 0.2rem; margin: 0.25rem 0.3rem 0 0; border: 1px solid var(--line); background: #fff; color: var(--faded); border-radius: 999px; padding: 0 0.45rem; font-size: 0.68rem; font-style: normal; cursor: pointer; }
  .card .twin:hover { border-color: var(--accent-light); color: var(--accent); }

  /* editing in place, on the board itself */
  .card [contenteditable="true"], .card [contenteditable="plaintext-only"] { -webkit-user-select: text; user-select: text; cursor: text; outline: 2px solid #d9a441; outline-offset: 2px; border-radius: 3px; background: #fffdf3; min-width: 2.5rem; display: inline-block; }

  /* boxes: divisions drawn on the board, behind the cards */
  .card.k-box { background: rgba(255, 255, 255, 0.28); border: 2px dashed var(--accent-light); border-left-width: 2px; border-radius: 10px; box-shadow: none; padding: 0.3rem 0.6rem; }

  .card.k-box .blab:empty::before { content: 'double-click to name it'; color: var(--faded); font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; letter-spacing: 0; }
  .card .bgrip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--accent-light) 50%); border-bottom-right-radius: 8px; opacity: 0.75; }

  /* tables: rows and columns of the reader's words and passages, the first row or column headings if the reader chose */
  .card.k-table { background: #fff; border-left-width: 1.5px; padding: 0.3rem 0.4rem 0.45rem; font-size: 0.86rem; line-height: 1.25; }
  .card.k-table .tcap { display: block; font-weight: 600; color: var(--accent); font-size: 0.95rem; margin: 0 0.1rem 0.25rem; }

  .card.k-table td, .card.k-table th { border: 1px solid var(--line-soft); padding: 0.2rem 0.35rem; vertical-align: top; text-align: left; overflow-wrap: anywhere; }

  .card.k-table th.corner { background: #ddd0b2; }
  .card.k-table .tt { display: block; white-space: pre-wrap; min-height: 1.15em; }

  .card.k-table .tp { display: inline-block; border: 1px solid var(--line); border-left: 3px solid var(--accent-light); border-radius: 4px; background: var(--card); color: var(--accent); font-size: 0.78rem; font-weight: 400; padding: 0 0.3rem; cursor: pointer; }

  .card.k-table td.tdrop, .card.k-table th.tdrop { background: color-mix(in srgb, #d9a441 30%, #fff); }
  /* a parallel in a cell: in its colour, its letter and name, or its words in one passage and their citation */

  .card.k-table .tpar { display: inline-block; max-width: 100%; border: 1px solid var(--pc); border-left: 3px solid var(--pc); border-radius: 4px; background: #fff; color: var(--pc); font-size: 0.78rem; font-weight: 400; line-height: 1.25; padding: 0.05rem 0.3rem; cursor: pointer; text-align: left; }

  .card.k-table .tpar.phov { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #d9a441; }
  .card.k-table td.tpon, .card.k-table th.tpon { box-shadow: inset 0 0 0 2px var(--pc); background: color-mix(in srgb, var(--pc) 8%, #fff); }
  #pardrag { position: fixed; z-index: 60; pointer-events: none; display: none; border: 1px solid var(--pc); border-left: 3px solid var(--pc); border-radius: 4px; background: #fff; color: var(--pc); font: 0.85rem/1.3 'EB Garamond', Georgia, serif; padding: 0.1rem 0.4rem; box-shadow: 0 3px 10px rgba(0,0,0,0.18); max-width: 260px; }
  #details .tcellpar { display: flex; flex-wrap: wrap; gap: 0.2rem 0.5rem; align-items: center; margin: 0.15rem 0 0.35rem; }
  #details .tcellpar .rel { flex: 1 1 100%; }
  #details .tcellpar select { flex: 1; min-width: 0; font: inherit; font-size: 0.85rem; }
  .card .tcol { position: absolute; width: 9px; margin-left: -4px; cursor: col-resize; display: none; border-radius: 3px; }

  /* a cell's own knob, to draw an arrow from that cell alone: shown on the cell under the mouse, and on the cell last clicked */
  .card.k-table .tw { position: relative; }
  .card.k-table .ck { position: absolute; right: -0.3rem; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--accent-light); color: #fff; font-size: 10px; line-height: 16px;
                      text-align: center; font-weight: 400; font-style: normal; cursor: crosshair; display: none; box-shadow: 0 0 0 1.5px #fff; }
  .card.k-table td:hover > .tw > .ck, .card.k-table th:hover > .tw > .ck, .card.k-table.sel .tsel > .tw > .ck { display: block; }
  #stage.linking .card.k-table .ck { display: none; }
  @media (pointer: coarse) {
    .card.k-table .ck { width: 26px; height: 26px; margin-top: -13px; line-height: 26px; font-size: 14px; }

    .card.k-table.sel .tsel > .tw > .ck { display: block; }

  /* what an arrow being drawn would go to: a card, a cell of a table, or a group */
  .card.lto { outline: 3px dashed var(--accent); outline-offset: 2px; }
  .card.k-table td.lto, .card.k-table th.lto { box-shadow: inset 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent-light) 14%, #fff); }
  #ink .frame.lto rect.f { stroke-width: 4; fill-opacity: 0.14; }
  .ftab.lto { outline: 2px solid var(--ink); }
  /* an arrow to or from a cell is drawn again over its table, as far as the table's edge, so that it is seen to reach the cell */
  #drawn .cin path.v { fill: none; stroke-width: 1.8; opacity: 0.85; }
  #drawn .cin.sel path.v { stroke-width: 3.2; }
  #drawn .cin.dim { opacity: 0.08; }

<script>
/* ── Data ─────────────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────────────────────
   A topic's board. Each topic in My topics (topics.js) can have one. The topic's passages wait
   under Passages, in the side, and the reader puts them on the board one at a time, as cards;
   around them goes whatever the reader adds, notes, questions, groups, boxes, arrows, drawing
   and annotations. Nothing comes onto the board by itself. It is the reader's alone.

   It is kept in My topics' own store, in this browser's localStorage, beside the topics, so
   that it goes wherever they go: Save to file, and the locked file on GitHub when Keep on
   GitHub is on. This page never holds a token. It writes the store, and the portal in its
   side, or any tab of the portal, sends the change to GitHub, as it sends any change of
   its own. Before each save the page reads the store afresh and folds in whatever changed
   there meanwhile, so nothing of the topics is written over.

   The page began as the study's board (studies/kinds-of-nothing/board.html), and keeps its
   shape: models (here called groups), items (the cards), arrows, views, photographs. A
   passage card names the passage kept in My topics by its id (mt), with its address and
   citation beside it in case the passage is later taken out of My topics; its words are
   the portal's, read from the portal in the side, or the copy My topics kept until that has
   loaded. Annotations belong to the passage, not the board: they are kept once, beside the
   boards, and show on every board of the reader's where their passage stands.

   An arrow goes from and to a card, a group, or one cell of a table: { from, to } are the
   card's or group's id, and where an end is a cell, fromCell or toCell is that cell's own id
   (see Builders: tables), so that a page which does not know cells still reads it as an arrow
   to the table.
   ───────────────────────────────────────────────────────────────────────────── */
const PORTAL = 'index.html';
const TOPICS = 'kantlab-topics-v1';               // My topics' store (topics.js), which the board is kept in
const TOPICS_GH = 'kantlab-topics-github';        // set while My topics keeps a copy on GitHub in this browser
const BASE = { models: [], items: [], arrows: [], views: [] };
const TYPES = ['develops', 'contradicts', 'qualifies', 'same as', 'cf.'];
const BIG = 2e6;
const API = 'https://api.github.com';             // the only place a token is ever sent
const ORG = 'kant-lab-seminar';                   // a shared board is a private repository of the seminar's organisation
const NEW_REPO_WAIT = 30000;                      // ms: how long a repository just made is given to take its first file
const TOKEN_KEY = 'kantlab-topics-token';         // My topics' token (topics.js): sessionStorage, or localStorage if remembered
const QUEUE_TOKEN_KEY = 'kantlab-queue-token';    // the queue's, if that is the one this browser has
const SHARED_CACHE = 'kantlab-shared-board:';     // + the repository: this device's last copy of a shared board
const SHARE_UNFINISHED = 'kantlab-share-unfinished:';   // + the topic: a repository a Share made but put no board in, for the next Share to use
const SHARED_LIST = 'kantlab-shared-boards';      // the shared boards this browser knows of, for My topics' list
const TOKEN_HOWTO = 'https://github.com/mikrishnan/kant-lab/blob/main/logic-portal/README.md#sharing-a-board';
const POLL_MS = 5000, SAVE_MS = 2500;                                  // past this many characters the store has, the page warns
const PALETTE = ['#5c6e3a', '#8b5e3c', '#3b5068', '#6b4e7a', '#3f6b63', '#9a6a1e', '#7a3b3b', '#5a5a5a'];
const LAYERS = [
  { key: 'frames', label: 'Groups, as frames', mark: 'sq' },
  { key: 'hypothesis', label: 'Arrows', color: '#5c3d1e' },
  { key: 'problem', label: 'Questions, and what may answer them', color: '#8a3b12', dash: '7 4' },
  { key: 'passage', label: 'Passages', mark: 'sq' },
  { key: 'link', label: 'Links to other boards', mark: 'sq' },
  { key: 'note', label: 'Notes', mark: 'sq' },
  { key: 'drawing', label: 'Drawing', color: '#b03a2e' },
  { key: 'box', label: 'Boxes', mark: 'sq' },
  { key: 'table', label: 'Tables', mark: 'sq' },
  { key: 'annotations', label: 'Annotations, and what they join', color: '#2f5d8a', dash: '2 4' },
  { key: 'parallels', label: 'Parallels, through their knots', color: '#3b5068' },
  { key: 'echoes', label: 'Echoes, as ribbons', color: '#6b4e7a' },
];
const INK = { division: '#b8a88a', hypothesis: '#5c3d1e', problem: '#8a3b12', computer: '#9a8f7a', passage: '#5c3d1e', note: '#5c3d1e' };
const DASH = { problem: '7 4', computer: '2 4' };
const FAR = 0.55, NEAR = 1.3;
const PENS = ['#1a1208', '#8b5e3c', '#b03a2e', '#2f5d8a', '#5c6e3a'];
// Tables: the most rows and columns one can have, a new column's width on the board, and the narrowest a column can be.
const TABLE_MAX = { cols: 12, rows: 40 };
const TABLE_CW = 140, TABLE_MINW = 48;
const TABLE_TYPE = 'application/x-kantlab-table';   // a table copied from a board, whole: its headings, widths and passages too
// What can be said about a passage, or some of its words. A new kind is one more line here.
const ANN_KINDS = [
  { key: 'problem', label: 'Problem', color: '#8a3b12', hint: 'What is wrong or puzzling here: an OCR slip, a reading that does not fit, a clash with another passage' },
  { key: 'relevant', label: 'Relevant to…', color: '#2f5d8a', hint: 'Why, in a few words (optional)' },
  { key: 'interpretation', label: 'Interpretation', color: '#5c6e3a', hint: 'A possible reading, in your words' },
  { key: 'comment', label: 'Comment', color: '#9a6a1e', hint: 'Anything else' },
];
const ANN_CTX = 32;   // the characters kept either side of the words annotated, so that they can be found again
// Parallels: words in several passages that answer one another, each passage's words a place in it. The kinds
// offered for one (any word of one's own will do), their colours (the groups' palette, in another order), how many
// characters a card shows before the chosen parallel's words, and the most passages Compare sets side by side.
const PAR_TYPES = ['same words', 'same term', 'translation', 'paraphrase', 'example', 'contrast', 'cf.'];
const PAR_COLORS = ['#3b5068', '#9a6a1e', '#6b4e7a', '#3f6b63', '#5c6e3a', '#7a3b3b', '#8b5e3c', '#5a5a5a'];
const PAR_WIN = 80;
const ACCENT_INK = '#6b4e7a';   // the colour of an echo's buttons, before it has a colour of its own
const CMP_MAX = 4;
// Echoes: a stretch that answers a stretch elsewhere, two at a time. How close, in the order offered (unlike: looked at
// and found not to answer, which is listed but never drawn as a connection); the kinds offered (any word of one's own
// will do); the characters kept at each edge of a stretch to find it again; and the most columns of brackets in a margin.
const ECHO_DEG = [{ key: 'close', label: 'close', op: 0.36 }, { key: 'partial', label: 'partial', op: 0.22 }, { key: 'loose', label: 'loose', op: 0.11 }, { key: 'unlike', label: 'checked: not alike', op: 0 }];
const ECHO_TYPES = ['same argument', 'same steps, another order', 'abridged', 'expanded', 'same conclusion, other grounds', 'same example', 'same shape, other matter', 'answers or objects to', 'cf.'];
const ECHO_EDGE = 40;
const ECHO_COLS = 4;
const ECHO_MAX = 30;   // the most stretches the matrix sets against one another
const PREFS = 'kantlab-topic-board-prefs-v1:';      // + the topic: this device's own camera, layers and view, kept apart from the board

/* ── State ────────────────────────────────────────────────────────────────── */
let B;                 // the board: { models, items, arrows, views, removed }
let photos = [];       // photographs: { id, name, date, board }, kept in the board, apart in memory so that undo does not copy them
let TID = new URLSearchParams(location.hash.slice(1)).get('t') || '';   // the topic, by its id in My topics
let DB = null;         // My topics' store, as last read or written here
let topic = null;      // the topic in it
let seenB = '';        // the board as kept, as last read or written here (the base two changes are merged against)
let seenA = '[]';      // the annotations likewise
let lost = '';         // why nothing can be saved: 'unreadable' (My topics would not read), 'gone' (the topic is not in it)
let FW = null;         // the portal in the side, once its texts are in
let pendingStore = false;   // the store changed during a drag or an edit: taken in when it ends
let SHM = false;       // a shared board: kept in a repository of its own, not in My topics
let SH = null;         // its state: { repo, token, login, role: owner | collab | reader | archived, owner, sha, etag, base, status, … }
let SP = [];           // its passages
let SG = {};           // the passages taken out of it: { id: when }
let STOPIC = null;     // its topic, as its file has it: { id, name, note }
let viewId;            // the view shown
let live = null;       // while a photograph is shown, the board it stands in for
let undoStack = [], redoStack = [];
let sel = { kind: null, ids: [] };   // kind: 'card' | 'arrow' | 'model'
let form = null;       // the form open on the side, if any
let mode = null;       // { linkFrom } while choosing where an arrow goes
let focus = null;      // { id, hops }
let query = '';
let ppQuery = '';      // what is being looked for among the topic's passages, under Passages
let ppOpen = new Set(); // the topic's passages opened under Passages, to be read there in full, by id
let cardOpen = new Set(); // passage cards opened on the board, to be read there in full, by card id; never saved
let cam = { x: 40, y: 30, k: 1 };
let size = {};         // card id → { w, h }, as last drawn
let cbox = {};         // table id → { cell id → { x, y, w, h } }: where each cell an arrow ends at stands in its table, as last drawn
let ltoEl = null;      // what an arrow being drawn would go to, lit
let side = 'details';
let tool = 'move';     // 'move' | 'select' | 'pen' | 'erase'
let pen = PENS[2];
let sawPencil = false; // once an Apple Pencil has drawn, fingers move the board rather than draw
let offer = null;      // what a stroke just drawn may mean: { kind: 'arrow', from, to, stroke } | { kind: 'lasso', ids, stroke }
let spaceDown = false;
let prefs = {};        // this device's camera, layers and view, kept apart from the board
let editing = null;    // something being edited in place: { el, finish }
let annPick = null;    // words selected in a passage in the side, for the annotation bar: { card, qi, start, end, rect }
let sideStale = false; // someone else saved while words were being selected in the side: redraw it once the selection ends
let AX = null;         // the annotations, indexed by passage (see annIndex)
let tcell = null;      // the cell of a table last clicked: { id, r, c }
let hand = null;       // the parallel in hand, by id: offered first by words selected, until it is put down
let parSel = null;     // the parallel chosen, by id: its cards turn to its words and the rest dim, until Esc
let compare = null;    // Compare, while it is open: { ids: the passage cards side by side, top: card id → scroll }
let cmpStale = false;  // the store changed while words were being selected in Compare: drawn again once that ends
let hovPar = '';       // the parallel pointed at, lit wherever its words stand
let copyTable = null;  // a table being copied by its button in the side
let ehand = null;      // the stretch in hand, for an echo: one end as an echo keeps it, offered first by words selected, until put down
let echoSel = null;    // the echo chosen, by id: its ribbon and brackets strong, the rest faint, until Esc
let hovEcho = '';      // the echo pointed at, lit wherever its stretches stand
let echoChains = false; // the matrix shows the page's chains through a middle stretch: never saved

/* ── Builders: the board ──────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const me = () => SHM && SH && SH.login ? SH.login : '';    // your own board is yours alone, and nothing on it is signed; a shared one is signed
const now = () => new Date().toISOString();
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
// Keys in one order all the way down, so that two copies of the same board compare equal.
const deep = x => Array.isArray(x) ? x.map(deep) : isObj(x) ? Object.keys(x).sort().reduce((r, k) => { r[k] = deep(x[k]); return r; }, {}) : x;
// What is worked out here for a card and never saved: its passage's words, whether it is still under the topic.
const hide = (o, k, v) => Object.defineProperty(o, k, { value: v, writable: true, configurable: true, enumerable: false });
const view = () => B.views.find(v => v.id === viewId) || B.views[0];
const item = id => B.items.find(i => i.id === id);
const arrow = id => B.arrows.find(a => a.id === id);
const model = id => B.models.find(m => m.id === id);
const ro = () => !!live || !!lost || (SHM && (!SH || !SH.ready || SH.role === 'reader' || SH.role === 'archived'));
const roWhy = () => live ? 'This is a photograph. Bring it back to change it.' : lost === 'noaccess' ? 'This board is not shared with you, or no longer exists.' :
  SHM && SH && SH.role === 'archived' ? 'This board is no longer shared: it can be looked at, not changed.' : SHM && SH && SH.role === 'reader' ? 'You can look at this board: @' + SH.owner + ' has not given you write access.' :
  SHM && (!SH || !SH.ready) ? 'The shared board is still opening.' : lost === 'unreadable' ? 'My topics would not read in this browser, so nothing here is saved.' : 'This topic is not in My topics in this browser, so nothing here is saved.';
const layersOf = () => Object.assign({}, view().layers || {}, (prefs.layers || {})[viewId] || {});
const layerOn = k => layersOf()[k] !== false;
function showLayer(k, on) { prefs.layers = prefs.layers || {}; prefs.layers[viewId] = Object.assign(layersOf(), { [k]: on !== false }); savePrefs(); }
function loadPrefs() { try { prefs = JSON.parse(localStorage.getItem(PREFS + TID) || '{}') || {}; } catch (e) { prefs = {}; } }
function savePrefs() { try { localStorage.setItem(PREFS + TID, JSON.stringify(prefs)); } catch (e) { /* fine */ } }
const itemLayer = it => it.kind;
function shown(it) { if (!it || (view().hidden || []).includes(it.id)) return false; const l = itemLayer(it); return !l || layerOn(l); }
// An arrow's end is a card, a cell of a table, or a group: a group's is shown while its frame is.
const endShown = id => { const it = item(id); if (it) return shown(it); const m = model(id); return !!m && layerOn('frames') && !!frameOf(m); };
const arrowShown = a => layerOn(a.layer) && endShown(a.from) && endShown(a.to);
function nameOf(id) { const it = item(id); if (!it) return '(gone)'; const m = model(it.model); return cardTitle(it) + (m ? ' (' + m.title + ')' : ''); }
// An arrow's end by name: cell is a cell's id, or its [row, column] before it has one.
function endName(id, cell) {
  const it = item(id);
  if (!it) { const m = model(id); return m ? 'Group: ' + m.title : '(gone)'; }
  if (!cell || it.kind !== 'table') return nameOf(id);
  const rc = Array.isArray(cell) ? cell : cellRC(it, cell);
  return nameOf(id) + ', ' + (rc ? cellName(it, rc[0], rc[1]) : 'a cell no longer in it');
}
// What an annotation's "Relevant to" names, as words: a word, a card or one cell of a table as they stand now,
// another of your topics, or a card on its board, by their names now; or else the name kept with it, for a card no
// longer on this board.
// The cell's name as kept with the link, without its table's, which is named beside it.
function keptCell(to) { const n = nameOf(to.card) + ', ', c = String(to.cite || ''); return c.startsWith(n) ? c.slice(n.length) : c; }
function toText(to) {
  if (!to) return '';
  if (to.word) return to.word;
  if (to.card && item(to.card)) return endName(to.card, to.cell || to.rc || null);
  if (to.board) {   // another of your topics, or a card on its board: by its name as it is now, where it can be
    const t = DB ? realTopic(DB, to.board.t || '') : '', n = t ? topicName(t) : '';
    if (!to.board.item) return n || to.cite || 'another topic';
    const L = n ? linkOf({ to: to.board }) : null;
    return L && L.state === 'ok' ? L.topic + ': ' + L.title : to.cite || (n ? 'a card on the board of “' + n + '”' : 'a card on another board');
  }

// What is new in an exported board comes in beside what is here; nothing here is overwritten.
function addFrom(into, from) {
  ['models', 'items', 'arrows', 'annotations'].forEach(k => {
    into[k] = into[k] || [];
    const have = new Set(into[k].map(x => x.id));
    (from[k] || []).forEach(x => { if (x && typeof x.id === 'string' && !have.has(x.id)) into[k].push(clone(x)); });
  });
  const haveV = new Set(into.views.map(v => v.id));
  (from.views || []).forEach(fv => {
    if (!fv || !fv.pos) return;
    if (!haveV.has(fv.id)) { into.views.push(Object.assign({ hidden: [], ink: [] }, clone(fv))); return; }
    const v = into.views.find(x => x.id === fv.id);
    Object.keys(fv.pos).forEach(id => { if (!v.pos[id]) v.pos[id] = fv.pos[id].slice(); });
    (fv.ink || []).forEach(st => { v.ink = v.ink || []; if (!v.ink.some(x => x.id === st.id)) v.ink.push(clone(st)); });
  });
  return into;
