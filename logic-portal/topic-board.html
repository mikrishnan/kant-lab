<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A topic’s board · My topics · the Logic Portal · Kant Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap');

  /* The Logic Portal's palette and fonts. This page began as the board of the study the kinds of
     nothing (studies/kinds-of-nothing/board.html), and is now the portal's own: the two go their own ways. */
  :root {
    --ink: #1a1208;
    --parchment: #f5efe0;
    --parchment-dark: #e8dfc8;
    --panel: #faf7f0;
    --card: #fbf8f1;
    --accent: #5c3d1e;
    --accent-light: #8b5e3c;
    --faded: #7a6a52;
    --line: #b8a88a;
    --line-soft: #d9ccb0;
    --prob: #8a3b12;      /* problems, and what may answer them */
    --note: #fff6c9;      /* what is written on the board */
    --machine: #9a8f7a;   /* what the computer drew */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--parchment);
         display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-light); }

  header { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); background: var(--parchment-dark);
           font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.05em; flex: none; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .slash { color: var(--line); }
  header b { color: var(--accent); font-weight: 600; }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.5rem; padding: 0.4rem 0.8rem; border-bottom: 1px solid var(--line-soft); background: var(--panel); flex: none; }
  .tools .grp { display: flex; align-items: center; gap: 0.3rem; padding-right: 0.6rem; margin-right: 0.1rem; border-right: 1px solid var(--line-soft); }
  .tools .grp:last-child { border-right: 0; }
  .tools .lbl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin-right: 0.15rem; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--accent); border-radius: 999px; padding: 0.05rem 0.7rem; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-light); background: var(--card); }
  .btn.solid { background: var(--accent); color: var(--parchment); border-color: var(--accent); }
  .btn.solid:hover { background: var(--accent-light); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.k-problem { color: var(--prob); border-color: #d6b19c; }
  header a.back { font-family: 'EB Garamond', serif; font-size: 1rem; letter-spacing: 0; border: 1px solid var(--accent); border-radius: 999px; padding: 0 0.7rem; margin-right: 0.4rem; background: var(--accent); color: var(--parchment); }
  header a.back:hover { background: var(--accent-light); text-decoration: none; }
  header #tname { font-family: 'EB Garamond', serif; font-size: 1.05rem; letter-spacing: 0; }
  .btn.k-note { background: var(--note); }
  select.vsel { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0.05rem 0.3rem; max-width: 16rem; color: var(--accent); }
  #search { border: 1px solid var(--line); border-radius: 999px; padding: 0.05rem 0.7rem; width: 11rem; background: #fff; }
  #found { font-size: 0.82rem; color: var(--faded); min-width: 3.5rem; }
  .linkish { background: none; border: 0; padding: 0; color: var(--faded); cursor: pointer; text-decoration: underline; font-size: 0.86rem; }
  .linkish:hover { color: var(--accent); }

  .wrap { flex: 1; display: flex; min-height: 0; }

  /* ── The stage: an endless board, panned and zoomed ── */
  #stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
           background-color: #f7f2e4; background-image: radial-gradient(#ddd1b6 1px, transparent 1px); background-size: 24px 24px; }
  #stage.panning { cursor: grabbing; }
  #stage.linking, #stage.linking .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #ink { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #ink .ar { pointer-events: auto; cursor: pointer; }
  #ink .ar path.hit { fill: none; stroke: transparent; stroke-width: 16; }
  #ink .ar path.v { fill: none; stroke-width: 2.2; }
  #ink .ar.division path.v { stroke-width: 1.5; }
  #ink .ar.sel path.v { stroke-width: 4; }
  #ink .ar .pill rect { fill: #fff; stroke-width: 1.3; }
  #ink .ar .pill text { font-family: 'EB Garamond', serif; font-size: 13px; fill: var(--accent); }
  #ink .ar.problem .pill text { fill: var(--prob); }
  #ink .ar.computer .pill text { fill: var(--faded); font-style: italic; }
  #ink .frame rect.f { stroke-width: 2; }
  #ink .frame.sel rect.f { stroke-width: 3.5; }
  #ink .frame.drop rect.f { stroke-width: 3.5; fill-opacity: 0.14; }   /* a passage dragged from Passages is over it */
  #ink .marq { fill: rgba(139, 94, 60, 0.08); stroke: var(--accent-light); stroke-dasharray: 5 4; }
  #ink #ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .dim { opacity: 0.14; }
  #ink .ar.dim { opacity: 0.08; }

  /* frame tabs: a model's name, and the handle that moves it */
  .ftab { position: absolute; color: #fff; border-radius: 7px 7px 7px 0; padding: 0.1rem 0.6rem 0.12rem; white-space: nowrap; cursor: move; font-size: 0.9rem; }
  .ftab b { font-family: 'Cinzel', serif; letter-spacing: 0.04em; font-weight: 600; margin-right: 0.35rem; }
  .ftab i { opacity: 0.92; }
  .ftab small { display: block; font-size: 0.72rem; opacity: 0.85; margin-top: -0.1rem; }

  /* cards */
  .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-left-width: 5px; border-radius: 8px; padding: 0.3rem 0.55rem 0.35rem;
          box-shadow: 0 1px 2px rgba(60, 40, 10, 0.12); cursor: pointer; }
  .card:hover { box-shadow: 0 2px 8px rgba(60, 40, 10, 0.2); }
  .card.sel { outline: 3px solid var(--accent-light); outline-offset: 1px; }
  .card.hit { outline: 3px solid #d9a441; outline-offset: 1px; }
  .card.k-part { width: 168px; text-align: center; }
  .card.k-part .lab { display: block; font-weight: 600; color: var(--accent); font-size: 1.02rem; line-height: 1.15; }
  .card.k-part .lab.lat { font-style: italic; }
  .card .sub { display: block; font-size: 0.8rem; color: var(--faded); font-style: italic; margin-top: 0.1rem; line-height: 1.15; }
  .card .count { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.15rem; font-family: 'Cinzel', serif; letter-spacing: 0.06em; }
  .card .nearq { display: none; text-align: left; font-size: 0.8rem; font-style: italic; margin-top: 0.3rem; border-top: 1px dotted var(--line-soft); padding-top: 0.25rem; line-height: 1.25; }
  .card .nearq span { font-style: normal; color: var(--faded); font-size: 0.72rem; }
  .card.k-passage { width: 250px; background: var(--card); border-color: var(--line); font-size: 0.86rem; }
  .card.k-passage .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.1rem; }
  .card.k-passage .pq { font-style: italic; line-height: 1.25; }
  .card.k-passage .pc { display: block; font-size: 0.75rem; color: var(--faded); margin-top: 0.2rem; }
  .card.k-problem { width: 260px; background: #fff7f1; border-color: #d6b19c; border-left-color: var(--prob); font-size: 0.88rem; line-height: 1.25; }
  .card .tag { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.09em; color: var(--prob); margin-bottom: 0.15rem; }
  .card.k-note { width: 190px; background: var(--note); border-color: #e6d58a; font-size: 0.9rem; line-height: 1.25; transform: rotate(-0.6deg); }
  .card.k-note .tag { color: #8a7420; }
  .card .who { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.2rem; text-align: right; }
  .card .chk { color: #a0661a; font-size: 0.7rem; display: block; margin-top: 0.15rem; }
  .card .knob { position: absolute; right: -13px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
                font-size: 13px; line-height: 21px; text-align: center; cursor: crosshair; display: none; box-shadow: 0 0 0 2px #fff; }
  .card:hover .knob, .card.sel .knob { display: block; }
  #stage.readonly .knob { display: none !important; }
  /* depth: zoomed out, a card is its name; zoomed in, its first passage shows */
  #world.far .card .sub, #world.far .card .count, #world.far .card .who, #world.far .card .chk { display: none; }
  #world.far .card.k-part .lab { font-size: 1.5rem; }
  #world.far .card.k-passage .pq, #world.far .card.k-problem, #world.far .card.k-note { font-size: 1.15rem; }
  #world.near .card .nearq { display: block; }

  /* floating boxes on the stage */
  .float { position: absolute; background: rgba(250, 247, 240, 0.96); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(60, 40, 10, 0.12); font-size: 0.86rem; cursor: default; }
  #layers { left: 12px; bottom: 12px; padding: 0.45rem 0.7rem 0.5rem; max-width: 260px; }
  #layers .ttl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); display: block; margin-bottom: 0.2rem; }
  #layers label { display: flex; align-items: center; gap: 0.4rem; margin: 0.05rem 0; cursor: pointer; }
  #layers label i { display: inline-block; width: 1.4rem; height: 0; border-top: 2px solid var(--accent); }
  #layers label i.sq { height: 0.7rem; border: 1.5px solid var(--line); border-radius: 3px; }
  #layers label span.n { color: var(--faded); margin-left: auto; padding-left: 0.6rem; }
  #layers.closed label { display: none; }
  #zoom { right: 12px; bottom: 12px; padding: 0.2rem 0.3rem; display: flex; align-items: center; gap: 0.2rem; }
  #zoom button { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 1rem; padding: 0.1rem 0.45rem; border-radius: 6px; }
  #zoom button:hover { background: var(--parchment-dark); }
  #zoom #zk { min-width: 3.2rem; text-align: center; color: var(--faded); font-size: 0.82rem; }
  #banner { left: 50%; top: 12px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; align-items: center; gap: 0.6rem; max-width: 80%; }
  #banner.show { display: flex; }
  #banner.photo { background: #eef2f6; border-color: #3b5068; }
  #banner .btn { font-size: 0.82rem; }
  #chooser { display: none; padding: 0.35rem; gap: 0.3rem; flex-wrap: wrap; width: 230px; }
  #chooser.show { display: flex; }
  #chooser .ttl { flex-basis: 100%; font-size: 0.78rem; color: var(--faded); padding: 0 0.2rem; }
  #chooser textarea { flex-basis: 100%; border: 1px solid #e6d58a; background: var(--note); border-radius: 6px; padding: 0.3rem 0.45rem; font-size: 0.92rem; resize: vertical; }
  #chooser { width: 260px; }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; }
  #toast.show { display: block; }

  /* ── The side: what is selected, and the portal ── */
  #side { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side .tabs { display: flex; border-bottom: 1px solid var(--line-soft); flex: none; }
  #side .tabs button { flex: 1; border: 0; background: none; padding: 0.45rem 0.15rem; white-space: nowrap; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.04em; color: var(--faded); border-bottom: 2px solid transparent; }
  #side .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #details { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; }
  #reading { flex: 1; display: none; flex-direction: column; min-height: 0; }
  /* the topic's passages, waiting to be put on the board one at a time */
  #passages { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; display: none; }
  #passages h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #passages .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #passages .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #passages .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; }
  #passages .pp { background: #fff; border: 1px solid var(--line-soft); border-left: 4px solid var(--line); border-radius: 6px; padding: 0.35rem 0.55rem 0.4rem; margin: 0 0 0.45rem; cursor: grab; }
  #passages .pp:hover { border-color: var(--accent-light); }
  #passages .pp.dragging { opacity: 0.5; }
  #passages .pp .pc { font-size: 0.84rem; color: var(--accent); font-weight: 600; }
  #passages .pp .pc span { color: var(--faded); font-weight: 400; }
  #passages .pp .pw { font-style: italic; font-size: 0.9rem; line-height: 1.25; margin: 0.15rem 0 0.3rem; }
  #passages .pp .row { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: center; }
  #passages .pp .pl { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--accent); margin: 0.35rem 0 0.1rem; }
  #passages .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.2rem 0.5rem; margin: 0.2rem 0; cursor: pointer; font-size: 0.88rem; color: var(--accent); }
  #passages .rel:hover { border-color: var(--accent-light); }
  /* finding among them: the box stays at the top as the list scrolls (top: less the padding above it) */
  #passages .ppbar { position: sticky; top: -0.8rem; z-index: 1; display: flex; align-items: baseline; gap: 0.5rem; margin: 0 -1rem 0.5rem; padding: 0.45rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line-soft); }
  #passages .ppbar[hidden] { display: none; }
  #ppfind { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.7rem; background: #fff; font: inherit; font-size: 0.92rem; }
  #ppfound { font-size: 0.82rem; color: var(--faded); white-space: nowrap; }
  #passages mark.pf { color: inherit; background: color-mix(in srgb, #d9a441 38%, transparent); border-radius: 2px; padding: 0 1px; }
  #passages .pin { display: block; font-size: 0.84rem; line-height: 1.25; color: var(--faded); margin: -0.1rem 0 0.3rem; }
  #passages .pin i { font-style: normal; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--accent); margin-right: 0.3rem; }
  #passages .rel .pin { margin: 0.1rem 0 0; }
  #boards { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; display: none; }
  #boards h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #boards .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #boards .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #boards .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; }
  #boards .pp { background: #fff; border: 1px solid var(--line-soft); border-left: 4px solid var(--line); border-radius: 6px; padding: 0.35rem 0.55rem 0.4rem; margin: 0 0 0.45rem; cursor: grab; }
  #boards .pp:hover { border-color: var(--accent-light); }
  #boards .pp.dragging { opacity: 0.5; }
  #boards .pp .pc { font-size: 0.84rem; color: var(--accent); font-weight: 600; }
  #boards .pp .pc span { color: var(--faded); font-weight: 400; }
  #boards .pp .pw { font-style: italic; font-size: 0.9rem; line-height: 1.25; margin: 0.15rem 0 0.3rem; }
  #boards .pp .row { display: flex; gap: 0.6rem; align-items: center; }
  #boards .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.2rem 0.5rem; margin: 0.2rem 0; cursor: pointer; font-size: 0.88rem; color: var(--accent); }
  #boards .rel:hover { border-color: var(--accent-light); }
  #side .tabs button b.n { display: inline-block; min-width: 1.1rem; margin-left: 0.25rem; padding: 0 0.3rem; border-radius: 999px; background: var(--accent); color: var(--parchment); font-family: 'EB Garamond', serif; font-size: 0.75rem; letter-spacing: 0; font-weight: 400; }
  #stage.dropping { outline: 3px dashed var(--accent-light); outline-offset: -6px; }
  /* a link to another topic's board, or to a card or group on it */
  .card.k-link { width: 230px; background: #eef3f8; border-color: #a9bed2; border-left-color: #2f5d8a; font-size: 0.86rem; line-height: 1.25; }
  .card.k-link .lt { display: block; font-family: 'Cinzel', serif; font-size: 0.64rem; letter-spacing: 0.06em; color: #2f5d8a; margin-bottom: 0.1rem; }
  .card.k-link .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; }
  .card.k-link .lti { display: block; color: var(--accent); }
  .card.k-link .lw { font-style: italic; color: #3b3328; margin-top: 0.1rem; }
  .card.k-link.gone { border-style: dashed; border-left-style: dashed; background: #f3f2ef; opacity: 0.85; }
  .card .inl, .ftab .inl { position: absolute; top: -0.65rem; left: 0.5rem; background: #2f5d8a; color: #fff; border-radius: 999px; padding: 0 0.45rem; font-size: 0.7rem; font-style: normal; font-family: 'EB Garamond', serif; letter-spacing: 0; }
  .card .also { display: inline-block; margin-top: 0.25rem; border: 1px dashed #9a8f7a; color: var(--faded); border-radius: 999px; padding: 0 0.45rem; font-size: 0.68rem; font-style: normal; }
  .card.flash, .ftab.flash { box-shadow: 0 0 0 5px rgba(47, 93, 138, 0.45); transition: box-shadow 0.3s; }
  #details .lfrom { background: #fff; border: 1px solid #a9bed2; border-left: 3px solid #2f5d8a; border-radius: 6px; padding: 0.3rem 0.55rem; margin: 0.3rem 0; font-size: 0.9rem; }
  #details .lrow, #boards .lrow { font-size: 0.88rem; margin: 0.15rem 0 0 0.4rem; }
  #details .alsobox { border: 1px dashed #9a8f7a; border-radius: 6px; padding: 0.3rem 0.55rem; margin: 0.5rem 0; font-size: 0.9rem; }
  #reading.on { display: flex; }
  #reading .bar { display: flex; justify-content: space-between; padding: 0.3rem 0.8rem; font-size: 0.82rem; color: var(--faded); border-bottom: 1px solid var(--parchment-dark); }
  #reading .bar a { color: var(--accent); }
  #reading iframe { flex: 1; width: 100%; border: 0; background: var(--parchment); }
  #details h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #details h2.lat { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1.2rem; }
  #details .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #details .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #details .mchip { display: inline-block; color: #fff; border-radius: 4px; padding: 0 0.4rem; font-size: 0.8rem; font-style: normal; margin-right: 0.3rem; }
  #details .q { margin: 0 0 0.5rem; padding: 0.35rem 0.55rem; border-left: 3px solid var(--line); background: #fff; font-size: 0.94rem; }
  #details .q .t { font-style: italic; }
  #details .q .c { display: flex; gap: 0.5rem; align-items: baseline; margin-top: 0.2rem; font-size: 0.8rem; }
  #details .q .c button { background: none; border: 0; padding: 0; color: var(--accent-light); text-decoration: underline; cursor: pointer; font-size: 0.8rem; }
  #details .q .c .chk { color: #a0661a; }
  #details .q .c .x { margin-left: auto; color: var(--faded); }
  #details .stmt { background: #fff; border: 1.5px dashed var(--accent-light); border-radius: 6px; padding: 0.4rem 0.6rem; white-space: pre-wrap; }
  #details .stmt.machine { border-style: dotted; color: var(--faded); }
  #details .stmt.problem { border-color: var(--prob); }
  #details .by { font-size: 0.82rem; color: var(--faded); margin: 0.25rem 0 0; }
  #details .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.25rem 0.5rem; margin: 0.22rem 0; cursor: pointer; font-size: 0.9rem; }
  #details .rel:hover { border-color: var(--accent-light); }
  #details .rel b { color: var(--accent); font-weight: 600; }
  #details .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; margin: 0.2rem 0; }
  #details .warn { color: var(--prob); font-size: 0.86rem; }

  .lockcard select { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0.2rem 0.3rem; }
  .lockcard .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }

  /* editing in place, on the board itself */
  .card [contenteditable="true"], .card [contenteditable="plaintext-only"] { -webkit-user-select: text; user-select: text; cursor: text; outline: 2px solid #d9a441; outline-offset: 2px; border-radius: 3px; background: #fffdf3; min-width: 2.5rem; display: inline-block; }

  /* boxes: divisions drawn on the board, behind the cards */
  .card.k-box { background: rgba(255, 255, 255, 0.28); border: 2px dashed var(--accent-light); border-left-width: 2px; border-radius: 10px; box-shadow: none; padding: 0.3rem 0.6rem; }

  /* tables: rows and columns of the reader's words and passages, the first row or column headings if the reader chose */

  /* annotations: words of a passage marked by the seminar. Each kind's colour is --kc, set from ANN_KINDS. */

  .annbar { position: fixed; z-index: 40; display: none; gap: 0.25rem; padding: 0.25rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 2px 12px rgba(60, 40, 10, 0.2); }
  .annbar.show { display: flex; }
  .annbar button { border: 1.5px solid var(--kc); color: var(--kc); background: #fff; border-radius: 999px; padding: 0.05rem 0.65rem; cursor: pointer; font-size: 0.86rem; white-space: nowrap; }
  .annbar button:hover { background: var(--kc); color: #fff; }
  @media (pointer: coarse) { .annbar button { padding: 0.35rem 0.8rem; font-size: 0.95rem; } }
  #details .q .c button[data-annwhole] { color: var(--faded); }
  #details .anns-l { margin-top: 0.35rem; }

  #details .ann-e.placed, #details .ann-e.lost { border-left-style: dashed; }

  #details .ann-e .ex { font-style: italic; }

  #details .ann-e .am { display: flex; flex-wrap: wrap; gap: 0.1rem 0.55rem; font-size: 0.78rem; color: var(--faded); margin-top: 0.15rem; }

  #details .tsize { font-weight: 600; color: var(--accent); }
  #details .tprev table { border-collapse: collapse; table-layout: fixed; width: 100%; }

<header>

</header>
<div class="tools">
  <span class="grp"><span class="lbl">Add</span>
    <button type="button" class="btn k-note" data-add="note" title="Anything, as on a whiteboard">Note</button>
    <button type="button" class="btn k-problem" data-add="problem" title="A question the topic raises, in your words: draw arrows to it from the passages that may answer it">Question</button>

    <button type="button" class="btn" data-add="model" title="A group: a named frame for cards, which move with it">Group</button>
    <button type="button" class="btn" id="addp" title="The topic’s passages: put them on the board one at a time">Passage…</button>

  </span>
  <span class="grp"><span class="lbl">View</span>
    <select class="vsel" id="vsel" aria-label="View"></select>

  if (!topic) lost = 'gone';
  B = saved ? clone(saved) : topic ? layOut() : cleanBoard(clone(BASE));
  photos = B.photos || []; delete B.photos;
  B.removed = B.removed || [];
  B.annotations = clone(anns);
  seenB = saved ? keyOf(saved) : ''; seenA = JSON.stringify(anns);
  viewId = B.views.some(v => v.id === prefs.viewId) ? prefs.viewId : B.views[0].id;
  const V = new URLSearchParams(location.hash.slice(1)).get('v'); if (V && B.views.some(v => v.id === V)) viewId = V;
  if (topic && (!saved || syncCards() || !Array.isArray(d.annotations))) writeOut(d);   // a board made now, or cards for passages put under the topic since: kept at once
}
start();
// Each kind of annotation's colour, as --kc, and the bar that offers them.
document.head.insertAdjacentHTML('beforeend', '<style>' + ANN_KINDS.map(k => '.ak-' + k.key + ' { --kc: ' + k.color + '; }').join(' ') + ' .ak-reply { --kc: #8b5e3c; }</style>');
$('annbar').innerHTML = ANN_KINDS.map(k => '<button type="button" class="ak-' + k.key + '" data-annk="' + k.key + '" title="' + esc(k.key === 'relevant' ? 'What these words bear on: a word, a card on the board, R 3990, or a portal address' : k.hint) + '">' + esc(k.label) + '</button>').join('');
renderPens();
renderHead();
render();
if (topic && !lost && waiting().length && !B.items.some(i => i.kind === 'passage')) showSide('passages');
showLost();
watchPortal();
// Cards are measured once the page is laid out, and again when its fonts arrive, since they change every card's size.
const settle = () => { renderBoard(); if (arriveAt) { arrive(); return; } const c0 = camOf(); if (c0) { cam = Object.assign({}, c0); applyCam(); } else fit(); };
requestAnimationFrame(settle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!drag && !editing) settle(); else pendingStore = true; });   // drawn again, measured in its fonts, once the drag or the edit ends
</script>
</body>
