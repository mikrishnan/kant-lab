<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A topic’s board · My topics · the Logic Portal · Kant Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap');

  /* The Logic Portal's palette and fonts. This page began as the board of the study the kinds of
     nothing (studies/kinds-of-nothing/board.html), and is now the portal's own: the two go their own ways. */
  :root {
    --ink: #1a1208;
    --parchment: #f5efe0;
    --parchment-dark: #e8dfc8;
    --panel: #faf7f0;
    --card: #fbf8f1;
    --accent: #5c3d1e;
    --accent-light: #8b5e3c;
    --faded: #7a6a52;
    --line: #b8a88a;
    --line-soft: #d9ccb0;
    --prob: #8a3b12;      /* problems, and what may answer them */
    --note: #fff6c9;      /* what is written on the board */
    --machine: #9a8f7a;   /* what the computer drew */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--parchment);
         display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-light); }

  header { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); background: var(--parchment-dark);
           font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.05em; flex: none; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .slash { color: var(--line); }
  header b { color: var(--accent); font-weight: 600; }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.5rem; padding: 0.4rem 0.8rem; border-bottom: 1px solid var(--line-soft); background: var(--panel); flex: none; }
  .tools .grp { display: flex; align-items: center; gap: 0.3rem; padding-right: 0.6rem; margin-right: 0.1rem; border-right: 1px solid var(--line-soft); }
  .tools .grp:last-child { border-right: 0; }
  .tools .lbl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin-right: 0.15rem; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--accent); border-radius: 999px; padding: 0.05rem 0.7rem; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-light); background: var(--card); }
  .btn.solid { background: var(--accent); color: var(--parchment); border-color: var(--accent); }
  .btn.solid:hover { background: var(--accent-light); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.k-problem { color: var(--prob); border-color: #d6b19c; }
  header a.back { font-family: 'EB Garamond', serif; font-size: 1rem; letter-spacing: 0; border: 1px solid var(--accent); border-radius: 999px; padding: 0 0.7rem; margin-right: 0.4rem; background: var(--accent); color: var(--parchment); }
  header a.back:hover { background: var(--accent-light); text-decoration: none; }
  header #tname { font-family: 'EB Garamond', serif; font-size: 1.05rem; letter-spacing: 0; }
  .btn.k-note { background: var(--note); }
  select.vsel { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0.05rem 0.3rem; max-width: 16rem; color: var(--accent); }
  #search { border: 1px solid var(--line); border-radius: 999px; padding: 0.05rem 0.7rem; width: 11rem; background: #fff; }
  #found { font-size: 0.82rem; color: var(--faded); min-width: 3.5rem; }
  .linkish { background: none; border: 0; padding: 0; color: var(--faded); cursor: pointer; text-decoration: underline; font-size: 0.86rem; }
  .linkish:hover { color: var(--accent); }

  .wrap { flex: 1; display: flex; min-height: 0; }

  /* ── The stage: an endless board, panned and zoomed ── */
  #stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
           background-color: #f7f2e4; background-image: radial-gradient(#ddd1b6 1px, transparent 1px); background-size: 24px 24px; }
  #stage.panning { cursor: grabbing; }
  #stage.linking, #stage.linking .card { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #ink { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #ink .ar { pointer-events: auto; cursor: pointer; }
  #ink .ar path.hit { fill: none; stroke: transparent; stroke-width: 16; }
  #ink .ar path.v { fill: none; stroke-width: 2.2; }
  #ink .ar.division path.v { stroke-width: 1.5; }
  #ink .ar.sel path.v { stroke-width: 4; }
  #ink .ar .pill rect { fill: #fff; stroke-width: 1.3; }
  #ink .ar .pill text { font-family: 'EB Garamond', serif; font-size: 13px; fill: var(--accent); }
  #ink .ar.problem .pill text { fill: var(--prob); }
  #ink .ar.computer .pill text { fill: var(--faded); font-style: italic; }
  #ink .frame rect.f { stroke-width: 2; }
  #ink .frame.sel rect.f { stroke-width: 3.5; }
  #ink .marq { fill: rgba(139, 94, 60, 0.08); stroke: var(--accent-light); stroke-dasharray: 5 4; }
  #ink #ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
  .dim { opacity: 0.14; }
  #ink .ar.dim { opacity: 0.08; }

  /* frame tabs: a model's name, and the handle that moves it */
  .ftab { position: absolute; color: #fff; border-radius: 7px 7px 7px 0; padding: 0.1rem 0.6rem 0.12rem; white-space: nowrap; cursor: move; font-size: 0.9rem; }
  .ftab b { font-family: 'Cinzel', serif; letter-spacing: 0.04em; font-weight: 600; margin-right: 0.35rem; }
  .ftab i { opacity: 0.92; }
  .ftab small { display: block; font-size: 0.72rem; opacity: 0.85; margin-top: -0.1rem; }

  /* cards */
  .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-left-width: 5px; border-radius: 8px; padding: 0.3rem 0.55rem 0.35rem;
          box-shadow: 0 1px 2px rgba(60, 40, 10, 0.12); cursor: pointer; }
  .card:hover { box-shadow: 0 2px 8px rgba(60, 40, 10, 0.2); }
  .card.sel { outline: 3px solid var(--accent-light); outline-offset: 1px; }
  .card.hit { outline: 3px solid #d9a441; outline-offset: 1px; }
  .card.k-part { width: 168px; text-align: center; }
  .card.k-part .lab { display: block; font-weight: 600; color: var(--accent); font-size: 1.02rem; line-height: 1.15; }
  .card.k-part .lab.lat { font-style: italic; }
  .card .sub { display: block; font-size: 0.8rem; color: var(--faded); font-style: italic; margin-top: 0.1rem; line-height: 1.15; }
  .card .count { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.15rem; font-family: 'Cinzel', serif; letter-spacing: 0.06em; }
  .card .nearq { display: none; text-align: left; font-size: 0.8rem; font-style: italic; margin-top: 0.3rem; border-top: 1px dotted var(--line-soft); padding-top: 0.25rem; line-height: 1.25; }
  .card .nearq span { font-style: normal; color: var(--faded); font-size: 0.72rem; }
  .card.k-passage { width: 250px; background: var(--card); border-color: var(--line); font-size: 0.86rem; }
  .card.k-passage .ttl { display: block; font-weight: 600; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.1rem; }
  .card.k-passage .pq { font-style: italic; line-height: 1.25; }
  .card.k-passage .pc { display: block; font-size: 0.75rem; color: var(--faded); margin-top: 0.2rem; }
  .card.k-problem { width: 260px; background: #fff7f1; border-color: #d6b19c; border-left-color: var(--prob); font-size: 0.88rem; line-height: 1.25; }
  .card .tag { display: block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.09em; color: var(--prob); margin-bottom: 0.15rem; }
  .card.k-note { width: 190px; background: var(--note); border-color: #e6d58a; font-size: 0.9rem; line-height: 1.25; transform: rotate(-0.6deg); }
  .card.k-note .tag { color: #8a7420; }
  .card .who { display: block; font-size: 0.7rem; color: var(--faded); margin-top: 0.2rem; text-align: right; }
  .card .chk { color: #a0661a; font-size: 0.7rem; display: block; margin-top: 0.15rem; }
  .card .knob { position: absolute; right: -13px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
                font-size: 13px; line-height: 21px; text-align: center; cursor: crosshair; display: none; box-shadow: 0 0 0 2px #fff; }
  .card:hover .knob, .card.sel .knob { display: block; }
  #stage.readonly .knob { display: none !important; }
  /* depth: zoomed out, a card is its name; zoomed in, its first passage shows */
  #world.far .card .sub, #world.far .card .count, #world.far .card .who, #world.far .card .chk { display: none; }
  #world.far .card.k-part .lab { font-size: 1.5rem; }
  #world.far .card.k-passage .pq, #world.far .card.k-problem, #world.far .card.k-note { font-size: 1.15rem; }
  #world.near .card .nearq { display: block; }

  /* floating boxes on the stage */
  .float { position: absolute; background: rgba(250, 247, 240, 0.96); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(60, 40, 10, 0.12); font-size: 0.86rem; cursor: default; }
  #layers { left: 12px; bottom: 12px; padding: 0.45rem 0.7rem 0.5rem; max-width: 260px; }
  #layers .ttl { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); display: block; margin-bottom: 0.2rem; }
  #layers label { display: flex; align-items: center; gap: 0.4rem; margin: 0.05rem 0; cursor: pointer; }
  #layers label i { display: inline-block; width: 1.4rem; height: 0; border-top: 2px solid var(--accent); }
  #layers label i.sq { height: 0.7rem; border: 1.5px solid var(--line); border-radius: 3px; }
  #layers label span.n { color: var(--faded); margin-left: auto; padding-left: 0.6rem; }
  #layers.closed label { display: none; }
  #zoom { right: 12px; bottom: 12px; padding: 0.2rem 0.3rem; display: flex; align-items: center; gap: 0.2rem; }
  #zoom button { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 1rem; padding: 0.1rem 0.45rem; border-radius: 6px; }
  #zoom button:hover { background: var(--parchment-dark); }
  #zoom #zk { min-width: 3.2rem; text-align: center; color: var(--faded); font-size: 0.82rem; }
  #banner { left: 50%; top: 12px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; align-items: center; gap: 0.6rem; max-width: 80%; }
  #banner.show { display: flex; }
  #banner.photo { background: #eef2f6; border-color: #3b5068; }
  #banner .btn { font-size: 0.82rem; }
  #chooser { display: none; padding: 0.35rem; gap: 0.3rem; flex-wrap: wrap; width: 230px; }
  #chooser.show { display: flex; }
  #chooser .ttl { flex-basis: 100%; font-size: 0.78rem; color: var(--faded); padding: 0 0.2rem; }
  #chooser textarea { flex-basis: 100%; border: 1px solid #e6d58a; background: var(--note); border-radius: 6px; padding: 0.3rem 0.45rem; font-size: 0.92rem; resize: vertical; }
  #chooser { width: 260px; }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 0.3rem 0.8rem; display: none; }
  #toast.show { display: block; }

  /* ── The side: what is selected, and the portal ── */
  #side { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side .tabs { display: flex; border-bottom: 1px solid var(--line-soft); flex: none; }
  #side .tabs button { flex: 1; border: 0; background: none; padding: 0.4rem; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--faded); border-bottom: 2px solid transparent; }
  #side .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #details { flex: 1; overflow-y: auto; padding: 0.8rem 1rem 2rem; }
  #reading { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #reading.on { display: flex; }
  #reading .bar { display: flex; justify-content: space-between; padding: 0.3rem 0.8rem; font-size: 0.82rem; color: var(--faded); border-bottom: 1px solid var(--parchment-dark); }
  #reading .bar a { color: var(--accent); }
  #reading iframe { flex: 1; width: 100%; border: 0; background: var(--parchment); }
  #details h2 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--accent); margin: 0 0 0.15rem; font-weight: 600; letter-spacing: 0.02em; }
  #details h2.lat { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1.2rem; }
  #details .sub { color: var(--faded); font-style: italic; margin: 0 0 0.5rem; font-size: 0.92rem; }
  #details .k { display: block; font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--accent); margin: 0.9rem 0 0.3rem; }
  #details .mchip { display: inline-block; color: #fff; border-radius: 4px; padding: 0 0.4rem; font-size: 0.8rem; font-style: normal; margin-right: 0.3rem; }
  #details .q { margin: 0 0 0.5rem; padding: 0.35rem 0.55rem; border-left: 3px solid var(--line); background: #fff; font-size: 0.94rem; }
  #details .q .t { font-style: italic; }
  #details .q .c { display: flex; gap: 0.5rem; align-items: baseline; margin-top: 0.2rem; font-size: 0.8rem; }
  #details .q .c button { background: none; border: 0; padding: 0; color: var(--accent-light); text-decoration: underline; cursor: pointer; font-size: 0.8rem; }
  #details .q .c .chk { color: #a0661a; }
  #details .q .c .x { margin-left: auto; color: var(--faded); }
  #details .stmt { background: #fff; border: 1.5px dashed var(--accent-light); border-radius: 6px; padding: 0.4rem 0.6rem; white-space: pre-wrap; }
  #details .stmt.machine { border-style: dotted; color: var(--faded); }
  #details .stmt.problem { border-color: var(--prob); }
  #details .by { font-size: 0.82rem; color: var(--faded); margin: 0.25rem 0 0; }
  #details .rel { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.25rem 0.5rem; margin: 0.22rem 0; cursor: pointer; font-size: 0.9rem; }
  #details .rel:hover { border-color: var(--accent-light); }
  #details .rel b { color: var(--accent); font-weight: 600; }
  #details .empty { color: var(--faded); font-style: italic; font-size: 0.92rem; margin: 0.2rem 0; }
  #details .warn { color: var(--prob); font-size: 0.86rem; }
  #details .row { display: flex; gap: 0.4rem 0.6rem; margin-top: 0.9rem; flex-wrap: wrap; align-items: center; }
  #details label.f { display: block; font-size: 0.86rem; color: var(--faded); margin: 0.65rem 0 0.2rem; }
  #details textarea, #details input[type=text], #details select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.45rem; background: #fff; }
  #details textarea { min-height: 4.5rem; resize: vertical; }
  #details .ev { display: flex; gap: 0.4rem; align-items: flex-start; font-size: 0.86rem; margin: 0.25rem 0; cursor: pointer; }
  #details .ev input { margin-top: 0.25rem; flex: none; }
  #details .addq { border: 1px dashed var(--line); border-radius: 8px; padding: 0.2rem 0.6rem 0.6rem; margin-top: 0.5rem; background: #fff; }
  #details .intro p, #details .intro li { font-size: 0.95rem; }
  #details .intro p { margin: 0 0 0.55rem; }
  #details .intro ul { margin: 0 0 0.6rem; padding-left: 1.1rem; }
  #details .intro li { margin-bottom: 0.25rem; }
  #details kbd { font-family: inherit; font-size: 0.82rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; background: #fff; }
  #details .swatches { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  #details .swatches label { width: 1.7rem; height: 1.7rem; border-radius: 50%; cursor: pointer; display: block; border: 3px solid transparent; }
  #details .swatches input { display: none; }
  #details .swatches input:checked + label { border-color: var(--ink); }
  #details .photo { background: #fff; border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.35rem 0.6rem; margin: 0.35rem 0; }
  #details .photo b { color: var(--accent); }
  #details .photo .meta { font-size: 0.8rem; color: var(--faded); }
  #details .req { background: #fff; border: 1px solid var(--line-soft); border-left: 3px solid #d9a441; border-radius: 6px; padding: 0.3rem 0.55rem; margin: 0.35rem 0; font-size: 0.93rem; }
  #details .req.done { opacity: 0.6; border-left-color: #5c8a3a; }
  #details .req.done .rt { text-decoration: line-through; }
  #details .req .meta { font-size: 0.78rem; color: var(--faded); }
  #details textarea[data-req] { min-height: 4rem; }

  /* a model is moved by any bare part of its frame; its corner grip spreads its cards or gathers them */
  #ink .frame rect.f { pointer-events: auto; cursor: move; }
  #stage.tool-pen #ink .frame rect.f, #stage.tool-select #ink .frame rect.f, #stage.tool-erase #ink .frame rect.f { cursor: inherit; }
  .fgrip { position: absolute; width: 26px; height: 26px; border-radius: 7px; color: #fff; font-size: 15px; line-height: 25px; text-align: center; cursor: nwse-resize; opacity: 0.8; }
  .fgrip:hover { opacity: 1; }
  /* drawing sits on top of everything, as marker does on a whiteboard */
  #drawn { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #drawn path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #stage.tool-pen { cursor: crosshair; }
  #stage.tool-erase { cursor: cell; }
  #stage.tool-select { cursor: default; }
  #stage.spacepan, #stage.spacepan * { cursor: grab !important; }
  /* the tools */
  #palette { left: 12px; top: 12px; padding: 0.3rem; display: flex; flex-direction: column; gap: 0.2rem; }
  #palette button.tl { border: 0; background: none; border-radius: 8px; padding: 0.2rem 0.55rem; cursor: pointer; color: var(--accent); text-align: left; font-size: 0.88rem; white-space: nowrap; }
  #palette button.tl span { display: inline-block; width: 1.2rem; text-align: center; margin-right: 0.25rem; }
  #palette button.tl:hover { background: var(--parchment-dark); }
  #palette button.tl.on { background: var(--accent); color: var(--parchment); }
  #palette .pens { display: none; gap: 0.3rem; padding: 0.2rem 0.35rem 0.1rem; flex-wrap: wrap; width: 7.6rem; }
  #palette.pen .pens { display: flex; }
  #palette .pens button.pc { width: 1.35rem; height: 1.35rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  #palette .pens button.pc.on { box-shadow: 0 0 0 2px var(--ink); }
  #palette .pens .clr { flex-basis: 100%; text-align: left; margin-top: 0.15rem; }
  /* the side can be put away, for a tablet or a projector */
  body.sideclosed #side { display: none; }
  #sideopen { right: 12px; top: 12px; padding: 0.15rem 0.7rem; display: none; cursor: pointer; color: var(--accent); font-size: 0.9rem; }
  body.sideclosed #sideopen { display: block; }
  #side .tabs button.hide { flex: none; padding: 0.3rem 0.8rem; font-family: 'EB Garamond', serif; font-size: 1.05rem; letter-spacing: 0; color: var(--faded); }
  #stage { -webkit-touch-callout: none; -webkit-user-select: none; }
  /* fingers need bigger targets than a mouse */
  @media (pointer: coarse) {
    .card .knob { width: 34px; height: 34px; line-height: 33px; font-size: 18px; right: -19px; margin-top: -17px; }
    .card:hover .knob { display: none; }
    .card.sel .knob, .card.sel:hover .knob { display: block; }
    .fgrip { width: 38px; height: 38px; line-height: 37px; font-size: 20px; }
    .btn { padding: 0.25rem 0.9rem; }
    #palette button.tl { padding: 0.5rem 0.65rem; font-size: 0.98rem; }
    #palette .pens button.pc { width: 1.9rem; height: 1.9rem; }
    #zoom button { padding: 0.4rem 0.65rem; }
    #layers label { margin: 0.3rem 0; }
  }

  #sync { font-size: 0.84rem; color: var(--faded); display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  #sync i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #b8a88a; display: inline-block; }
  #sync.saved i { background: #5c8a3a; }
  #sync.busy i { background: #d9a441; }
  #sync.bad i { background: var(--prob); }
  #sync.practice i { background: #2f5d8a; }
  #sync .linkish { font-size: 0.84rem; }

  /* a topic's passages: one no longer under the topic, or no longer in My topics, is drawn dashed until it is put back or taken off */
  .card.k-passage.off { border-style: dashed; border-left-style: dashed; background: #f6f1e6; opacity: 0.85; }
  .card .flag { display: block; font-size: 0.7rem; color: var(--prob); margin-top: 0.2rem; font-style: normal; }
  .card .newtag { position: absolute; top: -0.6rem; right: 0.5rem; background: #2f5d8a; color: #fff; border-radius: 999px; padding: 0 0.45rem; font-size: 0.68rem; font-family: 'Cinzel', serif; letter-spacing: 0.08em; }
  #details .kept { background: var(--note); border: 1px solid #e6d58a; border-radius: 6px; padding: 0.3rem 0.55rem; font-size: 0.9rem; font-style: italic; margin: 0 0 0.4rem; }
  #details .offnote { border: 1.5px dashed var(--prob); border-radius: 6px; padding: 0.35rem 0.6rem; margin: 0.3rem 0 0.5rem; font-size: 0.92rem; }

  /* boxes: divisions drawn on the board, behind the cards */

<body>
<header>
  <a class="back" id="back" href="index.html" title="Back to this topic’s passages, in My topics">← Passages</a>

  <a id="mtlink" href="index.html">My topics</a><span class="slash">/</span>
  <b id="tname"></b><span class="slash">/</span>
  <b>Its board</b>
</header>
<div class="tools">
  <span class="grp"><span class="lbl">Add</span>
    <button type="button" class="btn k-note" data-add="note" title="Anything, as on a whiteboard">Note</button>
    <button type="button" class="btn k-problem" data-add="problem" title="A question the topic raises, in your words: draw arrows to it from the passages that may answer it">Question</button>

    <button type="button" class="linkish" id="vmore">this view…</button>
  </span>
  <span class="grp">
    <input type="search" id="search" placeholder="Find on the board" aria-label="Find on the board"><span id="found"></span>
  </span>
  <span class="grp">
    <button type="button" class="btn" id="undo" title="Undo (⌘Z)">↶</button>

    <button type="button" class="linkish" id="export">Export</button>

</div>
<div class="wrap">
  <div id="stage">
    <div id="world">
      <svg id="ink" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="gframes"></g><g id="gann"></g><g id="garrows"></g><path id="ghost" d=""></path><rect id="marq" class="marq" width="0" height="0" style="display:none"></rect></svg>
      <div id="cards"></div>
      <svg id="drawn" xmlns="http://www.w3.org/2000/svg"><g id="gdraw"></g><path id="wet" d=""></path></svg>
    </div>

      <button type="button" class="tl on" data-tool="move" title="Move cards and models, and drag the bare board to move about (V)"><span>✋</span>Move</button>
      <button type="button" class="tl" data-tool="select" title="Drag around cards to select several (S)"><span>⬚</span>Select</button>

      <button type="button" class="tl" data-tool="pen" title="Draw on the board (P). An Apple Pencil draws on the bare board in any tool."><span>✎</span>Draw</button>

    <div id="zoom" class="float"><button type="button" id="zout" title="Zoom out">−</button><span id="zk">100%</span><button type="button" id="zin" title="Zoom in">+</button><button type="button" id="zfit" title="Show the whole view">Fit</button><button type="button" id="ztidy" title="Lay this view out again, a column per group">Tidy</button></div>

    <div id="details"></div>

</div>

<datalist id="arrowtypes"><option value="develops"><option value="contradicts"><option value="qualifies"><option value="same as"><option value="answers?"><option value="cf."></datalist>

<div id="lock" class="lock" role="dialog" aria-modal="true" aria-labelledby="lockh"><div class="lockcard"><h2 id="lockh"></h2><div id="lockbody"></div></div></div>

<script>
/* ── Data ─────────────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────────────────────
   A topic's board. Each topic in My topics (topics.js) can have one: its passages are cards
   on it, which come and go with the topic, and around them whatever the reader adds, notes,
   questions, groups, boxes, arrows, drawing and annotations. It is the reader's alone.

   It is kept in My topics' own store, in this browser's localStorage, beside the topics, so
   that it goes wherever they go: Save to file, and the locked file on GitHub when Keep on
   GitHub is on. This page never holds a token. It writes the store, and the portal in its
   side, or any tab of the portal, sends the change to GitHub, as it sends any change of
   its own. Before each save the page reads the store afresh and folds in whatever changed
   there meanwhile, so nothing of the topics is written over.

   The page began as the study's board (studies/kinds-of-nothing/board.html), and keeps its
   shape: models (here called groups), items (the cards), arrows, views, photographs. A
   passage card names the passage kept in My topics by its id (mt), with its address and
   citation beside it in case the passage is later taken out of My topics; its words are
   the portal's, read from the portal in the side, or the copy My topics kept until that has
   loaded. Annotations belong to the passage, not the board: they are kept once, beside the
   boards, and show on every board of the reader's where their passage stands.
   ───────────────────────────────────────────────────────────────────────────── */
const PORTAL = 'index.html';
const TOPICS = 'kantlab-topics-v1';               // My topics' store (topics.js), which the board is kept in
const TOPICS_GH = 'kantlab-topics-github';        // set while My topics keeps a copy on GitHub in this browser
const BASE = { models: [], items: [], arrows: [], views: [] };
const TYPES = ['develops', 'contradicts', 'qualifies', 'same as', 'cf.'];
const COLS = 4, COLW = 275, ROWH = 215;           // where a topic's passages are laid out at first
const BIG = 2e6;                                  // past this many characters the store has, the page warns
const PALETTE = ['#5c6e3a', '#8b5e3c', '#3b5068', '#6b4e7a', '#3f6b63', '#9a6a1e', '#7a3b3b', '#5a5a5a'];
const LAYERS = [
  { key: 'frames', label: 'Groups, as frames', mark: 'sq' },
  { key: 'hypothesis', label: 'Arrows', color: '#5c3d1e' },
  { key: 'problem', label: 'Questions, and what may answer them', color: '#8a3b12', dash: '7 4' },
  { key: 'passage', label: 'Passages', mark: 'sq' },
  { key: 'note', label: 'Notes', mark: 'sq' },
  { key: 'drawing', label: 'Drawing', color: '#b03a2e' },
  { key: 'box', label: 'Boxes', mark: 'sq' },
  { key: 'annotations', label: 'Annotations, and what they join', color: '#2f5d8a', dash: '2 4' },
];
const INK = { division: '#b8a88a', hypothesis: '#5c3d1e', problem: '#8a3b12', computer: '#9a8f7a', passage: '#5c3d1e', note: '#5c3d1e' };
const DASH = { problem: '7 4', computer: '2 4' };
const FAR = 0.55, NEAR = 1.3;
const PENS = ['#1a1208', '#8b5e3c', '#b03a2e', '#2f5d8a', '#5c6e3a'];
// What can be said about a passage, or some of its words. A new kind is one more line here.
const ANN_KINDS = [
  { key: 'problem', label: 'Problem', color: '#8a3b12', hint: 'What is wrong or puzzling here: an OCR slip, a reading that does not fit, a clash with another passage' },
  { key: 'relevant', label: 'Relevant to…', color: '#2f5d8a', hint: 'Why, in a few words (optional)' },
  { key: 'interpretation', label: 'Interpretation', color: '#5c6e3a', hint: 'A possible reading, in your words' },
  { key: 'comment', label: 'Comment', color: '#9a6a1e', hint: 'Anything else' },
];
const ANN_CTX = 32;   // the characters kept either side of the words annotated, so that they can be found again
const PREFS = 'kantlab-topic-board-prefs-v1:';      // + the topic: this device's own camera, layers and view, kept apart from the board

/* ── State ────────────────────────────────────────────────────────────────── */
let B;                 // the board: { models, items, arrows, views, removed }
let photos = [];       // photographs: { id, name, date, board }, kept in the board, apart in memory so that undo does not copy them
let TID = new URLSearchParams(location.hash.slice(1)).get('t') || '';   // the topic, by its id in My topics
let DB = null;         // My topics' store, as last read or written here
let topic = null;      // the topic in it
let seenB = '';        // the board as kept, as last read or written here (the base two changes are merged against)
let seenA = '[]';      // the annotations likewise
let lost = '';         // why nothing can be saved: 'unreadable' (My topics would not read), 'gone' (the topic is not in it)
let FW = null;         // the portal in the side, once its texts are in
let pendingStore = false;   // the store changed during a drag or an edit: taken in when it ends
let viewId;            // the view shown
let live = null;       // while a photograph is shown, the board it stands in for
let undoStack = [], redoStack = [];
let sel = { kind: null, ids: [] };   // kind: 'card' | 'arrow' | 'model'
let form = null;       // the form open on the side, if any
let mode = null;       // { linkFrom } while choosing where an arrow goes
let focus = null;      // { id, hops }
let query = '';
let cam = { x: 40, y: 30, k: 1 };
let size = {};         // card id → { w, h }, as last drawn
let side = 'details';
let tool = 'move';     // 'move' | 'select' | 'pen' | 'erase'
let pen = PENS[2];
let sawPencil = false; // once an Apple Pencil has drawn, fingers move the board rather than draw
let offer = null;      // what a stroke just drawn may mean: { kind: 'arrow', from, to, stroke } | { kind: 'lasso', ids, stroke }
let spaceDown = false;
let prefs = {};        // this device's camera, layers and view, kept apart from the board
let editing = null;    // something being edited in place: { el, finish }
let annPick = null;    // words selected in a passage in the side, for the annotation bar: { card, qi, start, end, rect }
let sideStale = false; // someone else saved while words were being selected in the side: redraw it once the selection ends
let AX = null;         // the annotations, indexed by passage (see annIndex)

/* ── Builders: the board ──────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const me = () => '';    // the board is its reader's alone: nothing on it is signed
const now = () => new Date().toISOString();
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
// Keys in one order all the way down, so that two copies of the same board compare equal.
const deep = x => Array.isArray(x) ? x.map(deep) : isObj(x) ? Object.keys(x).sort().reduce((r, k) => { r[k] = deep(x[k]); return r; }, {}) : x;
// What is worked out here for a card and never saved: its passage's words, whether it is still under the topic.
const hide = (o, k, v) => Object.defineProperty(o, k, { value: v, writable: true, configurable: true, enumerable: false });
const view = () => B.views.find(v => v.id === viewId) || B.views[0];
const item = id => B.items.find(i => i.id === id);
const arrow = id => B.arrows.find(a => a.id === id);
const model = id => B.models.find(m => m.id === id);
const ro = () => !!live || !!lost;
const roWhy = () => live ? 'This is a photograph. Bring it back to change it.' : lost === 'unreadable' ? 'My topics would not read in this browser, so nothing here is saved.' : 'This topic is not in My topics in this browser, so nothing here is saved.';
const layersOf = () => Object.assign({}, view().layers || {}, (prefs.layers || {})[viewId] || {});
const layerOn = k => layersOf()[k] !== false;
function showLayer(k, on) { prefs.layers = prefs.layers || {}; prefs.layers[viewId] = Object.assign(layersOf(), { [k]: on !== false }); savePrefs(); }
function loadPrefs() { try { prefs = JSON.parse(localStorage.getItem(PREFS + TID) || '{}') || {}; } catch (e) { prefs = {}; } }
function savePrefs() { try { localStorage.setItem(PREFS + TID, JSON.stringify(prefs)); } catch (e) { /* fine */ } }
const itemLayer = it => it.kind;
function shown(it) { if (!it || (view().hidden || []).includes(it.id)) return false; const l = itemLayer(it); return !l || layerOn(l); }
const arrowShown = a => layerOn(a.layer) && shown(item(a.from)) && shown(item(a.to));
function nameOf(id) { const it = item(id); if (!it) return '(gone)'; const m = model(it.model); return cardTitle(it) + (m ? ' (' + m.title + ')' : ''); }
function cardTitle(it) {
  if (it.kind === 'box') return 'Box' + (it.label ? ': ' + it.label : '');
  if (it.kind === 'passage') return it.label || (it.quotes[0] && it.quotes[0].cite) || it.cite || 'a passage';
  const t = String(it.text || ''); return (it.kind === 'problem' ? 'Question: ' : 'Note: ') + (t.length > 50 ? t.slice(0, 49) + '…' : t);
}

/* Where a passage opens in the portal. */
function portalHref(q) {
  if (q.ref) {
    const k = q.ref.slice(0, q.ref.indexOf(':')), id = q.ref.slice(q.ref.indexOf(':') + 1);
    if (k === 'baumgarten' || k === 'meier') return PORTAL + '#read=' + k + '&at=' + encodeURIComponent(id);
    if (k === 'refl-meta' || k === 'refl-logik') return PORTAL + '#refl=' + id.replace(/^r/, '');
    return PORTAL + '#read=' + encodeURIComponent(k) + '&at=' + encodeURIComponent(id);
  }
  return q.hash ? PORTAL + q.hash : null;
}
// A portal address pasted on the page: only its #… part is kept, and only the portal is opened.
function hashOf(s) { const i = String(s || '').indexOf('#'); if (i < 0) return ''; const h = s.slice(i).trim(); return /^#[\w=&%.:,+*"' -]*$/.test(h) && h.length < 400 ? h : ''; }

/* ── Builders: keeping it ─────────────────────────────────────────────────────
   In My topics' store: boards[topic] is this board as kept (its photographs in it), and
   annotations, kept once for all of a reader's boards, those on the passages. The page reads
   the store afresh before each save, folds in what changed there meanwhile, and writes back
   only this board, the annotations, and what it was asked to change in a passage or the
   topic. A store that will not read is never written over. */
// What is read from the store is data: keep the shapes this page knows, and anything newer pages add.
function cleanBoard(d) {

window.addEventListener('blur', () => { spaceDown = false; $('stage').classList.remove('spacepan'); });
/* ── Init ─────────────────────────────────────────────────────────────────── */
function renderHead() {
  const name = topic ? topic.name : '';
  $('tname').textContent = name || 'a topic not in My topics here';
  document.title = (name ? name + ' · ' : '') + 'its board · My topics · Kant Lab';
  const back = 'index.html#mt=' + encodeURIComponent(TID);
  $('back').href = back; $('mtlink').href = back;
}
// Where the board stands: saved with the topics here, and, with GitHub on, what the portal beside it says of GitHub.
function renderSync() {
  const el = $('sync'); if (!el) return;
  let gh = false; try { gh = !!localStorage.getItem(TOPICS_GH); } catch (e) { gh = false; }
  if (lost || saveFailed) { el.className = 'bad'; el.innerHTML = '<i></i>Not saved'; el.title = lost ? roWhy() : 'This browser would not keep the last change. Export the board, so nothing is lost.'; return; }
  let st = '';
  try { const s = FW && FW.document.querySelector('#mtpage .mtstat'); st = s ? s.textContent.replace(/\s+/g, ' ').trim() : ''; } catch (e) { st = ''; }
  const bad = /locked|answered|can’t|isn’t|Try again|new token/i.test(st), busy = /moment|saving|catches up/.test(st);
  el.className = bad ? 'bad' : busy ? 'busy' : 'saved';
  el.innerHTML = '<i></i>' + (!gh ? 'Saved with My topics, in this browser' : !st ? 'Saved with My topics · GitHub when the portal beside the board has loaded' : bad ? 'Saved with My topics here · not yet on GitHub' : 'Saved with My topics · ' + esc(st.replace(/^Saved( on this computer)? · /, '')));
  el.title = !gh ? 'Kept with your topics in this browser. Save to file, in My topics, keeps a copy of both.'
    : bad ? 'GitHub: ' + st + ' Open My topics (← Passages) to put it right; the board is safe here meanwhile.'
    : 'Kept with your topics in this browser. The portal beside the board sends them to GitHub, locked with your passphrase, a few seconds after each change.';
}
setInterval(renderSync, 2000);
// What is new in an exported board comes in beside what is here; nothing here is overwritten.
function addFrom(into, from) {
  ['models', 'items', 'arrows', 'annotations'].forEach(k => {
    into[k] = into[k] || [];
    const have = new Set(into[k].map(x => x.id));
    (from[k] || []).forEach(x => { if (x && typeof x.id === 'string' && !have.has(x.id)) into[k].push(clone(x)); });
  });
  const haveV = new Set(into.views.map(v => v.id));
  (from.views || []).forEach(fv => {
    if (!fv || !fv.pos) return;
    if (!haveV.has(fv.id)) { into.views.push(Object.assign({ hidden: [], ink: [] }, clone(fv))); return; }
    const v = into.views.find(x => x.id === fv.id);
    Object.keys(fv.pos).forEach(id => { if (!v.pos[id]) v.pos[id] = fv.pos[id].slice(); });
    (fv.ink || []).forEach(st => { v.ink = v.ink || []; if (!v.ink.some(x => x.id === st.id)) v.ink.push(clone(st)); });
  });
  return into;
}
$('export').addEventListener('click', () => {
  const ids = new Set(annHere().map(a => a.id));
  const data = { kind: 'kantlab-topic-board', v: 1, topic: topic ? topic.name : '', saved: new Date().toISOString(), board: kept(),
    annotations: (B.annotations || []).filter(a => a && (ids.has(a.id) || (a.kind === 'reply' && ids.has(a.re)))) };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const slug = String(topic ? topic.name : 'topic').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'topic';
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'topic-board-' + slug + '-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('import').addEventListener('click', () => { if (ro()) return toast(roWhy()); $('file').value = ''; $('file').click(); });
$('file').addEventListener('change', () => {
  const f = $('file').files && $('file').files[0]; if (!f) return;
  f.text().then(s => {
    const d = JSON.parse(s);
    if (!d || d.kind !== 'kantlab-topic-board' || !d.board || !Array.isArray(d.board.items)) throw new Error('shape');
    const before = { m: B.models.length, i: B.items.length, a: B.arrows.length, v: B.views.length };
    const b = cleanBoard(d.board);
    change(() => { addFrom(B, { models: b.models, items: b.items, arrows: b.arrows, views: b.views, annotations: Array.isArray(d.annotations) ? d.annotations : [] }); });
    const have = new Set(photos.map(p => p.id)); let np = 0;
    (b.photos || []).forEach(p => { if (p && p.board && !have.has(p.id)) { photos.push(p); np++; } });
    if (np) save();
    render();
    toast('Added ' + (B.items.length - before.i) + ' cards, ' + (B.arrows.length - before.a) + ' arrows, ' + (B.models.length - before.m) + ' groups and ' + (B.views.length - before.v) + ' views. Nothing already on the board was changed.');
  }).catch(() => alert('That file is not an export of a topic’s board.'));
});
// The portal in the side: its texts give each passage its full words, and it sends the board to GitHub with the topics.
let fwT = 0;
function watchPortal() {
  clearInterval(fwT);
  fwT = setInterval(() => { const w = portalReady(); if (!w) return; clearInterval(fwT); FW = w; renderAround(); }, 500);
}
$('portal').addEventListener('load', () => { FW = null; watchPortal(); });
function showLost() {
  if (!lost) { $('lock').classList.remove('show'); return; }
  $('lockh').textContent = lost === 'unreadable' ? 'My topics would not read' : 'This topic is not in My topics here';
  $('lockbody').innerHTML = (lost === 'unreadable'
    ? '<p>The topics this browser keeps could not be read, so the board can’t be shown or saved. Nothing has been changed.</p>'
    : '<p>A topic’s board opens from My topics, in the portal: open the topic there and press <b>▦ Board</b>. This address may be to a topic deleted since, or kept in another browser.</p>') +
    '<p><a class="btn solid" href="index.html#mt=' + esc(encodeURIComponent(TID)) + '">Open My topics</a> <button type="button" class="linkish" id="lockx">Look at the board anyway</button></p>';
  $('lock').classList.add('show');
  $('lockx').addEventListener('click', () => $('lock').classList.remove('show'));
}
function start() {
  const d = readStore();
  if (!d) { lost = 'unreadable'; B = cleanBoard(clone(BASE)); B.annotations = []; viewId = B.views[0].id; loadPrefs(); return; }
  DB = d;
  const k = realTopic(d, TID);
  if (k !== TID) { TID = k; history.replaceState(null, '', '#t=' + encodeURIComponent(k)); }
  topic = d.topics.find(t => t && t.id === TID) || null;
  loadPrefs();
  const saved = isObj(d.boards) && d.boards[TID] ? cleanBoard(JSON.parse(JSON.stringify(d.boards[TID]))) : null;
  const anns = Array.isArray(d.annotations) ? d.annotations : [];
  if (!topic) lost = 'gone';
  B = saved ? clone(saved) : topic ? layOut() : cleanBoard(clone(BASE));
  photos = B.photos || []; delete B.photos;
  B.removed = B.removed || [];
  B.annotations = clone(anns);
  seenB = saved ? keyOf(saved) : ''; seenA = JSON.stringify(anns);
  viewId = B.views.some(v => v.id === prefs.viewId) ? prefs.viewId : B.views[0].id;
  if (topic && (!saved || syncCards() || !Array.isArray(d.annotations))) writeOut(d);   // a board made now, or cards for passages put under the topic since: kept at once
}
start();
// Each kind of annotation's colour, as --kc, and the bar that offers them.
document.head.insertAdjacentHTML('beforeend', '<style>' + ANN_KINDS.map(k => '.ak-' + k.key + ' { --kc: ' + k.color + '; }').join(' ') + ' .ak-reply { --kc: #8b5e3c; }</style>');
$('annbar').innerHTML = ANN_KINDS.map(k => '<button type="button" class="ak-' + k.key + '" data-annk="' + k.key + '" title="' + esc(k.key === 'relevant' ? 'What these words bear on: a word, a card on the board, R 3990, or a portal address' : k.hint) + '">' + esc(k.label) + '</button>').join('');
renderPens();
renderHead();
render();
showLost();
watchPortal();
// Cards are measured once the page is laid out, and again when its fonts arrive, since they change every card's size.
const settle = () => { renderBoard(); const c0 = camOf(); if (c0) { cam = Object.assign({}, c0); applyCam(); } else fit(); };
requestAnimationFrame(settle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!drag) settle(); });
</script>
