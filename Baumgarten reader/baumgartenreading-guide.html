<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baumgarten · Metaphysica (AA XVII)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&family=Libre+Baskerville:ital@0;1&display=swap');

:root {
  --ink:        #1a1208;
  --parchment:  #f4ede0;
  --parch-dark: #e8dcc8;
  --parch-deep: #d8ccb4;
  --accent:     #5c3d1e;
  --accent-lt:  #8b5e3c;
  --faded:      #7a6a52;
  --line:       #b8a88a;
  /* German gloss chip colours — warm amber, clearly distinct from Latin */
  --german-bg:  #fff8e8;
  --german-bd:  #c8a055;
  --german-ink: #7a4a00;
  /* AA page ref */
  --aa-ink:     #3a5a3a;
  --aa-bg:      #eef5ee;
  --aa-bd:      #8aaa8a;
  /* section header */
  --sec-ink:    #2e1a00;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 17px;
  line-height: 1.65;
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#toc-panel {
  width: 280px;
  min-width: 240px;
  flex-shrink: 0;
  background: var(--parch-dark);
  border-right: 2px solid var(--parch-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s ease;
}
#toc-panel.hidden { width: 0; min-width: 0; border-right: none; }

#toc-head {
  background: var(--accent);
  color: var(--parchment);
  padding: 0.9rem 1rem 0.8rem;
  flex-shrink: 0;
}
#toc-head h2 {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
}
#toc-head p {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.78rem;
  color: #d8c8a8;
  margin-top: 0.15rem;
}

#toc-search {
  padding: 0.6rem 0.8rem;
  flex-shrink: 0;
  border-bottom: 1px solid var(--parch-deep);
}
#toc-search input {
  width: 100%;
  background: var(--parchment);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 4px 8px;
  font-family: 'EB Garamond', serif;
  font-size: 0.85rem;
  color: var(--ink);
  outline: none;
}
#toc-search input:focus { border-color: var(--accent); }

#toc-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
}

/* TOC section group */
.toc-group { }
.toc-group-header {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faded);
  padding: 0.5rem 1rem 0.2rem;
  background: var(--parch-deep);
  margin-top: 2px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.toc-group-header:hover { color: var(--accent); }
.toc-group-body { }
.toc-group-body.collapsed { display: none; }

.toc-item {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 3px 1rem 3px 1.2rem;
  font-family: 'EB Garamond', serif;
  font-size: 0.84rem;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.toc-item:hover { background: var(--parch-deep); }
.toc-item.active {
  background: var(--parchment);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.toc-item .ti-num {
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  color: var(--faded);
  min-width: 32px;
  flex-shrink: 0;
}
.toc-item .ti-label {
  font-style: italic;
  line-height: 1.3;
  color: var(--ink);
  flex: 1;
}
.toc-item.active .ti-label { color: var(--accent); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#top-bar {
  background: var(--parch-dark);
  border-bottom: 2px solid var(--parch-deep);
  padding: 0.55rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-shrink: 0;
}
#toc-toggle {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--faded);
  border-radius: 2px;
  padding: 3px 8px;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  cursor: pointer;
  letter-spacing: 0.1em;
}
#toc-toggle:hover { color: var(--accent); border-color: var(--accent); }

.top-title {
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.top-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--faded);
  margin-left: auto;
}

/* legend for gloss chip */
.chip-legend {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.75rem;
  color: var(--faded);
  margin-left: auto;
}
.chip-sample {
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  color: var(--german-ink);
  font-size: 0.72rem;
  font-style: italic;
  padding: 0px 6px;
  border-radius: 2px;
}

#text-canvas {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 2.8rem 3rem;
}

#text-inner {
  max-width: 720px;
  margin: 0 auto;
}

/* AA page reference tag */
.aa-page {
  display: inline-flex;
  align-items: center;
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--aa-ink);
  background: var(--aa-bg);
  border: 1px solid var(--aa-bd);
  border-radius: 2px;
  padding: 0 5px;
  margin: 0 3px;
  vertical-align: middle;
  cursor: default;
}
.aa-page::before { content: 'AA 17:'; margin-right: 2px; opacity: 0.6; }

/* Baumgarten's own 1757 pagination, which the AA prints in brackets */
.ed-page {
  display: inline-flex;
  align-items: center;
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--faded);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0 5px;
  margin: 0 3px;
  vertical-align: middle;
  cursor: default;
}
.ed-page::before { content: '1757 p.'; margin-right: 3px; opacity: 0.6; }

/* A reading of AA XVII that looks like a misprint. The word is left as printed;
   only the dotted rule and the note beneath say so. */
.misprint {
  border-bottom: 1px dotted var(--accent);
  cursor: help;
}
.para-flag {
  margin: 0.35rem 0 0 0.2rem;
  padding-left: 0.6rem;
  border-left: 2px solid var(--accent-lt);
  font-family: 'EB Garamond', serif;
  font-size: 0.78rem;
  font-style: italic;
  line-height: 1.4;
  color: var(--faded);
}

/* An editorial note of the Academy Edition's own, standing where text would be */
.sec-note {
  margin: 0.5rem 0 1rem;
  padding: 0.55rem 0.85rem;
  background: var(--parch-deep);
  border-left: 3px solid var(--line);
  border-radius: 0 2px 2px 0;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--faded);
}
.toc-note {
  padding: 2px 1rem 4px 1.2rem;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.68rem;
  line-height: 1.35;
  color: var(--faded);
}

/* Kant Erläuterungen phase reference block */
.kant-refs {
  margin: 0.4rem 0 0.8rem;
  padding: 0.5rem 0.8rem;
  background: #f0eaf5;
  border-left: 3px solid #8060a0;
  border-radius: 0 2px 2px 0;
  font-family: 'EB Garamond', serif;
  font-size: 0.8rem;
  color: #4a3060;
}
.kant-refs .kr-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8060a0;
  margin-bottom: 0.25rem;
}
.kant-refs .kr-phases {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kant-phase {
  background: #f8f2ff;
  border: 1px solid #c0a0d8;
  border-radius: 2px;
  padding: 1px 7px;
  font-size: 0.78rem;
  color: #4a3060;
}

/* Section headings */
.section-part {
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  border-bottom: 2px solid var(--parch-deep);
  padding-bottom: 0.3rem;
  margin: 2.5rem 0 1rem;
}
.section-head {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  margin: 1.8rem 0 0.6rem;
  padding-left: 0.4rem;
  border-left: 3px solid var(--accent-lt);
}
.section-sub {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--faded);
  text-transform: uppercase;
  margin: 1.2rem 0 0.4rem;
}

/* Individual paragraph block */
.para-block {
  margin: 0.6rem 0;
  padding: 0.5rem 0.6rem 0.5rem 0.8rem;
  border-radius: 2px;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
  position: relative;
}
.para-block:hover {
  background: #faf4e8;
  border-left-color: var(--line);
}
.para-block.focused {
  background: #fffaf2;
  border-left-color: var(--accent);
  box-shadow: 0 1px 8px #00000010;
}

/* Paragraph number */
.para-num {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.15rem;
  user-select: none;
}

/* Latin text body */
.para-body {
  font-family: 'EB Garamond', serif;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink);
}

/* ── GERMAN GLOSS CHIP ── 
   Inline, rendered right where the *) marker is in the Latin text.
   Amber tint, Garamond italic, thin left rule in the accent tone.
   Designed to read like a rubrication in the margin but sitting inline. */
.gloss-chip {
  display: inline;
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  border-left: 3px solid var(--german-ink);
  border-radius: 0 3px 3px 0;
  color: var(--german-ink);
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85em;
  padding: 1px 7px 1px 5px;
  margin: 0 2px;
  vertical-align: baseline;
  cursor: default;
  white-space: nowrap;
}
.gloss-chip .chip-marker {
  font-style: normal;
  font-family: 'Cinzel', serif;
  font-size: 0.65em;
  letter-spacing: 0;
  color: var(--german-bd);
  margin-right: 3px;
  vertical-align: super;
}

/* Cross-reference links §.N */
.para-ref {
  color: var(--accent-lt);
  font-style: normal;
  cursor: pointer;
  border-bottom: 1px dashed var(--accent-lt);
  font-size: 0.92em;
}
.para-ref:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Empty / no-content message */
.empty-msg {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--faded);
  text-align: center;
  padding: 4rem 2rem;
  line-height: 1.6;
  font-size: 1.05rem;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--parch-deep); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--line); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="toc-panel">
  <div id="toc-head">
    <h2>Metaphysica</h2>
    <p>A. G. Baumgarten · Halle 1757</p>
  </div>
  <div id="toc-search">
    <input type="text" id="toc-filter" placeholder="Filter §§ …" autocomplete="off" spellcheck="false">
  </div>
  <div id="toc-scroll"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="top-bar">
    <button id="toc-toggle" title="Toggle table of contents">☰ TOC</button>
    <span class="top-title">Baumgarten · Metaphysica</span>
    <span class="top-sub">AA 17 · Editio IV, 1757</span>
    <span class="chip-legend">
      <span class="chip-sample">†</span> german equivalent
    </span>
  </div>
  <div id="text-canvas">
    <div id="text-inner">
      <div class="empty-msg">Loading text…</div>
    </div>
  </div>
</div>

<!-- The Metaphysica text itself. A classic <script src>, not fetch(), so the
     reader still opens by double-clicking from a file:// URL. -->
<script src="../data/metaphysica-17.js"></script>

<script>
// ── DATA: Baumgarten Metaphysica paragraphs ──────────────────────────────────
// The text lives in ../data/metaphysica-17.js, machine-extracted from the AA XVII
// transcription by scripts/parse_baum.py. That file publishes MET_META,
// MET_SECTIONS, MET_PARAGRAPHS and MET_BY_NUM as top-level consts; do not edit
// it by hand, change the extractor and regenerate.

// Kant's marginalia. The volume prints a "Handschriftliche Bemerkungen Kants"
// block for the Prolegomena and for Possibile and nowhere else, so this stays
// hand-entered here rather than in the generated data, keyed by section id.
const KANT_REFS = {
  'proleg': [
    { phase: 'δ', vol: 'XVII', page: '249' },
    { phase: 'λ', vol: 'XVII', page: '438' },
    { phase: 'ν', vol: 'XVII', page: '527' },
  ],
  'parsi-capi-seci': [
    { phase: 'δ', vol: 'XVII', page: '251' },
    { phase: 'ε', vol: 'XVII', page: '262' },
    { phase: 'ν', vol: 'XVII', page: '527' },
  ],
};

const SECTIONS = MET_SECTIONS.map(s => KANT_REFS[s.id] ? { ...s, kantRefs: KANT_REFS[s.id] } : s);
const PARAGRAPHS = MET_PARAGRAPHS;

// ── RENDERING ────────────────────────────────────────────────────────────────

// Build a map: section id → list of paragraphs
const secMap = {};
PARAGRAPHS.forEach(p => {
  if (!secMap[p.section]) secMap[p.section] = [];
  secMap[p.section].push(p);
});

// Also build a map: para num → paragraph (for cross-ref links)
const paraMap = {};
PARAGRAPHS.forEach(p => { paraMap[p.num] = p; });

function renderGlossChip(text, markerStr) {
  return `<span class="gloss-chip"><span class="chip-marker">${markerStr}</span>${text}</span>`;
}

// Convert @@N@@ markers and §.N cross-refs in text to HTML
function processText(p) {
  const glosses = p.glosses || [];
  const marks = p.marks || [];

  // 1. Replace @@N@@ with gloss chips (N is 1-based). The chip is labelled with
  //    the marker the volume actually prints, which is not recoverable from N:
  //    the asterisk count restarts when a §'s footnotes run over a page, three
  //    §§ carry on into a) b) c), and the volume mislabels a handful outright.
  let result = p.text.replace(/@@(\d+)@@/g, (_, n) => {
    const idx = parseInt(n) - 1;
    const german = glosses[idx] || '';
    if (!german) return '';
    return renderGlossChip(german, marks[idx] || '*'.repeat(parseInt(n)));
  });

  // 2. Convert cross-references to clickable links. The data keeps Baumgarten's
  //    own spacing, "§. 14"; they render tight, as "§14".
  result = result.replace(/§\.?\s*(\d+)/g, (match, num) => {
    return `<span class="para-ref" onclick="scrollToPara(${num})" title="Go to §${num}">§${num}</span>`;
  });

  // 3. Mark suspected misprints. The volume's word stays exactly as printed and
  //    is only underlined; the conjecture goes in the note beneath the §, so the
  //    reader can always see what AA XVII actually says. Done last, so the word
  //    cannot be matched inside markup generated above.
  (p.flags || []).forEach(f => {
    result = result.replace(new RegExp('\\b' + f.w + '\\b', 'g'),
      `<span class="misprint" title="perhaps a misprint for ${f.r}">${f.w}</span>`);
  });

  return result;
}

let focusedNum = null;

function scrollToPara(num) {
  const el = document.getElementById('para-' + num);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // Focus it
  if (focusedNum) {
    const prev = document.getElementById('para-' + focusedNum);
    if (prev) prev.classList.remove('focused');
  }
  el.classList.add('focused');
  focusedNum = num;
  // Highlight TOC
  document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
  const ti = document.querySelector(`.toc-item[data-para="${num}"]`);
  if (ti) { ti.classList.add('active'); ti.scrollIntoView({ block: 'nearest' }); }
}

function focusPara(num) {
  scrollToPara(num);
}

function buildTextContent() {
  const inner = document.getElementById('text-inner');
  inner.innerHTML = '';

  SECTIONS.forEach(sec => {
    // Section heading
    const secEl = document.createElement('div');
    if (sec.type === 'part') secEl.className = 'section-part';
    else if (sec.type === 'head') secEl.className = 'section-head';
    else secEl.className = 'section-sub';
    secEl.id = 'sec-' + sec.id;
    secEl.textContent = sec.label;
    inner.appendChild(secEl);

    // An AA editorial note standing where text would otherwise be — as at
    // Psychologia Empirica, whose §§ 504–699 the volume prints in Bd. XV.
    if (sec.note) {
      const n = document.createElement('div');
      n.className = 'sec-note';
      n.textContent = sec.note;
      inner.appendChild(n);
    }

    // Kant Erläuterungen phase references
    if (sec.kantRefs && sec.kantRefs.length) {
      const kr = document.createElement('div');
      kr.className = 'kant-refs';
      const lbl = document.createElement('div');
      lbl.className = 'kr-label';
      lbl.textContent = 'Handschriftliche Bemerkungen Kants';
      kr.appendChild(lbl);
      const phases = document.createElement('div');
      phases.className = 'kr-phases';
      sec.kantRefs.forEach(ref => {
        const chip = document.createElement('span');
        chip.className = 'kant-phase';
        chip.textContent = `Phase ${ref.phase} · ${ref.vol} · ${ref.page}`;
        phases.appendChild(chip);
      });
      kr.appendChild(phases);
      inner.appendChild(kr);
    }

    // Paragraphs
    const paras = secMap[sec.id] || [];
    paras.forEach(p => {
      const block = document.createElement('div');
      block.className = 'para-block';
      block.id = 'para-' + p.num;
      block.setAttribute('data-num', p.num);
      block.addEventListener('click', () => focusPara(p.num));

      // Header row: §.N and AA page if available
      const header = document.createElement('div');
      header.className = 'para-num';
      let headerHTML = `§${p.num}.`;
      if (p.aa) {
        const span = p.aaEnd ? `${p.aa}–${p.aaEnd}` : `${p.aa}`;
        headerHTML += ` <span class="aa-page">${span}</span>`;
      }
      if (p.ed) {
        headerHTML += ` <span class="ed-page" title="Baumgarten's own pagination, Halle 1757">${p.ed}</span>`;
      }
      header.innerHTML = headerHTML;
      block.appendChild(header);

      // Body
      const body = document.createElement('div');
      body.className = 'para-body';
      body.innerHTML = processText(p);
      block.appendChild(body);

      // The conjecture, kept out of the text and labelled as a conjecture.
      (p.flags || []).forEach(f => {
        const n = document.createElement('div');
        n.className = 'para-flag';
        n.textContent = `${f.w}] so AA XVII; perhaps a misprint for ${f.r}. ${f.y}`;
        block.appendChild(n);
      });

      inner.appendChild(block);
    });
  });
}

function buildTOC() {
  const scroll = document.getElementById('toc-scroll');
  scroll.innerHTML = '';

  // Group SECTIONS by part
  let currentGroup = null;
  let currentBody = null;

  SECTIONS.forEach(sec => {
    if (sec.type === 'part') {
      // New top-level group
      const group = document.createElement('div');
      group.className = 'toc-group';

      const header = document.createElement('div');
      header.className = 'toc-group-header';
      header.innerHTML = `${sec.label} <span>▾</span>`;
      group.appendChild(header);

      const body = document.createElement('div');
      body.className = 'toc-group-body';
      group.appendChild(body);

      header.addEventListener('click', () => {
        body.classList.toggle('collapsed');
        const arrow = header.querySelector('span');
        arrow.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
      });

      scroll.appendChild(group);
      currentGroup = group;
      currentBody = body;

      // Also add a TOC item for the part itself if it has paras
      const partParas = secMap[sec.id] || [];
      partParas.forEach(p => {
        const item = buildTOCItem(p);
        body.appendChild(item);
      });

    } else {
      // Sub-section header (non-clickable label) then its paras
      if (currentBody) {
        const subLabel = document.createElement('div');
        subLabel.style.cssText = 'font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--faded);padding:4px 1rem 1px 1.2rem;';
        subLabel.textContent = sec.label;
        currentBody.appendChild(subLabel);

        if (sec.note) {
          const n = document.createElement('div');
          n.className = 'toc-note';
          n.textContent = sec.note;
          currentBody.appendChild(n);
        }

        const paras = secMap[sec.id] || [];
        paras.forEach(p => {
          const item = buildTOCItem(p);
          currentBody.appendChild(item);
        });
      }
    }
  });
}

function buildTOCItem(p) {
  const item = document.createElement('div');
  item.className = 'toc-item';
  item.setAttribute('data-para', p.num);
  item.innerHTML = `<span class="ti-num">§${p.num}</span>
    <span class="ti-label">${getParaSnippet(p)}</span>`;
  item.addEventListener('click', () => scrollToPara(p.num));
  return item;
}

function getParaSnippet(p) {
  // Return first few words of paragraph as label
  const plain = p.text.replace(/@@\d+@@/g, '').replace(/§\.?\s*\d+/g, '').trim();
  const words = plain.split(/\s+/).slice(0, 6).join(' ');
  return words + (plain.split(/\s+/).length > 6 ? '…' : '');
}

// TOC filter
document.getElementById('toc-filter').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.toc-item').forEach(item => {
    const num = item.getAttribute('data-para');
    const label = item.textContent.toLowerCase();
    const show = !q || label.includes(q) || num === q;
    item.style.display = show ? '' : 'none';
  });
});

// TOC toggle
document.getElementById('toc-toggle').addEventListener('click', () => {
  document.getElementById('toc-panel').classList.toggle('hidden');
});

// Init
buildTextContent();
buildTOC();
</script>
</body>
