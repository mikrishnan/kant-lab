<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baumgarten · Metaphysica (AA XVII)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&family=Libre+Baskerville:ital@0;1&display=swap');

:root {
  --ink:        #1a1208;
  --parchment:  #f4ede0;
  --parch-dark: #e8dcc8;
  --parch-deep: #d8ccb4;
  --accent:     #5c3d1e;
  --accent-lt:  #8b5e3c;
  --faded:      #7a6a52;
  --line:       #b8a88a;
  /* German gloss chip colours — warm amber, clearly distinct from Latin */
  --german-bg:  #fff8e8;
  --german-bd:  #c8a055;
  --german-ink: #7a4a00;
  /* AA page ref */
  --aa-ink:     #3a5a3a;
  --aa-bg:      #eef5ee;
  --aa-bd:      #8aaa8a;
  /* section header */
  --sec-ink:    #2e1a00;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 17px;
  line-height: 1.65;
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#toc-panel {
  width: 280px;
  min-width: 240px;
  flex-shrink: 0;
  background: var(--parch-dark);
  border-right: 2px solid var(--parch-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s ease;
}
#toc-panel.hidden { width: 0; min-width: 0; border-right: none; }

#toc-head {
  background: var(--accent);
  color: var(--parchment);
  padding: 0.9rem 1rem 0.8rem;
  flex-shrink: 0;
}
#toc-head h2 {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
}
#toc-head p {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.78rem;
  color: #d8c8a8;
  margin-top: 0.15rem;
}

#toc-search {
  padding: 0.6rem 0.8rem;
  flex-shrink: 0;
  border-bottom: 1px solid var(--parch-deep);
}
#toc-search input {
  width: 100%;
  background: var(--parchment);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 4px 8px;
  font-family: 'EB Garamond', serif;
  font-size: 0.85rem;
  color: var(--ink);
  outline: none;
}
#toc-search input:focus { border-color: var(--accent); }

#toc-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
}

/* TOC section group */
.toc-group { }
.toc-group-header {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faded);
  padding: 0.5rem 1rem 0.2rem;
  background: var(--parch-deep);
  margin-top: 2px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.toc-group-header:hover { color: var(--accent); }
.toc-group-body { }
.toc-group-body.collapsed { display: none; }

.toc-item {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 3px 1rem 3px 1.2rem;
  font-family: 'EB Garamond', serif;
  font-size: 0.84rem;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.toc-item:hover { background: var(--parch-deep); }
.toc-item.active {
  background: var(--parchment);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.toc-item .ti-num {
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  color: var(--faded);
  min-width: 32px;
  flex-shrink: 0;
}
.toc-item .ti-label {
  font-style: italic;
  line-height: 1.3;
  color: var(--ink);
  flex: 1;
}
.toc-item.active .ti-label { color: var(--accent); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#top-bar {
  background: var(--parch-dark);
  border-bottom: 2px solid var(--parch-deep);
  padding: 0.55rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-shrink: 0;
}
#toc-toggle {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--faded);
  border-radius: 2px;
  padding: 3px 8px;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  cursor: pointer;
  letter-spacing: 0.1em;
}
#toc-toggle:hover { color: var(--accent); border-color: var(--accent); }

.top-title {
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.top-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--faded);
  margin-left: auto;
}

/* legend for gloss chip */
.chip-legend {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.75rem;
  color: var(--faded);
  margin-left: auto;
}
.chip-sample {
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  color: var(--german-ink);
  font-size: 0.72rem;
  font-style: italic;
  padding: 0px 6px;
  border-radius: 2px;
}

#text-canvas {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 2.8rem 3rem;
}

#text-inner {
  max-width: 720px;
  margin: 0 auto;
}

/* AA page reference tag */
.aa-page {
  display: inline-flex;
  align-items: center;
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--aa-ink);
  background: var(--aa-bg);
  border: 1px solid var(--aa-bd);
  border-radius: 2px;
  padding: 0 5px;
  margin: 0 3px;
  vertical-align: middle;
  cursor: default;
}
.aa-page::before { content: 'AA 17:'; margin-right: 2px; opacity: 0.6; }

/* Kant Erläuterungen phase reference block */
.kant-refs {
  margin: 0.4rem 0 0.8rem;
  padding: 0.5rem 0.8rem;
  background: #f0eaf5;
  border-left: 3px solid #8060a0;
  border-radius: 0 2px 2px 0;
  font-family: 'EB Garamond', serif;
  font-size: 0.8rem;
  color: #4a3060;
}
.kant-refs .kr-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8060a0;
  margin-bottom: 0.25rem;
}
.kant-refs .kr-phases {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kant-phase {
  background: #f8f2ff;
  border: 1px solid #c0a0d8;
  border-radius: 2px;
  padding: 1px 7px;
  font-size: 0.78rem;
  color: #4a3060;
}

/* Section headings */
.section-part {
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  border-bottom: 2px solid var(--parch-deep);
  padding-bottom: 0.3rem;
  margin: 2.5rem 0 1rem;
}
.section-head {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  margin: 1.8rem 0 0.6rem;
  padding-left: 0.4rem;
  border-left: 3px solid var(--accent-lt);
}
.section-sub {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--faded);
  text-transform: uppercase;
  margin: 1.2rem 0 0.4rem;
}

/* Individual paragraph block */
.para-block {
  margin: 0.6rem 0;
  padding: 0.5rem 0.6rem 0.5rem 0.8rem;
  border-radius: 2px;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
  position: relative;
}
.para-block:hover {
  background: #faf4e8;
  border-left-color: var(--line);
}
.para-block.focused {
  background: #fffaf2;
  border-left-color: var(--accent);
  box-shadow: 0 1px 8px #00000010;
}

/* Paragraph number */
.para-num {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.15rem;
  user-select: none;
}

/* Latin text body */
.para-body {
  font-family: 'EB Garamond', serif;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink);
}

/* ── GERMAN GLOSS CHIP ── 
   Inline, rendered right where the *) marker is in the Latin text.
   Amber tint, Garamond italic, thin left rule in the accent tone.
   Designed to read like a rubrication in the margin but sitting inline. */
.gloss-chip {
  display: inline;
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  border-left: 3px solid var(--german-ink);
  border-radius: 0 3px 3px 0;
  color: var(--german-ink);
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85em;
  padding: 1px 7px 1px 5px;
  margin: 0 2px;
  vertical-align: baseline;
  cursor: default;
  white-space: nowrap;
}
.gloss-chip .chip-marker {
  font-style: normal;
  font-family: 'Cinzel', serif;
  font-size: 0.65em;
  letter-spacing: 0;
  color: var(--german-bd);
  margin-right: 3px;
  vertical-align: super;
}

/* Cross-reference links §.N */
.para-ref {
  color: var(--accent-lt);
  font-style: normal;
  cursor: pointer;
  border-bottom: 1px dashed var(--accent-lt);
  font-size: 0.92em;
}
.para-ref:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Empty / no-content message */
.empty-msg {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--faded);
  text-align: center;
  padding: 4rem 2rem;
  line-height: 1.6;
  font-size: 1.05rem;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }

    glosses: [] },

  { num: 12, section: 'sec1', aaPage: null,
    text: 'Posito impossibili oritur contradictio@@1@@. Quod non tantum videtur, sed et est, verum@@2@@, quod tantum videtur, non est, apparens@@3@@ dicitur. Hinc orta contradictio vel vera est, vel apparens.',
    glosses: ['Entsteht ein Widerspruch', 'Wahr', 'nur scheinend'] },

  { num: 13, section: 'sec1', aaPage: null,
    text: 'Posito A et non-A oritur contradictio, §.9, 12. Posito A et B, quo posito ponitur non-A, ponitur impossibile, §.9, hinc oritur contradictio, §.12, prior patens@@1@@ (directa, immediata et explicita), posterior latens@@2@@ (indirecta, cryptica, mediata et implicita) vocatur. In quo vera contradictio patet, absurdum@@3@@ est (absonum).',
    glosses: ['Ein offenbarer', 'Ein versteckter Widerspruch', 'offenbar falsch'] },

  { num: 14, section: 'sec1', aaPage: null,
    text: 'Ratio@@1@@, cf. §.640, (condicio, hypothesis,) est id, ex quo cognoscibile est, cur aliquid sit. Quod rationem habet, seu, cuius aliquid est ratio, rationatum@@2@@ eius dicitur, et ab eo dependens@@3@@. Praedicatum, quo aliquid vel ratio, vel rationatum est, vel utrumque, nexus@@4@@ est.',
    glosses: ['ein Grund', 'seine Folge, das in ihm gegründete', 'das von ihm abhängende', 'der Zusammenhang, die Verknüpfung'] },

  { num: 15, section: 'sec1', aaPage: null,
    text: 'Quod spectatur, sed non in nexu cum iis, quae extra illud ponuntur, spectatur in se@@1@@. Quod nec in se quidem spectandum repraesentabile est, est impossibile in se@@2@@, (intrinsecus, simpliciter, absolute, per se). Quod in se spectatum est possibile, est possibile in se@@3@@ (intrinsecus, absolute, per se, simpliciter).',
    glosses: ['wird an und vor sich betrachtet', 'an und vor sich, innerlich, schlechterdings unmöglich', 'an und vor sich, innerlich, unbedingt möglich'] },

  { num: 16, section: 'sec1', aaPage: null,
    text: 'Quod in nexu etiam cum aliquibus, quae extra illud ponuntur, tamen est possibile, est possibile hypothetice@@1@@ (respective, relative, extrinsecus, per aliud, et secundum quid).',
    glosses: ['bedingt, äusserlich möglich'] },

  { num: 17, section: 'sec1', aaPage: null,
    text: 'Quod non, nisi in aliquo nexu cum iis, quae extra illud ponuntur, est impossibile, est impossibile hypothetice@@1@@ (respective, relative, extrinsecus, per aliud, et secundum quid).',
    glosses: ['bedingt, äusserlich, in einem gewissen Zusammenhange unmöglich'] },

  { num: 18, section: 'sec1', aaPage: null,
    text: 'Nullum absolute impossibile est hypothetice possibile, §.15, 16. Ergo nullum hypothetice possibile est absolute impossibile. Omne hypothetice impossibile et possibile est in se possibile, §.17, 15. Ergo absolute impossibilia nec hypothetice possibilia sunt, nec impossibilia. Quoddam absolute possibile est hypothetice impossibile.',
    glosses: [] },

  // ── SECTIO II · CONNEXUM ────────────────────────────────────────────────────
  { num: 19, section: 'sec2', aaPage: null,
    text: 'Possibile in nexu i.e. in quo nexus est, cui nexus convenit, connexum@@1@@ (rationale) est, in nexu impossibile est irrationale@@2@@ (inconnexum, incohaerens). Hinc irrationalia vel sunt in se, vel hypothetice impossibilia, §.15, 17.',
    glosses: ['zusammenhängend, verknüpft', 'ungereimt'] },

  { num: 20, section: 'sec2', aaPage: null,
    text: 'Omne possibile aut habet rationem, aut minus, §.10. Si habet rationem, aliquid est eius ratio, §.8. Si non habet, nihil est eius ratio, §.7. Ergo omnis possibilis ratio aut nihil est, aut aliquid, §.10. Si nihil foret ratio alicuius possibilis, foret ex nihilo cognoscibile, cur illud sit, §.14, hinc ipsum nihilum repraesentabile et aliquid, §.8, nihil aliquid, §.14, 8. Hinc quoddam possibile impossibile, §.7, 8, q.a., §.9. Ergo omnis possibilis aliquid est ratio, s. omne possibile est rationatum, s. nihil est sine ratione, seu, posito aliquo, ponitur aliquid eius ratio. Haec propositio dicitur principium rationis, quam colligas etiam ex §.265, 279, partim abstrahendo, partim vitando circulum.',
    glosses: [] },

  { num: 21, section: 'sec2', aaPage: null,
    text: 'Ratio singulorum in aliquo est ratio eius sufficiens@@1@@ (completa, totalis), aliquorum tantum in eodem ratio est ratio eius insufficiens@@2@@ (incompleta, partialis).',
    glosses: ['der zureichende Grund', 'der unzulängliche'] },

  { num: 22, section: 'sec2', aaPage: null,
    text: 'Nihil est sine ratione sufficiente, seu, posito aliquo, ponitur aliquid eius ratio sufficiens. Singula in omni possibili habent rationem, §.20, hinc omne possibile rationem sufficientem, §.21. Haec propositio dicitur principium rationis sufficientis (convenientiae).',
    glosses: [] },

  { num: 23, section: 'sec2', aaPage: null,
    text: 'Omne possibile est ratio, seu nihil est sine rationato, nihil sine corollario et auctoramento, nihil omnino sterile, otiosum et infecundum, seu posito aliquo ponitur aliquid rationatum eius. Nam omne possibile aut habet rationatum, aut minus, §.10. Si habet, est aliquid rationatum eius, §.8, si non habet, nihil est eius rationatum, §.7. Ergo omnis possibilis rationatum aut nihil est, aut aliquid, §.10. Si nihil esset rationatum possibilis alicuius, posset ex hoc cognosci, §.14, hinc esset aliquid, §.8, adeoque quoddam possibile impossibile, §.7, 8, q.a., §.9. Haec propositio dicatur principium rationati.',
    glosses: [] },

  { num: 24, section: 'sec2', aaPage: null,
    text: 'Omne possibile est ratio et rationatum, §.20, 23, hinc nexu duplici, §.14, connexum et rationale, §.19, tam a priori quam a posteriori cognoscibile. Haec propositio dicatur principium utrimque connexorum (a parte ante, et a parte post).',
    glosses: [] },

  { num: 25, section: 'sec2', aaPage: null,
    text: 'Ratio A rationis B, est ratio rationati C. Ex ratione τοῦ B cognosci potest, cur C sit, §.23, hinc A est ratio τοῦ C, §.14.',
    glosses: [] },

  { num: 26, section: 'sec2', aaPage: null,
    text: 'Rationatum C rationati B, est rationatum rationis A, §.25, 14.',
    glosses: [] },

  { num: 27, section: 'sec2', aaPage: null,
    text: 'Ratio A alicuius B, a quo dependet C, est huius C ratio mediata@@1@@ (ulterior, remota), ratio non mediata est immediata@@2@@ (proxima).',
    glosses: ['mittelbarer und entfernter', 'unmittelbarer und nächster Grund'] },

  { num: 28, section: 'sec2', aaPage: null,
    text: 'Ratio secundum quid@@1@@ (intermedia,) dicitur, quae habet adhuc ulteriorem, quae non habet, simpliciter talis@@2@@ (ultima). Rationes et rationata alicuius vel spectantur, etiam ut rationes et rationata inter se, subordinata@@3@@, vel minus, coordinata@@4@@.',
    glosses: ['der Zwischen-Grund', 'der letzte Grund', 'untereinander', 'neben einander stehende Gründe und Folgen'] },

  { num: 29, section: 'sec2', aaPage: null,
    text: 'Posito rationato, ponitur eius ratio aliqua, §.20, 14, et sufficiens, §.22, seu a rationato ad rationem, et sufficientem, V.C.',
    glosses: [] },

  { num: 30, section: 'sec2', aaPage: null,
    text: 'Posita ratione, hinc et sufficiente, §.21, ponitur rationatum, §.23, seu a ratione, et sufficiente, ad rationatum V.C.',
    glosses: [] },

  { num: 31, section: 'sec2', aaPage: null,
    text: 'Sublata ratione, et sufficiente, tollitur aliquid rationatum, quia posito hoc, poneretur et illa, §.29.',
    glosses: [] },

  { num: 32, section: 'sec2', aaPage: null,
    text: 'Sublato rationato tollitur ratio eius, et sufficiens, quia hac posita, poneretur et illud, §.30.',
    glosses: [] },

  { num: 33, section: 'sec2', aaPage: null,
    text: 'A et B connexa tertio C sunt connexa inter se, A est connexum cum C connexo cum B, est ergo in A, de quo cognosci potest ex B, cur sit, hinc A et B sunt connexa, §.19.',
    glosses: [] },

  // ── SECTIO III · ENS ────────────────────────────────────────────────────────
  { num: 34, section: 'sec3', aaPage: null,
    text: 'Quod aut ponitur esse A, aut ponitur non esse A, determinatur@@1@@. Quod vero tantum ponitur esse aut A, aut non A, est indeterminatum@@2@@. Quod determinari potest, est determinabile@@3@@.',
    glosses: ['bestimmt', 'unbestimmt', 'bestimmlich'] },

  { num: 35, section: 'sec3', aaPage: null,
    text: 'Ratio determinandi est determinans@@1@@. Omnis ergo ratio, sufficiens sufficienter, insufficiens insufficienter, determinat, §.34, 21. Hinc posito determinante, ponitur determinatum, §.30, et v.v., §.29. Sublato determinato, tollitur determinans, §.32, et v.v., §.31.',
    glosses: ['das bestimmende'] },

  { num: 36, section: 'sec3', aaPage: null,
    text: 'Quae determinando ponuntur in aliquo (notae et praedicata), sunt determinationes@@1@@, altera positiva, et affirmativa, §.34, 10, quae si vere sit, est realitas, altera negativa, §.34, 10, quae si vere sit, est negatio@@2@@. Negatio apparens est realitas cryptica, realitas apparens est vanitas@@3@@.',
    glosses: ['Bestimmungen', 'Verneinungen', 'Eitelkeit'] },

  { num: 37, section: 'sec3', aaPage: null,
    text: 'Determinationes possibilis aut sunt in eo repraesentabiles, etiamsi nondum spectetur in nexu, absolutae@@1@@, aut tunc demum, quando spectatur in nexu, §.10, respectivae@@2@@ (assumptivae). Determinationes possibilium respectivae sunt respectus@@3@@ (habitudines, τὰ πρός τι, relationes latius dictae). Respectus possibilium in iisdem in se spectatis non repraesentabiles sunt relationes@@4@@ (strictius dictae, ad extra). Relationes possibilium sunt eorundem determinationes externae@@5@@ (relativae, ad extra, extrinsecae), reliquae omnes, internae@@6@@.',
    glosses: ['dem möglichen an und vor sich betrachtet schon', 'beziehungs-weise zukommende Bestimmungen', 'Beziehungen', 'Verhältnisse', 'äussre', 'innre Bestimmungen'] },

  { num: 38, section: 'sec3', aaPage: null,
    text: 'Si in A sunt, quae in B, A et B sunt eadem@@1@@. Non eadem sunt diversa@@2@@ (alia).',
    glosses: ['einerlei', 'verschieden'] },

  { num: 39, section: 'sec3', aaPage: null,
    text: 'Determinationes possibilis internae, aut sunt internarum reliquarum rationes in internis simpliciter tales, aut minus, §.10. Illae sunt primae (principes), sive essentialia@@1@@.',
    glosses: ['die ersten oder wesentlichen Bestimmungen'] },

  { num: 40, section: 'sec3', aaPage: null,
    text: 'Complexus essentialium in possibili, seu possibilitas eius interna est essentia@@1@@ (esse rei, ratio formalis, natura, cf. §.430, quidditas, forma, formale totius, οὐσία τινότις, substantia, cf. §.191, conceptus entis primus).',
    glosses: ['das Wesen'] },

  { num: 41, section: 'sec3', aaPage: null,
    text: 'Determinationes possibilis internae, rationata essentiae, sunt affectiones@@1@@.',
    glosses: ['innere folgende Bestimmungen'] },

  { num: 42, section: 'sec3', aaPage: null,
    text: 'Determinatio interna, quae non est essentiale, est rationatum essentiae, §.39, 40, hinc affectio, §.41.',
    glosses: [] },

  { num: 43, section: 'sec3', aaPage: null,
    text: 'Posita in possibili essentia ponuntur affectiones, §.41, 30.',
    glosses: [] },

  { num: 44, section: 'sec3', aaPage: null,
    text: 'Positis in possibili affectionibus ponitur essentia aliqua, §.41, 29.',
    glosses: [] },

  { num: 45, section: 'sec3', aaPage: null,
    text: 'Sublata essentia tolluntur aliquae affectiones, §.41, 31.',
    glosses: [] },

  { num: 46, section: 'sec3', aaPage: null,
    text: 'Sublatis affectionibus tollitur essentia, §.41, 32.',
    glosses: [] },

  { num: 47, section: 'sec3', aaPage: null,
    text: 'Omnes determinationes internae possibilis sunt inter se connexae, singulae cum singulis. Affectiones enim connectuntur singulae cum essentialibus, §.39, haec cum essentia, §.40, 14. Hinc singulae determinationes cum singulis, §.33.',
    glosses: [] },

  { num: 48, section: 'sec3', aaPage: null,
    text: 'Nexus (harmonia) universalis@@1@@ est, qui est in singulis.',
    glosses: ['ein allgemeiner Zusammenhang'] },

  { num: 49, section: 'sec3', aaPage: null,
    text: 'In determinationibus possibilis internis est nexus universalis §.47, 48.',
    glosses: [] },

  { num: 50, section: 'sec3', aaPage: null,
    text: 'Affectiones habent rationem in essentia, §.41, hinc aut sufficientem, aut minus, §.21, 10. Illae sunt attributa@@1@@, hae modi@@2@@ (accidentia praedicabilia, s. logica, cf. §.191, adiuncta, praedicata secundaria).',
    glosses: ['Eigenschaften', 'Zufälligkeiten'] },

  { num: 51, section: 'sec3', aaPage: null,
    text: 'Attributa rationem sufficientem habent aut in omnibus essentialibus, aut in aliquibus tantum, §.50, 10. Illa propria@@1@@ sunt, haec communia@@2@@.',
    glosses: ['besondre', 'gemeine'] },

  { num: 52, section: 'sec3', aaPage: null,
    text: 'Omnis possibilium determinatio aut est essentiale, §.39, aut attributum, aut modus, §.42, aut relatio, §.37.',
    glosses: [] },

  { num: 53, section: 'sec3', aaPage: null,
    text: 'Omne possibile determinatum est, qua possibilitatem, §.34, 8, hinc in se possibile, qua possibilitatem internam, §.15, quae cum sit essentia, §.40, omne possibile habet essentiam, determinatum, qua essentiam. Ergo omnimode indeterminatum nihil est, §.7.',
    glosses: [] },

  { num: 54, section: 'sec3', aaPage: null,
    text: 'Possibile praeter essentiam, §.53, aut est determinatum, qua omnes affectiones etiam in ipso compossibiles, aut minus, §.34, 10. Illud est actuale@@1@@, hoc non ens (nihil, cf. §.7) privativum (mere possibile)@@2@@ vocatur.',
    glosses: ['wirklich', 'das bloss mögliche, ein mögliches Nichts'] },

  { num: 55, section: 'sec3', aaPage: null,
    text: 'Exsistentia@@1@@ (actus, cf. §.210, actualitas) est complexus affectionum in aliquo compossibilium, i.e. complementum essentiae sive possibilitatis internae, quatenus haec tantum, ut complexus determinationum spectatur, §.40.',
    glosses: ['Wirklichkeit'] },

  { num: 56, section: 'sec3', aaPage: null,
    text: 'Omnis determinatio possibilis interna aut pertinet ad essentiam eius, aut ad exsistentiam, §.55, 42.',
    glosses: [] },

  { num: 57, section: 'sec3', aaPage: null,
    text: 'Omne actuale est interne possibile, §.54, seu posita exsistentia ponitur interna possibilitas, §.55, 40, ab esse ad posse V.C.',
    glosses: [] },

  { num: 58, section: 'sec3', aaPage: null,
    text: 'Nullum interne impossibile est actuale, §.57, sublata possibilitate interna, tollitur actualitas, §.55, 40, seu a non posse ad non esse V.C.',
    glosses: [] },

  { num: 59, section: 'sec3', aaPage: null,
    text: 'Quoddam possibile non est actuale, §.54, seu posita possibilitate quadam tamen tolli potest actualitas, seu a quodam posse ad esse N.V.C.',
    glosses: [] },

  { num: 60, section: 'sec3', aaPage: null,
    text: 'Quoddam non actuale est possibile, §.59, sublata actualitate non omnis tollitur possibilitas, seu a non esse ad omnino non posse N.V.C.',
    glosses: [] },

  { num: 61, section: 'sec3', aaPage: null,
    text: 'Possibile, qua exsistentiam, determinabile est ens@@1@@.',
    glosses: ['ein Ding'] },

  { num: 62, section: 'sec3', aaPage: null,
    text: 'Non ens@@1@@ (negativum, cf. §.54) esset possibile, qua exsistentiam, non determinabile. §.61. At hoc impossibile, §.10, et, si videtur esse ens, est ens fictum@@2@@ (rationis ratiocinantis, cf. §.647).',
    glosses: ['ein Unding', 'ein erdichtetes Ding'] },

  { num: 63, section: 'sec3', aaPage: null,
    text: 'Omne ens est possibile, §.61, rationem, §.20, sufficientem habet, §.22, et rationatum, §.23, hinc dupliciter connexum est, §.24, habet essentiam, §.53, et essentialia, §.40, hinc affectiones, §.43, in universali nexu, §.49. Omnes entis determinationes aut sunt essentialia, aut attributa, aut modi, aut relationes, §.52. Posito ente, ponitur essentia eius, hinc essentialia omnia. Sublata essentia, tollitur ens. Sublato essentiali, tollitur essentia, hinc ens ipsum, §.53, 40. Omnis denique determinatio entis interna aut pertinet ad essentiam eius, aut ad exsistentiam, §.56.',
    glosses: [] },

  { num: 64, section: 'sec3', aaPage: null,
    text: 'Per essentiam attributa entis sufficienter determinantur, §.35, 50, hinc posita essentia ponuntur attributa, §.35. Ergo posito ente ponuntur attributa eius, §.63, sublato attributo tollitur essentia et ens, §.35, 63.',
    glosses: [] },

  { num: 65, section: 'sec3', aaPage: null,
    text: 'Modi entis per essentiam non sufficienter determinantur, §.50, 35, hinc non determinantur, qua exsistentiam, §.55. Ens ergo, qua modos actuales, per essentiam est indeterminatum, §.34, 54, i.e. modi possunt abesse et adesse salva rei essentia.',
    glosses: [] },

  { num: 66, section: 'sec3', aaPage: null,
    text: 'Exsistentia non repugnat essentiae, sed est realitas, §.36, cum ea compossibilis, §.50, 55.',
    glosses: [] },

  { num: 67, section: 'sec3', aaPage: null,
    text: 'Cognitio diversitatis est distinctio@@1@@, et ratio distinctionis in distinguendo discrimen (differentia, character, character distinctivus latius dictus, cf. §.350, nota, nota characteristica)@@2@@. Iam omnis determinatio entis est id, ex quo cognosci potest, ens illud nec indeterminatum, nec alio modo determinatum esse, §.36, 34. Ergo omnis determinatio est discrimen entis, §.38, 14.',
    glosses: ['Unterscheidung', 'Unterscheid, Merkmal, Kennzeichen, Unterscheidungs-Zeichen'] },

  { num: 68, section: 'sec3', aaPage: null,
    text: 'Discrimina entis sunt vel externa seu relativa, vel interna, §.67, 37, et haec vel essentialia, quae pertinent ad essentiam, vel accidentalia, quae ad exsistentiam, §.56, vel absoluta, vel respectiva, §.37.',
    glosses: [] },

  { num: 69, section: 'sec3', aaPage: null,
    text: 'Discrimina interna possunt repraesentari in ente in se spectato, §.68, 37, hinc quomodocumque cognosci, seu dari@@1@@. Data vel possumus etiam (sine compraesentia) sine assumpto alio, sine relatione ad aliud, concipere@@2@@ et intelligere, i.e. distincte cognoscere, vel non possumus. Illa sunt qualitates@@3@@, haec quantitates@@4@@.',
    glosses: ['angegeben werden', 'begreifen und verstehn', 'Beschaffenheiten', 'Grössen'] },

  // ── SECTIO IV · UNUM ────────────────────────────────────────────────────────
  { num: 72, section: 'sec4', aaPage: null,
    text: 'Determinationes entis separantur@@1@@, si ex simul positis quaedam tolluntur. Hinc inseparabiles@@2@@ sunt, quarum simul positarum nulla potest tolli.',
    glosses: ['werden getrennt', 'unzertrennlich'] },

  { num: 73, section: 'sec4', aaPage: null,
    text: 'Posito ente ponitur essentia, §.63, ergo complexus essentialium, §.40, hinc posito ente simul ponuntur essentialia omnia, et ita quidem, ut nullum possit tolli, §.63, 40. Ergo essentialia entis sunt per se inseparabilia, §.72, 15. Unum@@1@@ est, cuius determinationes sunt inseparabiles, et transcendentaliter@@2@@ quidem, cuius determinationes sunt per se inseparabiles. Ergo omne ens est unum transcendentale.',
    glosses: ['Eins', 'wesentlich eins'] },

  { num: 74, section: 'sec4', aaPage: null,
    text: 'A unum et B unum e.c. partim eadem, partim diversa sunt multa@@1@@. Quicquid cogitemus, aut sunt multa, aut non multa, §.10. Prior determinatio est multitudo (pluralitas)@@2@@, posterior unitas categorica@@3@@.',
    glosses: ['Viele', 'die Vielheit, Mehrheit', 'die Einheit'] },

  { num: 77, section: 'sec4', aaPage: null,
    text: 'Quicquid est, quod multa non sunt, est unicum (unum exclusive tale)@@1@@.',
    glosses: ['Einzig'] },

  // ── SECTIO V · ORDO ─────────────────────────────────────────────────────────
  { num: 78, section: 'sec5', aaPage: null,
    text: 'Si multa iuxta vel post se invicem ponuntur, coniunguntur@@1@@. Coniunctio plurium vel est eadem, vel diversa, §.10, 38. Si prior, est coordinatio@@2@@, et eius identitas ordo@@3@@. Ordinis scientia olim erat musica latius dicta.',
    glosses: ['verbunden werden', 'zusammenordnen', 'Ordnung'] },

  { num: 79, section: 'sec5', aaPage: null,
    text: 'Diversitas in coniunctione plurium est confusio (inordinatio)@@1@@. Coniunctio inseparabilium est unitio@@2@@.',
    glosses: ['Unordnung und Verwirrung', 'Vereinigung'] },

  { num: 80, section: 'sec5', aaPage: null,
    text: 'Omnis determinatio habet rationem, §.20, 36, quaeque ex aliqua determinata ratione cognosci potest, rationi dicitur conformis (conveniens, consentiens)@@1@@.',
    glosses: ['dem Grunde gemäss, übereinstimmig und zukommend'] },

  { num: 81, section: 'sec5', aaPage: null,
    text: 'Si posito A tollitur B, A et B opposita sunt@@1@@.',
    glosses: ['entgegen gesetzt, mit einander streitend'] },

  { num: 82, section: 'sec5', aaPage: null,
    text: 'Determinatio opposita illi, quae rationi conformis est, est rationi contraria (difformis, disconveniens) seu defectus@@1@@.',
    glosses: ['Mangel'] },

  { num: 83, section: 'sec5', aaPage: null,
    text: 'Propositis enuntians determinationem rationi conformem est norma (regula@@1@@, lex), immo latius, repraesentatio determinationis rationi conformis.',
    glosses: ['Richtschnur, Gesetz'] },

  { num: 84, section: 'sec5', aaPage: null,
    text: 'Ubicumque determinationes, ibi leges, §.83, 80.',
    glosses: [] },

  { num: 85, section: 'sec5', aaPage: null,
    text: 'Respectus entis ex coniunctione eius cum aliis determinatus est positus@@1@@. Ubi ergo positus, ibi leges, §.84, 37.',
    glosses: ['Stelle'] },

  { num: 86, section: 'sec5', aaPage: null,
    text: 'Coniunctione determinatur positus, hinc sunt in coniunctione leges, §.85, in eadem eaedem, §.38. Ergo in ordine coniunguntur plura eidem rationi conformiter, §.83, 78. Quod est in A et B, ipsis commune@@1@@ est. Quod est in A, non in B, est, respectu B, τῷ A proprium@@2@@, ergo in ordine sunt regulae communes.',
    glosses: ['Gemein', 'Eigen'] },

  { num: 87, section: 'sec5', aaPage: null,
    text: 'In coniunctione diversa diversae sunt leges, §.86, 38. Ergo in confusione non sunt leges communes, §.79, 86.',
    glosses: [] },

  { num: 88, section: 'sec5', aaPage: null,
    text: 'Ordinis si regula fuerit unica, simplex@@1@@, si plures, ordo compositus@@2@@ vocatur.',
    glosses: ['Eine einfache', 'zusammengesetzte Ordnung'] },

  // ── SECTIO VI · VERUM ───────────────────────────────────────────────────────
  { num: 89, section: 'sec6', aaPage: null,
    text: 'Veritas metaphysica@@1@@ (realis, obiectiva, materialis) est ordo plurium in uno, veritas in essentialibus et attributis entis, transcendentalis@@2@@.',

const secMap = {};
PARAGRAPHS.forEach(p => {
  if (!secMap[p.section]) secMap[p.section] = [];
  secMap[p.section].push(p);
});

// Also build a map: para num → paragraph (for cross-ref links)
const paraMap = {};
PARAGRAPHS.forEach(p => { paraMap[p.num] = p; });

function renderGlossChip(text, markerStr) {
  return `<span class="gloss-chip"><span class="chip-marker">${markerStr}</span>${text}</span>`;
}

// Convert @@N@@ markers and §.N cross-refs in text to HTML
function processText(text, glosses) {
  // 1. Replace @@N@@ with gloss chips (N is 1-based)
  let markers = ['*', '**', '***', '****', '******'];
  let result = text.replace(/@@(\d+)@@/g, (_, n) => {
    const idx = parseInt(n) - 1;
    const german = glosses[idx] || '';
    if (!german) return '';
    const marker = '*'.repeat(parseInt(n));
    return renderGlossChip(german, marker);
  });

  // 2. Convert §.N references to clickable links (handle §.N, N, or §§)
  //    The source text writes these as "§.14"; they render as "§14".
  result = result.replace(/§\.(\d+)/g, (match, num) => {
    return `<span class="para-ref" onclick="scrollToPara(${num})" title="Go to §${num}">§${num}</span>`;
  });

  return result;
}

let focusedNum = null;

function scrollToPara(num) {
  const el = document.getElementById('para-' + num);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // Focus it
  if (focusedNum) {
    const prev = document.getElementById('para-' + focusedNum);
    if (prev) prev.classList.remove('focused');
  }
  el.classList.add('focused');
  focusedNum = num;
  // Highlight TOC
  document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
  const ti = document.querySelector(`.toc-item[data-para="${num}"]`);
  if (ti) { ti.classList.add('active'); ti.scrollIntoView({ block: 'nearest' }); }
}

function focusPara(num) {
  scrollToPara(num);
}

function buildTextContent() {
  const inner = document.getElementById('text-inner');
  inner.innerHTML = '';

  SECTIONS.forEach(sec => {
    // Section heading
    const secEl = document.createElement('div');
    if (sec.type === 'part') secEl.className = 'section-part';
    else if (sec.type === 'head') secEl.className = 'section-head';
    else secEl.className = 'section-sub';
    secEl.id = 'sec-' + sec.id;
    secEl.textContent = sec.label;
    inner.appendChild(secEl);

    // Kant Erläuterungen phase references
    if (sec.kantRefs && sec.kantRefs.length) {
      const kr = document.createElement('div');
      kr.className = 'kant-refs';
      const lbl = document.createElement('div');
      lbl.className = 'kr-label';
      lbl.textContent = 'Handschriftliche Bemerkungen Kants';
      kr.appendChild(lbl);
      const phases = document.createElement('div');
      phases.className = 'kr-phases';
      sec.kantRefs.forEach(ref => {
        const chip = document.createElement('span');
        chip.className = 'kant-phase';
        chip.textContent = `Phase ${ref.phase} · ${ref.vol} · ${ref.page}`;
        phases.appendChild(chip);
      });
      kr.appendChild(phases);
      inner.appendChild(kr);
    }

    // Paragraphs
    const paras = secMap[sec.id] || [];
    paras.forEach(p => {
      const block = document.createElement('div');
      block.className = 'para-block';
      block.id = 'para-' + p.num;
      block.setAttribute('data-num', p.num);
      block.addEventListener('click', () => focusPara(p.num));

      // Header row: §.N and AA page if available
      const header = document.createElement('div');
      header.className = 'para-num';
      let headerHTML = `§${p.num}.`;
      if (p.aaPage) {
        headerHTML += ` <span class="aa-page">${p.aaPage}</span>`;
      }
      header.innerHTML = headerHTML;
      block.appendChild(header);

      // Body
      const body = document.createElement('div');
      body.className = 'para-body';
      body.innerHTML = processText(p.text, p.glosses);
      block.appendChild(body);

      inner.appendChild(block);
    });
  });
}

function buildTOC() {
  const scroll = document.getElementById('toc-scroll');
  scroll.innerHTML = '';

  // Group SECTIONS by part
  let currentGroup = null;
  let currentBody = null;

  SECTIONS.forEach(sec => {
    if (sec.type === 'part') {
      // New top-level group
      const group = document.createElement('div');
      group.className = 'toc-group';

      const header = document.createElement('div');
      header.className = 'toc-group-header';
      header.innerHTML = `${sec.label} <span>▾</span>`;
      group.appendChild(header);

      const body = document.createElement('div');
      body.className = 'toc-group-body';
      group.appendChild(body);

      header.addEventListener('click', () => {
        body.classList.toggle('collapsed');
        const arrow = header.querySelector('span');
        arrow.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
      });

      scroll.appendChild(group);
      currentGroup = group;
      currentBody = body;

      // Also add a TOC item for the part itself if it has paras
      const partParas = secMap[sec.id] || [];
      partParas.forEach(p => {
        const item = buildTOCItem(p);
        body.appendChild(item);
      });

    } else {
      // Sub-section header (non-clickable label) then its paras
      if (currentBody) {
        const subLabel = document.createElement('div');
        subLabel.style.cssText = 'font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--faded);padding:4px 1rem 1px 1.2rem;';
        subLabel.textContent = sec.label;
        currentBody.appendChild(subLabel);

        const paras = secMap[sec.id] || [];
        paras.forEach(p => {
          const item = buildTOCItem(p);
          currentBody.appendChild(item);
        });
      }
    }
  });
}

function buildTOCItem(p) {
  const item = document.createElement('div');
  item.className = 'toc-item';
  item.setAttribute('data-para', p.num);
  item.innerHTML = `<span class="ti-num">§${p.num}</span>
    <span class="ti-label">${getParaSnippet(p)}</span>`;
  item.addEventListener('click', () => scrollToPara(p.num));
  return item;
}

function getParaSnippet(p) {
  // Return first few words of paragraph as label
  const plain = p.text.replace(/@@\d+@@/g, '').replace(/§\.\d+/g, '').trim();
  const words = plain.split(/\s+/).slice(0, 6).join(' ');
  return words + (plain.split(/\s+/).length > 6 ? '…' : '');
}

// TOC filter
document.getElementById('toc-filter').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.toc-item').forEach(item => {
    const num = item.getAttribute('data-para');
    const label = item.textContent.toLowerCase();
    const show = !q || label.includes(q) || num === q;
    item.style.display = show ? '' : 'none';
  });
});

// TOC toggle
document.getElementById('toc-toggle').addEventListener('click', () => {
  document.getElementById('toc-panel').classList.toggle('hidden');
});

// Init
buildTextContent();
buildTOC();
</script>
</body>
</html>
