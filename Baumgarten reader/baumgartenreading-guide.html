<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baumgarten · Metaphysica (AA XVII)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600&family=Libre+Baskerville:ital@0;1&display=swap');

:root {
  --ink:        #1a1208;
  --parchment:  #f4ede0;
  --parch-dark: #e8dcc8;
  --parch-deep: #d8ccb4;
  --accent:     #5c3d1e;
  --accent-lt:  #8b5e3c;
  --faded:      #7a6a52;
  --line:       #b8a88a;
  /* German gloss chip colours — warm amber, clearly distinct from Latin */
  --german-bg:  #fff8e8;
  --german-bd:  #c8a055;
  --german-ink: #7a4a00;
  /* AA page ref */
  --aa-ink:     #3a5a3a;
  --aa-bg:      #eef5ee;
  --aa-bd:      #8aaa8a;
  /* section header */
  --sec-ink:    #2e1a00;
  /* Reflexionen panel */
  --panel-bg:   #faf7f0;
  /* Bands of Adickes' chronology, used to colour a phase chip by its decade.
     The same six tones the Meier reader uses, so a phase reads the same in
     both apps. Boundaries are Adickes' own (AA 14:XXXV). */
  --era-1750:   #7a6a4a;
  --era-1760:   #5c6e3a;
  --era-1770:   #8b5e3c;
  --era-1780:   #3b5068;
  --era-1790:   #6b4f7a;
  --era-none:   #9a9a9a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 17px;
  line-height: 1.65;
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#toc-panel {
  width: 280px;
  min-width: 240px;
  flex-shrink: 0;
  background: var(--parch-dark);
  border-right: 2px solid var(--parch-deep);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s ease;
}
#toc-panel.hidden { width: 0; min-width: 0; border-right: none; }

#toc-head {
  background: var(--accent);
  color: var(--parchment);
  padding: 0.9rem 1rem 0.8rem;
  flex-shrink: 0;
}
#toc-head h2 {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
}
#toc-head p {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.78rem;
  color: #d8c8a8;
  margin-top: 0.15rem;
}

#toc-search {
  padding: 0.6rem 0.8rem;
  flex-shrink: 0;
  border-bottom: 1px solid var(--parch-deep);
}
#toc-search input {
  width: 100%;
  background: var(--parchment);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 4px 8px;
  font-family: 'EB Garamond', serif;
  font-size: 0.85rem;
  color: var(--ink);
  outline: none;
}
#toc-search input:focus { border-color: var(--accent); }

#toc-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
}

/* TOC section group */
.toc-group { }
.toc-group-header {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faded);
  padding: 0.5rem 1rem 0.2rem;
  background: var(--parch-deep);
  margin-top: 2px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.toc-group-header:hover { color: var(--accent); }
.toc-group-body { }
.toc-group-body.collapsed { display: none; }

.toc-item {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 3px 1rem 3px 1.2rem;
  font-family: 'EB Garamond', serif;
  font-size: 0.84rem;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.toc-item:hover { background: var(--parch-deep); }
.toc-item.active {
  background: var(--parchment);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.toc-item .ti-num {
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  color: var(--faded);
  min-width: 32px;
  flex-shrink: 0;
}
.toc-item .ti-label {
  font-style: italic;
  line-height: 1.3;
  color: var(--ink);
  flex: 1;
}
.toc-item.active .ti-label { color: var(--accent); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#top-bar {
  background: var(--parch-dark);
  border-bottom: 2px solid var(--parch-deep);
  padding: 0.55rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-shrink: 0;
}
#toc-toggle {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--faded);
  border-radius: 2px;
  padding: 3px 8px;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  cursor: pointer;
  letter-spacing: 0.1em;
}
#toc-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* Same affordance as the TOC toggle — both open something. */
#synopsis-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--faded);
  border-radius: 2px;
  padding: 3px 9px;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  cursor: pointer;
}
#synopsis-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ── Baumgarten's Synopsis, as an overlay ── */
#synopsis-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26, 18, 8, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  padding: 3vh 1rem;
}
#synopsis-overlay.open { display: flex; }

#synopsis-panel {
  background: var(--parchment);
  border: 1px solid var(--line);
  border-radius: 3px;
  box-shadow: 0 8px 40px rgba(26, 18, 8, 0.35);
  width: min(760px, 100%);
  max-height: 94vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#synopsis-head {
  background: var(--accent);
  color: var(--parchment);
  padding: 0.8rem 1.2rem 0.7rem;
  display: flex;
  align-items: baseline;
  gap: 0.8rem;
  flex-shrink: 0;
}
#synopsis-head h2 {
  font-family: 'Cinzel', serif;
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
}
#synopsis-head .syn-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.78rem;
  color: #d8c8a8;
}
#synopsis-close {
  margin-left: auto;
  background: transparent;
  border: 1px solid rgba(244, 237, 224, 0.4);
  color: var(--parchment);
  border-radius: 2px;
  padding: 1px 8px;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  cursor: pointer;
}
#synopsis-close:hover { background: rgba(244, 237, 224, 0.15); }

#synopsis-scroll { overflow-y: auto; padding: 1rem 1.4rem 1.6rem; }

/* The printed Synopsis is a deep indented outline, but its indentation is in
   neither the RTF nor the text conversion, so it is not reconstructed here —
   the markers are set in a gutter and carry the structure themselves. */
.syn-provenance {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.78rem;
  line-height: 1.45;
  color: var(--faded);
  border-bottom: 1px solid var(--parch-deep);
  padding-bottom: 0.7rem;
  margin-bottom: 0.8rem;
}
.syn-row {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 1px 0;
  line-height: 1.5;
}
.syn-marker {
  flex: 0 0 2.6rem;
  text-align: right;
  font-family: 'Cinzel', serif;
  font-size: 0.68rem;
  color: var(--accent-lt);
}
.syn-text { flex: 1; font-size: 0.93rem; }
.syn-ref {
  color: var(--accent);
  border-bottom: 1px solid var(--parch-deep);
  cursor: pointer;
}
.syn-ref:hover { border-bottom-color: var(--accent); background: var(--parch-dark); }
/* A § the Synopsis names that AA XVII does not print. */
.syn-ref.absent {
  color: var(--faded);
  border-bottom: 1px dotted var(--line);
  cursor: help;
}
.syn-gap {
  margin: 0.6rem 0 0.6rem 3.2rem;
  padding: 0.45rem 0.8rem;
  background: var(--parch-dark);
  border-left: 3px solid var(--line);
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--faded);
}
.syn-page {
  margin: 0.7rem 0 0.2rem;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--line);
}

.top-title {
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.top-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--faded);
  margin-left: auto;
}

/* legend for gloss chip */
.chip-legend {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.75rem;
  color: var(--faded);
  margin-left: auto;
}
.chip-sample {
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  color: var(--german-ink);
  font-size: 0.72rem;
  font-style: italic;
  padding: 0px 6px;
  border-radius: 2px;
}

#reading-row {
  flex: 1;
  display: flex;
  min-height: 0;
}
#text-canvas {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 2.8rem 3rem;
}

#text-inner {
  max-width: 720px;
  margin: 0 auto;
}

/* AA page reference tag */
.aa-page {
  display: inline-flex;
  align-items: center;
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--aa-ink);
  background: var(--aa-bg);
  border: 1px solid var(--aa-bd);
  border-radius: 2px;
  padding: 0 5px;
  margin: 0 3px;
  vertical-align: middle;
  cursor: default;
}
.aa-page::before { content: 'AA 17:'; margin-right: 2px; opacity: 0.6; }

/* Baumgarten's own 1757 pagination, which the AA prints in brackets */
.ed-page {
  display: inline-flex;
  align-items: center;
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--faded);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0 5px;
  margin: 0 3px;
  vertical-align: middle;
  cursor: default;
}
.ed-page::before { content: '1757 p.'; margin-right: 3px; opacity: 0.6; }

/* A reading of AA XVII that looks like a misprint. The word is left as printed;
   only the dotted rule and the note beneath say so. */
.misprint {
  border-bottom: 1px dotted var(--accent);
  cursor: help;
}
.para-flag {
  margin: 0.35rem 0 0 0.2rem;
  padding-left: 0.6rem;
  border-left: 2px solid var(--accent-lt);
  font-family: 'EB Garamond', serif;
  font-size: 0.78rem;
  font-style: italic;
  line-height: 1.4;
  color: var(--faded);
}

/* An editorial note of the Academy Edition's own, standing where text would be */
.sec-note {
  margin: 0.5rem 0 1rem;
  padding: 0.55rem 0.85rem;
  background: var(--parch-deep);
  border-left: 3px solid var(--line);
  border-radius: 0 2px 2px 0;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--faded);
}
.toc-note {
  padding: 2px 1rem 4px 1.2rem;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.68rem;
  line-height: 1.35;
  color: var(--faded);
}

/* Kant Erläuterungen phase reference block */
.kant-refs {
  margin: 0.4rem 0 0.8rem;
  padding: 0.5rem 0.8rem;
  background: #f0eaf5;
  border-left: 3px solid #8060a0;
  border-radius: 0 2px 2px 0;
  font-family: 'EB Garamond', serif;
  font-size: 0.8rem;
  color: #4a3060;
}
.kant-refs .kr-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8060a0;
  margin-bottom: 0.25rem;
}
.kant-refs .kr-phases {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kant-phase {
  background: #f8f2ff;
  border: 1px solid #c0a0d8;
  border-radius: 2px;
  padding: 1px 7px;
  font-size: 0.78rem;
  color: #4a3060;
}

/* Section headings */
.section-part {
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  border-bottom: 2px solid var(--parch-deep);
  padding-bottom: 0.3rem;
  margin: 2.5rem 0 1rem;
}
.section-head {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  margin: 1.8rem 0 0.6rem;
  padding-left: 0.4rem;
  border-left: 3px solid var(--accent-lt);
}
.section-sub {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--faded);
  text-transform: uppercase;
  margin: 1.2rem 0 0.4rem;
}

/* Individual paragraph block */
.para-block {
  margin: 0.6rem 0;
  padding: 0.5rem 0.6rem 0.5rem 0.8rem;
  border-radius: 2px;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
  position: relative;
}
.para-block:hover {
  background: #faf4e8;
  border-left-color: var(--line);
}
.para-block.focused {
  background: #fffaf2;
  border-left-color: var(--accent);
  box-shadow: 0 1px 8px #00000010;
}

/* Paragraph number */
.para-num {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.15rem;
  user-select: none;
}

/* Latin text body */
.para-body {
  font-family: 'EB Garamond', serif;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink);
}

/* ── GERMAN GLOSS CHIP ── 
   Inline, rendered right where the *) marker is in the Latin text.
   Amber tint, Garamond italic, thin left rule in the accent tone.
   Designed to read like a rubrication in the margin but sitting inline. */
.gloss-chip {
  display: inline;
  background: var(--german-bg);
  border: 1px solid var(--german-bd);
  border-left: 3px solid var(--german-ink);
  border-radius: 0 3px 3px 0;
  color: var(--german-ink);
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85em;
  padding: 1px 7px 1px 5px;
  margin: 0 2px;
  vertical-align: baseline;
  cursor: default;
  white-space: nowrap;
}
.gloss-chip .chip-marker {
  font-style: normal;
  font-family: 'Cinzel', serif;
  font-size: 0.65em;
  letter-spacing: 0;
  color: var(--german-bd);
  margin-right: 3px;
  vertical-align: super;
}

/* Cross-reference links §.N */
.para-ref {
  color: var(--accent-lt);
  font-style: normal;
  cursor: pointer;
  border-bottom: 1px dashed var(--accent-lt);
  font-size: 0.92em;
}
.para-ref:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Empty / no-content message */
.empty-msg {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--faded);
  text-align: center;
  padding: 4rem 2rem;
  line-height: 1.6;
  font-size: 1.05rem;
}

/* ── REFLEXIONEN PANEL ──────────────────────────────────────────────────────
   Kant's handschriftliche Bemerkungen on the § in view, from AA XVII and XVIII.
   The card styling is the Meier reader's, mapped onto this app's palette so a
   Reflexion looks the same in both readers. */
#refl-show {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--faded);
  border-radius: 2px;
  padding: 3px 9px;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  cursor: pointer;
}
#refl-show:hover { color: var(--accent); border-color: var(--accent); }

#refl-resizer {
  width: 4px;
  background: var(--parch-deep);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background 0.15s;
}
#refl-resizer:hover { background: var(--accent-lt); }
#refl-resizer.hidden { display: none; }

#refl-panel {
  width: 380px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel-bg);
  border-left: 1px solid var(--line);
}
#refl-panel.hidden { display: none; }

#refl-head {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.55rem 1rem;
  background: var(--parch-dark);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
#refl-label {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--ink);
}
#refl-count {
  font-family: 'EB Garamond', serif;
  font-size: 0.75rem;
  font-style: italic;
  color: var(--faded);
}
#refl-toggle {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--faded);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px;
}
#refl-toggle:hover { color: var(--accent); }

#refl-scroll { flex: 1; overflow-y: auto; padding-bottom: 1.5rem; }

/* the § the list belongs to */
.r-para-head {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--parch-dark);
  border-bottom: 1px solid var(--parch-deep);
  padding: 6px 18px 7px;
}
.r-para-head-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.r-para-num {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink);
}
.r-para-count { font-size: 10.5px; color: var(--faded); flex-shrink: 0; }
.r-sub-hint {
  margin: 9px 18px 0;
  padding: 7px 10px;
  background: var(--parch-dark);
  border: 1px solid var(--parch-deep);
  font-size: 12px;
  line-height: 1.5;
  color: var(--faded);
}

/* one Reflexion */
.r-entry {
  position: relative;
  background: white;
  border-left: 3px solid var(--line);
  border-radius: 0 2px 2px 0;
  margin: 7px 18px 0;
  padding: 9px 12px 10px 30px;
  transition: box-shadow 0.12s;
  cursor: pointer;
}
.r-entry:hover { box-shadow: 0 1px 6px #00000017; }
.r-entry.interp { border-left-style: dashed; background: #fbfaf5; }
/* manuscript-placement glyph, in the card's left gutter */
.r-glyph {
  position: absolute;
  left: 8px;
  top: 9px;
  width: 15px;
  text-align: center;
  font-size: 13px;
  line-height: 1.2;
  color: var(--faded);
  cursor: help;
  user-select: none;
}
.r-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.r-num {
  font-family: 'Cinzel', serif;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faded);
}
.r-phase {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  border: 1px solid currentColor;
  padding: 0 5px 1px;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}
.r-phase:hover { background: #0000000d; }
.r-phase .r-phase-sym { font-size: 13.5px; font-weight: 500; }
.r-phase .r-phase-yr { font-size: 10.5px; opacity: 0.85; margin-left: 3px; }
.r-phase.undated { border-style: dashed; }
.era-1750 { color: var(--era-1750); }
.era-1760 { color: var(--era-1760); }
.era-1770 { color: var(--era-1770); }
.era-1780 { color: var(--era-1780); }
.era-1790 { color: var(--era-1790); }
.era-none { color: var(--era-none); }
.r-aa {
  font-family: 'Cinzel', serif;
  font-size: 8.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--aa-ink);
  border: 1px solid currentColor;
  padding: 1px 5px;
  margin-left: auto;
  flex-shrink: 0;
}
/* the AA's dating verbatim, where it says more than the symbols do */
.r-phraw {
  font-size: 11.5px;
  color: var(--faded);
  font-style: italic;
  margin-bottom: 3px;
}
/* the AA locus note, verbatim */
.r-locus {
  font-size: 11.5px;
  color: var(--ink);
  background: var(--parchment);
  border: 1px solid var(--parch-deep);
  padding: 3px 7px;
  margin-bottom: 5px;
  line-height: 1.45;
}
.r-locus-raw { font-style: italic; }
.r-chip {
  display: inline-block;
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  color: var(--faded);
  padding: 0 4px;
  margin: 3px 3px 0 0;
  background: white;
}
.r-chip.lemma {
  font-family: 'EB Garamond', serif;
  font-size: 11.5px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--accent-lt);
  border-color: var(--accent-lt);
  cursor: pointer;
}
.r-chip.lemma:hover { background: #8b5e3c1a; }
.r-chip.satz { color: var(--accent-lt); border-color: var(--accent-lt); cursor: pointer; }
.r-text { font-size: 14px; line-height: 1.62; color: var(--ink); white-space: pre-wrap; }
.r-foot { display: flex; align-items: baseline; gap: 7px; margin-top: 6px; flex-wrap: wrap; }
.r-sig { font-size: 11px; font-style: italic; color: var(--faded); }
/* How the § was arrived at — attested, or worked out, and from what. */
.r-prov {
  font-family: 'Cinzel', serif;
  font-size: 7.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 1px 5px;
  border: 1px solid var(--line);
  color: var(--faded);
  margin-left: auto;
}
.r-prov.locus { border-color: var(--aa-ink); color: var(--aa-ink); }
.r-prov.group { border-color: var(--line); }
.r-prov.interp { border-color: #aa6b6b; color: #8a4a4a; border-style: dashed; }
.r-prov.page { border-color: var(--era-1780); color: var(--era-1780); }
.r-prov.other { border-color: var(--line); color: var(--faded); font-style: italic; }

/* the way in to the Reflexionen that attach to no § */
.r-elsewhere {
  margin: 14px 18px 4px;
  padding-top: 10px;
  border-top: 1px solid var(--parch-deep);
}
.r-elsewhere-btn {
  display: block;
  width: calc(100% - 36px);
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--line);
  color: var(--faded);
  padding: 5px 9px;
  margin: 8px 18px 6px;
  cursor: pointer;
}
.r-elsewhere .r-elsewhere-btn { width: 100%; margin: 8px 0 6px; }
.r-elsewhere-btn:hover { color: var(--ink); border-color: var(--accent); }
.r-elsewhere-note {
  display: block;
  font-size: 11.5px;
  font-style: italic;
  line-height: 1.45;
  color: var(--faded);
}

/* ── Adickes overlay ── his note on the phase behind a chip */
.adickes-veil {
  position: fixed;
  inset: 0;
  background: #1a120859;
  z-index: 200;
  display: none;
}
.adickes-veil.open { display: block; }
.adickes-box {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(620px, 92vw);
  max-height: 82vh;
  overflow-y: auto;
  background: var(--parchment);
  border: 1px solid var(--line);
  box-shadow: 0 8px 40px #1a120844;
  padding: 22px 26px 26px;
}
.adickes-box h3 {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  letter-spacing: 0.05em;
  color: var(--ink);
  margin-bottom: 2px;
}
.adickes-sub {
  font-family: 'Cinzel', serif;
  font-size: 8.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--faded);
  margin-bottom: 14px;
}
.adickes-years { font-size: 16px; color: var(--accent-lt); margin-bottom: 12px; }
.adickes-note {
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink);
  border-left: 2px solid var(--line);
  padding-left: 13px;
  white-space: pre-wrap;
}
.adickes-flag {
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--parch-dark);
  border: 1px solid var(--parch-deep);
  padding: 8px 11px;
  margin-bottom: 12px;
}
.adickes-close {
  float: right;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--line);
  color: var(--faded);
  padding: 3px 9px;
  cursor: pointer;
}
.adickes-close:hover { color: var(--ink); border-color: var(--accent); }

/* ── lemma / Satz highlight in the primary text ── */
.lemma-hit {
  background: #8b5e3c38;
  box-shadow: 0 1px 0 var(--accent-lt);
}
.satz-hit { background: #8b5e3c21; }
.para-block.part-anfang::before,
.para-block.part-schluss::after {
  content: '⌐';
  color: var(--accent-lt);
  font-size: 15px;
  margin-right: 4px;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--parch-deep); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--line); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="toc-panel">
  <div id="toc-head">
    <h2>Metaphysica</h2>
    <p>A. G. Baumgarten · Halle 1757</p>
  </div>
  <div id="toc-search">
    <input type="text" id="toc-filter" placeholder="Filter §§ …" autocomplete="off" spellcheck="false">
  </div>
  <div id="toc-scroll"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="top-bar">
    <button id="toc-toggle" title="Toggle table of contents">☰ TOC</button>
    <button id="synopsis-btn" title="Baumgarten's own conspectus of the whole work">Synopsis</button>
    <button id="refl-show" title="Show Kant's Reflexionen beside the text" style="display:none;">Reflexionen</button>
    <span class="top-title">Baumgarten · Metaphysica</span>
    <span class="top-sub">AA 17 · Editio IV, 1757</span>
    <span class="chip-legend">
      <span class="chip-sample">†</span> german equivalent
    </span>
  </div>
  <div id="reading-row">
    <div id="text-canvas">
      <div id="text-inner">
        <div class="empty-msg">Loading text…</div>
      </div>
    </div>

    <div id="refl-resizer" title="Drag to resize"></div>

    <!-- Kant's handschriftliche Bemerkungen on the § in view -->
    <aside id="refl-panel">
      <div id="refl-head">
        <span id="refl-label">Reflexionen</span>
        <span id="refl-count"></span>
        <button id="refl-toggle" title="Hide the Reflexionen">×</button>
      </div>
      <div id="refl-scroll"></div>
    </aside>
  </div>
</div>

<!-- Baumgarten's Synopsis, AA 17:19–23 -->
<div id="synopsis-overlay">
  <div id="synopsis-panel">
    <div id="synopsis-head">
      <h2>Synopsis</h2>
      <span class="syn-sub">Baumgarten's conspectus of the whole work</span>
      <button id="synopsis-close">Close</button>
    </div>
    <div id="synopsis-scroll"></div>
  </div>
</div>

<!-- Adickes on one phase of Kant's hand, AA 14:XXXV–XLIII; opened from a phase chip -->
<div class="adickes-veil" id="adickesVeil">
  <div class="adickes-box" id="adickesBox"></div>
</div>

<!-- The Metaphysica text itself. A classic <script src>, not fetch(), so the
     reader still opens by double-clicking from a file:// URL. -->
<script src="../data/metaphysica-17.js"></script>
<script src="../data/phases-adickes.js"></script>
<script src="../data/reflexionen-17-18-baumgarten.js"></script>

<script>
// ── DATA: Baumgarten Metaphysica paragraphs ──────────────────────────────────
// The text lives in ../data/metaphysica-17.js, machine-extracted from the AA XVII
// transcription by scripts/parse_baum.py. That file publishes MET_META,
// MET_SECTIONS, MET_PARAGRAPHS and MET_BY_NUM as top-level consts; do not edit
// it by hand, change the extractor and regenerate.

// Kant's marginalia. The volume prints a "Handschriftliche Bemerkungen Kants"
// block for the Prolegomena and for Possibile and nowhere else, so this stays
// hand-entered here rather than in the generated data, keyed by section id.
const KANT_REFS = {
  'proleg': [
    { phase: 'δ', vol: 'XVII', page: '249' },
    { phase: 'λ', vol: 'XVII', page: '438' },
    { phase: 'ν', vol: 'XVII', page: '527' },
  ],
  'parsi-capi-seci': [
    { phase: 'δ', vol: 'XVII', page: '251' },
    { phase: 'ε', vol: 'XVII', page: '262' },
    { phase: 'ν', vol: 'XVII', page: '527' },
  ],
};

const SECTIONS = MET_SECTIONS.map(s => KANT_REFS[s.id] ? { ...s, kantRefs: KANT_REFS[s.id] } : s);
const PARAGRAPHS = MET_PARAGRAPHS;

// ── RENDERING ────────────────────────────────────────────────────────────────

// Build a map: section id → list of paragraphs
const secMap = {};
PARAGRAPHS.forEach(p => {
  if (!secMap[p.section]) secMap[p.section] = [];
  secMap[p.section].push(p);
});

// Also build a map: para num → paragraph (for cross-ref links)
const paraMap = {};
PARAGRAPHS.forEach(p => { paraMap[p.num] = p; });

function renderGlossChip(text, markerStr) {
  return `<span class="gloss-chip"><span class="chip-marker">${markerStr}</span>${text}</span>`;
}

// Convert @@N@@ markers and §.N cross-refs in text to HTML
function processText(p) {
  const glosses = p.glosses || [];
  const marks = p.marks || [];

  // 1. Replace @@N@@ with gloss chips (N is 1-based). The chip is labelled with
  //    the marker the volume actually prints, which is not recoverable from N:
  //    the asterisk count restarts when a §'s footnotes run over a page, three
  //    §§ carry on into a) b) c), and the volume mislabels a handful outright.
  let result = p.text.replace(/@@(\d+)@@/g, (_, n) => {
    const idx = parseInt(n) - 1;
    const german = glosses[idx] || '';
    if (!german) return '';
    return renderGlossChip(german, marks[idx] || '*'.repeat(parseInt(n)));
  });

  // 2. Convert cross-references to clickable links. The data keeps Baumgarten's
  //    own spacing, "§. 14"; they render tight, as "§14".
  result = result.replace(/§\.?\s*(\d+)/g, (match, num) => {
    return `<span class="para-ref" onclick="scrollToPara(${num})" title="Go to §${num}">§${num}</span>`;
  });

  // 3. Mark suspected misprints. The volume's word stays exactly as printed and
  //    is only underlined; the conjecture goes in the note beneath the §, so the
  //    reader can always see what AA XVII actually says. Done last, so the word
  //    cannot be matched inside markup generated above.
  (p.flags || []).forEach(f => {
    result = result.replace(new RegExp('\\b' + f.w + '\\b', 'g'),
      `<span class="misprint" title="perhaps a misprint for ${f.r}">${f.w}</span>`);
  });

  return result;
}

let focusedNum = null;

function scrollToPara(num, andPanel = true) {
  const el = document.getElementById('para-' + num);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // Focus it
  if (focusedNum) {
    const prev = document.getElementById('para-' + focusedNum);
    if (prev) prev.classList.remove('focused');
  }
  el.classList.add('focused');
  focusedNum = num;
  // Highlight TOC
  document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
  const ti = document.querySelector(`.toc-item[data-para="${num}"]`);
  if (ti) { ti.classList.add('active'); ti.scrollIntoView({ block: 'nearest' }); }
  // Move the Reflexionen to the § now in view. The highlighting functions call
  // this to reach their own §, and must not have the panel rebuilt under them.
  if (andPanel && reflOpen && reflPara !== num) renderReflForPara(num);
}

function focusPara(num) {
  scrollToPara(num);
}

function buildTextContent() {
  const inner = document.getElementById('text-inner');
  inner.innerHTML = '';

  SECTIONS.forEach(sec => {
    // Section heading
    const secEl = document.createElement('div');
    if (sec.type === 'part') secEl.className = 'section-part';
    else if (sec.type === 'head') secEl.className = 'section-head';
    else secEl.className = 'section-sub';
    secEl.id = 'sec-' + sec.id;
    secEl.textContent = sec.label;
    inner.appendChild(secEl);

    // An AA editorial note standing where text would otherwise be — as at
    // Psychologia Empirica, whose §§ 504–699 the volume prints in Bd. XV.
    if (sec.note) {
      const n = document.createElement('div');
      n.className = 'sec-note';
      n.textContent = sec.note;
      inner.appendChild(n);
    }

    // Kant Erläuterungen phase references
    if (sec.kantRefs && sec.kantRefs.length) {
      const kr = document.createElement('div');
      kr.className = 'kant-refs';
      const lbl = document.createElement('div');
      lbl.className = 'kr-label';
      lbl.textContent = 'Handschriftliche Bemerkungen Kants';
      kr.appendChild(lbl);
      const phases = document.createElement('div');
      phases.className = 'kr-phases';
      sec.kantRefs.forEach(ref => {
        const chip = document.createElement('span');
        chip.className = 'kant-phase';
        chip.textContent = `Phase ${ref.phase} · ${ref.vol} · ${ref.page}`;
        phases.appendChild(chip);
      });
      kr.appendChild(phases);
      inner.appendChild(kr);
    }

    // Paragraphs
    const paras = secMap[sec.id] || [];
    paras.forEach(p => {
      const block = document.createElement('div');
      block.className = 'para-block';
      block.id = 'para-' + p.num;
      block.setAttribute('data-num', p.num);
      block.addEventListener('click', () => focusPara(p.num));

      // Header row: §.N and AA page if available
      const header = document.createElement('div');
      header.className = 'para-num';
      let headerHTML = `§${p.num}.`;
      if (p.aa) {
        const span = p.aaEnd ? `${p.aa}–${p.aaEnd}` : `${p.aa}`;
        headerHTML += ` <span class="aa-page">${span}</span>`;
      }
      if (p.ed) {
        headerHTML += ` <span class="ed-page" title="Baumgarten's own pagination, Halle 1757">${p.ed}</span>`;
      }
      header.innerHTML = headerHTML;
      block.appendChild(header);

      // Body
      const body = document.createElement('div');
      body.className = 'para-body';
      body.innerHTML = processText(p);
      block.appendChild(body);

      // The conjecture, kept out of the text and labelled as a conjecture.
      (p.flags || []).forEach(f => {
        const n = document.createElement('div');
        n.className = 'para-flag';
        n.textContent = `${f.w}] so AA XVII; perhaps a misprint for ${f.r}. ${f.y}`;
        block.appendChild(n);
      });

      inner.appendChild(block);
    });
  });
}

function buildTOC() {
  const scroll = document.getElementById('toc-scroll');
  scroll.innerHTML = '';

  // Group SECTIONS by part
  let currentGroup = null;
  let currentBody = null;

  SECTIONS.forEach(sec => {
    if (sec.type === 'part') {
      // New top-level group
      const group = document.createElement('div');
      group.className = 'toc-group';

      const header = document.createElement('div');
      header.className = 'toc-group-header';
      header.innerHTML = `${sec.label} <span>▾</span>`;
      group.appendChild(header);

      const body = document.createElement('div');
      body.className = 'toc-group-body';
      group.appendChild(body);

      header.addEventListener('click', () => {
        body.classList.toggle('collapsed');
        const arrow = header.querySelector('span');
        arrow.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
      });

      scroll.appendChild(group);
      currentGroup = group;
      currentBody = body;

      // Also add a TOC item for the part itself if it has paras
      const partParas = secMap[sec.id] || [];
      partParas.forEach(p => {
        const item = buildTOCItem(p);
        body.appendChild(item);
      });

    } else {
      // Sub-section header (non-clickable label) then its paras
      if (currentBody) {
        const subLabel = document.createElement('div');
        subLabel.style.cssText = 'font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--faded);padding:4px 1rem 1px 1.2rem;';
        subLabel.textContent = sec.label;
        currentBody.appendChild(subLabel);

        if (sec.note) {
          const n = document.createElement('div');
          n.className = 'toc-note';
          n.textContent = sec.note;
          currentBody.appendChild(n);
        }

        const paras = secMap[sec.id] || [];
        paras.forEach(p => {
          const item = buildTOCItem(p);
          currentBody.appendChild(item);
        });
      }
    }
  });
}

function buildTOCItem(p) {
  const item = document.createElement('div');
  item.className = 'toc-item';
  item.setAttribute('data-para', p.num);
  item.innerHTML = `<span class="ti-num">§${p.num}</span>
    <span class="ti-label">${getParaSnippet(p)}</span>`;
  item.addEventListener('click', () => scrollToPara(p.num));
  return item;
}

function getParaSnippet(p) {
  // Return first few words of paragraph as label
  const plain = p.text.replace(/@@\d+@@/g, '').replace(/§\.?\s*\d+/g, '').trim();
  const words = plain.split(/\s+/).slice(0, 6).join(' ');
  return words + (plain.split(/\s+/).length > 6 ? '…' : '');
}

// ── SYNOPSIS ─────────────────────────────────────────────────────────────────
// Baumgarten's own conspectus, rendered flat. Its printed indentation survives
// neither the RTF nor the text conversion, so it is not reconstructed; the
// markers stand in a gutter and carry the outline themselves, as they do on the
// page. Each § it names is a link, except where AA XVII does not print that §.

function synopsisRef(text) {
  // Turn the entry's own § reference into links, leaving the wording verbatim.
  return text.replace(/§+\.?\s*\d+(?:\s*[-–]\s*\d+)?/g, match => {
    const first = parseInt(match.match(/\d+/)[0], 10);
    if (MET_BY_NUM[first] === undefined) {
      return `<span class="syn-ref absent" title="AA XVII does not print this §">${match}</span>`;
    }
    return `<span class="syn-ref" onclick="synopsisGo(${first})">${match}</span>`;
  });
}

function synopsisGo(num) {
  closeSynopsis();
  scrollToPara(num);
}

function buildSynopsis() {
  const scroll = document.getElementById('synopsis-scroll');
  if (scroll.childElementCount) return;          // built once

  const prov = document.createElement('div');
  prov.className = 'syn-provenance';
  prov.textContent =
    'AA 17:19–23, from the front matter of the 1757 edition. The printed Synopsis '
    + 'is an indented outline, but its indentation is not preserved in the source '
    + 'transcription and has not been reconstructed here — the markers are set in '
    + 'the gutter exactly as the volume letters them. Click a § to go to it.';
  scroll.appendChild(prov);

  let page = null, lastTo = null;
  MET_SYNOPSIS.forEach(e => {
    if (e.ed !== page) {
      page = e.ed;
      const pg = document.createElement('div');
      pg.className = 'syn-page';
      pg.textContent = '1757, p. ' + page;
      scroll.appendChild(pg);
    }

    // Two pages of the Synopsis are absent from the transcription; say so where
    // the break falls rather than letting the numbering jump silently.
    if (e.from !== undefined) {
      if (lastTo !== null && e.from > lastTo + 1) {
        const g = document.createElement('div');
        g.className = 'syn-gap';
        g.textContent = `§§ ${lastTo + 1}–${e.from - 1} — the Synopsis covers these, but `
          + `the pages carrying them are not in the source transcription.`;
        scroll.appendChild(g);
      }
      lastTo = Math.max(lastTo === null ? e.to : lastTo, e.to);
    }

    const row = document.createElement('div');
    row.className = 'syn-row';
    const mk = document.createElement('span');
    mk.className = 'syn-marker';
    mk.textContent = e.m || '';
    const tx = document.createElement('span');
    tx.className = 'syn-text';
    tx.innerHTML = synopsisRef(e.t);
    row.appendChild(mk);
    row.appendChild(tx);
    scroll.appendChild(row);
  });
}

function openSynopsis() {
  buildSynopsis();
  document.getElementById('synopsis-overlay').classList.add('open');
}
function closeSynopsis() {
  document.getElementById('synopsis-overlay').classList.remove('open');
}

// ── REFLEXIONEN ──────────────────────────────────────────────────────────────
// Kant's handschriftliche Bemerkungen on the Metaphysica: 2967 of them, Refl.
// 3489–6455, from AA XVII and XVIII, in ../data/reflexionen-17-18-baumgarten.js.
// The panel lists what stands at the § in view. AA XVII–XVIII are not arranged
// the way AA XVI is — the Erläuterungen have no block structure at all and the
// blocks elsewhere are thin — so there is nothing to be gained by mirroring the
// volume's own sequence. A plain list per § is closer to how these read; the
// median § has 12 entries and the largest 112, so no windowing is needed.

// How the AA says a note is placed on the page, and the gutter glyph for it.
const REFL_KIND = {
  'zu':        { glyph: '→', de: 'Zu …',        en: 'attached to the passage; placement not further specified' },
  'gegenüber': { glyph: '‖', de: 'Gegenüber …', en: 'on the facing (interleaved) page, opposite the passage' },
  'neben':     { glyph: '▎', de: 'Neben …',     en: 'beside the passage, in the same margin' },
  'zwischen':  { glyph: '↕', de: 'Zwischen …',  en: 'between the printed lines, or between two §§' },
  'über':      { glyph: '↑', de: 'Über …',      en: 'above the line' },
  'unter':     { glyph: '↓', de: 'Unter …',     en: 'below the line' },
  'nach':      { glyph: '»', de: 'Nach …',      en: 'after the passage' },
  'in':        { glyph: '⊂', de: 'In …',        en: 'written into the printed text itself' }
};

// Decade bands, used only to colour a phase chip. Boundaries are Adickes' own:
// α/β are the 1750s, θ the 1780s, ω 1790–1804 (AA 14:XXXV).
const ERAS = [
  { key: '1750', cls: 'era-1750', lo: 0,    hi: 1759 },
  { key: '1760', cls: 'era-1760', lo: 1760, hi: 1769 },
  { key: '1770', cls: 'era-1770', lo: 1770, hi: 1779 },
  { key: '1780', cls: 'era-1780', lo: 1780, hi: 1789 },
  { key: '1790', cls: 'era-1790', lo: 1790, hi: 9999 },
  { key: 'none', cls: 'era-none', lo: null, hi: null }
];

// The corpus, and the vocabulary for saying how each entry got its §. Every
// entry carries `src`, and the tag is the only place the reader can see whether
// a § is the Academy Edition's or this tool's — so nothing is normalised away.
const BAUM_CORPUS = {
  vol: 17, work: 'Metaphysica',
  entries: typeof REFLM_ENTRIES !== 'undefined' ? REFLM_ENTRIES : [],
  byPara: typeof REFLM_BY_PARA !== 'undefined' ? REFLM_BY_PARA : {},
  provenance(e) {
    if (e.other) return { cls: 'other', text: 'another handbook',
      title: 'Not written in the Metaphysica at all, but in ' + e.other
           + '. It is shown here because the Academy Edition prints it in the '
           + 'same volume, and it is attached to no § of Baumgarten.' };
    if (e.blatt) return { cls: 'other', text: 'loses Blatt',
      title: 'A loose sheet rather than the handbook, so the AA gives it no '
           + 'place in Baumgarten’s text.' };
    if (e.front) return { cls: 'other', text: 'front matter',
      title: 'Kant writing on the Roman-numbered front matter — the prefaces '
           + 'and the Synopsis — which precedes § 1.' };
    if (e.interp) return { cls: 'interp', text: 'interpolated §',
      title: 'The AA states no § for this Reflexion. The § was inferred from '
           + 'the surrounding entries by this tool and is not attested.' };
    if (e.src === 'locus') return { cls: 'locus', text: '§ attested',
      title: 'The § comes from this Reflexion’s own locus note in the AA.' };
    if (e.src === 'block') return { cls: 'group', text: '§ from AA block',
      title: 'The AA states no § for this Reflexion individually; the § range '
           + 'comes from the block header it stands under.' };
    if (e.src === 'page') return { cls: 'page', text: '§ from handbook page',
      title: 'The AA locates this note only to a page of Kant’s copy (' + e.sig
           + '). The §§ are those the 1757 edition prints on that page — '
           + 'attested from both sides, but it names every § on the page, not '
           + 'the one Kant wrote against.' };
    return { cls: 'interp', text: 'no § stated',
      title: 'Nothing in the AA locates this Reflexion in the text.' };
  },
};

// The entries the AA attaches to no § of the Metaphysica, in AA order. Nothing
// in the corpus is allowed to be unreachable, and none of these may be filed
// against a § it says nothing about, so they get a view of their own.
const REFL_OFFPARA = BAUM_CORPUS.entries
  .map((e, i) => [e, i]).filter(([e]) => !e.paras || !e.paras.length).map(([, i]) => i);

let reflPara = null;       // the § the panel is currently showing
let reflOpen = true;

/** Which era band a phase symbol falls in; 'none' where Adickes gives no date. */
function eraOf(sym) {
  const p = phaseInfo(sym);
  if (!p || p.from == null) return 'none';
  for (const e of ERAS) {
    if (e.lo !== null && p.from >= e.lo && p.from <= e.hi) return e.key;
  }
  return 'none';
}

function buildReflEntry(idx) {
  const C = BAUM_CORPUS;
  const e = C.entries[idx];
  const div = document.createElement('div');
  div.className = 'r-entry' + (e.interp ? ' interp' : '');
  div.dataset.idx = idx;

  // gutter glyph for where on the page the note stands
  const kind = e.loc && e.loc.kind ? REFL_KIND[e.loc.kind] : null;
  const g = document.createElement('span');
  g.className = 'r-glyph';
  g.textContent = kind ? kind.glyph : '·';
  g.title = kind ? kind.de + ' — ' + kind.en
                 : 'The AA gives no placement note for this Reflexion';
  div.appendChild(g);

  // header: number · phase chips · AA page
  const head = document.createElement('div');
  head.className = 'r-head';
  const num = document.createElement('span');
  num.className = 'r-num';
  num.textContent = 'Refl. ' + e.r;
  head.appendChild(num);

  (e.ph || []).forEach(sym => {
    const p = phaseInfo(sym);
    const b = document.createElement('button');
    b.className = 'r-phase ' + ERAS.find(x => x.key === eraOf(sym)).cls +
                  (p && p.years ? '' : ' undated');
    b.innerHTML = '<span class="r-phase-sym"></span><span class="r-phase-yr"></span>';
    b.querySelector('.r-phase-sym').textContent = p ? p.sym : sym;
    b.querySelector('.r-phase-yr').textContent = p && p.years ? p.years : 'undat.';
    b.title = 'Adickes’ phase ' + (p ? p.sym : sym) + ' — click for his note';
    b.onclick = ev => { ev.stopPropagation(); openAdickes(sym); };
    head.appendChild(b);
  });

  if (e.aa) {
    const aa = document.createElement('span');
    aa.className = 'r-aa';
    aa.textContent = 'AA ' + (e.vol || C.vol) + ':' + e.aa + (e.aaEnd ? '–' + e.aaEnd : '');
    head.appendChild(aa);
  }
  div.appendChild(head);

  // the AA's phase expression verbatim, where it says more than the symbols do.
  // Adickes' query marks and parentheses are his own uncertainty and are kept.
  const symJoin = (e.ph || []).join('');
  if (e.phRaw && e.phRaw.replace(/[\s.]/g, '') !== symJoin) {
    const pr = document.createElement('div');
    pr.className = 'r-phraw';
    pr.textContent = 'AA: ' + e.phRaw;
    pr.title = 'The Academy Edition’s dating verbatim. Query marks and ' +
               'parentheses are Adickes’ own expression of uncertainty.';
    div.appendChild(pr);
  }

  // the locus note, verbatim, plus whatever could be parsed out of it
  if (e.loc && e.loc.raw) {
    const lo = document.createElement('div');
    lo.className = 'r-locus';
    const raw = document.createElement('span');
    raw.className = 'r-locus-raw';
    raw.textContent = e.loc.raw;
    lo.appendChild(raw);

    if (e.loc.satz && e.loc.satz.length) {
      const c = document.createElement('span');
      c.className = 'r-chip satz';
      c.textContent = 'Satz ' + e.loc.satz.join('·');
      c.title = 'Highlight sentence ' + e.loc.satz.join(', ') + ' of the § in the ' +
                'text on the left. Sentences are counted by splitting on ' +
                'sentence-final punctuation, so the count is approximate.';
      c.onclick = ev => { ev.stopPropagation(); highlightSatz(e); };
      lo.appendChild(document.createElement('br'));
      lo.appendChild(c);
    }
    if (e.loc.nr && e.loc.nr.length) {
      const c = document.createElement('span');
      c.className = 'r-chip';
      c.textContent = 'Nr. ' + e.loc.nr.join('·');
      c.title = 'The numbered item within the § that the note attaches to';
      lo.appendChild(c);
    }
    if (e.loc.part) {
      const c = document.createElement('span');
      c.className = 'r-chip';
      c.textContent = e.loc.part;
      c.title = 'Where in the § the note stands';
      lo.appendChild(c);
    }
    if (e.loc.lemma) {
      const c = document.createElement('span');
      c.className = 'r-chip lemma';
      c.textContent = '»' + e.loc.lemma + '«';
      c.title = 'The words of Baumgarten the AA says this note annotates — ' +
                'click to find them in the text on the left';
      c.onclick = ev => { ev.stopPropagation(); highlightLemma(e); };
      lo.appendChild(c);
    }
    div.appendChild(lo);
  }

  // the Reflexion itself
  const t = document.createElement('div');
  t.className = 'r-text';
  t.textContent = e.text;
  div.appendChild(t);

  // footer: Kant's own page, and how the § was arrived at
  const foot = document.createElement('div');
  foot.className = 'r-foot';
  if (e.sig) {
    const s = document.createElement('span');
    s.className = 'r-sig';
    s.textContent = e.sig;
    s.title = 'Where the note stands in Kant’s own copy of the ' + C.work +
              ' (sheet and page, as the AA gives it). A prime marks the ' +
              'interleaved page.';
    foot.appendChild(s);
  }
  const prov = document.createElement('span');
  const tag = C.provenance(e);
  prov.className = 'r-prov ' + tag.cls;
  prov.textContent = tag.text;
  prov.title = tag.title;
  foot.appendChild(prov);
  div.appendChild(foot);

  div.onclick = () => {
    if (e.loc && e.loc.lemma) highlightLemma(e);
    else if (e.loc && e.loc.satz && e.loc.satz.length) highlightSatz(e);
  };
  return div;
}

function renderReflForPara(num) {
  reflPara = num;
  const scroll = document.getElementById('refl-scroll');
  if (!scroll) return;
  scroll.innerHTML = '';

  const idxs = BAUM_CORPUS.byPara[String(num)] || [];
  const head = document.createElement('div');
  head.className = 'r-para-head';
  head.innerHTML = '<div class="r-para-head-line">'
    + '<span class="r-para-num">§' + num + '</span>'
    + '<span class="r-para-count">'
    + (idxs.length === 1 ? '1 Reflexion' : idxs.length + ' Reflexionen')
    + '</span></div>';
  scroll.appendChild(head);

  if (!idxs.length) {
    const none = document.createElement('div');
    none.className = 'r-sub-hint';
    none.textContent = 'The Academy Edition records no Reflexion at §' + num + '.';
    scroll.appendChild(none);
  } else {
    // locus-attested notes first, then those placed only by page or by block
    const order = { locus: 0, page: 1, block: 2 };
    idxs.slice()
        .sort((a, b) => ((order[BAUM_CORPUS.entries[a].src] ?? 3)
                       - (order[BAUM_CORPUS.entries[b].src] ?? 3))
                        || BAUM_CORPUS.entries[a].r - BAUM_CORPUS.entries[b].r)
        .forEach(i => scroll.appendChild(buildReflEntry(i)));
  }

  const foot = document.createElement('div');
  foot.className = 'r-elsewhere';
  foot.innerHTML = '<button class="r-elsewhere-btn" id="refl-elsewhere">'
    + REFL_OFFPARA.length + ' Reflexionen belong to no §</button>'
    + '<span class="r-elsewhere-note">Kant on the prefaces and the Synopsis, on '
    + 'loose sheets, and in his copy of Eberhard.</span>';
  scroll.appendChild(foot);
  document.getElementById('refl-elsewhere').onclick = showReflElsewhere;

  updateReflCount(idxs.length);
}

function showReflElsewhere() {
  const scroll = document.getElementById('refl-scroll');
  scroll.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'r-para-head';
  head.innerHTML = '<div class="r-para-head-line">'
    + '<span class="r-para-num">No §</span>'
    + '<span class="r-para-count">' + REFL_OFFPARA.length + ' Reflexionen</span></div>';
  scroll.appendChild(head);

  const note = document.createElement('div');
  note.className = 'r-sub-hint';
  note.textContent = 'These are printed in AA XVII and XVIII but attach to no '
    + 'numbered § of the Metaphysica: Kant writing on the Roman-numbered front '
    + 'matter, on loose sheets, and in his copy of Eberhard’s Vorbereitung zur '
    + 'natürlichen Theologie. None of them has been filed against a § here.';
  scroll.appendChild(note);

  const back = document.createElement('button');
  back.className = 'r-elsewhere-btn';
  back.textContent = '‹ back to §' + (reflPara || 1);
  back.onclick = () => renderReflForPara(reflPara || 1);
  scroll.appendChild(back);

  REFL_OFFPARA.forEach(i => scroll.appendChild(buildReflEntry(i)));
  updateReflCount(REFL_OFFPARA.length);
}

function updateReflCount(n) {
  document.getElementById('refl-count').textContent =
    n === 1 ? '1 note' : n + ' notes';
}

function showReflPanel(on) {
  reflOpen = on;
  document.getElementById('refl-panel').classList.toggle('hidden', !on);
  document.getElementById('refl-resizer').classList.toggle('hidden', !on);
  document.getElementById('refl-show').style.display = on ? 'none' : '';
  if (on) renderReflForPara(focusedNum === null ? (reflPara || 1) : focusedNum);
}

// ── Adickes overlay ── his note on one phase of Kant's hand
function openAdickes(sym) {
  const p = phaseInfo(sym);
  const box = document.getElementById('adickesBox');
  box.innerHTML = '';

  const close = document.createElement('button');
  close.className = 'adickes-close';
  close.textContent = 'close';
  close.onclick = closeAdickes;
  box.appendChild(close);

  const h = document.createElement('h3');
  h.textContent = 'Phase ' + (p ? p.sym : sym);
  box.appendChild(h);

  const sub = document.createElement('div');
  sub.className = 'adickes-sub';
  sub.textContent = 'Adickes’ chronology of Kant’s hand · ' +
                    (p && p.aa ? p.aa : 'AA 14:XXXV–XLIII');
  box.appendChild(sub);

  const yr = document.createElement('div');
  yr.className = 'adickes-years';
  yr.textContent = p && p.years ? p.years : 'Adickes gives no date for this phase.';
  box.appendChild(yr);

  // Everything Adickes qualifies his own dating with, kept as a qualification
  // rather than folded into the year span above.
  const flag = msg => {
    const d = document.createElement('div');
    d.className = 'adickes-flag';
    d.textContent = msg;
    box.appendChild(d);
  };
  if (p && p.inherited) {
    flag('Dated from phase ' + p.inheritedFrom + '. ' + p.inheritedReason);
  }
  if (p && p.relative) flag('Relative position only: ' + p.relative);
  if (p && p.significance) flag('Significance: ' + p.significance);
  if (p && p.covers) flag('Covers: ' + p.covers);
  if (p && p.editorial) flag(p.editorial);
  if (p && p.notInAdickesTable) {
    flag('This label is not one of Adickes’ 33 tabled phases; see the note above.');
  }
  if (p && p.unlisted) flag('Adickes does not table this exponent of the letter.');
  if (!p || p.unknown) {
    flag('This label could not be matched against Adickes’ table. It may be a ' +
         'transcription artefact; check the Academy Edition directly.');
  }

  if (p && p.note) {
    const n = document.createElement('div');
    n.className = 'adickes-note';
    n.textContent = p.note;
    box.appendChild(n);
  }

  const preLbl = document.createElement('div');
  preLbl.className = 'adickes-sub';
  preLbl.style.marginTop = '18px';
  preLbl.textContent = 'On the notation generally · ' + ADICKES_PREAMBLE.aa;
  box.appendChild(preLbl);
  const pre = document.createElement('div');
  pre.className = 'adickes-note';
  pre.style.marginTop = '14px';
  pre.style.fontSize = '12.5px';
  pre.textContent = ADICKES_PREAMBLE.text;
  box.appendChild(pre);

  document.getElementById('adickesVeil').classList.add('open');
}
function closeAdickes() {
  document.getElementById('adickesVeil').classList.remove('open');
}

/* ── highlighting the annotated words in the primary text ──────────────────
   The AA often names the exact lemma a note attaches to ("»quicquid est,
   illud«") or a sentence number. Both are worth showing in the text itself
   rather than only stating. */

function clearHighlights() {
  document.querySelectorAll('.lemma-hit, .satz-hit').forEach(el => {
    const parent = el.parentNode;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
    parent.normalize();
  });
  document.querySelectorAll('.part-anfang, .part-schluss')
    .forEach(el => el.classList.remove('part-anfang', 'part-schluss'));
}

function paraTextEl(n) {
  const p = document.getElementById('para-' + n);
  return p ? p.querySelector('.para-body') : null;
}

/* The text nodes of a § that carry Baumgarten's Latin. His own German
   equivalents are set inline as chips, and the AA's lemmata are the Latin, so
   the chips are excluded from both the haystack and the wrapping. */
function paraTextNodes(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest('.gloss-chip')
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const out = [];
  let n;
  while ((n = walker.nextNode())) out.push(n);
  return out;
}

function targetPara(entry) {
  // prefer the § the entry's own locus names
  const cands = (entry.loc && entry.loc.paras && entry.loc.paras.length)
    ? entry.loc.paras : (entry.paras || []);
  for (const p of cands) if (paraTextEl(p)) return p;
  return null;
}

function wrapRange(root, start, end, cls) {
  // walk the Latin text nodes, wrapping the [start,end) slice of their concatenation
  let pos = 0, made = null;
  const jobs = [];
  for (const node of paraTextNodes(root)) {
    const len = node.nodeValue.length;
    const a = Math.max(start, pos), b = Math.min(end, pos + len);
    if (a < b) jobs.push([node, a - pos, b - pos]);
    pos += len;
    if (pos >= end) break;
  }
  jobs.forEach(([n, a, b]) => {
    const mid = n.splitText(a);
    if (b - a < mid.nodeValue.length) mid.splitText(b - a);
    const span = document.createElement('span');
    span.className = cls;
    mid.parentNode.insertBefore(span, mid);
    span.appendChild(mid);
    if (!made) made = span;
  });
  return made;
}

function highlightLemma(entry) {
  clearHighlights();
  const n = targetPara(entry);
  if (n === null) return;
  const el = paraTextEl(n);
  const lemma = entry.loc.lemma;
  // the AA abbreviates long lemmata as "first words — last words"
  const parts = lemma.split(/\s*[—–]\s*/).filter(Boolean);
  const text = paraTextNodes(el).map(x => x.nodeValue).join('');
  let first = null;

  /* Two passes, the second case-insensitive. The AA quotes a lemma from
     mid-sentence, so it lowercases a word the § happens to open with —
     § 161 »minimum« against "Minimum est solo nihilo maius". Folding case
     is as far as this goes: it is the same word, differently capitalised.
     Seven lemmata still find nothing, because the AA is not quoting the
     printed word at all — it normalises Baumgarten's spelling (»subposita«
     for *supposita*, »ejusdem« for *eiusdem*), cites Kant's German
     (»angestrengt«), or composes a topic label of its own
     (»identitas numerica«). Those must stay unhighlighted; a looser match
     would put the mark on words Kant did not annotate. */
  for (const fold of [false, true]) {
    const hay  = fold ? text.toLowerCase() : text;
    const seek = fold ? parts.map(p => p.toLowerCase()) : parts;
    const whole = fold ? lemma.toLowerCase() : lemma;
    if (seek.length === 2) {
      const a = hay.indexOf(seek[0]);
      const b = a < 0 ? -1 : hay.indexOf(seek[1], a + seek[0].length);
      if (a >= 0 && b >= 0) first = wrapRange(el, a, b + seek[1].length, 'lemma-hit');
    }
    if (!first) {
      const one = seek[0] || whole;
      const a = hay.indexOf(one);
      if (a >= 0) first = wrapRange(el, a, a + one.length, 'lemma-hit');
    }
    if (first) break;
  }
  markPart(entry, n);
  scrollToPara(n, false);
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function highlightSatz(entry) {
  clearHighlights();
  const n = targetPara(entry);
  if (n === null) return;
  const el = paraTextEl(n);
  const hay = paraTextNodes(el).map(x => x.nodeValue).join('');
  // approximate: split on sentence-final punctuation followed by a capital
  const bounds = [];
  let last = 0;
  const re = /[.!?:](?=\s+[A-ZÄÖÜ»(]|\s*$)/g;
  let m;
  while ((m = re.exec(hay))) { bounds.push([last, m.index + 1]); last = m.index + 1; }
  if (last < hay.length) bounds.push([last, hay.length]);

  let first = null;
  entry.loc.satz.slice().reverse().forEach(s => {
    const b = bounds[s - 1];
    if (b) first = wrapRange(el, b[0], b[1], 'satz-hit') || first;
  });
  markPart(entry, n);
  scrollToPara(n, false);
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function markPart(entry, n) {
  const part = entry.loc && entry.loc.part;
  if (!part) return;
  const block = document.getElementById('para-' + n);
  if (!block) return;
  if (/Anfang/i.test(part)) block.classList.add('part-anfang');
  else if (/Schluss|Ende/i.test(part)) block.classList.add('part-schluss');
}

document.getElementById('synopsis-btn').addEventListener('click', openSynopsis);
document.getElementById('synopsis-close').addEventListener('click', closeSynopsis);
document.getElementById('synopsis-overlay').addEventListener('click', e => {
  if (e.target.id === 'synopsis-overlay') closeSynopsis();   // click the backdrop
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSynopsis();
});

// TOC filter
document.getElementById('toc-filter').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.toc-item').forEach(item => {
    const num = item.getAttribute('data-para');
    const label = item.textContent.toLowerCase();
    const show = !q || label.includes(q) || num === q;
    item.style.display = show ? '' : 'none';
  });
});

// TOC toggle
document.getElementById('toc-toggle').addEventListener('click', () => {
  document.getElementById('toc-panel').classList.toggle('hidden');
});

// Reflexionen panel: show, hide, and Escape out of the Adickes overlay
document.getElementById('refl-toggle').addEventListener('click', () => showReflPanel(false));
document.getElementById('refl-show').addEventListener('click', () => showReflPanel(true));
document.getElementById('adickesVeil').addEventListener('click', e => {
  if (e.target.id === 'adickesVeil') closeAdickes();   // click the backdrop
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAdickes();
});

// Panel resizer, clamped the same way the Meier reader's is
const reflResizer = document.getElementById('refl-resizer');
const reflPanelEl = document.getElementById('refl-panel');
let reflResizing = false;
reflResizer.addEventListener('mousedown', () => {
  reflResizing = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!reflResizing) return;
  const w = document.getElementById('reading-row').getBoundingClientRect().right - e.clientX;
  if (w > 260 && w < 640) reflPanelEl.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  reflResizing = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

/* Follow the § in view. The reader's own navigation goes through
   scrollToPara(), but plain scrolling does not, and the panel is worth having
   track the text. An IntersectionObserver rather than a scroll handler: there
   are 804 §§, and measuring them all on every frame is not affordable. The
   root margin narrows the root to a band across the top of the canvas, so
   `visible` holds only the §§ in that band and its lowest number is the one
   being read. */
function watchParasInView() {
  const canvas = document.getElementById('text-canvas');
  const visible = new Set();
  const obs = new IntersectionObserver(recs => {
    recs.forEach(r => {
      const n = +r.target.dataset.num;
      if (r.isIntersecting) visible.add(n); else visible.delete(n);
    });
    if (!reflOpen || !visible.size) return;
    const top = Math.min(...visible);
    if (top !== reflPara) renderReflForPara(top);
  }, { root: canvas, rootMargin: '-80px 0px -62% 0px' });
  canvas.querySelectorAll('.para-block').forEach(b => obs.observe(b));
}

// Init
buildTextContent();
buildTOC();
document.getElementById('refl-show').title =
  REFLM_META.count + ' Reflexionen (Refl. ' + REFLM_META.rMin + '–' + REFLM_META.rMax +
  ') on the Metaphysica, AA ' + REFLM_META.volumes.join(' and ') + '.';
document.getElementById('refl-label').title = document.getElementById('refl-show').title;
renderReflForPara(1);
watchParasInView();
</script>
