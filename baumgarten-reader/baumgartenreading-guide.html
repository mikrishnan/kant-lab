<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>The Baumgarten Reader has been retired</title>
<link rel="canonical" href="../logic-portal/index.html#read=baumgarten">
<!-- Retired on 4 November 2026: the Logic Portal now does everything this reader did, from the
     same data. The script carries a link to the reader over to the same place in the portal:
     #go=92, #go=§ 92 or #para-92 opens that §; #go=16:236 opens that page of the Academy edition;
     a number above 1000 is a Reflexion. The reader as it last stood is kept at the commit below. -->
<script>
(function () {
  var h = location.hash, m, n, to = 'read=baumgarten';
  if ((m = /(?:^#|&)go=([^&]*)/.exec(h)) || (m = /^#para-(\d+)$/.exec(h))) {
    var v = decodeURIComponent(m[1]).trim();
    if (/^\d{1,2}\s*[:.,]\s*\d+/.test(v)) to = 'aa=' + encodeURIComponent(v.replace(/\s/g, ''));
    else if ((n = v.replace(/\D/g, ''))) to = +n > 1000 ? 'refl=' + n : 'read=baumgarten&at=p' + n;
  }
  location.replace('../logic-portal/index.html#' + to);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../logic-portal/index.html#read=baumgarten"></noscript>
<p>The Baumgarten Reader has been retired. Baumgarten’s <i>Metaphysica</i> is now read in <a href="../logic-portal/index.html#read=baumgarten">the Logic Portal</a>, with Kant’s notes beside it.
The reader as it last stood is <a href="https://raw.githack.com/mikrishnan/kant-lab/9d473662a1a2a947232aed780ffbd180e9f233c0/baumgarten-reader/baumgartenreading-guide.html">kept here</a>.</p>
</html>
